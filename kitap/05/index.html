<script type="application/json" id="kitap-veri">{"no": 5, "baslik": "Sabredenlerin Hikâyeleri", "tanitim": "Hastalıkta, ayrılıkta ve kayıpta Allah'a güvenle dayanan peygamberlerin, sahabilerin ve sıradan müminlerin sabır hikâyeleri.", "onsoz": "Sabır, dişini sıkıp susmak değildir. Kur'an ve hadislerdeki örnekler, sabrın yalvarmayı, ağlamayı ve ağır bir yükü Allah'a açmayı dışlamadığını gösterir. Bu kitapta hastalığa, ayrılığa ve kayba katlanan sekiz insanın hikâyesi var. Her biri farklı bir acı yaşadı, ama hepsi aynı kapıya yöneldi. Umarız bu sayfalar kendi sıkıntılarınızda size yoldaş olur.", "hikayeler": [{"no": 1, "baslik": "Eyyûb'un Sabrı", "tur": "kaynakli", "paragraflar": ["Bir insanın sağlığı, ailesi, malı yerindeyken şükretmesi kolaydır. Asıl imtihan, bunlar elden gittiği zaman başlar. Kur'an, Eyyûb'u (a.s.) böyle bir imtihanın içinde anlatır. Allah onu ağır bir dert ve sıkıntıyla sınadı. Ayetler hastalığın cinsini, ne kadar sürdüğünü ve başka ayrıntılarını söylemez. Bu yüzden onları tahmin etmeye ya da eklemeye gerek yoktur. Bilinen şey, Eyyûb'un bu imtihanda gösterdiği tavırdır.", "Eyyûb'un hastalığı hakkında kaynaklarda pek çok anlatı dolaşır. Ancak bunların büyük kısmı sahih kaynaklara dayanmaz. Biz yalnızca Kur'an'ın ve sahih hadisin söylediğini aktarıyoruz. Çünkü hikâyenin gücü, hastalığın adında değil, Eyyûb'un tavrındadır: Derdi Allah'tan başkasına şikâyet etmemek.", "Peygamber Efendimiz (s.a.v.) Sa'd b. Ebû Vakkas'ın sorusu üzerine şöyle buyurmuştur: İnsanların en şiddetli imtihana uğrayanları peygamberlerdir; sonra onlara en yakın olanlar, sonra onlara yakın olanlar. Kişi, dinindeki sağlamlığa göre imtihan edilir. Bu söz, Eyyûb'un hâlini daha iyi anlamamıza yardım eder: Allah'ın sevgili kulları da sınanır ve sınav, onların derecesini yükseltir.", "Eyyûb ne isyan etti ne de insanların kapısında dert yandı. Rabbine yalnızca yalvardı: ‘Başıma bu dert geldi; sen merhametlilerin en merhametlisisin.’ (Enbiyâ, 21/83) Bu dua kısacıktır. İçinde bir sitem de, uzun bir istek listesi de yoktur. Eyyûb hâlini Allah'a arz etmiş, geri kalanını O'nun merhametine bırakmıştır. Sabreden kişi, dua etmekten geri durmaz.", "Allah onun duasını kabul etti ve ona şöyle seslendi: ‘Ayağınla yere vur; işte yıkanacak ve içilecek serin bir su!’ (Sâd, 38/42) Eyyûb yere vurdu, su çıktı. Onunla yıkanıp içince derdinden kurtuldu. Allah ona ailesini ve onlarla birlikte bir mislini daha verdi. Bu, ‘katımızdan bir rahmet ve ibadet edenlere bir öğüt’ olarak bildirilir. (Enbiyâ, 21/84) Allah onun için şöyle der: ‘Biz onu sabırlı bulduk. Ne güzel kuldu! Çünkü hep Allah'a yönelirdi.’ (Sâd, 38/44)", "Peygamberimiz bu kıssaya hadisle bir ayrıntı daha ekler. Ebû Hüreyre'nin aktardığına göre Eyyûb (a.s.) bir gün yıkanırken üzerine altından çekirgeler yağmaya başladı. Eyyûb bunları avuçlayıp elbisesine doldurmaya koyuldu. Rabbi ona şöyle seslendi: ‘Ey Eyyûb! Gördüğün bu şeylerden seni müstağni kılmadım mı?’ Eyyûb: ‘Evet, ya Rab! Fakat senin bereketinden müstağni kalamam’ dedi.", "Eyyûb'un bu cevabı, sabrın ve şükrün özetidir. İnsan elinde ne kadar çok şey olursa olsun, Allah'ın bereketine muhtaçtır. Sağlık da mal da O'nun rahmetiyle değer kazanır. Dertle sınanan kul, sabrettikten sonra yeni nimetlere kavuşabilir. Ama asıl kazanç, Rabbine yönelmenin huzurudur. Allah sabreden kulunu unutmaz; derdi aldıktan sonra da ona yeni bir kapı açar."], "ibret": "Eyyûb derdini Allah'a açtı, başkasına değil. Sabretmek, dua etmeyi bırakmak değil, duayı yalnız Allah'a yöneltmektir. Allah, sabırla yalvaran kulunun derdini giderir ve ona fazlasıyla nimet verir.", "kaynak": "Enbiyâ Sûresi, 21/83-84; Sâd Sûresi, 38/41-44; Buhârî, Gusül (279); Enbiyâ (3391); Tirmizî, Zühd (2398)"}, {"no": 2, "baslik": "Yakup'un Güzel Sabrı", "tur": "kaynakli", "paragraflar": ["Yakup (a.s.) bir akşam kapıda oğullarının seslerini duydu. Ağlayarak geliyorlardı. Yusuf onlarla birlikte gitmişti, ama aralarında değildi. ‘Babamız,’ dediler, ‘biz yarışmaya gittik, Yusuf'u eşyalarımızın yanında bıraktık; onu kurt yedi. Doğru söylesek bile sen bize inanmazsın.’ Üzerinde sahte bir kan bulunan gömleğini de getirmişlerdi. (Yûsuf, 12/16-18) Yusuf'un kuyuya bırakılması başka bir hikâyedir. Yakup o akşam yalnızca bir evladının kaybolduğu haberini alıyordu. Yakup, daha önce Yusuf'un rüyasını duyduğunda ona bunu kardeşlerine anlatmamasını öğütlemişti. (Yûsuf, 12/5)", "Yakup söylenenlere inanmadı, ama bağırıp çağırmadı. Şöyle dedi: ‘Hayır, nefisleriniz size kötü bir işi hoş göstermiş. Artık bana düşen güzel bir sabırdır. Anlattıklarınıza karşı yardımı istenecek olan ancak Allah'tır.’ (Yûsuf, 12/18) ‘Güzel sabır’ derken şikâyetsiz, kimseyi yıkmaya çalışmayan, yüzünü yalnız Allah'a çeviren bir sabırdan söz ediyordu. Müfessirler ‘güzel sabır’ı, şikâyet etmeyen ve acıyı yalnız Allah'a açan sabır olarak açıklar.", "Yıllar geçti. Yakup'un oğulları Mısır'a gittiler ve döndüklerinde kardeşlerinden birinin daha yanlarında olmadığını bildirdiler. Mısır'daki o olaylar ayrı bir hikâyedir. Yakup bir evladını daha kaybetmişti. Yine şöyle dedi: ‘Güzel bir sabır! Umarım Allah onların hepsini bana getirir.’ (Yûsuf, 12/83) Sonra yüzünü çevirip ‘Vah Yusuf'a!’ dedi. Hüzünden gözleri ağarmıştı; içini dolduran kederi yutkunup duruyordu. (Yûsuf, 12/84)", "Oğulları ona: ‘Allah'a yemin olsun, sen Yusuf'u anıp duracaksın; ya hasta olacaksın ya da helak olacaksın’ dediler. Yakup şöyle cevap verdi: ‘Ben derdimi ve hüznümü ancak Allah'a arz ederim. Allah'tan, sizin bilmediklerinizi bilirim.’ (Yûsuf, 12/85-86) Sonra oğullarına şu öğüdü verdi: ‘Oğullarım, gidin Yusuf'u ve kardeşini araştırın. Allah'ın rahmetinden ümit kesmeyin. Çünkü kâfirler topluluğundan başkası Allah'ın rahmetinden ümit kesmez.’ (Yûsuf, 12/87)", "Hikâyenin bu yerinde Yakup'un oğullarına söylediği sözlerde bir incelik dikkat çeker. Yakup hem kendi derdini Allah'a anlatır hem de çocuklarına ‘gidin, araştırın’ diyerek onları harekete geçirir. Yani sabır, elini kolunu bağlayıp beklemek anlamına gelmez. Yakup beklerken de çalışır, çalışırken de Allah'a güvenir. Sabır ile gayretin aynı kalpte yaşaması, bu hikâyenin sessiz derslerinden biridir.", "Kur'an bu hikâyenin sonunu da anlatır. Kervan Mısır'dan çıkarken Yakup: ‘Gerçekten ben Yusuf'un kokusunu alıyorum’ dedi. (Yûsuf, 12/94) Müjdeci geldi ve Yusuf'un gömleğini Yakup'un yüzüne koydu; Yakup yeniden görür oldu. ‘Size, Allah'tan sizin bilmediğiniz şeyleri bildiğimi söylememiş miydim?’ dedi. (Yûsuf, 12/96) Yıllarca süren bir sabır, bir kavuşmayla taçlanmıştı.", "Yakup'un sabrı, umudu terk etmeyen bir sabırdı. Yıllar boyu Yusuf'un adını anmaktan vazgeçmedi; ama bu anışta isyan da yoktu. Derdini insanlara değil, Allah'a anlattı. Oğullarına bile şu öğüdü verdi: Allah'ın rahmetinden ümit kesmeyin. Sabır ile umut, onun hayatında ayrılmaz iki arkadaştı."], "ibret": "Yakup, acısını insanlara değil, Allah'a anlattı ve O'nun rahmetinden hiç ümit kesmedi. Güzel sabır, şikâyetsiz ve umutla beklemektir. Allah, sabırla bekleyenin sabrını karşılıksız bırakmaz; kul da O'nun rahmetinden umudunu kesmemelidir.", "kaynak": "Yûsuf Sûresi, 12/5, 16-18, 83-87, 93-96"}, {"no": 3, "baslik": "İsmail'in Teslimiyeti", "tur": "kaynakli", "paragraflar": ["İbrahim (a.s.) kavminden ayrılırken şöyle demişti: ‘Ben Rabbime gidiyorum, O bana yol gösterecek.’ Bunun ardından Allah'tan bir dilekte bulundu: ‘Rabbim, bana salihlerden bir evlat ver.’ Allah da ona ‘yumuşak huylu bir oğul’ müjdeledi. (Sâffât, 37/99-101) Uzun yıllar beklenen bu evlat, onun gözünün nuru oldu. Duasının karşılığını bir oğul olarak almıştı; ama Allah'ın onu bir imtihanla sınaması henüz başlamamıştı. Kur'an, müjdelenen evladı ‘halîm’ diye niteler. Bu kelime, yumuşak huylu, öfkesini yutan ve sabırlı demektir.", "Oğlu babasıyla birlikte çalışacak çağa gelince İbrahim rüyasında onu kurban ettiğini gördü. Peygamberlerin rüyaları vahiydir. Ama İbrahim, bu ağır emri oğluna sormadan uygulamaya geçmedi: ‘Yavrucuğum, rüyada seni kurban ettiğimi görüyorum. Bak bakalım sen ne düşünüyorsun?’ (Sâffât, 37/102) Genç oğlun cevabı, bu hikâyenin en güzel cümlesidir: ‘Babacığım, emrolunduğun şeyi yap. İnşallah beni sabredenlerden bulacaksın.’ Babanın bu soruyu sormasında bir incelik vardır: Emir, zorlamayla değil, gönül rızasıyla yerine getirilecek, iki taraf da bu imtihanı kendi iradesiyle yaşayacaktı.", "Kur'an bu evladın adını vermez. Müfessirlerin çoğunluğuna göre bu oğul İsmail'dir; bazı âlimler ise İshak olduğunu söylemiştir. Biz de çoğunluğun görüşüne uyarak ona İsmail diyoruz; ama ayetlerin anlattığının ötesine geçmiyoruz. Önemli olan, babanın rüyaya, oğlun da Allah'ın emrine teslim oluşudur. Kur'an bu anı sadece şöyle anlatır: ‘İkisi de teslim olunca…’ (Sâffât, 37/103) Burada ayrıntılar susar, teslimiyet konuşur.", "Ve tam o sırada Allah İbrahim'e seslendi: ‘Ey İbrahim! Rüyayı gerçekleştirdin. Biz iyilik edenleri işte böyle mükâfatlandırırız. Şüphesiz bu, apaçık bir imtihandı.’ (Sâffât, 37/104-106) Allah ona fidye olarak büyük bir kurbanlık verdi. (Sâffât, 37/107) Hikâye böylece yumuşak bir selamla biter. Allah, İbrahim için sonrakiler arasında güzel bir ün bıraktı: ‘İbrahim'e selam olsun!’ (Sâffât, 37/108-109) İmtihanın amacı hüzün değil, teslimiyetin ortaya çıkmasıydı. Bu olayda merhamet ve lütuf hâkimdir; amaç acı çektirmek değil, bir kulun teslimiyetini ortaya koymaktır.", "Bu olay, bugün her kurban bayramında hatırlanır. Baba ile oğlun birbirine güvenle ve sevgiyle, Allah'ın emrine bağlanması Müslümanlara bir örnek olarak kalmıştır. İsmail'in ‘inşallah beni sabredenlerden bulacaksın’ sözü, sabrı kendi gücüne değil, Allah'ın yardımına bağlayan bir tevazuyu da öğretir. Gerçek sabır, önce Allah'tan sabır dilemekle başlar. Kur'an'ın ifadesiyle, Allah iyilik edenleri mükâfatsız bırakmaz. İbrahim ile oğlunun hatırası her yıl yeniden canlanır; kurbanlık hayvan kesen Müslüman, Allah'ın emrine teslim olmanın ne demek olduğunu bir kez daha düşünür. Teslimiyet, Allah'ın emrini sevgiyle karşılamak ve O'nun yardımına güvenmektir; bu bayramın asıl hatırlattığı da budur."], "ibret": "İbrahim ile oğlu, Allah'ın emrine sevgiyle ve güvenle teslim oldular. İsmail ‘İnşallah beni sabredenlerden bulacaksın’ diyerek sabrı Allah'a bağladı. Allah, teslim olanı imtihandan selametle çıkarır.", "kaynak": "Sâffât Sûresi, 37/99-111"}, {"no": 4, "baslik": "‘Ehad, Ehad’ Diyen Bilal", "tur": "kaynakli", "paragraflar": ["Mekke'de bir köle düşünün. Adı Bilal'dir. Siyer kitaplarına göre Ümeyye b. Halef'in kölesidir. Bir gün Peygamber Efendimizden (s.a.v.) İslam'ı duyar ve ‘Allah birdir’ sözüne inanır. Bu iman, bir kölenin hayatında efendisinin iznine bağlı olmayan tek şeydir: kalbi. Bilal, bu kalbinden vazgeçmedi. Kur'an'da Allah, ‘Allah sabredenlerle beraberdir’ buyurur. (Bakara, 2/153) Bilal'in hikâyesi, bu sözün Mekke'deki karşılığıdır. ‘Ehad’ Arapçada ‘bir, tek’ demektir; İhlâs Sûresi'nin ilk ayeti de ‘De ki: O Allah birdir’ diye başlar. (İhlâs, 112/1)", "İbn Mes'ûd'dan (r.a.) gelen bir rivayet, İslam'ı ilk açığa vuranları anlatır. Peygamberimizi Allah amcası Ebû Tâlib sayesinde, Ebû Bekir'i de kavmi sayesinde korudu. Diğerlerini müşrikler yakalayıp zırh giydirdiler ve güneşte bıraktılar. Bilal dışındakiler, ağır işkence altında müşriklerin istediği sözü dilleriyle söylemek zorunda kaldılar. Kur'an, kalbi imanla dolu olduğu hâlde zorlanan kimseyi bu yüzden kınamaz. (Nahl, 16/106) Bilal ise geri adım atmadı. İbn Mes'ûd şöyle der: ‘Bilal, Allah yolunda canını değersiz saydı; kavmi de onu değersiz saydı.’ Onu çocuklara teslim ettiler. Çocuklar onu Mekke'nin sokaklarında dolaştırırken Bilal tek bir söz söylüyordu: ‘Ehad, ehad!’ Yani ‘Allah bir, Allah bir.’", "Siyer kitaplarında bu eziyet daha ayrıntılı anlatılır. İbn Hişâm'ın aktardığına göre Ümeyye, Bilal'i sıcak bir günde dışarı çıkarır, göğsüne ağır bir kaya koydurur ve ‘Muhammed'in dinini bırakmazsan böyle kalacaksın’ derdi. Bilal ise aynı cevabı verirdi: ‘Ehad, ehad.’ Biz bu olayı fazla uzatmıyoruz; çünkü hikâyenin asıl yeri, eziyet değil, Bilal'in kalbindeki sağlamlıktır. Bu sağlamlığı en iyi ‘Ehad, ehad’ sözünün sadeliği anlatır: Bilal, yalnız Allah'a bağlıydı.", "Bu tablo, imanın ve sabrın bir kölenin hayatında nasıl bir yer tuttuğunu gösterir. Elinde malı mülkü olmayan, kimsenin koruyucusu bulunmayan bir insan, dünyanın en güçlü sözünü tekrar ediyordu. O, kendi gücüne değil, Allah'a dayanıyordu. Siyer kitapları onun Habeşli olduğunu söyler. Kimliği, doğum yeri ve rengi onun için bir engel olmadı; çünkü Allah'ın katında üstünlük, ancak takvadadır.", "Ebû Bekir (r.a.) Bilal'e yapılan bu eziyete kayıtsız kalmadı. Siyer kaynaklarına göre onu satın alarak hürriyetine kavuşturdu. Satın alma bedeli rivayetlerde farklı geçtiği için burada bir rakam vermiyoruz. Bilal artık özgür bir insandı. Fakat onun için en kıymetli özgürlük, Rabbine kul olmanın verdiği özgürlüktü. Allah, sabreden bu kölenin kalbini, hiçbir efendinin boyun eğdiremeyeceği bir kaleye çevirmişti.", "Yıllar sonra Ömer (r.a.), Ebû Bekir'den söz ederken şunu söyledi: ‘Ebû Bekir efendimizdir; efendimizi de o azat etti.’ Ömer burada ‘efendimiz’ derken Bilal'i kastediyordu. Bir zamanlar köle olan Bilal, böylece Ömer'in ağzından ‘efendimiz’ diye anılan bir sahabi oldu. Bilal'in sabrı, Mekke sokaklarında çocukların arasında yankılanan ‘Ehad, ehad’ sözünden Ömer'in bu saygılı ifadesine uzanan bir yoldu. Allah, sabrın karşılığını kimi zaman bu dünyada da güzel bir saygıyla verir."], "ibret": "Bilal ağır eziyetlerde bile ‘Allah birdir’ demekten vazgeçmedi. Gerçek sabır, kalbi Allah'a bağlı tutmaktır. Allah, böyle bir kulun kıymetini zamanla herkese gösterir. Bilal'in bir sözü, bütün eziyetten güçlüydü.", "kaynak": "İbn Mâce, Mukaddime (150); Buhârî, Fezâilü'l-ashâb (3754); İbn Hişâm, es-Sîre; Bakara Sûresi, 2/153; Nahl Sûresi, 16/106; İhlâs Sûresi, 112/1"}, {"no": 5, "baslik": "Ümmü Süleym'in Sabrı", "tur": "kaynakli", "paragraflar": ["Medine'de bir evde hasta bir çocuk vardı. Babası Ebû Talha, annesi Ümmü Süleym'di (r.anhümâ). Enes'in (r.a.) aktardığına göre Ebû Talha o gün evde değildi ve çocuk hastalığına yenik düşüp vefat etti. Ümmü Süleym oğlunun ölümünü gördü. Bir annenin yüreğine bu haberin ne kadar ağır geleceğini tahmin etmek zordur. Ama o bu acıyı bir telaşa, bir feryada dönüştürmedi. Hadisi aktaran Enes, Ümmü Süleym'in oğludur. Yani bu sahneyi kendi annesi için anlatmaktadır.", "Çocuğu evin bir köşesine yatırdı ve evdekilere: ‘Ebû Talha'ya kimse bir şey söylemesin, ben kendim haber vereceğim’ dedi. Ebû Talha eve gelince ona yemeğini getirdi. Ebû Talha ‘Çocuk nasıl?’ diye sorunca ‘Sakinleşti; umarım rahata erdi’ dedi. Ebû Talha bunu iyiye yordu. Böylece uzun bir günün yorgunluğuyla gelen eşi, huzurla yemeğini yiyip dinlenebildi. Sabrı yalnız kendisi için değil, eşi için de bir şefkatti.", "Sabaha doğru Ümmü Süleym eşine şöyle sordu: ‘Ey Ebû Talha, bir topluluk bir aileye bir şeyi emanet etse, sonra emanetini geri istese, o ailenin onu vermemeye hakkı olur mu?’ Ebû Talha: ‘Hayır’ dedi. Ümmü Süleym: ‘O hâlde oğlunun hususunda sabret ve Allah'tan ecir bekle’ dedi. Yani çocuk Allah'ın bir emanetiydi ve emanet sahibi onu geri almıştı. Bu cümle bir teselli olduğu kadar bir sabır dersiydi.", "Kur'an, bu tür anlar için şöyle buyurur: ‘Andolsun, sizi biraz korku, açlık, mallardan, canlardan ve ürünlerden eksiltmekle imtihan edeceğiz. Sabredenleri müjdele.’ (Bakara, 2/155) Ümmü Süleym, bu müjdenin canlı bir örneği oldu. Çocuğunu kaybeden bir annenin dengesini koruması, ancak Allah'a duyulan güvenle mümkündür. Bu denge, soğukkanlılıktan değil, imandan gelir. Bir annenin evlat acısını bu kadar vakarla taşıması, yalnız kendi gönlünü değil, evini ve eşini de ayakta tutmuştu.", "Ebû Talha olanları Peygamber Efendimize (s.a.v.) anlattı. Peygamberimiz ‘Allah, geceniz için size bereket versin’ diye dua etti. Bu duanın bereketiyle Ümmü Süleym yeniden hamile kaldı ve bir oğlan doğurdu. Çocuğu Peygamberimize götürdüler. Peygamberimiz çocuğa bir hurma çiğneyip damağına sürdü ve ona Abdullah adını verdi. Bu, Ümmü Süleym'in sabrının Allah katında güzel bir karşılık bulduğunu gösteren bir işaretti. Bir annenin sabrı ve Peygamberimizin duası, en sessiz bereketlerin kaynağı olmuştu.", "Hadiste, ensardan bir adamın şu sözü de yer alır: ‘Bu Abdullah'ın dokuz çocuğunu gördüm; hepsi Kur'an okuyordu.’ Bir annenin sabrı, yalnızca kendi hayatında değil, çocuklarının ve torunlarının hayatında da bereket olmuştu. Allah, bir kulun gösterdiği sabrı ona dünya hayatında da küçük işaretlerle gösterir. Ama asıl karşılık, âhirette Rabbin vereceği ecirdir."], "ibret": "Ümmü Süleym acısını yutup önce eşine şefkatle davrandı, sonra ona teselliyi bir emanet örneğiyle verdi. Sabır, aile içinde sevgiyle de yaşanır. Allah, sabreden anneyi hayırlı bir nesille ödüllendirir.", "kaynak": "Buhârî, Cenâiz (1301); Akîka (5470); Müslim, Âdâb (2144); Bakara Sûresi, 2/155"}, {"no": 6, "baslik": "Göz Yaşarır, Kalp Hüzünlenir", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimizin (s.a.v.) oğlu İbrahim hasta olmuştu. Enes b. Mâlik'in (r.a.) anlattığına göre Peygamberimiz ve sahabiler, İbrahim'i emziren sütannenin eşi Ebû Seyf'in evine gittiler. Peygamberimiz çocuğu aldı, öptü ve kokladı. Bir süre sonra yine gittiler. Bu kez İbrahim son nefeslerini veriyordu. Peygamberimizin gözlerinden yaşlar akmaya başladı. Siyer kitaplarına göre İbrahim, Peygamberimizin Mariye'den olan oğludur ve çok küçük yaşta vefat etmiştir.", "Orada bulunan Abdurrahman b. Avf (r.a.) şaşırdı: ‘Sen de mi ağlıyorsun, ey Allah'ın Resûlü?’ Peygamberimiz şöyle cevap verdi: ‘Ey İbn Avf! Bu bir rahmettir.’ Sonra yine yaşlar döktü ve şu sözü söyledi: ‘Göz yaşarır, kalp hüzünlenir; ama biz yalnızca Rabbimizin razı olacağı sözü söyleriz. Ey İbrahim! Senin ayrılığınla biz mahzunuz.’ Peygamberimiz böylece, sabrın gözyaşını yasaklamadığını, asıl sabrın isyan eden bir söz söylememek olduğunu öğretmiş oldu. Bu söz, Kur'an'daki şu ifadeyi hatırlatır: ‘Biz Allah'a aidiz ve O'na döneceğiz.’ (Bakara, 2/156)", "Sabır bazen yanlış anlaşılır. Kimileri sabırlı olmayı hiç ağlamamak, hiç üzülmemek sanır. Oysa Peygamberimizin bu davranışı, acı çeken bir insanın gözyaşıyla, hüzünle, dertleşmeyle sabır arasında bir çelişki olmadığını gösterir. Şikâyet ve isyan, sabra aykırıdır. Gözyaşı ise rahmetin, yani kalbin yumuşaklığının bir sonucudur. Allah'ın elçisi, hem ağlayan hem de Rabbine teslim olan bir baba olarak insanlığa örnek oldu.", "Peygamberimizin bu tavrı, bütün Müslümanlar için bir ölçüdür. Kayıp karşısında insan ağlayabilir, hüzünlenebilir, özleyebilir. Yasak olan, Allah'a isyan edici sözler söylemek, yüze vurup yakayı yırtarak feryat etmektir. Peygamberimizin gözyaşı, bu dengenin en güzel örneğidir: Bir yanda insan sevgisi, bir yanda Allah'a teslimiyet.", "Bu olayın bir de ikinci bir kısmı vardır. Mugîre b. Şu'be'nin (r.a.) aktardığına göre İbrahim'in vefat ettiği gün güneş tutuldu. İnsanlar kendi aralarında: ‘Güneş, İbrahim'in ölümü için tutuldu’ dediler. Peygamberimiz, acısının içindeyken bile bu yanlış inanışa izin vermedi. ‘Güneş ve ay, Allah'ın âyetlerindendir; kimsenin ölümü ya da doğumu için tutulmazlar. Bunu gördüğünüzde dua edin ve namaz kılın’ buyurdu. Bu söz, güneşin ve ayın Allah'ın koyduğu düzene bağlı olduğunu, kimsenin ölümüyle değişmediğini hatırlatır.", "Peygamberimiz o gün hem bir baba hem de bir öğretmendi. Kendi acısını gizlemedi, ama insanların bir yanlışa kapılmasına da göz yummadı. Acısını, kendi lehine bir işarete çevirmeye de çalışmadı. Böylece sabrın üç yönünü göstermiş oldu: Acıyı duygularla yaşamak, Allah'a teslim olmak ve doğruyu söylemeye devam etmek. Bir babanın gözyaşı ile bir peygamberin doğruluğu, aynı günde, aynı kalpte bir araya gelmişti."], "ibret": "Peygamberimiz oğlu için gözyaşı döktü ama Rabbinin razı olmayacağı tek söz söylemedi. Sabır, ağlamamak değil; isyan etmemektir. Acıyı duymak ve Allah'a teslim olmak birlikte yürüyebilir.", "kaynak": "Buhârî, Cenâiz (1303); Küsûf (1043); Müslim, Fezâil (2315); Bakara Sûresi, 2/156"}, {"no": 7, "baslik": "Dilersen Sabret, Cennet Senin", "tur": "kaynakli", "paragraflar": ["İbn Abbas (r.a.) bir gün Atâ b. Ebû Rebâh'a şöyle sordu: ‘Sana cennetlik bir kadın göstereyim mi?’ Atâ: ‘Evet’ dedi. İbn Abbas bir kadını gösterdi ve onun hikâyesini anlattı. Bu hikâyeyi bize, Peygamber Efendimizin (s.a.v.) zamanından yıllar sonra bile bir sahabinin hatırlayıp başkasına aktarması ulaştırmıştır. Bu, kadının sabrının ne kadar iz bıraktığını gösterir. Buhârî'deki ek bir rivayette bu kadının adı Ümmü Züfer olarak geçer.", "Kadın, nöbetler hâlinde gelen bir hastalıktan şikâyet ediyordu. Sara denen bu hastalıkta kişi kendinden geçer ve bu esnada üzeri açılabilir. Peygamberimize geldi ve: ‘Ya Resûlallah, bende bu hastalık var; nöbet geçirdiğimde üstüm başım açılıyor. Allah'a dua et de bana şifa versin’ dedi. Hadis bu hâli anlatırken kadını küçümsemez; aksine, hayâsını ve güzel ahlakını gözler önüne serer. Sara nöbeti kişinin elinde olmadan gelir; hastanın bir kusuru yoktur, ama yaşadığı mahcubiyet büyüktür. Kadın, hastalığı yüzünden insanların önünde mahcup olmaktan çekinen biriydi.", "Peygamberimiz ona iki yol sundu: ‘Dilersen sabret, sana cennet vardır. Dilersen Allah'a dua edeyim, sana şifa versin.’ Seçim kadına bırakılmıştı. Kadın: ‘Sabredeceğim’ dedi. Ardından şunu ekledi: ‘Ama nöbet sırasında üstüm açılıyor. Allah'a dua et de açılmayayım.’ Peygamberimiz onun için bu konuda dua etti. Kadın, hem sabrı seçmiş hem de edebini gözetmeyi unutmamıştı. Kadının isteği küçük görünür; ama ince bir edep taşır: Sabrederken bile Allah'ın verdiği haya duygusunu korumak istemiştir.", "Burada bir noktayı açıkça söylemek gerekir. Bu hadis tedaviden ya da dua etmekten vazgeçmeyi öğütlemez. Hasta olan kimse, tedavi olur ve Allah'tan şifa diler. Burada anlatılan, bu kadının kendi tercihidir ve Peygamberimiz ona iki yolu da açık bırakmıştır. Asıl kıymet, şikâyeti Allah'a arz etmek ve isyana kapılmamaktır.", "Peygamberimiz hastalık hakkında şöyle de buyurmuştur: ‘Müslümanın başına gelen yorgunluk, hastalık, keder, üzüntü, eziyet ve gam; hatta ayağına batan bir diken bile olsa, Allah bunlarla onun günahlarından bir kısmını bağışlar.’ Bu hadis, hastalığın ve sıkıntının boşuna olmadığını anlatır. Hasta olan kul, çektiği her zorlukta bir karşılık bulur. Bu müjde, yatağa düşen herkesin yüreğine bir ferahlık getirir.", "Peygamberimiz başka bir hadiste şöyle buyurur: ‘Müminin işi ne şaşırtıcıdır! Onun her işi hayırdır. Bu, müminden başkasında yoktur. Başına bir sevinç gelirse şükreder, bu onun için hayır olur. Bir sıkıntı gelirse sabreder, bu da onun için hayır olur.’ Hasta kadının hâli, bu hadisin canlı bir örneğidir. İbn Abbas'ın onu yıllar sonra bile ‘cennetlik’ diye göstermesi, sabrın gizli kalmadığını, görenlerin yüreğinde kaldığını anlatır."], "ibret": "Kadın hastalığına sabrı, edebini koruma duasıyla birleştirdi. Hastalıkta sabır cennetle müjdelenir; tedavi aramak da güzeldir. Müminin her hâli hayırdır; sıkıntıda sabreden de kazanır, şükreden de.", "kaynak": "Buhârî, Merdâ (5652, 5641, 5642); Müslim, Birr ve Sıla (2576, 2573); Zühd (2999)"}, {"no": 8, "baslik": "Sabır İlk Anda Olur", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimiz (s.a.v.) bir gün bir kadının yanından geçti. Kadın, bir yakınının mezarı başında ağlıyordu. Enes b. Mâlik'in (r.a.) anlattığına göre Peygamberimiz ona şöyle dedi: ‘Allah'tan kork ve sabret.’ Kadın, onun Peygamber olduğunu bilmiyordu. Acısı yüreğini doldurmuştu. Bu sözü bir şefkat olarak değil, üzerine binen bir yük olarak duydu. Mezarlık, acının en yoğun yaşandığı yerlerden biridir.", "Kur'an, musibet anında ne yapılacağını şöyle bildirir: ‘Andolsun, sizi biraz korku, açlık, mallardan, canlardan ve ürünlerden eksiltmekle imtihan edeceğiz. Sabredenleri müjdele. Onlar, başlarına bir musibet geldiği zaman “Biz Allah'a aidiz ve O'na döneceğiz” derler.’ (Bakara, 2/155-156) Peygamberimiz, kadını bu ayetin ruhuna çağırıyordu: acıyı hissetmek, ama onu Allah'a yönelen bir dile çevirmek.", "Kadın sert bir cevap verdi: ‘Benden uzak dur. Benim başıma gelen senin başına gelmedi.’ Hadis bu sözü dürüstçe aktarır. Peygamberimiz, acısı içindeki bir kadının bu sözüne karşılık vermeden yoluna devam etti. Bu sessizlik, o gün kadının sözünden daha yüksek sesle konuşuyordu. Çünkü gerçek ahlak, karşısındakinin acısını anlamakla başlar. Kadının sert sözü kötü niyetten değil, acısının ağırlığından geliyordu. Acı içindeki insan, çoğu zaman karşısındakinin kim olduğunu bile göremez; sözlerini de tartamaz.", "Kadına sonra: ‘O, Peygamber'di’ denildi. Kadın bunu duyunca hemen Peygamberimizin kapısına geldi. Kapıda bekçi yoktu; Peygamberimizin kapısı herkese açıktı. Kadın: ‘Seni tanımadım’ dedi. Bir insanın, hata ettiğini anlar anlamaz bu özrü dilemek için bizzat kapıya gelmesi, bu hikâyenin sevimli taraflarından biridir. Peygamberimiz de karşısına geleni geri çevirmedi. Zamanla her acı yumuşar; asıl güzel olan, acının tam ortasında Allah'a yönelmektir. Peygamberimiz de kadına bunu hatırlatmıştı.", "Peygamberimiz kadına kızmadan, nezaketle şöyle buyurdu: ‘Sabır, musibetin ilk anında olandır.’ Bu cümle, sabrın aslında ne olduğunu açıklar. Acının ilk sarsıntısında, kalp en çok isyana yakınken gösterilen sabır, asıl sabırdır. Sonradan, zaman geçip acı yatıştığında gelen sabır ise zamanın bir hediyesidir. Peygamberimiz acısını yasaklamadı; ona acının ilk anında Allah'a nasıl yönelebileceğini öğretti. Peygamberimiz, gözyaşını yasaklamamıştır; yasaklanan, yüze vurmak, yakayı yırtmak ve cahiliye çağrılarıyla bağırıp çağırmaktır. Hadisteki ‘ilk darbe’ ifadesi, acının insanı en çok sarstığı o ilk ânı anlatır.", "Başka bir hadiste Peygamberimiz şöyle buyurur: ‘Kim sabretmeye çalışırsa Allah ona sabır verir. Hiç kimseye sabırdan daha hayırlı ve daha geniş bir nimet verilmemiştir.’ Bu hikâye, sabrın ilk anda zor olduğunu, ama Allah'ın yardımıyla ulaşılabileceğini gösterir. Acı çeken birine kızmak değil, onu anlayışla uyarmak ve kapıyı açık bırakmak da sabrın bir parçasıdır."], "ibret": "Peygamberimiz acısı içindeki bir kadına nezaketle öğüt verdi. Gerçek sabır, musibetin ilk anında gösterilen sabırdır. Allah, sabretmeye çalışana sabır verir; acı çekene anlayışla yaklaşmak da güzel ahlaktır.", "kaynak": "Buhârî, Cenâiz (1252, 1283, 1294); Zekât (1469); Müslim, Cenâiz (926); Bakara Sûresi, 2/155-156"}], "kapanis": "Eyyûb'un duası, Yakup'un güzel sabrı, İsmail'in teslimiyeti, Bilal'in ‘Ehad’ı, Ümmü Süleym'in emanet sözü... Hepsinde aynı şey var: Allah'a yönelmiş bir kalp. Sabır, acıyı hissetmemek değil, acıyla birlikte Rabbine dönmektir. Bu kitabı kapattığınızda aklınızda bir cümle kalsın: Sabır, ilk anda olandır. Rabbimiz hepimize güzel bir sabır versin.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/05/", "kapak": "../../kapak/05.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 6, "baslik": "Allah'a Güvenen Gönüller", "hazir": true, "yol": "../06/index.html"}, "pdf": "../../pdf/kitap-05.pdf", "epub": "../../epub/kitap-05.epub"}</script>
