<script type="application/json" id="kitap-veri">{"no": 4, "baslik": "Annelerin Duaları", "tanitim": "Kur'an'daki annelerin dualarından Peygamber Efendimizin anlattığı anne ve evlat hikâyelerine; sevginin, fedakârlığın ve duanın gücünü anlatan sekiz kaynaklı hikâye.", "onsoz": "Bir annenin güveni bazen ıssız bir vadide su kaynağı, bazen nehre bırakılmış bir sandığın sığınağı olmuştur; bir evladın duası da bazen kapalı bir kapının ardında bir hidayete vesile olmuştur. Bu kitapta Kur'an'ın ve sahih hadislerin anlattığı sekiz hikâye var. Hepsinde bir anne, bir evlat ve onları bir arada tutan sevgi ile güven yer alıyor. Okurken kendi annenizi de hatırlayacaksınız.", "hikayeler": [{"no": 1, "baslik": "Hacer'in Koşusu ve Zemzem", "tur": "kaynakli", "paragraflar": ["Issız bir vadi düşünün. Ağaç yok, ot yok, su yok; yalnızca sıcak taşlar ve uzaktan sessizce bakan dağlar var. Peygamber Efendimiz (s.a.v.), İbn Abbas'ın aktardığına göre, İbrahim (a.s.) ile Hacer'in tam böyle bir yerde nasıl ayrıldığını anlatmıştır. İbrahim, eşi Hacer'i ve emzirdiği oğlu İsmail'i Mekke'nin bulunduğu bu vadiye getirmiş, yanlarına bir kese hurma ile bir kap su bırakıp geri dönmeye başlamıştı.", "Hacer arkasından yürüdü. ‘Ey İbrahim, yanında hiç kimsenin olmadığı bu vadide bizi bırakıp nereye gidiyorsun?’ diye defalarca sordu. İbrahim dönüp bakmadı, cevap vermedi. Sonunda Hacer: ‘Bunu sana Allah mı emretti?’ dedi. İbrahim: ‘Evet’ deyince Hacer hiç tereddüt etmedi: ‘O hâlde bizi zayi etmez.’ Geri döndü. İbrahim, vadiyi aşıp onları göremeyeceği bir yere gelince Kâbe'nin bulunacağı yöne döndü, ellerini kaldırdı: ‘Rabbimiz, ben soyumdan bazılarını, ekin bitmeyen bir vadide, saygıdeğer Evinin yanına yerleştirdim. Rabbimiz, namazı dosdoğru kılsınlar diye. Sen de insanlardan bir kısmının gönlünü onlara meylettir; onları ürünlerle rızıklandır, umulur ki şükrederler.’ (İbrâhîm, 14/37)", "Hacer kaptaki sudan içiyor, oğlunu emziriyordu. Su tükenince kendisi de oğlu da susadı; İsmail susuzluktan kıvranmaya başladı. Hacer oğlunun bu hâline bakmaya dayanamadı. Vadideki en yakın tepe olan Safa'ya çıkıp çevreye baktı; kimse yoktu. Sonra vadiye indi, eteğini toplayıp koştu, karşıdaki Merve'ye çıktı ve oradan da bakındı. Bir yardım, bir kervan, bir iz arıyordu. Böyle yedi defa gidip geldi. Peygamberimiz, insanların Safa ile Merve arasında yaptığı sa'yin aslının bu olduğunu bildirmiştir.", "Yedinci seferde Merve'nin üstündeyken bir ses işitti. ‘Sus’ dedi kendi kendine ve kulak verdi. Ses yine gelince Hacer seslendi: ‘Sesini duyurdun; eğer bir yardımın varsa yetiş!’ O anda zemzemin bulunduğu yerde Allah'ın gönderdiği bir meleği gördü. Orada su çıkmaya başladı. Hacer suyu tutmak için etrafını çevirdi, avuçlarıyla kabına doldurmaya başladı. Peygamberimiz sonradan şöyle buyurmuştur: ‘Allah İsmail'in annesine rahmet etsin. Zemzemi kendi hâline bıraksaydı, akan bir pınar olurdu.’", "Hacer sudan içti, oğlunu emzirdi. Melek ona: ‘Zarara uğramaktan korkmayın. Burası, bu çocuğun ve babasının yapacağı Allah'ın evinin yeridir. Allah, kendisine ait olanları zayi etmez’ dedi. Bir süre sonra yoldan geçen Cürhüm kabilesi, kuşların havada dönüp durduğunu görünce orada su olduğunu anladı. ‘Burada konaklamamıza izin verir misin?’ diye sordular. Hacer: ‘Olur, ama suda hakkınız yoktur’ dedi; onlar da kabul edip vadiye yerleştiler. Susuz vadiye hayat böyle geldi. Bir annenin ıssız yerde başlayan koşusu, sonraki nesillerin ibadetinde bugün de yaşıyor; her hacıda ve umrecide o koşunun izi var."], "ibret": "Hacer, emrin Allah'tan geldiğini bilince güvendi; ama bununla da yetinmeyip koştu. Dua ile çabayı birleştirenin kapısı açılır. Allah, kendisine güvenen anneyi ve evladını yarı yolda bırakmaz.", "kaynak": "İbrâhîm Sûresi, 14/37; Buhârî, Enbiyâ (3364)"}, {"no": 2, "baslik": "Musa'nın Annesi Sandığı Nehre Bırakıyor", "tur": "kaynakli", "paragraflar": ["Mısır'da korku dolu günlerdi. Kur'an'ın anlattığına göre Firavun yeryüzünde böbürlenmiş, halkını gruplara ayırmış, bir kesimi güçsüz bırakıp onların erkek çocuklarına kıyıyordu. (Kasas, 28/4) Böyle bir zamanda bir annenin kucağında yeni doğmuş bir bebek vardı: Musa. Anne onu bağrına basarken yarınından korkuyordu. Tam o sırada Allah ona şöyle ilham etti: ‘Onu emzir. Başına bir şey geleceğinden korkarsan onu nehre bırak; korkma, üzülme. Çünkü biz onu sana geri getireceğiz ve onu peygamberlerden biri yapacağız.’ (Kasas, 28/7)", "Emrin ardından gelen cümleler dikkat çekicidir. Önce ‘emzir’ denir; yani annelik görevi korkulu günlerde bile sürecektir. Sonra ‘nehre bırak’ denir; fakat hemen ardından iki yasak ve iki müjde gelir: Korkma, üzülme; onu sana geri getireceğiz, onu peygamber yapacağız. Allah, bir annenin en büyük endişesine, daha o anda en büyük cevabı vermiştir.", "Bir annenin bu emri yerine getirmesi kolay mıydı? Kur'an, onun gönlünün Musa'dan başka her şeyden boşaldığını söyler. Allah kalbine güç vermeseydi, neredeyse sırrını açığa vuracaktı. (Kasas, 28/10) Yine de ilhama güvendi. Bebeği bir sandığa yerleştirip nehre bıraktı. Kızına: ‘Onun izini takip et’ dedi. Kız, kimseye belli etmeden, uzaktan bakarak sandığın peşinden gitti. (Kasas, 28/11)", "Nehrin akıntısı sandığı Firavun'un ailesinin yanına getirdi. Allah, bunu Musa'ya yıllar sonra şöyle hatırlatacaktı: ‘Annene vahyedilecek şeyi vahyetmiştik: Onu sandığa koy, sonra nehre bırak; nehir onu kıyıya atsın. Onu, hem benim hem onun düşmanı olan biri alacak. Seni kendimden bir sevgiyle donattım; gözümün önünde yetiştirilmen için.’ (Tâhâ, 20/38-39) Bebeği alanlar şaşırdılar. Firavun'un hanımı: ‘Bu çocuk, benim için de senin için de göz aydınlığı olsun. Onu öldürmeyin; belki bize faydası dokunur ya da onu evlat ediniriz’ dedi. (Kasas, 28/9)", "Bu sırada annenin gönlü yerinde değildi. Bebek ise Allah'ın takdiriyle hiçbir sütanneyi kabul etmiyordu. (Kasas, 28/12) Uzaktan bakan kız kardeşi öne çıktı: ‘Size onu sizin için yetiştirecek ve ona iyi bakacak bir aile göstereyim mi?’ dedi. Böylece bebek annesinin kucağına döndü. Allah şöyle buyurur: ‘Böylece onu, gözü aydın olsun, üzülmesin ve Allah'ın vaadinin gerçek olduğunu bilsin diye annesine geri verdik. Ama çokları bilmez.’ (Kasas, 28/13)", "Bir gün bile bırakmak istemeyeceği evladını, Allah'ın sözüne güvenerek suya emanet eden bir anne düşünün. O gün sandık nehre bırakılırken kimse sonunu bilmiyordu. Anne yalnızca bir şeyi biliyordu: Allah'ın vaadi, korkusundan büyüktü. Akıntı bebeği önce Firavun'un sarayına götürdü; ama Allah'ın takdiri onu yine annesinin kucağına ulaştırdı. Kalbi korkuyla ilhamın arasında kalmış, ilhamı seçmişti. Allah da bu güveni boşa çıkarmadı."], "ibret": "Musa'nın annesi korkusunu ve sevgisini Allah'ın ilhamına teslim etti. Allah da emaneti ona daha güzel bir şekilde geri verdi. Allah'ın vaadi, insanın endişesinden daha büyüktür.", "kaynak": "Kasas Sûresi, 28/4-13; Tâhâ Sûresi, 20/38-40"}, {"no": 3, "baslik": "İmrân'ın Hanımının Adağı", "tur": "kaynakli", "paragraflar": ["Meryem dünyaya gelmeden önce, bir annenin yüreğinde bir dua doğdu. İmrân'ın hanımı çocuğuna kavuşacağı günü beklerken Rabbine yalvardı: ‘Rabbim! Karnımdakini, yalnız sana hizmet etsin diye sana adadım. Benden kabul buyur. Şüphesiz sen işitirsin, bilirsin.’ (Âl-i İmrân, 3/35) Müfessirlere göre o dönemde adanan çocuklar ibadet yerinde hizmet ederdi ve bu hizmet genellikle erkek çocuklara yakıştırılırdı. Kadın da doğacak çocuğunu, bir sır gibi Allah'a emanet etmişti.", "Doğum günü geldi ve her şey umduğu gibi çıkmadı. ‘Rabbim, ben onu kız doğurdum’ dedi. Oysa Allah, onun ne doğurduğunu en iyi bilendi; erkek, kız gibi değildi. Anne duasını şöyle sürdürdü: ‘Ben ona Meryem adını verdim. Onu ve soyunu kovulmuş şeytanın şerrinden sana sığındırırım.’ (Âl-i İmrân, 3/36) Beklediğiyle eline geçen farklıydı; ama o, adağından vazgeçmedi. Hayal kırıklığını bir şikâyete değil, yeni bir duaya çevirdi: bebeğini ve gelecek nesillerini Allah'ın korumasına bıraktı.", "Allah da Meryem'i güzel bir kabulle kabul etti ve onu güzel bir bitki gibi yetiştirdi. Onun bakımını Zekeriya'ya verdi. (Âl-i İmrân, 3/37) Kur'an, bu bakım meselesinde kimin sorumluluk alacağı için kalemlerini atanlardan da söz eder. (Âl-i İmrân, 3/44) Bu cümlelerin içinde bir annenin duasının karşılığı saklıdır. Anne bir şey istemişti, Allah ise çok daha fazlasını vermişti. Kız çocuğu diye geri çevrilmedi; tam tersine seçilmişti.", "Adak, kişinin Allah'a kendi isteğiyle verdiği sözdür. İmrân'ın hanımı bu sözü, çocuk doğmadan önce vermişti. Doğan çocuk kız da olsa söz sözdü. Kur'an'da adıyla anılan tek kadın Meryem'dir; bir annenin duasıyla başlayan bu hayır, yalnız kendi evinde kalmadı. Bu hikâye bize hem sözünde durmayı hem de Allah'ın kabulüne güvenmeyi öğretir.", "Peygamber Efendimiz (s.a.v.) bu duanın bereketini şöyle haber vermiştir: ‘Doğan her insanoğluna, doğduğu sırada şeytan dokunur; çocuk bu dokunuştan ötürü bağırarak ağlar. Yalnız Meryem ve oğlu bunun dışındadır.’ Hadisi aktaran Ebû Hüreyre (r.a.) bunun ardından ‘İsterseniz şu ayeti okuyun’ demiş ve İmrân'ın hanımının duasını anmıştır: ‘Onu ve soyunu kovulmuş şeytandan sana sığındırırım.’ Yani anne, kızı için ne istediyse, Allah onu bir ayet olarak bırakmış, bir hadisle de müjdelemiştir.", "Bir annenin dar bir anda söylediği dua, yüzyıllar sonra bile Kur'an'ın sayfalarında ve Peygamberimizin sözlerinde yaşıyor. Meryem'in Zekeriya'nın gözetiminde büyümesi, Allah'ın gösterdiği bir yolun başlangıcıydı. Her şey, çocuğunu hayırla Allah'a emanet eden bir annenin sade duasıyla başlamıştı. İmrân'ın hanımının adı Kur'an'da geçmez; ama duası, ismi bilinmeden de unutulmaz. Evladı için en güzel koruma, ona yapılan duadır. Bu dua, her annenin evladı için yapabileceği en büyük iyiliği de gösterir: gücünün yetmediği yerde onu Allah'a emanet etmek."], "ibret": "İmrân'ın hanımı kızını da, soyunu da Allah'a sığındırdı. Evladı için en güzel koruma, ona yapılan dua ve onu Allah'a emanet etmektir. Allah, hayırlı niyetle yapılan duayı beklenenden güzel kabul eder.", "kaynak": "Âl-i İmrân Sûresi, 3/35-37 ve 44; Buhârî, Enbiyâ (3431); Müslim, Fezâil (2366)"}, {"no": 4, "baslik": "Ebû Hüreyre Annesi İçin Dua İstiyor", "tur": "kaynakli", "paragraflar": ["Ebû Hüreyre (r.a.), Peygamber Efendimiz'in (s.a.v.) yanında en çok hadis dinleyen ve aktaran sahabilerdendir. Ama bu hikâyede o bir âlim olarak değil, bir evlat olarak karşımıza çıkar. Annesi henüz Müslüman olmamıştı. Ebû Hüreyre onu yumuşak bir dille defalarca İslam'a davet ediyordu. Bir gün yine anlattı; fakat annesi bu kez Peygamberimiz hakkında hoşlanmadığı bir söz söyledi. Hadiste sözün ne olduğu açıkça yazılmaz. Yalnızca Ebû Hüreyre'nin bundan çok incindiği anlaşılır. Ebû Hüreyre, hadis kaynaklarına göre Devs kabilesindendir; Medine'ye geldikten sonra Resûlullah'ın yanından ayrılmamıştır.", "Ebû Hüreyre ağlayarak Resûlullah'ın yanına geldi. ‘Ya Resûlallah’ dedi, ‘annemi İslam'a çağırıyordum, o ise bana senin hakkında hoşlanmadığım bir şey söyledi. Allah'a dua et de Ebû Hüreyre'nin annesine hidayet versin.’ Peygamberimiz hemen dua etti: ‘Allahım, Ebû Hüreyre'nin annesine hidayet ver.’ Ebû Hüreyre bu duadan umutlanarak evine doğru yola çıktı. Kalbinde hem üzüntü hem de bir beklenti vardı. Annesine karşı sevgisi, incinmesine rağmen azalmamıştı.", "Eve vardığında kapının kapalı olduğunu gördü. İçeriden su sesi geliyordu. Tam kapıya yaklaşırken annesi: ‘Ebû Hüreyre, olduğun yerde dur’ dedi. Biraz sonra elbisesini giydi, başörtüsünü aceleyle örttü ve kapıyı açtı. Sonra şöyle dedi: ‘Eşhedü en lâ ilâhe illallah ve eşhedü enne Muhammeden abdühû ve resûlüh.’ Yani ‘Allah'tan başka ilah olmadığına ve Muhammed'in O'nun kulu ve resûlü olduğuna şahitlik ederim.’ Böylece uzun zamandır süren davet, bir duanın ardından karşılığını bulmuştu.", "Ebû Hüreyre sevinçten ağlayarak Peygamberimize geri döndü. İlk gelişinde hüzünle akan gözyaşları, bu kez sevinçle akıyordu. ‘Müjde ya Resûlallah! Allah duanı kabul etti ve annemi hidayete erdirdi’ dedi. Peygamberimiz Allah'a hamd etti, hayırla andı. Bunun üzerine Ebû Hüreyre bir dua daha istedi: ‘Ya Resûlallah, Allah'a dua et de beni ve annemi mümin kullarına sevdirsin, onları da bize sevdirsin.’", "Hidayet konusunda Kur'an'ın bir hatırlatması vardır: ‘Şüphesiz sen sevdiğini doğru yola erdiremezsin; ancak Allah dilediğini doğru yola erdirir.’ (Kasas, 28/56) Peygamberimiz de bu yüzden önce Allah'a dua etti. Ebû Hüreyre ise ne bağırdı, ne zorladı; yumuşak dille davet etti, sonra Allah'a yöneldi.", "Peygamberimiz: ‘Allahım, şu küçük kulunu ve onun annesini mümin kullarına sevdir; mümin kullarını da onlara sevdir’ diye dua etti. Ebû Hüreyre sonradan şunu anlatır: ‘Beni görüp ya da duyup da sevmeyen hiçbir mümin yoktur.’ Bir evladın gözyaşı, bir annenin kalbini açtı. Bir peygamberin duası ise ikisinin de güzel anılmasına vesile oldu. Kırılan kalp, kırgınlıkta kalmadı; duaya dönüştü ve karşılığını buldu. Sevgi ile sabır, çoğu zaman en zor kapıyı bile açar."], "ibret": "Ebû Hüreyre annesine kırılmak yerine onun hidayeti için dua istedi. Kırıcı söze sevgiyle ve duayla karşılık verenin eli boş dönmez. Anne babaya iyilik, onların hayrını istemekle de gösterilir.", "kaynak": "Müslim, Fezâilü's-sahâbe (2491); Kasas Sûresi, 28/56"}, {"no": 5, "baslik": "Esmâ ve Annesi", "tur": "kaynakli", "paragraflar": ["Esmâ bint Ebû Bekir (r.anha) bir gün annesinin kendisini görmeye geldiğini haber alınca şaşırdı. Annesi Müslüman değildi; müşrikler arasında yaşıyordu. Siyer kaynaklarında annesinin adı Kuteyle olarak geçer ve Ebû Bekir'in ondan Müslüman olmadan önce ayrıldığı belirtilir. Hadise göre bu olay, Peygamberimiz zamanında, Kureyş'le yapılan antlaşmanın sürdüğü günlerde yaşandı. Anne, kızından bir ilgi ve iyilik bekleyerek gelmişti. Hadisteki ‘beklentiyle gelmek’ ifadesi, annenin Esmâ'dan bir yardım ya da ilgi istediğini düşündürür.", "Esmâ ne yapacağını bilemedi. Annesini kabul etmek, ona ikramda bulunmak doğru muydu? İnanç ayrılığı, evladın annesine karşı görevini değiştirir miydi? Bu soruyu kendi kendine cevaplamak yerine doğrudan Peygamber Efendimiz'e (s.a.v.) gitti. ‘Ya Resûlallah’ dedi, ‘annem bana geldi ve benden bir şey bekliyor. Ona iyilik edeyim mi, onunla bağımı sürdüreyim mi?’", "Peygamberimizin cevabı kısa ve açıktı: ‘Evet. Annenle bağını sürdür.’ Esmâ'nın içindeki tereddüt böylece sona erdi. Bir anne, farklı inançta olsa bile annedir; ona gösterilen iyilik, evladın güzel ahlakının bir parçasıdır. Peygamberimiz bu sözüyle iki şeyi aynı anda öğretiyordu: Müslüman, imanından taviz vermeden annesinin hakkını korur; annenin hakkı da inanç farkıyla ortadan kalkmaz. Esmâ'nın aldığı bu cevap, sonraki nesillere de rehber oldu. Akrabalık bağını sürdürmek, yani sıla-i rahim, dinin güzel öğütlerindendir.", "Kur'an, ana babaya iyiliği birçok yerde öğütler. Dinde ayrılık olsa bile, şu ayet bu konuda yol göstericidir: ‘Eğer onlar, hakkında bilgin olmayan bir şeyi bana ortak koşman için seni zorlarlarsa onlara itaat etme; ama dünyada onlarla güzelce geçin.’ (Lokmân, 31/15) Yani imandan taviz verilmez, fakat anneye karşı sevgi ve saygı da bırakılmaz. Esmâ bu dengeyi Peygamberimize sorarak buldu.", "Bu olayla ilgili olarak bir ayetten de söz edilir. Mümtehine Sûresi'ndeki ayetin bu olay üzerine indiği rivayet edilir. Ayette Allah şöyle buyurur: ‘Allah, din konusunda sizinle savaşmayan ve sizi yurtlarınızdan çıkarmayan kimselere iyilik etmenizi ve onlara adil davranmanızı yasaklamaz. Şüphesiz Allah, adil davrananları sever.’ (Mümtehine, 60/8) Yani Allah, savaşmayan ve düşmanlık etmeyen insanlara karşı iyiliği ve adaleti, bir Müslümanın ahlakının parçası saymıştır.", "Peygamberimizin bir başka sözü de bu hikâyenin yanına yakışır. Bir adam, ‘Ya Resûlallah, insanlar arasında iyi davranmama en çok layık olan kimdir?’ diye sormuştu. ‘Annen’ dedi Peygamberimiz. ‘Sonra kim?’ ‘Annen.’ ‘Sonra kim?’ ‘Annen.’ ‘Sonra kim?’ ‘Sonra baban.’ Esmâ'nın sorusu ve bu cevap, İslam'ın annenin hakkını ne kadar yüce gördüğünü gösterir. İslam, sevgiyi inanç farkıyla ölçmedi; annenin hakkını Allah'ın hakkından sonra gelen en yüce haklardan biri olarak belirledi."], "ibret": "Esmâ, annesine karşı ne yapacağını Peygamberimize sorarak öğrendi. Anne farklı inançta da olsa evlat ona iyilik eder, bağını koparmaz. Güzel ahlak, karşımızdaki kim olursa olsun bizi terk etmemelidir.", "kaynak": "Buhârî, Hibe (2620); Edeb (5978, 5971); Müslim, Zekât (1003); Mümtehine Sûresi, 60/8; Lokmân Sûresi, 31/15"}, {"no": 6, "baslik": "Hurmayı İki Kızına Bölen Anne", "tur": "kaynakli", "paragraflar": ["Hz. Âişe'nin (r.anha) kapısı bir gün çalındı. Kapıda iki küçük kızıyla yoksul bir kadın duruyordu. Yüzlerinden ihtiyaç içinde oldukları anlaşılıyordu. Kadın yardım istedi. Âişe o gün evde bulduğu üç hurmayı kadına verdi. Az bir ikramdı; ama Âişe, kapısına gelen ihtiyaç sahibini eli boş çevirmemişti; ama verdiği şeyin ne kadar büyük bir olaya vesile olacağını henüz bilmiyordu.", "Kadın üç hurmayı aldı. Kızlarından her birine bir hurma uzattı. Kendisine ayırdığı üçüncüyü ağzına götürüyordu ki kızları ona baktı. Onlar henüz doymamıştı; annelerinin elindeki hurmayı istediler. Kadın, tam yiyeceği anda hurmayı ağzından indirdi, ikiye böldü ve yarısını bir kızına, yarısını öbürüne verdi. Kendisi bir şey yemeden kalktı ve kızlarını alıp evden çıktı.", "Âişe bu manzarayı gördü ve çok şaşırdı. Peygamber Efendimiz (s.a.v.) eve geldiğinde olanı ona olduğu gibi anlattı. Kadının hurmasını iki kızı için bölmesini, kendi aç kalmayı göze almasını söyledi. Bir annenin kendinden vazgeçişi, eşikte geçen kısacık bir anda bile insanın kalbine işleyebilir.", "Bu hadis Müslim'in ‘Kız çocuklarına iyilik etmenin fazileti’ babında yer alır. Âişe'nin ifadesine göre kadının bu davranışı onu hayrete düşürmüştü. Gerçekten de bir anne için kendi lokmasından vazgeçmek, belki de en zor ve en sessiz fedakârlıktır; kimse onu alkışlamaz, kimse bilmez. Ama bilen Allah vardır.", "Peygamberimiz onu dinledi ve şöyle buyurdu: ‘Allah, bu davranışı sebebiyle ona cenneti vacip kıldı.’ Rivayette ‘ya da onu ateşten kurtardı’ şeklinde bir şüphe ifadesi de geçer. Kimsenin tanımadığı yoksul bir kadındı bu. Ne makamı vardı ne serveti; yalnızca evlatları için bir hurmayı bölecek kadar şefkati vardı. Allah'ın katında değeri ise, dünyadaki hâliyle değil, gösterdiği fedakârlıkla ölçüldü. Kadının adı, nereli olduğu, kızlarının kaç yaşında olduğu bilinmiyor. Hadis bunları anlatmaz; çünkü ibret, kimliğinde değil, davranışındadır.", "Peygamberimiz kız çocukları hakkında şunu da buyurmuştur: ‘Kim iki kız çocuğunu erginlik çağına gelinceye kadar bakıp büyütürse, kıyamet günü ben ve o şöyle geliriz.’ Bunu söylerken iki parmağını bitiştirmiştir. Bu söz, hurmayı bölen annenin davranışının tek başına değil, bir ahlakın parçası olduğunu gösterir.", "Peygamberimizin aynı konuda bir sözü daha bilinir: ‘Kim bu kız çocuklarıyla imtihan edilir de onlara iyi davranırsa, onlar kıyamet günü kendisi için ateşe karşı bir perde olurlar.’ Kur'an da kız çocuğunun doğumundan hoşlanmayan eski anlayışı eleştirmişti. (Nahl, 16/58-59) Bir hurma, bir lokma, bir şefkat; Allah'ın kapısını açan küçük şeylerdir. Evlat için hakkından vazgeçen her anne, bu müjdeden payını alır."], "ibret": "Anne, kendi hakkı olan lokmayı bile evlatlarına verdi. Fedakârlık, bazen yalnızca bir hurmayı bölmektir. Allah, sessizce yapılan o paylaşımı görür ve en büyük karşılığı verir.", "kaynak": "Müslim, Birr ve Sıla (2630, 2631); Buhârî, Zekât (1418); Edeb (5995); Nahl Sûresi, 16/58-59"}, {"no": 7, "baslik": "Esirler Arasında Çocuğunu Arayan Anne", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimiz'in (s.a.v.) yanına bir gün esirler getirildi. Hadisi aktaran Ömer (r.a.) bu esirlerin hangi olaydan geldiğini söylemez; yalnızca aralarındaki bir kadını anlatır. Kadın telaş içindeydi ve kalabalığın arasında birini arıyordu. Göğsü sütle dolmuştu. Koşuyor, bakıyor, duraksıyor, yeniden arıyordu. Savaşın ve esirliğin ağırlığı içinde bir annenin tek derdi vardı: Çocuğunu bulmak.", "Esirler arasında bir çocuk görünce onu hemen aldı, bağrına bastı ve emzirdi. Kadının bu hâli Peygamberimizin ve çevresindeki sahabilerin dikkatini çekti. Ayrılığın ortasında bir annenin evladına duyduğu özlem, herkese açıkça görünüyordu. Hadiste kimsenin kadına bir şey söylediği anlatılmaz; Peygamberimiz ise bu sahneden, yanındakilere büyük bir ders çıkarmak istemiştir.", "Bu hadis, Allah'ın rahmetini ve tövbe eden kulların affını anlatan bir bölümde yer alır. Bu bağlam, sahnenin neden anlatıldığını gösterir: Peygamberimiz, bir annenin sevgisini ölçü alarak Allah'ın kullarına merhametini anlatmak istemiştir. Esirlik gibi ağır bir ortamda bile ortaya çıkan şefkat, rahmetin dünyadaki küçük bir yansımasıdır.", "Sonra Peygamberimiz sahabilerine döndü ve sordu: ‘Sizce bu kadın, çocuğunu ateşe atar mı?’ Sahabiler: ‘Hayır, vallahi. Gücü yettiği sürece onu asla ateşe atmaz’ dediler. Peygamberimiz o zaman şöyle buyurdu: ‘Allah, kullarına, bu kadının çocuğuna olan merhametinden daha merhametlidir.’ Bu söz, orada bulunanlar için bir annenin sevgisinden yola çıkıp Allah'ın rahmetini anlamanın en yakın yolu oldu.", "Peygamberimiz şöyle de buyurmuştur: ‘Merhamet edenlere Rahman olan Allah merhamet eder. Yeryüzündekilere merhamet edin ki gökteki size merhamet etsin.’ Kur'an da ‘Rabbiniz, rahmeti kendi üzerine yazmıştır’ diyerek bunu bildirir. (En'âm, 6/54) Demek ki merhamet, yalnız bir duygu değil; Allah'ın kullarına koyduğu güzel bir ölçüdür.", "Bir annenin şefkatini hepimiz biliriz. Çocuk düşse tutar, ağlasa sarar, hasta olsa başında bekler, geceyi gündüze katar. Allah'ın merhameti ise bunun çok ötesindedir. Peygamberimiz başka bir hadiste bunu şöyle anlatır: ‘Allah rahmeti yüz parçaya ayırdı; doksan dokuzunu kendi katında tuttu, bir parçasını yeryüzüne indirdi. Yaratıkların birbirine merhamet etmesi o bir parçadandır. Hatta bir hayvanın yavrusuna zarar vermemek için ayağını kaldırması da bundandır.’", "Bu hadisler bize iki şey öğretir. Birincisi, evladını koruyan bir annenin sevgisi çok kıymetlidir; bu sevgi, Allah'ın yarattığı en güzel duygulardan biridir. İkincisi, bu sevginin üstünde Allah'ın sonsuz rahmeti vardır. Hata edenlerin, kaybolanların, yoldan çıkanların bile Rablerine dönebileceği bir kapı hep açıktır. Bu müjde, her gönül için bir umut kaynağıdır; her anne için de bir tesellidir. Bu umut, anne olan da olmayan da herkesin ortak sığınağıdır."], "ibret": "Anne, evladı için koşar, onu bulunca bağrına basar. Allah'ın kullarına merhameti bundan çok daha büyüktür. Rabbimizin rahmetini düşününce, hiçbir kul Allah'ın kapısından umudunu kesmemelidir.", "kaynak": "Buhârî, Edeb (5999, 6000); Müslim, Tevbe (2754, 2752); Ebû Dâvûd, Edeb (4941); Tirmizî, Birr ve Sıla (1924); En'âm Sûresi, 6/54"}, {"no": 8, "baslik": "Hatice'nin Teselli Eden Sözleri", "tur": "kaynakli", "paragraflar": ["Hira Mağarası'ndaki ilk vahiyden sonra Peygamber Efendimiz (s.a.v.) heyecan içinde evine geldi. Kalbi hızlı hızlı atıyordu. Eşi Hz. Hatice'ye (r.anha) ‘Beni örtün, beni örtün!’ dedi. Onu örttüler. Heyecanı biraz yatışınca Hatice'ye olanları anlattı ve ‘Kendimden korktum’ dedi. Siyer kitaplarına göre Hatice, Mekke'nin saygın ve varlıklı kadınlarındandı ve Peygamberimizle uzun yıllardır evliydi. O, kocasını en yakından tanıyan insandı.", "Hadise göre Peygamberimize ilk gelen söz ‘Oku’ olmuştu: ‘Yaratan Rabbinin adıyla oku! O, insanı alaktan yarattı. Oku! Rabbin sonsuz kerem sahibidir. O ki kalemle (yazmayı) öğretti. İnsana bilmediğini öğretti.’ (Alak, 96/1-5) Peygamberimiz bu ağır sözle eve dönmüştü. Onu karşılayan, korkusunu söyleyebileceği bir eş idi.", "Hatice şaşırmadı, telaşa kapılmadı. Şöyle dedi: ‘Hayır, vallahi! Allah seni asla utandırmaz. Sen akrabalık bağlarını gözetirsin, yükü ağır olanın yükünü taşırsın, yoksula kazandırırsın, misafiri ağırlarsın ve hak yolunda başına gelen sıkıntılarda insanlara yardım edersin.’ Bu sözler, kocasının güzel ahlakına duyduğu güvenin ifadesiydi. Korku dolu bir anda bir eş, en doğru teselliyi vermişti: Onun korkusunu değil, güzel yönlerini hatırlatmıştı. Bu sözlerin her biri, Peygamberimizin vahiyden önceki hayatını da bilen birinin şahitliğiydi. Kendi korkusu içindeki bir insanın yanında, ona yüreklilik veren bir yoldaş vardı.", "Sonra Hatice, Peygamberimizi amcasının oğlu Varaka b. Nevfel'e götürdü. Varaka, eski kitapları bilen yaşlı bir adamdı. Peygamberimizin anlattıklarını dinledikten sonra: ‘Bu, Allah'ın Musa'ya da gönderdiği melektir’ dedi. Ardından kavminin bir gün onu yurdundan çıkaracağını ve onun getirdiği gibi bir şey getiren herkese düşmanlık edildiğini söyledi. Bu görev ağırdı; ama onun yanında inanan, güvenen bir eş vardı. Çok geçmeden Varaka vefat etti ve vahiy bir süre kesildi.", "Yıllar geçti. Hatice, Peygamberimizin ilk inananı ve en yakın destekçisi oldu. Allah da bu desteği unutmadı. Ebû Hüreyre'nin anlattığına göre bir gün Cebrâil (a.s.), Peygamberimizin yanına gelip şöyle dedi: ‘Ya Resûlallah, işte Hatice geliyor; yanında bir kap yemek ya da içecek var. Yanına gelince ona Rabbinden ve benden selam söyle. Ona cennette, içinde gürültü ve yorgunluk olmayan, boş inciden bir ev müjdele.’ Hatice'nin vefatından sonra bile Peygamberimiz onu hayırla anardı.", "Bir eşin güvenli, sakin ve umut veren sözü, tarihin en büyük görevinin ilk anında Peygamberimize kuvvet oldu. Hatice'nin bu sözleri, bir ailede sevginin ve güvenin en zor günlerde insanı ayakta tutan bir güç olduğunu gösterir. Korkuyla eve gelen birini öğütle değil, onu dinleyerek ve güzel yönlerini hatırlatarak teselli etmek; belki de ev halkının birbirine verebileceği en büyük hediyedir."], "ibret": "Hatice, korkuyla gelen eşine sevgiyle ve doğru sözlerle güven verdi. Aile içinde söylenen iyi bir söz, bir insanı en büyük sınavda ayakta tutabilir. Allah, destek olanı da unutmaz.", "kaynak": "Buhârî, Bed'ü'l-vahy (3); Menâkıbü'l-ensâr (3818, 3820); Müslim, Îmân (160); Fezâilü's-sahâbe (2432); Alak Sûresi, 96/1-5"}], "kapanis": "Annelerin duası görünmez bir yoldur; yolun her adımında bizi izler. Hacer'in koşusu, Musa'nın annesinin güveni, Hatice'nin teselli eden sözleri bize aynı şeyi gösterdi: Allah'a güvenen gönül çaresiz kalmaz. Bu kitabı kapatırken annenize bir dua edin. Mümkünse bir telefon açın ya da bir ziyaret edin. Allah tüm annelerimizden razı olsun.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/04/", "kapak": "../../kapak/04.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 5, "baslik": "Sabredenlerin Hikâyeleri", "hazir": true, "yol": "../05/index.html"}, "pdf": "../../pdf/kitap-04.pdf", "epub": "../../epub/kitap-04.epub", "gorunum": "kitap-gorunumu.html"}</script>
