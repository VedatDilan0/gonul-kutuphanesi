<script type="application/json" id="kitap-veri">{"no": 6, "baslik": "Allah'a Güvenen Gönüller", "tanitim": "Ateşin, denizin ve mağaranın ortasında yalnız Allah'a dayanan gönüller; tevekkülün tedbiri bırakmak değil, elden geleni yapıp Allah'a güvenmek olduğunu anlatan sekiz hikâye.", "onsoz": "Tevekkül, elini kolunu bağlayıp beklemek değildir. Kur'an ve hadislerdeki örnekler, önce elden gelenin yapıldığını, sonra sonucun Allah'a bırakıldığını gösterir. Bu kitaptaki sekiz hikâyede kimi zaman ateş, kimi zaman deniz, kimi zaman bir mağara ya da bir salgın var. Hepsinde güvenin adresi aynı: Allah. Hikâyeler, bu güveni sade ve sıcak bir dille anlatıyor.", "hikayeler": [{"no": 1, "baslik": "Ateşe Atılan İbrahim", "tur": "kaynakli", "paragraflar": ["Bir gün kavmi bayram için şehirden çıkmıştı ve İbrahim (a.s.) putların yanına gitmişti. Putları kırıp büyüklerini bıraktığı olay, ayrı bir hikâyenin konusudur. Bu hikâye, ondan sonrasını anlatır. Kavmi, işin kimin elinden çıktığını anlayınca öfkeyle şunu dedi: ‘Yakın onu ve tanrılarınıza yardım edin; eğer bir şey yapacaksanız!’ (Enbiyâ, 21/68) Kur'an, bir başka yerde onların bu işi nasıl hazırladığını da kısaca anlatır: ‘Onun için bir yapı yapın ve onu alevli ateşe atın.’ (Sâffât, 37/97) Kısacası, bir yanda öfkeli bir kalabalık, öbür yanda tek başına bir kul vardı.", "Ateşin ne kadar büyük olduğu, nasıl yakıldığı, İbrahim'in ona nasıl atıldığı Kur'an'da ayrıntıyla verilmez. Bazı kitaplarda geçen mancınık, hükümdarın adı, ateşin kaç gün yandığı gibi bilgilerin Kur'an'da dayanağı yoktur. Biz yalnızca ayetlerin ve sahih rivayetin söylediği kadarını biliyoruz. Bildiğimiz şey de yeterince güçlüdür: İbrahim, böylesi bir ateşin başında tek başına kalmıştı. Ama yalnız değildi.", "İbn Abbas (r.a.) şöyle anlatır: ‘Hasbünallâhü ve ni'me'l-vekîl’ (Allah bize yeter, O ne güzel vekildir) sözünü, İbrahim ateşe atıldığı zaman söylemişti. Bu söz bir sığınaktır. Kul, elinden geleni yapmış, gücünün yetmediği yerde Allah'a dayanmıştır. İbrahim, hesap yapmadı, pazarlık etmedi; yalnızca bu kısa ve yüce cümleyi söyledi. Hadis âlimleri bu rivayeti sahih kabul eder ve İbn Abbas'ın sözü olarak nakleder.", "‘Hasb’ kelimesi ‘yeter’ demektir; ‘vekîl’ ise işi kendisine bırakılan, güvenilen demektir. Yani bu cümle şunu söyler: Bana Allah yeter; işimi emanet ettiğim O, ne güzel güvenilecek dosttur. Kavmi ise bu konuda başka bir şey düşünmüyordu: ‘Onu öldürün ya da yakın’ demekten başka cevapları olmadı. (Ankebût, 29/24)", "Allah'ın cevabı kısa ve etkili oldu: ‘Ey ateş! İbrahim'e karşı serin ve selamet ol!’ (Enbiyâ, 21/69) Ateş ona zarar vermedi. Kavmi ona bir tuzak kurmak istemişti; Allah ise onları en çok zarar edenler yaptı. (Enbiyâ, 21/70) Ankebût Sûresi, olayın sonunu şöyle bağlar: ‘Allah onu ateşten kurtardı. Şüphesiz bunda inanan bir kavim için deliller vardır.’ (Ankebût, 29/24) Ateşin serinlenişi, güvenin karşılığıydı. Bu yüzden İbrahim'in sözü bir kaçış değil, bir bağlanıştır: Hiçbir gücün yetmediği yerde Allah'a yaslanmak.", "Tevekkül, tedbirsizlik değildir. İbrahim, kavmine hakikati açıkça söylemiş, putların güçsüzlüğünü ortaya koymuş, elinden geleni yapmıştı. Ama sonuç, onun elinde değildi. Elinde olmayan yerde ona kalan şey, Allah'a güvenmekti. Bu güven bir pasiflik değil, insanın en dik durduğu andır. Kavmi onu ateşe atmaya karar verirken İbrahim'in kalbi, korkunun değil güvenin yanındaydı. Allah da onu, kendisine sığınan kul olarak korudu."], "ibret": "İbrahim ateşin karşısında ‘Allah bize yeter’ dedi. Elinden geleni yapıp gerisini Allah'a bırakan kul yalnız kalmaz. Allah, kendisine güvenen kulunu en büyük tuzaktan da kurtarır.", "kaynak": "Enbiyâ Sûresi, 21/68-70; Sâffât Sûresi, 37/97-98; Ankebût Sûresi, 29/24; Buhârî, Tefsîr (4563)"}, {"no": 2, "baslik": "Deniz Kıyısında ‘Rabbim Benimledir’", "tur": "kaynakli", "paragraflar": ["Bir gece, Mısır'da küçük bir topluluk sessizce yola çıktı. Allah, Musa'ya şöyle vahyetmişti: ‘Kullarımı geceleyin yürüt. Çünkü sizi takip edecekler.’ (Şuarâ, 26/52) Musa ve beraberindekiler, yıllarca baskı altında yaşadıkları yurtlarını arkalarında bırakıyorlardı. Firavun bunu öğrenince şehirlere toplayıcılar gönderdi: ‘Bunlar küçük bir topluluk’ dedi. (Şuarâ, 26/53-54) Ama güç, kalabalıkta değil, Allah'ın yardımındaydı. Şuarâ Sûresi, takipçilerin sabaha erdikleri sırada onların arkasına düştüğünü bildirir. (Şuarâ, 26/60)", "Gün doğarken Firavun'un ordusu onlara yetişti. İki topluluk birbirini görecek kadar yaklaşınca Musa'nın yanındakiler korkuyla: ‘Yakalandık!’ dediler. (Şuarâ, 26/61) Önlerinde deniz, arkalarında ordu vardı. Korkmakta haksız değillerdi; çünkü insanın çaresiz kaldığı yer işte böyle bir yerdir. Ama bu anda Musa, kendinden emin bir sesle şöyle dedi: ‘Asla! Şüphesiz Rabbim benimle beraberdir; O bana yol gösterecektir.’ (Şuarâ, 26/62) Yani iki yürek aynı anda aynı manzarayı görüyordu; biri korkuyla, öbürü güvenle bakıyordu.", "Allah, bu olayı İsrailoğullarına şöyle hatırlatır: ‘Hani sizin için denizi yarmış, sizi kurtarmış ve Firavun hanedanını gözlerinizin önünde boğmuştuk.’ (Bakara, 2/50) Musa'nın o gün söylediği ‘bana yol gösterecek’ sözünde bir şey daha vardır: Gelecek zamana yönelik bir güven. ‘Gösteriyor’ değil, ‘gösterecek’ demişti. Yolu şimdi görmüyordu; ama yolu gösterecek olanı biliyordu. Musa ise o dar anda bile Rabbinin yolu göstereceğinden emindi. Kurtuluş, çoğu zaman en dar anda belirir.", "Allah Musa'ya şöyle vahyetti: ‘Asanı denize vur!’ Deniz yarıldı ve her bir parçası koca bir dağ gibi oldu. (Şuarâ, 26/63) Allah, Tâhâ Sûresi'nde bunu şöyle anlatır: ‘Onlara denizde kuru bir yol aç. Yakalanmaktan korkma, endişe etme.’ (Tâhâ, 20/77) Musa ve beraberindekiler o yoldan geçtiler. Allah, Musa'yı ve beraberindekileri kurtardı; ötekileri ise suda bıraktı. Firavun ise ordusuyla peşlerinden girdi ve deniz onları içine aldı. (Şuarâ, 26/65-67; Tâhâ, 20/78)", "Bu olay, Peygamber Efendimizin (s.a.v.) zamanında da hatırlanıyordu. İbn Abbas'ın (r.a.) anlattığına göre Peygamberimiz Medine'ye geldiğinde Yahudilerin Âşûrâ günü oruç tuttuğunu gördü. Sebebini sordu. ‘Bu, Allah'ın Musa'yı ve İsrailoğullarını düşmanlarından kurtardığı gündür’ dediler. Peygamberimiz: ‘Biz Musa'ya sizden daha yakınız’ buyurdu ve o gün oruç tuttu, Müslümanlara da oruç tutmalarını emretti. Âşûrâ, bugün de Müslümanlar için bir şükür ve hatırlama günüdür.", "Deniz yarıldığı anda Musa'nın yanındakilerin korkusu sona ermişti. Allah'ın kurtuluşu, kimi zaman ‘çaresiz’ denilen yerde başlar. Musa'nın ‘Rabbim benimledir’ sözü, bir peygamberin güveniydi; ama bu güveni her mümin kendi hayatında yaşayabilir. Önümüz deniz, arkamız ordu gibi görünse de Rabbimiz yolu bilir. Yeter ki yüreğimiz, korkunun değil, Allah'ın yanında olsun."], "ibret": "Musa, önünde deniz arkasında ordu varken ‘Rabbim benimledir’ dedi. Çaresiz görünen yerde Allah'ın yolu açıktır. Güvenen kalbe korku egemen olmaz; Allah, ona kurtuluş yolunu gösterir.", "kaynak": "Şuarâ Sûresi, 26/52-68; Tâhâ Sûresi, 20/77-79; Bakara Sûresi, 2/50; Buhârî, Savm (2004)"}, {"no": 3, "baslik": "Hurma Ağacının Dibinde Meryem", "tur": "kaynakli", "paragraflar": ["Meryem, ailesinden ayrılıp doğu tarafında bir yere çekildi; kendisiyle onlar arasına bir perde germişti. Kur'an'a göre Allah ona ruhunu gönderdi ve ruh, ona düzgün bir insan kılığında göründü. Meryem: ‘Ben senden Rahmân'a sığınırım; eğer Allah'tan korkuyorsan’ dedi. Gelen: ‘Ben ancak Rabbinin elçisiyim; sana tertemiz bir oğul bağışlamak için geldim’ dedi. (Meryem, 19/16-19) Kur'an burada Allah'ın elçisinin başka bir tasvirini yapmaz.", "Kur'an, Meryem'e verilen büyük değeri başka bir surede de bildirir: ‘Hani melekler demişti ki: Ey Meryem! Allah seni seçti, seni arındırdı ve seni dünya kadınlarına üstün kıldı.’ (Âl-i İmrân, 3/42) Ona kendisinden bir kelimeyi, yani Meryem oğlu İsa Mesih'i müjdelediler. (Âl-i İmrân, 3/45) Bu yüce müjde, onu yalnızlıkta ve suçlamada ayakta tutacak bir güven kaynağıydı.", "Meryem şaşırdı: ‘Bana bir insan dokunmadığı, ben de iffetsiz biri olmadığım hâlde nasıl çocuğum olur?’ Cevap kısa ve sakindi: ‘Böyledir; Rabbin buyurdu ki: Bu bana kolaydır. Onu insanlara bir delil ve bizden bir rahmet kılacağız.’ (Meryem, 19/20-21) Meryem gebe kaldı ve bir yere çekildi. Doğum sancısı onu bir hurma ağacının dibine götürdü. Yalnızdı, bitkindi ve çok yüklüydü. İşte o anda şöyle dedi: ‘Keşke bundan önce ölseydim de unutulmuş, gitmiş olsaydım!’ (Meryem, 19/23)", "Tam o sırada bir ses ona seslendi: ‘Üzülme! Rabbin senin alt yanında bir dere akıttı. Hurma ağacını kendine doğru silkele; üzerine taze, olgun hurmalar dökülsün. Ye, iç, gözün aydın olsun. Bir insan görürsen de ki: Ben Rahmân'a oruç adadım; bugün hiçbir insanla konuşmayacağım.’ (Meryem, 19/24-26) Bu cümlelerde bir yol haritası var: yemek, içmek, sakinleşmek, konuşmamak. Allah, korkunun ve yalnızlığın ortasında onun ihtiyacını karşılamıştı.", "Burada tevekkülün bir inceliği saklıdır. Allah, Meryem'in yemesi için hurmayı kendiliğinden önüne getirmedi; ona ‘hurma ağacını kendine doğru silkele’ dedi. Yani bir iş, bir çaba istedi. Doğum sancısı çeken, yorgun bir kadından bile bu küçük gayret beklendi. Sonra rızık, o çabanın üzerine dökülüp geldi. Tevekkül, çalışmayı bırakmak değil, çalışıp sonucu Allah'a bırakmaktır.", "Meryem bebeğini kucağına alıp kavmine döndü. Onlar: ‘Ey Meryem, gerçekten çok kötü bir şey yaptın!’ dediler ve ona ağır sözler söylediler. (Meryem, 19/27-28) Bu, hikâyenin en hassas yeridir. Meryem hiçbir şey söylemedi; yalnızca bebeğe işaret etti. ‘Beşikteki bir çocukla nasıl konuşuruz?’ dediler. O sırada beşikteki bebek konuşmaya başladı.", "‘Ben Allah'ın kuluyum. O bana kitap verdi ve beni peygamber yaptı. Nerede olursam olayım beni mübarek kıldı; yaşadığım sürece namazı ve zekâtı bana tavsiye etti. Anneme iyi davranmayı da bana emretti. Beni zorba ve bedbaht yapmadı. Doğduğum gün, öleceğim gün ve diri olarak kaldırılacağım gün selam bana!’ (Meryem, 19/30-33) Meryem, savunmasını Allah'a bırakmıştı. Allah da onu en güzel biçimde savundu."], "ibret": "Meryem yalnızlıkta ve suçlamada konuşmayı bıraktı, savunmasını Allah'a bıraktı. Allah, kendisine güvenen kulunu hem ihtiyacıyla hem itibarıyla korur. Yalnız kaldığımızı sandığımız yerde de Allah bizimledir.", "kaynak": "Meryem Sûresi, 19/16-33; Âl-i İmrân Sûresi, 3/42-47"}, {"no": 4, "baslik": "Mağaradaki İki Kişi", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimiz (s.a.v.) Mekke'den çıktığı gün yanında yalnız bir arkadaşı vardı: Ebû Bekir (r.a.). Siyer kitaplarına göre ikisi, Mekke'nin yakınında bir mağaraya sığındılar. Kureyş onları aramakta kararlıydı. Kur'an bu anı şöyle bildirir: ‘Eğer siz ona yardım etmezseniz, Allah ona yardım etmiştir. Hani kâfirler onu çıkarmışlardı; iki kişiden ikincisiydi. İkisi mağarada iken arkadaşına şöyle diyordu: Üzülme, Allah bizimledir.’ (Tevbe, 9/40) Allah, bu anın devamını da şöyle bildirir: ‘Allah ona huzur ve güven indirdi ve onu görmediğiniz ordularla destekledi.’ (Tevbe, 9/40)", "Ebû Bekir şöyle anlatır: ‘Mağarada Peygamberimize dedim ki: Eğer onlardan biri ayaklarının altına baksa bizi görür.’ Arayanlar o kadar yakına gelmişti ki mağaranın üstünde duran müşriklerin ayakları görünüyordu. Peygamberimiz sakin bir sesle cevap verdi: ‘Ey Ebû Bekir! Üçüncüleri Allah olan iki kişi hakkında ne düşünürsün?’ Bu söz, mağaranın dar karanlığında genişleyen bir güvendi. Orada iki kişi vardı; ama Allah, onlarla beraber olandı.", "Siyer kitaplarına göre Ebû Bekir'in endişesi kendi canından çok Peygamberimiz içindi; ona bir zarar gelmesinden korkuyordu. Kur'an ise onu Peygamberimizin ‘arkadaşı’ diye anar. Bu endişe, sevdiğine bir kötülük gelmesini istemeyen bir sadakatin ifadesiydi. Peygamberimizin cevabı korkuyu küçümsemedi, ona teslim de olmadı; ‘Üzülme’ diyerek onu Allah'ın beraberliğiyle kuşattı.", "Burada bir noktayı açıkça söylemek gerekir. Halk arasında mağaranın ağzına örümceğin ağ ördüğü, bir güvercinin yuva yaptığı ya da Ebû Bekir'i bir yılanın soktuğu da anlatılır. Bu ayrıntılar Buhârî ve Müslim'in rivayetlerinde geçmez; başka kitaplardaki rivayetlerin sağlamlığı ise âlimlerce tartışılmıştır. Bu yüzden onları hikâyeye katmıyoruz. Sahih rivayetlerin gösterdiği şey çok daha sadedir: iki insan, bir mağara ve Allah'a duydukları güven.", "Mağaradan ayrılıp yola çıktılar. Yolda Sürâka b. Mâlik onların peşine düştü; çünkü Kureyş, Peygamberimizi getirene büyük bir ödül koymuştu. Sürâka yaklaşınca Peygamberimiz Allah'a dua etti ve Sürâka'nın atının ayakları yere saplandı. Bunun üzerine Sürâka onlardan emân diledi ve kendisine dua etmelerini rica etti. Peygamberimiz dua etti, Sürâka kurtuldu. O da geri döndü ve kendisinden sonra gelen takipçileri de geri çevirmeye başladı. Allah, kendisine dayanan elçisini böyle korudu; Kur'an'ın ifadesiyle onu, görmediğiniz ordularla desteklemişti.", "Bu hikâye bize tevekkülün iki yüzünü öğretir. Peygamberimiz ve Ebû Bekir, hicret için gerekli bütün tedbirleri aldılar: gizlendiler, sakınarak yola çıktılar, sığınacak bir yer seçtiler. Ama sonuçta güvendikleri yalnız Allah'tı. ‘Üzülme, Allah bizimledir’ sözü, bu iki yüzü aynı cümlede birleştirir: Elinden geleni yaptıktan sonra gönlünü Allah'a bırakmak. Böylece mağaranın dar karanlığı, bir iman penceresine dönüştü. Böylece hicret yolu, güvenin ve tedbirin birlikte yürüdüğü bir yol oldu."], "ibret": "Peygamberimiz mağarada korkan arkadaşına ‘Üzülme, Allah bizimledir’ dedi. Tedbiri alıp gerisini Allah'a bırakan kalp korkuyu yener. Allah'ın bizimle olduğunu bilmek, en dar yeri bile genişletir.", "kaynak": "Tevbe Sûresi, 9/40; Buhârî, Fezâilü'l-ashâb (3653); Menâkıb (3615); Menâkıbü'l-ensâr (3906); Müslim, Fezâilü's-sahâbe (2381)"}, {"no": 5, "baslik": "Az Sayıda ama Allah'a Güvenen Bir Ordu", "tur": "kaynakli", "paragraflar": ["Musa'dan sonra İsrailoğullarının ileri gelenleri, peygamberlerine geldiler: ‘Bize bir hükümdar gönder de Allah yolunda savaşalım.’ Peygamberleri onlara şöyle dedi: ‘Size savaş yazılırsa savaşmaktan geri durmayacak mısınız?’ Onlar: ‘Yurdumuzdan çıkarıldığımız, çocuklarımızdan ayrıldığımız hâlde Allah yolunda neden savaşmayalım?’ dediler. Fakat savaş yazılınca bir kısmı dışında hepsi yüz çevirdi. (Bakara, 2/246) Allah da onlara Tâlût'u hükümdar olarak gönderdi.", "İlk itiraz hemen geldi: ‘Biz ondan daha çok hükümdarlığa layığız; ona mal bolluğu bile verilmedi.’ Peygamberleri cevap verdi: ‘Allah onu sizin üzerinize seçti; ona ilimde ve bedende üstünlük verdi.’ (Bakara, 2/247) Güç ve makam konusunda Allah'ın ölçüsü, insanların ölçüsünden farklıydı. Allah dilediğine hükümranlığını verir; O, geniş lütuf sahibidir ve her şeyi bilendir.", "Tâlût ordusuyla yola çıkınca onlara şöyle dedi: ‘Allah sizi bir ırmakla sınayacak. Kim ondan içerse benden değildir; kim de onu tatmazsa bendendir. Ancak eliyle bir avuç alan başka.’ Pek azı dışında hepsi o ırmaktan içti. (Bakara, 2/249) Sabır ve irade imtihanı, savaştan önce başlamıştı. Tâlût ve yanındaki inananlar ırmağı geçtiler. Fakat onlar da Câlût'un kalabalık ordusunu görünce: ‘Bugün Câlût ve ordusuna karşı gücümüz yok’ dediler. Kalabalık bir ordu, sağlam yürekleri bile bir an sarsabiliyordu.", "Müfessirler bu ırmak imtihanını, sabrın ve disiplinin bir ölçüsü olarak açıklar. Susuzluk insanın en çok dayanamadığı şeylerden biridir; buna rağmen kendini tutabilenlerin içi, Allah'ın emrine bağlıydı. Bir avuç su susuzluğu geçirmez; ama emre uymak, gönlü sağlamlaştırır. Kur'an, kıssanın sonunda şunu da söyler: ‘Allah, insanların bir kısmını bir kısmıyla savmasaydı yeryüzü fesada uğrardı.’ (Bakara, 2/251)", "Allah'a kavuşacaklarına kesin inananlar ise şöyle dedi: ‘Nice az topluluk, Allah'ın izniyle çok topluluğa galip gelmiştir. Allah sabredenlerle beraberdir.’ Ordular karşılaşınca şöyle dua ettiler: ‘Rabbimiz! Üzerimize sabır yağdır, ayaklarımızı sağlam tut ve kâfirler topluluğuna karşı bize yardım et.’ (Bakara, 2/249-250) Allah'ın izniyle Câlût'un ordusunu bozguna uğrattılar. Davud, Câlût'u öldürdü; Allah ona hükümdarlık ve hikmet verdi. (Bakara, 2/251) Davud'un sapanla taş atması gibi ayrıntılar Kur'an'da yoktur; ayet yalnızca Davud'un Câlût'u öldürdüğünü bildirir. Böylece az sayıdaki inananlar, Allah'a dayanarak kalabalık bir orduyu yendiler.", "Bu hikâyenin Peygamber Efendimizin (s.a.v.) dönemiyle bir bağı da vardır. Berâ b. Âzib'in (r.a.) aktardığına göre Bedir'e katılan sahabiler, Peygamberimizin ashabının sayısının, Tâlût'la birlikte ırmağı geçenlerin sayısı kadar, yani üç yüz on küsur kişi olduğunu söylerlerdi. Berâ: ‘Onunla birlikte ırmağı yalnızca mümin olanlar geçti’ der. Küçük bir topluluk, büyük bir güveni taşıdığı zaman, sayıların ötesinde bir güç kazanır."], "ibret": "Tâlût'un az sayıdaki ordusu, Allah'a güvenip sabır dilediği için galip geldi. Güç, kalabalıkta değil, Allah'ın yardımındadır. Az olsak da Allah'a güvenir ve sabır isteriz; çünkü Allah sabredenlerle beraberdir.", "kaynak": "Bakara Sûresi, 2/246-251; Buhârî, Megâzî (3957)"}, {"no": 6, "baslik": "Habbâb'ın Şikâyeti ve Gelen Müjde", "tur": "kaynakli", "paragraflar": ["Mekke'de Müslümanlar için zor günlerdi. İslam'a girenler eziyete uğruyordu. Habbâb b. Eret (r.a.) da bu sıkıntıyı çekenlerdendi. Bir gün Peygamber Efendimizin (s.a.v.) yanına gitti. Peygamberimiz o sırada Kâbe'nin gölgesinde, hırkasına yaslanmış oturuyordu. Habbâb bir şikâyet getirmişti; sıkıntı o kadar uzamıştı ki yüreği yardım bekliyordu. Hadis, onların sıkıntısını inkâr etmez; çünkü sıkıntı gerçekti ve Peygamberimiz de buna ortaktı.", "Habbâb şöyle dedi: ‘Bizim için yardım dilemeyecek misin? Bize dua etmeyecek misin?’ Bu sorunun içinde bir sızı vardı. Müslümanlar, Allah'a güveniyorlardı; ama sıkıntı uzamıştı ve bir yardım, bir ferahlık bekliyorlardı. Bir rivayete göre Peygamberimiz bu söz üzerine, yüzü kızarmış hâlde yaslandığı yerden doğrulup oturdu. Sonra onlara, kendilerinden önce inananların yaşadıklarını hatırlattı.", "Peygamberimiz şöyle buyurdu: ‘Sizden önceki ümmetlerde inananlara çok ağır eziyetler yapılırdı. Öyle ki bir adam için yerde bir çukur kazılır ve içine konurdu. Bu eziyet, onu dininden çevirmezdi.’ Hadisin devamında anlatılan eziyetleri biz burada ayrıntılandırmıyoruz. Çünkü hadisin amacı, eziyeti anlatmak değil, sabrın ve sebatın ne kadar büyük olduğunu göstermektir. Peygamberimiz, Mekkeli müminlere kendilerinden önceki müminlerin yolunu hatırlatıyordu. Peygamberimiz sıkıntıyı küçümsemedi; onları, kendilerinden önce bundan da ağırını yaşayıp sebat eden müminlerle birlikte anarak teselli etti.", "Bu hadisin Kur'an'daki bir ayetle büyük bir uyumu vardır: ‘Yoksa sizden öncekilerin başına gelenler sizin de başınıza gelmeden cennete gireceğinizi mi sandınız? Onlara şiddetli yoksulluk ve hastalık dokundu, öyle sarsıldılar ki peygamber ve onunla beraber iman edenler: Allah'ın yardımı ne zaman? diyecek hâle geldiler. Biliniz ki Allah'ın yardımı yakındır.’ (Bakara, 2/214) Habbâb'ın sorusu ile ayetin ‘ne zaman?’ sorusu aynı yüreğin sesidir.", "Sonra şu müjdeyi verdi: ‘Allah'a yemin olsun, Allah bu işi tamamlayacak. Öyle ki bir binek sahibi, San'a'dan Hadramevt'e kadar yalnız Allah'tan ve koyunlarına saldıracak kurttan başka bir şeyden korkmadan yolculuk edecek. Ama siz acele ediyorsunuz.’ San'a, bugünkü Yemen'in başkentidir; Hadramevt ise ülkenin güneydoğusundadır. İkisi arasında uzun bir yol vardır. O gün bu söz, Mekke'deki ezilmiş bir topluluk için çok uzak bir hayal gibi görünüyordu. Peygamberimiz, o zamanın tehlikeli yollarında bile bir yolcunun hiçbir şeyden korkmadan gideceğini bildiriyordu.", "Ama Allah vaadini yerine getirdi. İslam yayıldı, güven ve huzur yeryüzüne yerleşti. Habbâb'ın şikâyeti bir isyan değil, bir yardım istemeydi; Peygamberimiz de ona sabrı hatırlatıp bir müjde verdi. Burada tevekkülün bir inceliği vardır: Güvenmek, hiç sıkılmamak ya da acele etmemek değildir. Kul, sıkıntısını arz eder ve sabreder; Allah'ın vaadi ise vakti gelince mutlaka gerçekleşir. Zaman Allah'ın elindedir."], "ibret": "Habbâb sıkıntısını Peygamberimize arz etti, Peygamberimiz ona sabrı ve Allah'ın vaadini hatırlattı. Acele etmek insanın hâlidir; ama Allah'ın vaadi mutlaka gelecektir. Güvenen kalp, sabırla bekler.", "kaynak": "Buhârî, Menâkıb (3612); Menâkıbü'l-ensâr (3852); İkrâh (6943); Bakara Sûresi, 2/214"}, {"no": 7, "baslik": "Vebalı Şehre Girmeyen Halife", "tur": "kaynakli", "paragraflar": ["Halife Ömer (r.a.) Şam'a doğru yola çıkmıştı. Yanında Peygamberimizin sahabilerinden bir topluluk vardı. Serğ denilen yere vardıklarında, Şam bölgesindeki ordu komutanları, Ebû Ubeyde ve arkadaşları, onları karşıladı. Orada bir haber verildi: Şam'da veba çıkmıştı. İbn Abbas'ın (r.a.) anlattığına göre Ömer bu haberi öğrenince yürüyüşünü durdurdu ve ne yapacağını düşünmeye başladı.", "Ömer önce ilk hicret eden muhacirleri çağırdı ve onlara danıştı. Muhacirler ayrı düştüler. Kimi: ‘Bir iş için çıktın, ondan dönmemeni uygun görmüyoruz’ dedi. Kimi de: ‘Yanında Peygamberimizin sahabileri ve insanların hayırlıları var; onları bu salgının içine götürmeni uygun görmüyoruz’ dedi. Ömer onları gönderdi, sonra ensarı çağırdı. Onlar da muhacirler gibi ayrı düştüler. Ömer'in danışma konusundaki titizliği burada görülür. Ömer'in önce danışması, acele etmemesi ve herkesi dinlemesi, kararın isabetini artırmıştı.", "Sonra Ömer, Kureyş'in Mekke'nin fethi yılında hicret eden yaşlılarını çağırdı. Onlar ise tek ağızdan: ‘Biz senin insanlarla birlikte geri dönmeni ve onları bu salgının içine sokmamanı uygun görüyoruz’ dediler. Ömer sabahleyin halka ‘Sabah develerin üzerinde dönüyorum’ diye duyurdu. Ebû Ubeyde: ‘Allah'ın kaderinden mi kaçıyorsun?’ diye sordu. Ömer: ‘Keşke bunu senden başkası söyleseydi, ey Ebû Ubeyde! Evet, Allah'ın kaderinden Allah'ın kaderine kaçıyoruz’ dedi.", "Sonra Ömer bir örnek verdi: ‘Söyle bana, bir adamın develeri olsa ve iki yamaçlı bir vadiye insese, yamaçlardan biri yemyeşil, diğeri kıraç olsa; yeşil yamaçta otlatırsa Allah'ın kaderiyle otlatmış olmaz mı? Kıraç yamaçta otlatsa da yine Allah'ın kaderiyle otlatmış olmaz mı?’ Bu benzetme çok yerindeydi: Hangi yolu seçersek seçelim, Allah'ın takdiri içindeyiz. Ama seçimimizin sorumluluğu bize aittir. Yani insan, hangi yolu seçerse seçsin bir tercih yapmış olur ve onun sorumluluğunu taşır.", "O sırada Abdurrahman b. Avf (r.a.) geldi; başka bir işi vardı. Şöyle dedi: ‘Bu konuda bende bir bilgi var. Resûlullah'ı şöyle derken işittim: Bir yerde veba olduğunu duyarsanız oraya girmeyin. Bulunduğunuz yerde çıkarsa oradan kaçmak için çıkmayın.’ Ömer, Allah'a hamd etti ve döndü. Bu hikâye bize tevekkülün tedbiri dışlamadığını öğretir: Allah'a güvenmek, tedbir almak ve sonucu Allah'a bırakmaktır.", "Bu karar, salgın hastalıklarda insanların bulunduğu yerden ayrılmaması ve hasta bölgeye de girmemesi ilkesinin ilk örneklerinden biri sayılır. Peygamberimiz, salgın bölgesinde sabır ve güvenle kalan kimse için de bir müjde vermiştir: Allah'ın yazdığından başkasının başına gelmeyeceğini bilerek sabredenin şehit sevabı alacağı bildirilmiştir. Tevekkül, korkuya kapılmak değil, hem tedbirli hem huzurlu olmaktır. Ömer'in dönüşü, bir kaçış değil, bir sorumluluktu: İnsanları korumak için aldığı bir karardı."], "ibret": "Ömer, salgın olan yere girmeyerek hem tedbir aldı hem Allah'ın takdirine güvendi. Tevekkül, tedbiri bırakmak değildir. Önce akıllıca davranırız, sonra sonucu Allah'a bırakırız; huzur buradadır.", "kaynak": "Buhârî, Tıb (5729, 5730, 5734); Müslim, Selâm (2219)"}, {"no": 8, "baslik": "Ağaç Altında Uyuyan Peygamber", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimizle (s.a.v.) bir sefere çıkan sahabilerden Câbir b. Abdullah (r.a.) şunu anlatır: Bir gün bir vadiye vardılar. Vadi dikenli ağaçlarla doluydu ve öğle sıcağı bastırmıştı. Bu sefer, siyer kitaplarında Zâtürrikâ' seferi olarak anılır. Herkes gölge arıyordu. Peygamberimiz bir ağacın altına indi ve kılıcını ağacın bir dalına astı. Sahabiler de ağaçların altına dağılıp dinlenmeye çekildiler.", "Câbir şöyle devam eder: ‘Biz biraz uyumuştuk ki Resûlullah bizi çağırdı. Gittiğimizde yanında bir bedevi vardı.’ Peygamberimiz şöyle anlattı: ‘Ben uyurken bu adam kılıcımı çekmiş. Uyanınca kılıç çekilmiş hâlde onun elindeydi. Bana: Seni benden kim koruyacak? dedi. Ben de: Allah, dedim. İşte bu oturuyor.’ Bu sözlerin ardından Peygamberimiz onu cezalandırmadı. Câbir'in anlatımıyla bu olay, sahabilerin gözleri önünde değil, onlar uyurken yaşanmıştı; Peygamberimiz onlara olanı sonradan anlattı.", "Hadiste anlatılan, bir yönüyle çok sade, bir yönüyle çok büyüktür. Peygamberimiz uyuyordu. Uyandığında, elinde çekilmiş bir kılıçla başında duran bir adam gördü. Bir insanın gücünün hiçbir şeye yetmediği, çaresiz kaldığı bir andı. Ve Peygamberimiz, tek bir kelimeyle cevap verdi: ‘Allah.’ Bu, bir korkunun cevabı değil, bir güvenin cevabıydı. O sakin ses, kılıçlardan daha güçlüydü. Bu cevap, Peygamberimizin kılıçtan korkmadığını değil, kılıcın da onu tutanın da Allah'ın elinde olduğunu bildiğini gösterir.", "Allah, Peygamberimize başka bir ayette şöyle demişti: ‘Allah seni insanlardan korur.’ (Mâide, 5/67) O günkü olay bu güvenceyle birlikte anılır. Allah'ın elçisi, korunmaya muhtaç olduğunu hissetmeden, yalnız Allah'a bağlılığıyla davranmıştı. Bedevinin eline geçen kılıç kimsenin canını yakmadı; Allah elçisini korudu, Peygamberimiz de öfkeyle değil, güvenle karşılık verdi.", "Buhârî'deki bir rivayette adamın adının Ğavres b. Hâris olduğu da bildirilir. Başka kitaplarda kılıcın adamın elinden düştüğü ve adamın sonrasına dair farklı bilgiler de anlatılır; ama bu ayrıntılar aynı sağlamlıkta değildir. Biz burada Buhârî'nin metninde bulunanla yetiniyoruz: Peygamberimiz ‘Allah’ dedi, adamı cezalandırmadı ve adam yanında oturdu.", "Kur'an, Peygamberimizin bu tavrına şu öğütle de işaret eder: ‘Affı tut, iyiliği emret, cahillerden yüz çevir.’ (A'râf, 7/199) Peygamberimiz, kılıcını çeken bir adamı bile cezalandırmadı. Böyle bir sükûnet ve cömertlik, ancak güvenli bir kalpten çıkar. Korkan insan öfkelenir; güvenen insan bağışlar.", "Bu hikâye, tevekkülün bir başka yönünü gösterir. Peygamberimiz kılıcını yanında taşıyor, ordusuyla birlikte seferde bulunuyordu; tedbir eksik değildi. Ama kimsenin yetişemediği bir anda, tek başına kaldığı bir anda, Allah'a dayanmak onun gücüydü. Allah, kendisine güvenen kulunu korumasında tutar. Peygamberimizin affı da güvenin bir yansımasıydı: Güvenen, korkmadığı için kin de beslemez."], "ibret": "Elinde çekilmiş kılıçla karşısında duran adama Peygamberimiz ‘Allah’ diye cevap verdi ve onu cezalandırmadı. Allah'a güvenen kalp, en tehlikeli anda bile sakin ve affedici olur.", "kaynak": "Buhârî, Cihâd (2910); Megâzî (4135, 4136); Mâide Sûresi, 5/67; A'râf Sûresi, 7/199"}], "kapanis": "İbrahim ateşin başında, Musa denizin kıyısında, Meryem hurma ağacının dibinde, Peygamberimiz ve Ebû Bekir mağarada... Hepsi farklı yerlerdeydi, ama gönülleri aynı yere dayanıyordu: Allah'a. Tevekkül, çalışmayı bırakmak değil, çalıştıktan sonra gönlü Allah'a bırakmaktır. Bu kitabı kapattığınızda bir sıkıntı karşınıza çıkarsa, bu cümleyi hatırlayın.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/06/", "kapak": "../../kapak/06.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 7, "baslik": "İyilik Eden İyilik Bulur", "hazir": true, "yol": "../07/index.html"}, "pdf": "../../pdf/kitap-06.pdf", "epub": "../../epub/kitap-06.epub"}</script>
