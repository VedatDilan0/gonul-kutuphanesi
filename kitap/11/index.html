<script type="application/json" id="kitap-veri">{"no": 11, "baslik": "Cennet Yolunda Güzel Davranışlar", "tanitim": "Yoldan bir dalı kaldırmaktan en sevilen bahçeyi bağışlamaya; cenneti kazandıran güzel davranışları, ibadeti ve yardımseverliği anlatan sekiz sahih hikâye.", "onsoz": "Cennete giden yol, bazen büyük işlerle değil, küçük ve samimi davranışlarla açılır. Bu kitapta, yoldan bir dalı kaldıran adamı, mescidi süpüren kadını, en sevdiği bahçeyi bağışlayan bir sahabiyi ve daha nicelerini bulacaksınız. Hepsi, güzel bir davranışın Allah katındaki değerini bize gösterir. Okurken kendi küçük iyiliklerinizi de hatırlayın.", "hikayeler": [{"no": 1, "baslik": "Beyruhâ Bahçesi", "tur": "kaynakli", "paragraflar": ["Medine'nin hurmalıkları arasında, Mescid-i Nebevî'nin tam karşısında bir bahçe vardı: Beyruhâ. Sahibi, Medine'de ensardan en çok hurmalığa sahip olan Ebû Talha'ydı ve bu bahçe, onun en sevdiği maldı. İçinde serin gölgeler, tatlı ve berrak bir su vardı. Peygamber Efendimiz (s.a.v.) de zaman zaman bu bahçeye girer, suyundan içerdi. Bunu bize Enes b. Mâlik (r.a.) anlatır. Ebû Talha için Beyruhâ, yalnız bir mülk değil, gönlünün durduğu bir yerdi.", "Bir gün şu ayet indi: “Sevdiğiniz şeylerden Allah yolunda harcamadıkça iyiliğe asla erişemezsiniz. Her ne harcarsanız Allah onu bilir.” (Âl-i İmrân, 3/92) Ebû Talha bu ayeti işitince hemen kalkıp Peygamberimizin huzuruna geldi. “Ey Allah'ın Resulü” dedi, “Yüce Allah ‘Sevdiğiniz şeylerden harcamadıkça iyiliğe erişemezsiniz’ buyuruyor. Benim en sevdiğim malım Beyruhâ'dır. Onu Allah için sadaka yapıyorum; hayrını ve Allah katındaki karşılığını umarım.”", "Sonra sözüne şunu ekledi: “Ey Allah'ın Resulü, onu Allah'ın sana gösterdiği yerde kullan.” Bu, kolay söylenecek bir söz değildi. Çünkü en sevilen şeyi vermek, insana en ağır gelen şeydir. Ama Ebû Talha için ayet apaçık bir çağrıydı ve sevgisi, ona engel olmadı. Peygamber Efendimiz, onun bu sözüne çok memnun oldu.", "“Âferin!” buyurdu. “Ne kazançlı bir mal, ne kazançlı bir mal! Söylediğini işittim. Ben onu akrabalarına vermeni uygun görüyorum.” Ebû Talha da: “Öyle yaparım ey Allah'ın Resulü” dedi ve bahçeyi akrabaları ile amcasının oğulları arasında paylaştırdı. Böylece bir kişinin en sevdiği bahçesi, yakınlarının da nasibi oldu. Sadaka, uzaklara gitmeden önce yanı başındakilerin hakkına da baktı.", "Müfessirler, ayetteki “iyilik” kelimesini, Allah'ın rızasına ve cennete ulaştıran olgunluk hâli diye anlar. Bu yüzden ayet, sıradan bir tavsiye değil, insanı yükselten bir ölçüdür. Dikkat edin: Ebû Talha bahçeyi dilediği gibi dağıtmadı; Peygamberimizin gösterdiği yere bıraktı. Bu da onun, verirken bile kendi arzusunu değil Allah'ın hoşnutluğunu aradığını gösterir.", "Bu hikâyenin en güzel yanı, Ebû Talha'nın pek çok malın arasından kendi gönlüne en yakın olanı seçmesidir. Elindeki fazlalığı değil, sevdiği şeyi verdi. Peygamberimizin akrabalara vermeyi önermesi de dikkat çekicidir: İyilik, evin içinden başlayıp dışarıya yayılır. Ayet bize iyiliğe ermenin sırrını gösterir: Verilen şeyin büyüklüğü kadar, ona duyulan sevgiden vazgeçebilmek de önemlidir.", "Her insanın bir “Beyruhâ”sı vardır: Zamanı, sağlığı, bir sofrası ya da bir sözü... Allah yolunda harcanan şey, sevilen şey olunca kalbi de terbiye eder. Çünkü insan, sevdiğini verdiğinde, sevgisinin esiri olmaktan kurtulur. Verdiğimiz her şey, aslında Allah'ın bize emanet ettiğidir."], "ibret": "Allah yolunda en sevdiğimizden vermek, gönlü güzelleştirir ve bizi sevdiklerimizin esaretinden kurtarır. Sadakanın ilk hakkı yakınlarımızdadır; iyilik evden başlar, sonra herkese yayılır. Verirken gönlümüz de arınır.", "kaynak": "Âl-i İmrân Sûresi, 3/92; Buhârî, Zekât (1461); Müslim, Zekât (998)"}, {"no": 2, "baslik": "Yoldaki Dikenli Dal", "tur": "kaynakli", "paragraflar": ["Ebû Hüreyre (r.a.), Peygamber Efendimizin (s.a.v.) bir adamı anlattığını nakleder. Adam yolda yürüyordu. Bir yerde, yolun üzerinde dikenli bir dal gördü. Bu dalı kimin bıraktığı bilinmiyordu; ama herkesin ayağına batabilecek bir yerdeydi. Çoğumuz gibi adam da belki “Başkası kaldırır” diyebilirdi. Ama o, eğilip dalı yoldan kenara çekti.", "Peygamber Efendimiz hadisin devamını şöyle haber verir: Allah bu davranışı kabul etti ve onu bağışladı. Yolun ortasında bir dal... Ne büyük bir mal, ne bir sadaka, ne de uzun bir ibadet. Sadece bir an eğilmek ve bir dalı kenara çekmek. Fakat o küçük davranış, kimsenin görmediği bir yerde yapılmış samimi bir iyilikti.", "Hadiste geçen “Allah ona teşekkür etti” ifadesi, bu küçük davranışın Allah katındaki kıymetini gösterir. Her şeyin sahibi olan Allah'ın, bir kulunun yoldan bir dal kaldırmasına karşılık vermesi ne büyük bir şereftir! Kimse görmese de Allah görür ve unutmaz.", "Başka bir rivayette ise adam, dalı görünce şöyle der: “Vallahi bunu Müslümanlardan uzaklaştıracağım ki onlara zarar vermesin.” İyiliğin niyeti, böyle bir cümlede saklıdır. Adam kendi rahatı için değil, yoldan geçecek herkes için düşünmüştü. Kimlerin geçeceğini bilmiyordu; ama geçenlerin zarar görmesini istemedi. Hadis, adamın bu sebeple cennete girdiğini de bildirir. Allah, kulunun niyetine de bakar.", "Peygamber Efendimiz, imanı anlatırken de bu davranışa özel bir yer verir: “İman, yetmiş küsur şubedir. Bunların en üstünü ‘Allah'tan başka ilah yoktur’ demek, en aşağısı ise yoldan eziyet veren bir şeyi kaldırmaktır. Hayâ da imandan bir şubedir.” Demek ki yoldaki bir engeli kaldırmak, imanın en küçük ama en gerçek işaretlerinden biridir.", "Bir sahabi, Ebû Berze (r.a.), bir gün Peygamberimize gelip şöyle der: “Ey Allah'ın Resulü, bana faydalanacağım bir şey öğret.” Peygamber Efendimiz ona şu cevabı verir: “Müslümanların yolundan eziyet veren şeyleri kaldır.” Faydalı olmak isteyen birine verilen bu cevap, iyiliğin büyük görünen işlerde değil, yürüdüğümüz yolun kenarında başladığını gösterir.", "Yolun ortasındaki bir dal, günümüzde başka şeyler olabilir: Kırık bir cam, kaygan bir zemin, bir çukur ya da sokakta bırakılmış bir engel. Önemli olan, o engeli gören bir gönlün “Bu benim işim değil” demeden eğilmesidir. Allah, bu kadar küçük bir hizmeti bile unutmaz.", "Düşünün: Bir engelin kalkması, yalnız bir kişiyi değil, o yoldan geçecek herkesi korur. Yaşlıyı, çocuğu, yorgun yolcuyu, geceleyin yürüyeni... İyiliğin güzelliği, kimlere ulaşacağını önceden bilmemesindedir. Cennetin kapısı, bazen yolun kenarındaki bir dalın ardında açılır. Bu küçük adım, kalbin temizliğini ve başkasını düşünen bir gönlü gösterir."], "ibret": "Küçük görünen bir iyilik, Allah katında büyük karşılık bulabilir. Başkasına zarar verebilecek bir engeli kaldırmak imanın bir parçasıdır; “Başkası yapar” demeden eğilebilmek de güzel bir ahlaktır.", "kaynak": "Buhârî, Ezân, 32 (652); Mezâlim, 28 (2472); Müslim, Îmân, 58 (35); Birr (1914, 2618)"}, {"no": 3, "baslik": "Mescidi Süpüren Kadın", "tur": "kaynakli", "paragraflar": ["Medine'de Mescid-i Nebevî, her gün insanların gelip gittiği bir yerdi. Namaz kılanlar, ders dinleyenler, Peygamber Efendimizi (s.a.v.) görmek isteyenler... Bu kalabalığın arkasında, çoğu zaman gözden kaçan bir hizmet vardı: Mescidin temizliği. Ebû Hüreyre (r.a.), bu hizmeti yapan birinden söz eder. Rivayette o kişi, mescidi süpüren bir kadın olarak geçer; bazı rivayetlerde ise bir genç diye de belirtilir. Adı bilinmeyen bu kimse, sessizce işini yapıyordu.", "Bir yerin temiz kalması, yüzlerce kişinin rahatça namaz kılabilmesi demektir. Mescidin zemini temiz olmasa, secdeye eğilmek zor olurdu. Bu hizmet sessizdi; ne ses getirdi ne alkış topladı. Ama her sabah başlayan bir ibadetin, her akşam sürüp giden bir huzurun altında bu emek vardı.", "Bir gün Peygamberimiz onu göremedi ve kendisini sordu. “Öldü” dediler. “Bana haber verseydiniz ya” buyurdu. Rivayete göre sahabiler, bu kimsenin işini küçük görmüşlerdi. Elbette kötü bir niyetleri yoktu; ama Peygamberimizin sorusu, onun hizmetini fark ettiğini ve unutmadığını gösterir.", "Peygamber Efendimiz ise o hizmeti hiç küçük görmemişti. “Kabrini bana gösterin” dedi. Sahabiler onu mezarına götürdü; Peygamberimiz, mezarın başında durup ona namaz kıldı. Orada, sade bir kabrin başında, Allah'ın Resulü ve sahabiler birlikte durdu. O gün mescidi süpüren kimse, bir hatırlanma ve duayla uğurlanmış oldu.", "Sonra şunu buyurdu: “Bu kabirler, içindekiler için karanlıkla doludur. Yüce Allah benim onlara kıldığım namazla bu kabirleri aydınlatır.” Bu söz, hem o kadına gösterilen değerin hem de ölenlerin ardından yapılan dualara verilen önemin bir işaretidir.", "Bu olay bize bir ölçü verir: Toplumda çoğu zaman büyük görünen işler konuşulur; ama bir yerin temiz kalması, bir yolun açık olması, bir sofranın hazır olması, kimsenin fark etmediği ellere bağlıdır. Mescidi süpüren o kimse, belki hiçbir zaman bir ders vermedi, bir hutbe okumadı. Ama her gün Allah'ın evini temizledi.", "Peygamber Efendimizin onu sorması ve kabrinin başında durması, Allah katında hizmetin değerinin makamla, ünle ya da görünürlükle ölçülmediğini gösterir. Kimsenin görmediği bir işi yürekten yapan insan, Allah'ın ve Resulünün gözünde çok değerlidir. Onun sessiz emeği, Peygamberimizin gözünde bir değer taşıyordu; çünkü hizmetin büyüğü küçüğü Allah katında niyete göre ölçülür.", "Allah'ın evini temiz tutmak, çok eski bir hizmettir. Kur'an'da İbrahim'e ve İsmail'e, Allah'ın evini tavaf edenler, orada kalanlar, rükû ve secde edenler için temiz tutmaları emredildiği bildirilir. (Bakara, 2/125) Mescidi süpüren o kimse de, bu güzel mirasın sessiz bir devamcısıydı. Bu yüzden bir yeri temiz tutan, bir yolu açan, bir sofrayı hazırlayan herkese teşekkür etmek bize düşer."], "ibret": "Kimsenin görmediği hizmetler Allah katında kaybolmaz. İnsanın değeri makamıyla değil, samimiyetiyle ölçülür. Hizmet edeni unutmamak ve ardından dua etmek de güzel bir edeptir. Hizmetin küçüğü yoktur.", "kaynak": "Buhârî, Salât, 72 (458, 460), Cenâiz, 67 (1337); Müslim, Cenâiz, 71 (956); Bakara Sûresi, 2/125"}, {"no": 4, "baslik": "Allah İçin Yapılan Ziyaret", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimiz (s.a.v.) bir gün sahabilerine bir adamın hikâyesini anlattı. Ebû Hüreyre (r.a.) bu hadisi bize aktarır. Bir adam, başka bir köyde yaşayan kardeşini ziyaret etmek için yola çıktı. Belki yol uzundu, belki yorucuydu. Ama kalbinde bir niyet vardı: Kardeşini görmek.", "Allah, bu adamın yolunun üzerine bir melek bekletti. Melek, adam yanına gelince ona sordu: “Nereye gitmek istiyorsun?” Adam: “Şu köyde bir kardeşim var, onu ziyarete gidiyorum” dedi. Melek bir soru daha sordu: “Onda gidip gözeteceğin bir çıkarın, ondan bir alacağın mı var?”", "Meleğin sorusu sandığımızdan derindir. Aslında adamın niyetini yoklar: Seni bir ihtiyaç mı yürütüyor, yoksa sadece sevgi mi? İnsanlar çoğu zaman iyilik yaptıklarında karşılığını arar. Bu adam ise bu sınavdan yalnızca “Allah için” diyerek geçti.", "Adamın cevabı, bu hikâyenin kalbidir: “Hayır. Ben onu yalnızca Allah için seviyorum.” Ne bir borç vardı ne bir çıkar. Ne bir iş bağlantısı ne de bir beklenti. Sadece Allah için kurulmuş bir sevgi. Bunun üzerine melek şöyle dedi: “Ben sana Allah'ın elçisiyim. Allah, senin onu sevdiğin gibi seni de seviyor.” Bu, sevginin ve niyetin ne kadar kıymetli olduğunu gösterir.", "Bu müjde, bir ziyaretin değerini anlatır. İnsanlar çoğu zaman bir yere giderken bir sebep arar: Bir iş, bir ihtiyaç, bir yarar. Bu adam ise yalnızca kardeşliğin gönüldeki sıcaklığıyla yürüdü. Allah da bu niyeti gördü ve ona sevgisini bildirdi.", "Bu hadis, kardeşlik bağının gücünü gösterir. Dostluk, çıkarla kurulunca çıkarla biter. Ama Allah için kurulan dostluk, Allah'ın sevgisine vesile olur. Kardeşimizi ziyaret etmek, hatırını sormak, hasta olunca yanında bulunmak, sıkıntıda yalnız bırakmamak, hep bu sevginin güzel meyveleridir.", "Düşünün: Yolculuğun sonunda adamı ne bir mal ne bir makam bekliyordu. Oysa ona verilen karşılık, ziyaret ettiği kardeşinin kendisinden de büyüktü: Allah'ın sevgisi. Hiçbir ödül, bu müjdeden daha kıymetli olamazdı.", "Peygamber Efendimiz başka bir hadisinde, Allah'ın kıyamet günü şöyle buyuracağını haber verir: “Benim celalim için birbirini sevenler nerede? Bugün, gölgemden başka gölgenin bulunmadığı günde onları gölgemde gölgelendireceğim.” Bu sevgi, sözle sınırlı kalmaz; yola çıkmakla, vakit ayırmakla, kapı çalmakla görünür hâle gelir. Yolu uzun olsun kısa olsun, kalbinde Allah rızası olan her ziyaret, Allah katında karşılık bulur.", "Bizim de çevremizde ziyaret edilmeyi bekleyen birileri vardır: Yaşlı bir komşu, uzakta kalmış bir akraba, yalnız bir dost. Kısa bir ziyaretle ya da bir hâl hatır sorusuyla onlara ulaşabiliriz. Niyetimiz yalnızca Allah için olursa, gönlümüzde bir müjde de bizi bekler. Kalbimizdeki niyeti her seferinde yenilemek, ziyaretin değerini artırır."], "ibret": "Allah için kurulan sevgi, çıkardan uzak ve temizdir. Bir kardeşi sırf Allah rızası için ziyaret etmek, Allah'ın sevgisine vesile olur. Gönülden yapılan küçük bir ziyaret bile büyük bir müjde taşıyabilir.", "kaynak": "Müslim, Birr, 37 (2566), 38 (2567)"}, {"no": 5, "baslik": "Cennette Komşuluk İsteyen Rebîa", "tur": "kaynakli", "paragraflar": ["Rebîa b. Ka'b (r.a.) genç bir sahabiydi. Peygamber Efendimizin (s.a.v.) yanında bulunmayı en büyük kazanç sayardı. Geceleri Resûlullah'ın kapısının yanında kalır, ona hizmet etmek için hazır beklerdi. Kendi anlattığına göre, Peygamberimizin abdest suyunu ve ihtiyaç duyduğu şeyleri getirirdi.", "Bir gün Peygamber Efendimiz ona: “Benden bir şey iste” buyurdu. Bu, bir gencin hayatında duyabileceği en büyük tekliflerden biriydi. Dünyanın nimetleri ondan istenebilirdi: Mal, mevki, rahat bir ev. Rebîa ise bir an düşündü. Sonra söyleyeceği sözü gönlünden seçti: “Cennette seninle beraber olmayı istiyorum.”", "Peygamberimizin “Benden iste” demesi, Rebîa'nın hizmetinin fark edildiğini gösterir. Rebîa bunca vakit onun yanında durmuştu. Allah'ın Resulü onun bu vefasını görmüştü ve ona bir kapı açıyordu.", "Peygamber Efendimiz sordu: “Başka bir şey?” Rebîa: “İşte bu kadar” dedi. Başka hiçbir isteği yoktu. Dünyanın bütün kapıları açıkken, o en yüksek makamı, cennette Allah'ın Resulüyle birlikte olmayı seçmişti.", "Bunun üzerine Peygamber Efendimiz ona şöyle buyurdu: “O hâlde çok secde ederek kendin için bana yardım et.” Yani cennette komşu olmak isteyen kişinin, bunun için gayret göstermesi gerekir. Dilek güzeldi; ama yoluna da adım atmak gerekiyordu. O yol, namaz ve secdeden geçiyordu.", "Rebîa'nın cevabındaki “cennette” kelimesi önemlidir. O, Peygamber Efendimizle yalnız dünyada değil, sonsuz yurtta da beraber olmak istedi. Dünyadaki yakınlığı yetmedi; bu yakınlığın ebedî olmasını diledi. Bu cevap, bir gencin hayattan tek bir şey beklediğini gösteriyordu. Bazı sözler vardır, bütün bir hayatı tek bir cümlede toplar.", "Secde, insanın Allah'a en yakın olduğu andır. Alnını yere koyan kişi, kendini en küçük bildiği yerde, en büyük yakınlığı bulur. Peygamberimiz Rebîa'ya sevdiği bir yolu gösterdi: Allah'a çok secde etmek, Allah'la bağını sık sık tazelemek.", "Bu hikâye, büyük bir isteğin küçük adımlarla gerçekleşebileceğini gösterir. Rebîa'nın hizmeti, isteği ve ardından gelen ibadet çağrısı bir bütündür. Hizmet ona yakınlık kazandırdı, dilek ona yön verdi, secde ise ona yol oldu.", "Peygamberimizin “Bana yardım et” demesi de dikkat çekicidir. Rebîa'yı sorumluluğa ortak etti. Dua ve gayret birbirini tamamlar: Allah'tan istemek, elinden geleni yapmakla birlikte anlam kazanır.", "Müslim'in aynı bölümünde bir başka sahabinin, Sevbân'ın sözü de yer alır. Kendisine cennete götürecek bir amel soran birine Sevbân, Peygamberimizden duyduğunu aktarır: “Allah için çok secde et. Çünkü Allah için yaptığın her secde sebebiyle Allah seni bir derece yükseltir ve bir günahını siler.” Rebîa'ya gösterilen yol, yalnız ona özel değildi; cenneti isteyen herkese açık bir yoldu."], "ibret": "En güzel dilek, Allah'ın rızasını ve cennette Resûlullah'a komşu olmayı istemektir. Bu dileğe giden yol, çok secdeden ve ibadete gönülden bağlanmaktan geçer. Dilemek kadar çalışmak da önemlidir.", "kaynak": "Müslim, Salât (488-489); Ebû Dâvûd, Tatavvu' (1320)"}, {"no": 6, "baslik": "Ezanın Başlangıcı", "tur": "kaynakli", "paragraflar": ["Müslümanlar Medine'ye geldiklerinde, namaz vaktini kendi kendilerine kestirerek toplanırlardı. Namaza çağıran bir ezan henüz yoktu. Abdullah b. Ömer (r.a.) anlatır: Bir gün bu konuyu aralarında konuştular. Kimisi: “Hıristiyanların çanı gibi bir çan edinelim” dedi. Kimisi: “Yahudilerin borusu gibi bir boru olsun” dedi. Ömer (r.a.) ise şunu söyledi: “Namaza çağıracak bir adam görevlendirsek olmaz mı?” Bunun üzerine Peygamber Efendimiz (s.a.v.): “Ey Bilal, kalk, namaza çağır” buyurdu. Hadis şârihlerine göre bu ilk çağrı, ezanın sözleri belirlenmeden önce “Namaza toplanın!” diye yapılan bir duyuruydu.", "Ezanın sözlerinin öğrenilişi ise ayrı bir rivayetle anlatılır. Ensardan Abdullah b. Zeyd (r.a.) anlatır: Peygamber Efendimiz insanları namaza toplamak için çan yaptırmayı emretmişti. O gece Abdullah, uykusunda bir rüya gördü. Rüyasında kendisine ezanın sözleri öğretilmişti. Sabah olunca hemen Peygamberimize gelip gördüğünü anlattı.", "Peygamber Efendimiz: “İnşallah bu hak bir rüyadır” buyurdu. Sonra ona şöyle dedi: “Kalk, gördüğünü Bilal'e öğret. Çünkü onun sesi seninkinden daha gürdür.” Abdullah, ezanın sözlerini Bilal'e öğretti. Bilal de gür sesiyle ezanı okumaya başladı. Böylece Bilal, müezzinlik hizmetinin başına geçmiş oldu. Medine'nin üzerinde, ilk kez Allah'ın adı bu sözlerle yankılandı: “Allahu ekber, Allahu ekber…”", "O sırada Ömer (r.a.) evindeydi. Bilal'in sesini duyunca elbisesini sürüyerek aceleyle Peygamber Efendimizin yanına geldi. “Seni hak peygamber olarak gönderene yemin olsun, ben de onun gördüğünün aynısını gördüm” dedi. Peygamber Efendimiz: “Allah'a hamd olsun” buyurdu. Böylece rüyanın doğruluğu, tek bir gönülle değil, birden çok gönülle de teyit edilmiş oldu.", "Ezanın sözlerine bir bakın: Allah'ın en büyük olduğunu, O'ndan başka ilah bulunmadığını, Muhammed'in Allah'ın elçisi olduğunu, namaza ve kurtuluşa gelmek gerektiğini duyurur. Bir dua kadar derin, bir davet kadar sıcak bir çağrıdır. Bu çağrının ilk kez Medine'de, sahabilerin birbirini dinlemesi, bir rüyanın anlatılması ve gür bir sesin seçilmesiyle ortaya çıkması, güzel işlerin gönül birliğiyle yürüdüğünü gösterir.", "Bilal'in sesi Medine'nin üzerinde yükselirken, bu sesin bir gün dünyanın dört bir yanında günde beş kez okunacağı kimsenin aklına gelmiyordu. Oysa küçük bir istişare, bir rüya ve gür bir ses, bütün bir ümmetin namaza çağrılışının başlangıcı oldu. Bugün bir şehrin gürültüsünde ya da bir köyün sessizliğinde ezanı duyan herkes, aslında o ilk günün yankısını dinliyor.", "Hikâyedeki her kişinin bir payı var: Fikir söyleyen, rüyasını anlatan, yol gösteren, sesini veren. Hiçbiri kendi başına bir şey yapmadı; hepsi birlikte, Allah'ın adını yükseltti. Bu da bize, güzel bir işin ortak emekle büyüdüğünü hatırlatır."], "ibret": "Güzel işler, istişare ve gönül birliğiyle bereket bulur. Namaz vaktinde Allah'ın adını yükselten bir ses, insanları kısa bir süre dünyadan alıp Rablerine yöneltir; ezan bu yüzden çok değerlidir.", "kaynak": "Buhârî, Ezân, 1 (604); Ebû Dâvûd, Salât, 28 (499); Tirmizî, Salât, 25 (189)"}, {"no": 7, "baslik": "Fatıma'ya Öğretilen Tesbih", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimizin (s.a.v.) kızı Fatıma (r.anha), evinin bütün işini kendisi görürdü. Ali (r.a.) anlatır: Fatıma, un öğütmek için el değirmenini çevirirdi ve bu yüzden elleri yorulmuştu, izler olmuştu. Bir gün Peygamberimize bazı esirler getirildiğini duydu. Babasından yardım olarak bir hizmetçi istemek için evinden çıktı.", "Ancak Peygamber Efendimizi evde bulamadı. Bunu Âişe'ye (r.anha) söyledi ve ihtiyacını bıraktı. Peygamberimiz eve gelince Âişe ona Fatıma'nın geldiğini haber verdi. O sırada Ali ile Fatıma yatağa girmişlerdi. Peygamber Efendimiz, hemen onların evine geldi.", "Ali ile Fatıma kalkmak istediler. Peygamberimiz: “Yerinizde kalın” buyurdu ve aralarına oturdu. Ali, onun ayaklarının serinliğini göğsünde hissettiğini söyler. Sonra Peygamber Efendimiz şöyle dedi: “Size istediğinizden daha hayırlı bir şeyi öğreteyim mi?”", "“Yatağınıza girdiğiniz zaman otuz üç kez ‘Sübhânallah’, otuz üç kez ‘Elhamdülillah’ ve otuz dört kez ‘Allahu ekber’ deyin. Bu, sizin için bir hizmetçiden daha hayırlıdır.” Bu söz, kızını ihtiyacıyla yalnız bırakmayan bir babanın şefkatiyle, bir Peygamberin hikmetini bir araya getirir.", "“Sübhânallah” demek, Allah'ı her eksiklikten uzak tutmaktır. “Elhamdülillah”, her nimetin O'ndan geldiğini söylemektir. “Allahu ekber” ise O'nun her şeyden büyük olduğunu hatırlamaktır. Yorgun bir bedenin, bu üç cümlede teselli bulması çok anlamlıdır. Dünyanın işleri bitmez; ama gün sonunda Allah'a dönmek, onların ağırlığını hafifletir.", "Dikkat edilirse Peygamber Efendimiz, Fatıma'yı kuru bir “hayır” ile geri çevirmedi. Ona, hizmetçiden daha değerli bir şey öğretti. Gün boyu yorulan bir kadının, bedensel bir yardım yerine kalbine ve gücüne dayanak olacak bir zikir alması, aslında bir bakıma yorgunluğun ilacıydı. O gün Fatıma'nın istediği yardım, haklı ve sade bir istekti: Bir hizmetçi. Peygamber Efendimiz ona o yardımı vermedi, ama onu eli boş da çevirmedi. Yorgunluğunda ona destek olacak başka bir hazine öğretti. Bu, en güzel yardımın bazen ihtiyaç duyanın asıl ihtiyacını görmek olduğunu gösterir.", "Hadis şârihleri “hizmetçiden daha hayırlı” sözünü iki şekilde anlamıştır. Bir kısmına göre bu zikrin ahiretteki karşılığı, dünyada bir hizmetçiden daha değerlidir. Bazılarına göre ise bu zikre devam edene Allah, işini görecek bir güç ve dinçlik verir.", "Ali, bu öğüt konusunda bir şey de söyler: Peygamberimizden bunu işittiğinden beri hiç bırakmadığını anlatır. Ömrü boyunca bu zikri sürdürdü. Bir sözün hayata geçmesi, işte bu istikrarla olur: Küçük ama sürekli bir ibadet, büyük ama kısa süreli bir gayretten daha kalıcıdır.", "Bugün de pek çok ev, bu zikirle günü kapatır. Yorgun bir akşamın sonunda Allah'ı anarak yatağa girmek, insanın içini yatıştırır. Hizmetçi aramaya çıkan bir kızın, babasından aldığı bu hediye, yüzyıllar boyunca nice evin sessiz duası oldu."], "ibret": "Yorgun bir gün sonunda Allah'ı anmak, insana gerçek bir güç ve huzur verir. Küçük ama devamlı bir zikir, büyük ama kısa süren bir gayretten daha kalıcıdır. İyilik, ihtiyaç duyanın asıl ihtiyacını görmektir.", "kaynak": "Buhârî, Nafakât, 6 (5361), Fezâilü'l-ashâb, 9 (3705); Müslim, Zikir, 80 (2727)"}, {"no": 8, "baslik": "İbrahim'in Misafirleri", "tur": "kaynakli", "paragraflar": ["Bir gün İbrahim'in (a.s.) evine tanımadığı misafirler geldi. Kur'an, onlardan “şerefli misafirler” diye söz eder. (Zâriyât, 51/24) Misafirler içeri girip selam verdiler. İbrahim de selamlarını aldı ve “Siz tanımadığım bir topluluksunuz” dedi. (Zâriyât, 51/25) Yabancı olmaları, onların ağırlanmasına engel olmadı.", "İbrahim hiç beklemeden ailesinin yanına gitti. Kur'an'ın anlattığına göre, kısa sürede semiz bir buzağı getirdi, onu kızarttı ve misafirlerinin önüne koydu. (Zâriyât, 51/26-27; Hûd, 11/69) Müfessirler, ayetteki ifadeden onun misafirlerine hiç sezdirmeden, sessizce ailesinin yanına gittiğini anlar. Misafire geç kalmamak ve ikramı gösterişe dökmeden, gönül hoşluğuyla hazırlamak, ikramın en güzel hâlidir. Yemeği misafirlerinin önüne koyan İbrahim, nazikçe “Yemez misiniz?” diye sordu. Bu, bir ev sahibinin ilk ve en güzel sorusuydu. Fakat misafirler yemeğe el uzatmadı.", "İbrahim bunu görünce içinde bir çekingenlik duydu; onlardan korkmaya başladı. (Hûd, 11/70) O zaman misafirler ona: “Korkma!” dediler. Ve ona bilgin bir oğul müjdelediler. (Zâriyât, 51/28) Ayetlerden, bu misafirlerin Allah'ın elçileri olduğu anlaşılır. Müfessirlere göre bu elçiler meleklerdi; ancak Kur'an onların nasıl göründüğünü anlatmaz.", "Bu müjdeyi işiten İbrahim'in yaşlı eşi, şaşkınlıkla bir feryat edip yüzüne vurdu: “Ben kısır bir kocakarıyım!” (Zâriyât, 51/29) Hûd Sûresi'ne göre bu sırada ayaktaydı ve güldü; ona İshak'ı, İshak'ın ardından da Yakup'u müjdelediler. (Hûd, 11/71) Kadın şaşkındı: “Vay başıma! Ben yaşlı bir kadınım, bu kocam da bir ihtiyar...” (Hûd, 11/72)", "Elçiler sade ve kesin bir cevap verdi: “Allah'ın emrine mi şaşıyorsun? Allah'ın rahmeti ve bereketleri, ey ev halkı, sizin üzerinizedir.” (Hûd, 11/73) Bir misafir ağırlama sahnesi, bir ailenin yıllardır beklediği bir müjdenin kapısı olmuştu. İbrahim'in kapısı herkese açıktı; bu açık kapıdan, bir müjde de içeri girdi.", "Peygamber Efendimiz (s.a.v.) de bu güzel ahlakı öğütlemiştir: “Allah'a ve ahiret gününe inanan kimse misafirine ikram etsin.” Bu söz, misafirperverliğin imanın bir gereği olduğunu gösterir. Misafire gösterilen ilgi, yalnız bir görgü kuralı değil, Allah'a olan inancın da bir yansımasıdır.", "Peygamber Efendimiz, misafirliğin ölçüsünü de bildirmiştir: Misafire bir gün bir gece özel ikram yapılır; misafirlik üç gündür; bundan sonrası ise sadakadır. Böylece bu davranış, hem ev sahibine hem misafire ağır gelmeyecek bir ölçüyle güzelleşir. Kapı açıldığında, rahmet de içeri girer.", "İbrahim'in misafirlerini ilk ağırladığı anda, onların kim olduğunu bilmiyordu. Belki de bu yüzden ikramı daha içtendi. Bize düşen, kapımıza gelen herkese ikram edecek bir gönül hazırlamaktır. Çünkü bir sofra, sadece karnı doyurmaz; gönülleri de bir araya getirir."], "ibret": "Misafire güler yüz ve ikram göstermek, imanın bir parçasıdır. Kapısını ve gönlünü açan insana Allah, beklemediği yerden hayır ve müjde kapıları açar. Hazırlıkta acele etmek de ikramın güzelliğidir.", "kaynak": "Zâriyât Sûresi, 51/24-30; Hûd Sûresi, 11/69-73; Buhârî, Edeb, 31 (6018, 6019); Müslim, Îmân, 74 (47)"}], "kapanis": "Cennet yolu, bazen yoldan kaldırılan bir dalla, bazen süpürülen bir mescitle, bazen de sevgiyle yapılan bir ziyaretle açılıyor. Bu hikâyelerin sonunda belki içimizden şunu geçirdik: Bugün hangi küçük iyiliği yapabilirim? Cevabı kalbinizde bulursanız, bu kitap amacına ulaşmış demektir. Allah niyetlerimizi ve amellerimizi güzelleştirsin.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/11/", "kapak": "../../kapak/11.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 12, "baslik": "Hayvanlara Merhamet", "hazir": true, "yol": "../12/index.html"}, "pdf": "../../pdf/kitap-11.pdf", "epub": "../../epub/kitap-11.epub", "gorunum": "kitap-gorunumu.html"}</script>
