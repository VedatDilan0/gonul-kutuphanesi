<script type="application/json" id="kitap-veri">{"no": 7, "baslik": "İyilik Eden İyilik Bulur", "tanitim": "Bir kuyu başında yapılan yardım, sönen bir kandil, bir bahçe, bir örtü... Paylaşmanın, yardımlaşmanın ve sadakanın bereketini anlatan sekiz kaynaklı hikâye.", "onsoz": "Bir iyilik çoğu zaman küçük görünür: bir yudum su, bir lokma ekmek, bir örtü. Ama Kur'an'da ve sahih hadislerde bu küçük iyiliklerin nasıl büyüdüğünü, kimi zaman bir kuyuyu, kimi zaman bir bahçeyi, kimi zaman bir ömrü değiştirdiğini görürüz. Bu kitaptaki sekiz hikâye, paylaşmanın hem veren hem alan için nasıl bir bereket kapısı olduğunu anlatıyor. Her hikâyenin sonunda kaynağını ve kısa bir ibret bulacaksınız.", "hikayeler": [{"no": 1, "baslik": "Medyen Kuyusundaki İki Kız", "tur": "kaynakli", "paragraflar": ["Ayakları yoldan yorulmuş, gönlü endişeyle dolmuştu. Musa (a.s.) Mısır'dan ayrılmak zorunda kalmıştı. Kur'an'ın anlattığına göre orada başına gelen bir olaydan sonra şehrin uzak ucundan bir adam koşarak gelmiş ve ona “İleri gelenler seni öldürmek için görüşüyor, hemen çık git” demişti (Kasas, 28/20). Musa korku içinde, etrafını gözleyerek çıktı ve “Rabbim, beni zalimler topluluğundan kurtar” diye yalvardı (Kasas, 28/21).", "Medyen tarafına yönelince şöyle dedi: “Umarım Rabbim beni doğru yola iletir.” (Kasas, 28/22) Sonunda Medyen'in su başına vardı. Orada kalabalık bir topluluk hayvanlarını suluyordu. Biraz ötede ise iki kız, davarlarını geri tutarak bekliyordu.", "Musa kızlara yaklaştı ve sordu: “Sizin derdiniz ne?” Kızlar şöyle cevap verdi: “Çobanlar sürülerini sulayıp çekilmeden biz sulayamayız. Babamız da çok yaşlı bir adamdır.” (Kasas, 28/23) Yabancı bir şehirde, üstelik yorgun bir yolcunun bu işe karışması gerekmezdi. Ama Musa hiçbir şey beklemeden davarları onlar için suladı.", "Sonra bir gölgeye çekildi ve şöyle dua etti: “Rabbim, bana indireceğin her hayra muhtacım.” (Kasas, 28/24) Bu sözde ne bir şikâyet vardı ne de uzun bir istek listesi. Yurdundan uzak, yalnız bir adamın en sade duasıydı. Yaptığı iyiliği saymamış, karşılığını da istememişti; yalnızca kendi ihtiyacını Rabbine bırakmıştı.", "Çok geçmeden kızlardan biri utana utana yürüyerek geldi ve dedi ki: “Babam, bize su verdiğin için seni ödüllendirmek üzere çağırıyor.” (Kasas, 28/25) Musa kalkıp yaşlı adamın yanına gitti ve başından geçenleri anlattı. Yaşlı adam ona: “Korkma, o zalimler topluluğundan kurtuldun” dedi. Bu yaşlı babanın kim olduğu Kur'an'da söylenmez; müfessirler kimliği konusunda farklı görüşler bildirmiştir. Biz de ona yalnızca “yaşlı baba” diyelim.", "Kızlardan biri babasına şöyle dedi: “Babacığım, onu ücretle tut; çünkü ücretle tutacakların en hayırlısı güçlü ve güvenilir olandır.” (Kasas, 28/26) Baba Musa'ya bir teklifte bulundu: İki kızından biriyle onu evlendirecek, karşılığında Musa kendisinin yanında sekiz yıl çalışacaktı; isterse bunu on yıla tamamlayacaktı. Zor durumda bırakmak istemediğini de söyledi. Musa kabul etti: “Seninle benim aramdaki söz budur.” (Kasas, 28/27-28)", "Kur'an bu sahneyi kısa ve sade tutar. Ne Musa'nın yorgunluğu uzun uzun anlatılır ne de kızların minneti. Yine de her cümlede bir incelik vardır: Kızlar yardım istemez, Musa yaptığı yardımı anlatmaz, baba teşekkürünü bir davetle yapar. Üç taraf da kendi payına düşen güzelliği gösterir.", "Bir sürünün suyuyla başlayan küçük bir yardım, Musa'nın önünde yepyeni bir hayatın kapısını açtı. Yorgun bir yolcu, kısa sürede hem iş hem barınak hem de bir yuva buldu. Musa önce elinden geleni yaptı, sonra ihtiyacını Rabbine açtı. Cevap da hiç beklemediği bir kapıdan, utangaç bir davetle geldi."], "ibret": "Karşılık beklemeden yapılan küçük bir yardım, bazen kapalı sanılan kapıları açar. Elimizden geleni yapıp ihtiyacımızı Allah'a açtığımızda, cevap çoğu zaman beklemediğimiz yerden ve beklemediğimiz güzellikte gelir.", "kaynak": "Kasas Sûresi, 28/20-28"}, {"no": 2, "baslik": "Sönen Lambanın Işığında Misafir", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimiz (s.a.v.) o gün yanına gelen yorgun adamı öylece geri çevirmek istemedi. Adam aç olduğunu söylemişti. Ama Resûlullah'ın hanımlarının evinde de ikram edilecek bir şey yoktu; haber gönderdiğinde hepsi aynı cevabı verdi: “Bizde sudan başka bir şey yok.” Medine'nin o günlerinde, en yüce insanın evinde bile bir misafire sunulacak lokma bulunmayabiliyordu.", "Bunun üzerine Peygamberimiz çevresindekilere döndü: “Bu adamı bu gece kim misafir eder? Allah ona rahmet etsin.” Ensardan bir adam ayağa kalktı: “Ben, ey Allah'ın Resulü.” Müslim'in bir rivayetinde bu sahabinin adı Ebû Talha (r.a.) olarak geçer. Misafiri evine götürdü ve hanımına: “Resûlullah'ın misafirine ikram et” dedi.", "Kadın şaşkındı: “Evde çocukların yemeğinden başka bir şey yok.” Adam çaresiz kalmadı: “Yemeği hazırla, kandili yak. Çocuklar akşam yemeği isterse onları oyalayıp uyut.” Kadın yemeği hazırladı, kandili yaktı ve çocukları uyuttu. Sonra kandili düzeltiyormuş gibi kalkıp söndürdü. İkisi de karanlıkta sofraya oturdu, yiyormuş gibi yaptılar. Misafir yemeğini yerken onlar geceyi aç geçirdi.", "Düşünmeden geçmeyin: Bu iki insan misafire sadece yemek vermedi. Onu mahcup etmemek için kendi açlıklarını da gizlediler. Kandil sönünce karanlık hem onların boş ellerini hem de boş tabaklarını örttü. Kimse görmedi, kimse alkışlamadı. Yalnızca bir misafir doydu, bir ev gönül rahatlığıyla uyudu.", "Sabah olunca adam Peygamberimizin huzuruna çıktı. Resûlullah ona şöyle buyurdu: “Allah, dün gece misafirinize yaptığınız şeye hayret etti.” Bazı rivayetlerde bu söz “Allah güldü” diye geçer; ikisi de Allah'ın onların davranışından hoşnut olduğunu anlatır. Ardından şu ayet indi: “Kendileri ihtiyaç içinde olsalar bile (kardeşlerini) kendilerine tercih ederler. Kim nefsinin cimriliğinden korunursa işte onlar kurtuluşa erenlerdir.” (Haşr, 59/9) Hadiste bu ayetin söz konusu olay üzerine indiği belirtilir.", "Ayetin başında, bu evin dahil olduğu topluluk da anlatılır. Allah, Ensar'ı şöyle över: Onlardan önce yurt edinip imanı gönüllerine yerleştirenler, kendilerine hicret edenleri severler ve onlara verilenlerden dolayı içlerinde bir ihtiyaç duymazlar. Yani Medine'nin bu insanları, muhacirleri evlerine alırken hesap yapmıyordu. Sönen kandilin hikâyesi, bu geniş gönüllülüğün tek bir evdeki küçük bir göstergesiydi.", "Hadisin en etkileyici yanı, bu davranışın büyük bir söz ya da bir yemin olmadan, sıradan bir akşam yemeği saatinde yaşanmış olmasıdır. Ortada bir kandil, birkaç çocuk ve boş bir tabak vardı. Büyük fedakârlıklar, bazen bu kadar küçük sahnelerde saklanır.", "Bu sofrada ne bir ziyafet vardı ne de gösterişli bir fedakârlık. Üstelik yapılan iyilik, karşısındaki insanın kendini borçlu hissetmeyeceği bir sadelikteydi. Aradan asırlar geçti, o evin sahibi belki unutuldu; ama sönen kandilin hikâyesi hâlâ anlatılıyor. Çünkü Allah, kimsenin görmediği iyiliği de görür ve onu kıymetli kılar."], "ibret": "Gerçek cömertlik, fazlalığı değil, kendine lazım olanı paylaşabilmektir. Gizlice yapılan iyilik, Allah katında gösterişli bir ziyafetten daha değerli olabilir. Misafiri sevindirmek, bazen kendi karnını doyurmaktan önce gelir.", "kaynak": "Buhârî, Menâkıbü'l-ensâr, 10 (3798); Tefsîr, Haşr (4889); Müslim, Eşribe, 172 (2054); Haşr Sûresi, 59/9"}, {"no": 3, "baslik": "Herkese Açılan Kuyu", "tur": "kaynakli", "paragraflar": ["Medine'de su, altın kadar değerli bir nimetti. Çölün kıyısındaki bir şehirde tatlı su bulmak kolay değildi. Peygamber Efendimiz (s.a.v.) ve arkadaşları hicret edip Medine'ye yerleştiğinde, şehirde içmeye uygun tatlı suyu bulunan kuyu Rûme kuyusuydu. Hadis kaynaklarına göre başka bir tatlı su kaynağı yoktu.", "Kuyunun bir sahibi vardı ve suya ihtiyacı olan herkes onun iznine bağlıydı. Rivayetlere göre su ücret karşılığı veriliyordu. Fiyatı, sahibinin kim olduğu ve kuyunun nasıl satın alındığı konusunda kitaplarda çeşitli ayrıntılar anlatılır; ancak bunların çoğu sağlam kaynaklara dayanmadığı için biz bunlara girmeyeceğiz. Bilinen şey şudur: Bir şehrin gündelik ihtiyacı, tek bir kuyunun kapısına bağlıydı.", "Peygamberimiz bir gün şöyle buyurdu: “Kim Rûme kuyusunu satın alır da kovasını Müslümanların kovalarıyla bir tutarsa, ona cennette ondan daha hayırlısı vardır.” Bu söz kimseye zorla bir yük yüklemiyordu. Yalnızca bir kapıyı gösteriyordu: Malı olanın, malını herkesin hayrı için kullanması.", "Bu çağrıya Osman b. Affân (r.a.) cevap verdi. Kuyuyu kendi malıyla satın aldı ve Müslümanların kullanımına açtı. Artık Osman'ın kovası ile Medine'nin yoksulunun, yolcusunun, çocuklarının kovası aynı kuyuya iner, aynı suyu çekerdi.", "Peygamberimizin müjdesinde dikkat çeken bir ayrıntı vardır: Kuyuyu alan kişi onu herkese açacak, kendi kovasını da Müslümanların kovalarıyla bir tutacaktı. Yani verirken kendine bir ayrıcalık ayırmamak, bağışladığı şeyde herkesle eşit olmak. Çünkü bazen vermek kolaydır, ama verdiğin şeyin karşısında bir insan gibi sıraya girmek, gönlün olgunluğunu ister.", "Bu olayı bize aktaran rivayet Osman'ın kendi anlatımına dayanır; yıllar sonra bir vesileyle bunu hatırlatmıştır. Rivayet Tirmizî ve Nesâî gibi hadis kitaplarında yer alır. Tirmizî bu hadisin hasen olduğunu söyler.", "Kaynaklarda bu kuyunun, Müslümanların ilk vakıf örneklerinden biri olarak anıldığını görürüz. Vakıf, bir malın sahibinin elinden çıkıp kalıcı olarak herkesin faydasına sunulması demektir. Osman'ın verdiği şey yalnızca bir kova su değil, kendisinden sonra da süren bir hayırdı. Aynı rivayette Osman, başka iyiliklerini de hatırlatır; Tebük ordusunu donatması bunlardan biridir.", "İmam Buhârî de Vesâyâ bölümünde, vakıf konusunun başlığında bu olayı kısaca anar. Âlimler Rûme kuyusunu, vakfın dayanaklarından biri olarak değerlendirmiştir. Yani bu iyilik, ilk dönem âlimlerinin gözünde de hatırı sayılır bir örnekti.", "Rûme kuyusunun suyu, Osman'ın zengin olduğunu değil, zenginin iyiliğe nasıl yöneldiğini gösterdi. Artık Medine'de susayan kimse, bu kuyunun suyu için pazarlık yapmak zorunda değildi. Bir insanın malından çıkan küçük bir bedel, bütün bir şehre rahatlık oldu; Allah katındaki karşılığın ise bundan çok daha hayırlı olacağı müjdelenmişti."], "ibret": "Malın değeri, ihtiyacı olanın kapısına ne kadar yaklaştığıyla ölçülür. Kendi kovasını herkesinkiyle bir tutan insan, verdiğinden çok daha fazlasını kazanır; çünkü hayır, kalıcı olduğunda sahibine devam eder.", "kaynak": "Tirmizî, Menâkıb, 18 (3703); Nesâî, Ahbâs, 4 (3608); Buhârî, Vesâyâ, 33 (bab başlığında)"}, {"no": 4, "baslik": "Bulutun Sulattığı Bahçe", "tur": "kaynakli", "paragraflar": ["Çölde yürüyen bir adamın başı üzerinde bir bulut vardı. Bu, Peygamber Efendimizin (s.a.v.) bize aktardığı bir olaydır. Adam, bulutun içinden bir ses duydu: “Falanın bahçesini sula.” Sözde bir isim geçiyordu. Hadiste o ismin kime ait olduğu söylenmez; biz de bir ad uydurmayacağız.", "Bulut yürüdü ve yağmurunu siyah, taşlı bir araziye boşalttı. Sular, o taşlığın kanallarından birinde toplanıp akmaya başladı. Adam suyun peşine düştü. Biraz ileride, elindeki kürekle suyu bahçesine yönlendiren birini gördü.", "Adam yaklaşıp sordu: “Ey Allah'ın kulu, adın nedir?” Bahçe sahibi adını söyledi. Bu, buluttan duyulan isimle aynıydı. Bahçe sahibi bu kez şaşırdı: “Ey Allah'ın kulu, niçin adımı soruyorsun?” Yolcu açıkladı: “Bu suyun yağdığı bulutun içinde bir ses işittim; ‘Falanın bahçesini sula’ diyordu ve senin adını söylüyordu. Sen bu bahçeyle ne yapıyorsun?”", "Bahçe sahibi bir an düşündü ve şöyle dedi: “Mademki bunu sordun, söyleyeyim. Ben bu bahçenin ürününe bakarım; üçte birini sadaka olarak veririm, üçte birini ben ve ailem yeriz, üçte birini de yine bahçeye, ürünün yenilenmesi için geri koyarım.” Hadis burada biter.", "Ama anlattıkları çok şeydir. Bu adam kimseye gösteriş yapmamış, sırrını kimseye açmamıştı. Yolcu sormasa, bahçesinin hesabını yalnızca Allah bilecekti. Bulutu o bahçeye yönelten Allah'tı; adam ise yalnızca elinden geleni yapıyordu. Yaptığı şey, hepimizin yapabileceği kadar sadeydi: Kazancını üçe bölmek.", "Başka bir hadiste Peygamberimiz, bir müminin ailesine sevap umarak harcadığı şeyin de onun için sadaka olduğunu bildirir (Buhârî, Îmân, 41; Müslim, Zekât, 48). Bahçe sahibinin ürünü üçe bölmesi bu açıdan düşünülebilir: Sadaka yalnızca dışarıya verilen değildir; sevap umarak ailesine harcanan da sadakadır. Böylece bu adam, kazancının büyük bir kısmını Allah rızası yolunda kullanmış oluyordu.", "Hadis, Müslim'in Zühd bölümünde yer alır; yani dünyaya aşırı bağlanmamayı, gönül inceliklerini anlatan hadisler arasında. Bu konum da bize, bahçe sahibinin dünyalık bir kazancı bile, kalbini bağlamadan ve paylaşarak yaşadığını düşündürür.", "Bu bölümlere dikkatle bakalım. Üçte birini sadaka olarak verirken ailesini ihmal etmemişti; üçte birini ailesine harcarken cimrilik de etmemişti. Üçte birini de toprağa geri veriyordu; yani yarının bereketini bugünden hazırlıyordu. Cömertlik bir taşkınlık değil, bir denge işiydi. Hem verenin hem ailesinin hem de toprağın hakkı gözetiliyordu.", "Hadis, bu dengeye karşılık gelen bir ikramı da gösterir: Bulut, yağmurunu daha uzaklara değil, doğrudan o bahçenin suyuna yöneltti. Elbette bu, her sadakanın böyle bir olayla karşılık göreceği anlamına gelmez; ama sadaka veren, ailesine bakan ve toprağıyla ilgilenen bir insanın, Allah'ın rahmetinden uzak olmadığını gösterir."], "ibret": "Sadaka vermek malı eksiltmez, onu bereketlendirir. Hayrı gizli yapan, ailesini ve geleceğini de unutmayan kişi, Allah'ın rahmetini ummadığı yerden bulabilir. Cömertlik, düzenli ve dengeli bir iştir; kimseyi mağdur etmez.", "kaynak": "Müslim, Zühd, 45 (2984)"}, {"no": 5, "baslik": "Alacalı, Kel ve Kör", "tur": "kaynakli", "paragraflar": ["İsrailoğulları arasında üç kişi vardı: Birinin derisi alacalıydı, birinin saçı dökülmüştü, biri de gözleriyle göremiyordu. Peygamber Efendimizin (s.a.v.) anlattığına göre Allah onları sınamak istedi ve bir melek gönderdi. Melek önce alaca hastalığı olana geldi: “En çok neyi istersin?” O şöyle dedi: “Güzel bir renk ve güzel bir deri; çünkü insanlar benden tiksiniyor.”", "Melek eliyle ona dokundu; hastalık geçti ve ona güzel bir renk ve güzel bir deri verildi. “Hangi mal sana daha sevimli?” diye sorunca “Deve” dedi. Kendisine gebe bir deve verildi ve “Allah sana bereket versin” denildi. Aynı şekilde kel adam saçına kavuştu ve sığır istedi; kör adam gözlerine kavuştu ve koyun istedi. Yıllar içinde üçünün de malı çoğaldı; her birinin vadiler dolusu sürüsü oldu.", "Aradan zaman geçti. Melek bu kez yoksul bir yolcu kılığında önce alacalıya gitti: “Yoksul bir adamım, yolculukta azığım tükendi. Sana güzel rengi, güzel teni ve malı verenin adıyla senden bir deve istiyorum.” Adam cevap verdi: “Haklar çok.” Melek: “Sanki seni tanıyorum; sen alacalı, insanların tiksindiği, yoksul biri değil miydin? Allah sana bunları verdi.” Adam: “Bu malı atalarımdan miras aldım.” Melek: “Yalan söylüyorsan Allah seni eski hâline döndürsün.” Kel adam da aynı şekilde karşılık verdi.", "Sıra gözlerini yeniden kazanan adama geldi. Melek yine bir yolcu olarak sordu: “Gözünü sana geri veren adına senden bir koyun istiyorum.” Adam şöyle dedi: “Ben kördüm, Allah gözümü bana geri verdi. Dilediğini al, dilediğini bırak. Allah için aldığın hiçbir şeyden dolayı seni zorlamayacağım.”", "Melek ona şöyle dedi: “Malını tut. Siz sınandınız. Allah senden razı oldu, iki arkadaşından hoşnut olmadı.” Hadis burada biter. Anlatılanlarda dikkat çeken şey şudur: Üçü de aynı nimete kavuştu, aynı yolcuyla karşılaştı. Ama biri nimeti verenin kim olduğunu hatırladı, ikisi ise nimeti kendi malı sandı.", "Gözleri açılan adam, bir zamanlar nasıl bir karanlığın içinde olduğunu unutmamıştı. Bu hatıra, elindekini paylaşmasını kolaylaştırdı. Şükür yalnızca dille söylenen bir söz değildir; elindekinin bir bölümünü ihtiyacı olana açabilmektir. Dikkat edin, adam “dilediğini al” dedi; yani yoksula vermekten bir minnet beklemedi, kendini Allah'ın emanetçisi gibi gördü.", "Hâlbuki öteki ikisi, yoksulluktan nasıl çıktıklarını unutmuş, geçmişlerini gizlemeye çalışmıştı. Nimet çoğaldıkça gönülleri küçülmüştü. Üçünün imtihanı da aynıydı, ama sonuçları farklı oldu; çünkü biri verenin kim olduğunu bildi.", "Hadiste bu üç kişinin isimleri, hangi zamanda yaşadıkları söylenmez. Çünkü mesele onların kim olduğu değil, nimet karşısında nasıl davrandıklarıdır. Böylece hikâye herkesin hikâyesi olur: Hepimiz bir gün sağlığımızı, malımızı ya da güzelliğimizi bir imtihan olarak yaşarız."], "ibret": "Elimizdeki nimeti kimin verdiğini unutmadığımızda paylaşmak kolaylaşır. İyilik, bir zamanlar nasıl yardıma muhtaç olduğunu hatırlayan kalpten doğar. Nimet, şükredenin elinde artar; unutanın elinde ise azalır.", "kaynak": "Buhârî, Enbiyâ, 51 (3464); Müslim, Zühd, 10 (2964)"}, {"no": 6, "baslik": "Azıklarını Bir Araya Koyanlar", "tur": "kaynakli", "paragraflar": ["Yemen'den gelen bir topluluktu onlar: Eş'arîler. Peygamber Efendimizin (s.a.v.) yanına, kaynaklara göre Hayber'in fethi sıralarında ulaşmışlardı. Ebû Mûsâ el-Eş'arî (r.a.) de bu kabilenin insanıydı. Medine'de yeni bir hayata başlıyorlardı ve ellerindekiyle yetinmeyi, ellerindekini paylaşmayı biliyorlardı.", "Ebû Mûsâ'nın kendi anlatımına göre kabilesi, Peygamberimizin çıktığını Yemen'de duymuş ve ona doğru yola çıkmıştı. Bir gemiyle denize açılan topluluğu rüzgâr Habeşistan'a savurmuş; orada Cafer b. Ebû Tâlib ve arkadaşlarıyla karşılaşmışlar, sonra Hayber'in fethi sırasında Medine'ye ulaşmışlardı. Yani onlar yolun yorgunluğunu, belirsizliğini ve eksikliğini iyi bilen insanlardı.", "Onlar hakkında Peygamberimizin bir sözü bize ulaşmıştır. Resûlullah şöyle buyurdu: “Eş'arîler bir savaşta azıkları tükenmeye yüz tuttuğunda ya da Medine'de ailelerinin yiyeceği azaldığında, ellerinde ne varsa hepsini bir örtünün üzerine toplarlar. Sonra bir kapla aralarında eşit olarak bölüşürler. İşte onlar bendendir, ben de onlardanım.”", "Bu hadis kısadır; ama içinde tam bir tablo vardır. Bir yolculukta azığın azaldığını düşünün. Çoğumuzun ilk tepkisi kendi torbasına sarılmaktır. Eş'arîler ise tersini yaptı. Kim ne taşıyorsa getirdi. Çok yiyeceği olan da az yiyeceği olan da örtünün başına oturdu. Kimin ne kadar getirdiği artık önemini yitirdi. Sonra bir kapla herkese eşit pay dağıtıldı.", "Bu davranış, bir cömertlikten öte bir düzendi. Güçlü olan yiyeceğinin fazlasını vermekle kalmıyor, payın eşit olmasına da razı oluyordu. Yoksul olan ise kendini yük hissetmiyordu; çünkü o da ortak bir sofranın sahibiydi. Böylece kıtlık, insanları birbirinden ayırmak yerine birbirine yaklaştırdı.", "Hadisi Ebû Mûsâ el-Eş'arî rivayet eder; yani paylaşmanın bu güzel örneğini, bizzat o topluluğun içinden biri bize aktarmıştır. Rivayet hem Buhârî'de hem Müslim'de yer alır. Bu da olayın, iki büyük hadis kitabında da kabul gördüğünü gösterir.", "Peygamberimizin “onlar bendendir, ben de onlardanım” sözünü hadis şârihleri, “benim yolumdan giden, benim ahlakımla yaşayan” anlamında yorumlamıştır. Hadiste ayrıca Peygamberimizin bu topluluktan ne kadar hoşnut olduğu hissedilir. Bir kabilenin, ortak sofra kurma alışkanlığıyla Resûlullah'ın övgüsüne mazhar olması, küçük bir davranışın ne kadar büyük bir değer taşıdığını gösterir.", "Başka bir hadiste de Peygamberimiz, Eş'arîlerin gece Kur'an okurken seslerini tanıdığını söyler. Böylece bu insanların hem birbirini doyuran hem Allah'ı anan bir topluluk olarak hatırlandığını görürüz. Dünya işinde paylaşmak ile ibadet etmek, onlarda birbirinden ayrı değildi.", "Paylaşmak çoğu zaman büyük bir fedakârlık gibi düşünülür. Oysa Eş'arîlerin yaptığı çok sadeydi: Bir örtü, bir kap ve eşit bir pay. Üstelik bunu en çok kendilerini düşünmeleri gereken anda, azığın tükendiği sırada yaptılar. İyilik, belki de tam orada, darlığın ortasında başlar."], "ibret": "Zor zamanda birlikte olmak, bolluktaki cömertlikten daha kıymetlidir. Elindekini ortaya koyan topluluk, hem kendini hem birbirini kurtarır; paylaşılan azık, tek başına yenen azıktan daha bereketlidir.", "kaynak": "Buhârî, Şirket, 1 (2486); Megâzî (4230, 4232); Müslim, Fezâilü's-sahâbe, 166-167 (2499-2500)"}, {"no": 7, "baslik": "Kefen Olsun Diye İstenen Örtü", "tur": "kaynakli", "paragraflar": ["Bir kadın, kendi elleriyle dokuduğu kenarlı bir örtüyü Peygamber Efendimize (s.a.v.) getirdi. “Bunu sana giydirmek için kendi ellerimle dokudum” dedi. Resûlullah ona ihtiyacı olduğu için örtüyü kabul etti. Sehl b. Sa'd (r.a.) bu olayı anlatırken şöyle der: Peygamberimiz onu izar gibi sararak yanımıza çıktı. Kadının emeği, o gün en yüce kişinin üzerindeydi.", "Burde, kenarlarıyla birlikte dokunmuş, sarınmaya yarayan bir örtü demektir. Kadının onu kendi elleriyle dokuması, bu hediyenin hem emek hem sevgi taşıdığını gösterir. Peygamberimiz de bu emeği, ihtiyacı olduğu için hemen kabul etti ve kadını kırmadı.", "Orada bulunanlardan bir adam örtüyü görünce beğendi: “Ne güzel! Onu bana giydirir misin?” Peygamberimiz “Evet” dedi. Bir süre meclisinde oturdu, sonra evine döndü; örtüyü katlayıp adama gönderdi. Adam ne bir pazarlık yapmıştı ne de bir ısrarda bulunmuştu. Yalnızca istemişti.", "Cemaatten bazıları adama sitem etti: “Güzel yapmadın. Peygamber onu ihtiyacı olduğu için giymişti. Üstelik senden bir şey istendiğinde hayır demeyen biri olduğunu bildiğin hâlde istedin!” Gerçekten de başka bir hadiste Câbir (r.a.), Peygamberimizden bir şey istendiğinde “hayır” demediğini söyler. Arkadaşları, adamın bu güzel huydan yararlanmasını doğru bulmamıştı.", "Adam şöyle cevap verdi: “Vallahi, onu giymek için istemedim. Ölünce kefenim olsun diye istedim.” Sehl, olayın devamını şu kısa cümleyle bağlar: “Gerçekten de o örtü onun kefeni oldu.”", "Bu olayda iki güzellik yan yana durur. Birincisi, Peygamberimizin ihtiyacı olan bir örtüyü, istendiği anda vermesidir. Kimi insanlar elindeki şeyi, kendine lazım olduğu hâlde paylaşmaktan çekinir. O ise lazım olanı verdi; üstelik bir sitem ya da yüzünü ekşitme olmadan.", "İkincisi, adamın niyetidir. Şârihler, onun örtüyü süslenmek için değil, Peygamberimizin mübarek bedenine değmiş bir şeyden bereket umarak ve ölümü unutmayarak istediğini anlatır. Böyle bir istek, ahireti hatırlayan ve ona hazırlanan bir kalpten gelir. Dünyalık bir hediye yerine, son yolculuğuna eşlik edecek bir yadigâr istemişti.", "Kadının hikâyesi de kıymetlidir. Elleriyle dokuduğu örtünün sonunda bir müminin son yolculuğuna eşlik edeceğini belki hiç bilmedi. Ama emeği kabul edildi, verilen iyilik de yerini buldu. Sehl'in anlatışı, kısa bir hadiste bile nice güzelliğin yan yana durabildiğini gösterir.", "Buhârî bu hadisi, “Kefenini (sağlığında) hazırlayan kimse” başlığı altında anar. Hadisten çıkarılan bir ders de, ölüme hazırlıklı olmanın ayıp ya da uğursuz bir şey değil, uyanık bir kalbin işareti olduğudur. Kefen, ölümü hatırlatır; ölümü hatırlayan insan da hayatını daha dikkatli yaşar.", "Buhârî'nin rivayetinde bu adamın adı geçmez. Biz de bir isim vermeden, yalnızca niyetinin güzelliğini öne çıkardık."], "ibret": "İhtiyacı olduğu hâlde isteneni veren cömertlik, hem verenin hem alanın gönlünü ferahlatır. Niyeti güzel olan bir isteğin sonu da güzel olur; ölümü hatırlayan kalp, hayatı daha güzel yaşar.", "kaynak": "Buhârî, Cenâiz, 28 (1277); Büyû (2093); Libâs (5810); Câbir'in sözü için: Müslim, Fezâil, 56 (2311)"}, {"no": 8, "baslik": "Niyetine Göre Kabul Edilen Sadaka", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimiz (s.a.v.) bize bir adamın hikâyesini anlatır. Bu adam bir gün kendi kendine şöyle der: “Bu gece mutlaka bir sadaka vereceğim.” Gizlice hazırlanır, sadakasını alıp karanlıkta evinden çıkar. Yolda bir kişinin eline bırakır ve eve döner. Sabah olunca insanlar konuşmaya başlar: “Dün gece bir hırsıza sadaka verilmiş.”", "Adam şaşırır ama şöyle der: “Allahım, hamd sana olsun! Hırsıza vermişim.” Yine de vazgeçmez. “Bu gece yine sadaka vereceğim” diye çıkar, bu kez sadakasını kötü yola düşmüş bir kadına verir. Sabah şehir yine bu haberle uyanır: “Bu gece kötü yoldaki bir kadına sadaka verilmiş.” Adam bu kez de aynı sözleri söyler: “Allahım, hamd sana olsun! Kötü yoldaki bir kadına vermişim.”", "Üçüncü gece de sadakasıyla çıkar; bu defa para bir zenginin eline geçer. Sabah olunca konuşma yine başlar: “Zengin birine sadaka verilmiş.” Adam yine sabırla, yine şükürle şöyle der: “Allahım, hamd sana olsun! Hırsıza, kötü yoldaki kadına ve zengine vermişim.” Hadiste adamın kimliği ve hangi toplumdan olduğu belirtilmez; biz de bir ad vermiyoruz.", "Sonra adama bir müjde bildirilir; şârihler bunu bir rüya olarak yorumlar. Ona şöyle denir: “Hırsıza verdiğin sadaka, belki onu hırsızlıktan vazgeçirir. Kötü yoldaki kadına verdiğin, belki onu o yoldan çevirir. Zengine verdiğin ise belki ibret alır da Allah'ın kendisine verdiğinden başkalarına harcar.” Yani sadaka kabul edilmiştir.", "Bu hadis, sadakanın değerinin yalnızca kime verildiğiyle değil, niyetle ölçüldüğünü gösterir. Adam gizlilik içinde, kimseden bir övgü beklemeden yola çıkmıştı. Başına gelenler karşısında şikâyet etmedi, kimseyi suçlamadı; sadece Allah'a hamd etti. Hayır yapmaya çalışırken yanlış kapıyı çalmış olması, onu o hayrın sevabından mahrum bırakmadı.", "Elbette bu, sadakayı gelişigüzel vermeyi öğütlemez. İnsan elinden geldiği kadar dikkat eder, ihtiyaç sahibini arar. Ama niyet temiz olduğunda, sonuç kimi zaman bizim göremediğimiz bir güzelliğe çıkar. Bir kalbe düşen sadaka, onu değiştirebilir; bir hırsızın hırsızlığı, bir kadının yolu, bir zenginin cimriliği, bu küçük iyilikle yön değiştirebilir.", "Bu hadis, bir de şu bakımdan güzeldir: Gizlice sadaka vermek isteyen adamın niyeti, ertesi sabah şehrin dilindeydi. Gösteriş peşinde olan biri bu duruma sinirlenir, utanır, belki bir daha vermezdi. Oysa adam, kimseye bir şey ispat etmeye çalışmıyordu; kime verdiğini değil, kimin için verdiğini düşünüyordu.", "Bu sabır, hadisin bize en çok öğrettiği şeylerden biridir. İnsan iyilik yaparken eleştirilebilir, yanlış anlaşılabilir. Önemli olan, niyeti bozmadan yola devam edebilmektir.", "Adamın en güzel yanı, her sabah gelen laflara rağmen vazgeçmemesidir. Her sabah yine şükretti, her gece yine çıktı. Sonunda Allah, hem niyetini hem sabrını kabul etti."], "ibret": "İyiliğin kabulü, çoğu zaman niyete bağlıdır. Hayır yolunda yanılsak da, Allah rızası için yapılan sadaka boşa gitmez; doğru yere ulaşmasa bile bir kalbe dokunabilir, bir yolu değiştirebilir.", "kaynak": "Buhârî, Zekât, 14 (1421); Müslim, Zekât, 78 (1022)"}], "kapanis": "Sekiz hikâyenin ortak bir sesi vardı: Verenin eli boş kalmaz. Medyen'de bir kuyu başında, Medine'de bir sofrada, çölde bir bulutun altında hep aynı gerçek yaşandı. İyilik, karşılık beklenmeden yapıldığında bile geri döner; bazen bir yuva olarak, bazen bir bahçe olarak, bazen de ahirette bir müjde olarak. Siz de bugün küçük bir iyiliği ihmal etmeyin. Belki de bir gün o iyilik, sizi bekleyen kapıyı açar.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/07/", "kapak": "../../kapak/07.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 8, "baslik": "Doğruluk ve Emanet", "hazir": true, "yol": "../08/index.html"}, "pdf": "../../pdf/kitap-07.pdf", "epub": "../../epub/kitap-07.epub", "gorunum": "kitap-gorunumu.html"}</script>
