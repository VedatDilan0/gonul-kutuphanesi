<script type="application/json" id="kitap-veri">{"no": 9, "baslik": "Duaların Güzelliği", "tanitim": "Balığın karnından mihraba, mağaradan minbere... Kur'an'da ve sahih hadislerde geçen dualar ve o duaların kabul edildiği sekiz hikâye.", "onsoz": "Dua, insanın Rabbiyle kurduğu en sade ve en sıcak bağdır. Kur'an'da ve sahih hadislerde, çok farklı hâllerde edilen dualarla karşılaşırız: bir balığın karnında, bir mihrapta, bir mağarada, bir minberin başında. Bu kitaptaki sekiz hikâye, duanın nasıl edildiğini ve nasıl karşılık bulduğunu anlatıyor. Her hikâyenin sonunda kaynağını ve kısa bir ibret bulacaksınız.", "hikayeler": [{"no": 1, "baslik": "Balığın Karnındaki Dua", "tur": "kaynakli", "paragraflar": ["Kimi dualar, rahat bir odada değil, en dar yerde edilir. Yunus (a.s.) da öyle bir yerde dua etti. Kur'an ona “Zünnûn”, yani “balık sahibi” der. Kur'an'ın anlattığına göre Yunus, kavmini Allah'a çağırdı; ama onların inanmadığını görünce öfkeli bir hâlde yanlarından ayrıldı (Enbiyâ, 21/87). Müfessirler, onun bu ayrılışı Allah'ın izni gelmeden yaptığını, bu yüzden bir imtihana girdiğini söyler.", "Yunus dolu bir gemiye bindi. Yolculuk sırasında gemidekiler kura çekti ve kura Yunus'a çıktı; müfessirlere göre bu yüzden denize bırakıldı. Kur'an burada şöyle der: “Derken kendini kınamakta iken balık onu yuttu.” (Sâffât, 37/142) Balığın türü, Yunus'un onun karnında ne kadar kaldığı Kur'an'da bildirilmez. Rivayetlerde bu konuda çeşitli bilgiler vardır; ama kesin değildir, biz de onlara yer vermiyoruz.", "Şimdi bir an Yunus'un yerinde düşünelim. Çevresinde deniz var, üstünde gece var, bir de balığın karnı var. Müfessirler, ayette geçen “karanlıklar” ifadesini bu üç karanlık olarak yorumlar. Hiç kimsenin ulaşamayacağı, hiçbir sesin duyulmayacağı bir yer. İşte orada Yunus, şu duayı etti: “Senden başka ilah yoktur. Seni tenzih ederim. Ben gerçekten haksızlık edenlerden oldum.” (Enbiyâ, 21/87)", "Bu dua üç parçadan oluşur. Önce Allah'ın birliğini ilan eder: “Senden başka ilah yoktur.” Sonra O'nu kusurdan uzak tutar: “Seni tenzih ederim.” En sonunda ise kendi hatasını kabul eder: “Ben haksızlık edenlerden oldum.” Yunus, yaşadığı sıkıntının suçunu kimseye yüklemedi. Ne şehre ne kavmine ne denize. Önce Rabbini yüceltti, sonra kendini sorguladı.", "Allah ise onun duasını kabul etti: “Biz de onun duasını kabul ettik ve onu sıkıntıdan kurtardık. İşte biz müminleri böyle kurtarırız.” (Enbiyâ, 21/88) Başka bir ayette de şöyle buyurulur: “Eğer o, Allah'ı çokça tesbih edenlerden olmasaydı, diriltilecekleri güne kadar onun karnında kalırdı.” (Sâffât, 37/143-144) Yani Yunus'un kurtuluşunda, bu tesbihin de payı vardı.", "Sonra Yunus bir kıyıya bırakıldı. Kur'an bunu şöyle anlatır: “Biz onu, hasta hâlde çıplak bir yere attık; üzerine de yapraklı bir bitki bitirdik.” (Sâffât, 37/145-146) Müfessirlere göre bu bitki onu gölgesiyle korudu. Karanlığın içinden çıkan Yunus'u, bu kez serin bir gölge karşıladı. Yani Allah onu yalnızca kurtarmakla kalmadı; hasta ve yorgun hâlini de gözetti.", "Hikâyenin devamında, Yunus'un kavminin de iman ettiği bildirilir (Sâffât, 37/147-148). Biz bunu kısaca anmakla yetiniyoruz.", "Peygamber Efendimiz (s.a.v.) bu duaya özel bir önem vermiştir. Sa'd b. Ebû Vakkâs'ın (r.a.) rivayetine göre şöyle buyurmuştur: “Balık sahibinin, karnındayken yaptığı dua şudur: ‘Lâ ilâhe illâ ente sübhâneke innî küntü mine'z-zâlimîn.’ Hangi Müslüman, herhangi bir derdi için bu duayla dua ederse, Allah onun duasını kabul eder.” Hadisi Tirmizî rivayet etmiştir; kaynaklarda sahih olarak değerlendirilir."], "ibret": "En dar yerde bile Allah'a dönmek mümkündür. Hatayı kabul edip Rabbine yönelen kişi, karanlığın içinde de bir kapı bulur; tövbe ve tesbih, kurtuluşun anahtarıdır.", "kaynak": "Enbiyâ Sûresi, 21/87-88; Sâffât Sûresi, 37/139-148; Tirmizî, Daavât (3505)"}, {"no": 2, "baslik": "Zekeriya'nın Gizli Duası", "tur": "kaynakli", "paragraflar": ["Zekeriya (a.s.) yaşlanmıştı. Kur'an'ın anlattığına göre, kendi himayesinde bulunan Meryem'in yanına, mihraba her girdiğinde bir rızık bulurdu. Bir gün sordu: “Ey Meryem! Bu sana nereden geliyor?” Meryem sade ve kesin bir cevap verdi: “Bu, Allah katındandır. Şüphesiz Allah, dilediğine hesapsız rızık verir.” (Âl-i İmrân, 3/37) Meryem'i Zekeriya'nın himayesine İmrân'ın hanımının adağı getirmişti; biz bu sahneyi burada bir cümleyle anıyoruz.", "Bu cevap Zekeriya'nın kalbinde bir kapı araladı. Allah'ın, dilediğine dilediği şekilde verdiğini bir kez daha gördü. Yaşlılığı ve hanımının çocuk doğurmaya elverişli olmayışı, içinde taşıdığı bu isteği uzak gösteriyordu. Ama Meryem'in yanındaki bu rızık, ona umudun hiç kapanmadığını gösterdi. Ve orada Rabbine şöyle yöneldi: “Rabbim! Bana katından temiz bir nesil ver. Şüphesiz sen duayı işitensin.” (Âl-i İmrân, 3/38)", "Kur'an bu duanın nasıl edildiğini ayrıca anlatır: “Hani o, Rabbine gizlice niyazda bulunmuştu.” (Meryem, 19/3) Gizli dua, yalnızca Allah'ın duyduğu bir fısıltıdır. Zekeriya şöyle dedi: “Rabbim! Benim kemiklerim zayıfladı, başım yaşlılıktan ağardı. Ey Rabbim! Ben sana dua ederken hiçbir zaman mahrum kalmadım.” (Meryem, 19/4)", "Bu cümlede bir hayatın bütün tecrübesi vardır. Zekeriya, yıllardır dua eden, her duasında Allah'ın cevabını gören birinin güveniyle konuşuyordu. “Sana dua ederken hiç mahrum olmadım” sözü, bu güvenin ifadesidir. Daha sonra şöyle devam etti: “Ben, arkamdan gelecek yakınlarımdan endişe ediyorum. Hanımım da kısırdır. Bana katından bir varis ver.” (Meryem, 19/5) Müfessirler, bu varisliğin özellikle ilim ve peygamberlik görevinin devamı yönünden de olduğunu söyler.", "Dua kabul edildi. Zekeriya mihrapta namaz kılarken melekler ona şöyle seslendi: “Allah sana Yahya'yı müjdeler.” (Âl-i İmrân, 3/39) Yahya'nın, Allah'tan bir kelimeyi doğrulayan, önder, iffetli ve salihlerden bir peygamber olacağı bildirildi. Zekeriya şaşırdı: “Rabbim! Ben yaşlıyım, hanımım da kısır. Benim nasıl oğlum olur?” Allah'ın cevabı: “İşte böyle, Allah dilediğini yapar.” (Âl-i İmrân, 3/40)", "Zekeriya yine de bir alamet istedi. “Rabbim, bana bir alamet ver” dedi. Cevap gelmişti: “Senin alametin, üç gün boyunca insanlarla işaretten başka bir şekilde konuşmamandır. Rabbini çokça an, akşam sabah tesbih et.” (Âl-i İmrân, 3/41)", "Sonra Zekeriya mihraptan kavminin karşısına çıktı ve onlara, sabah akşam Allah'ı tesbih etmelerini işaretle bildirdi (Meryem, 19/11). İnsanlarla konuşamaması, ona bir ceza değil, bir müjdenin işaretiydi. Bu üç gün boyunca Rabbini çokça andı.", "Hikâyenin en güzel yanı, duanın hiçbir zaman geç kalmamasıdır. Kemikleri zayıflamış, saçları ağarmış bir adam, yıllardır dua ettiği hâlde, Rabbinin kapısından eli boş dönmediğini söylüyordu. Dualar bazen yıllarca beklemek ister; ama bekleyenin kapısı kapanmaz."], "ibret": "Dua etmek için geç kalınmış bir yaş yoktur. Allah'a gizlice açılan eller, hiçbir zaman boş dönmez; bazen cevap, ummadığımız bir zamanda ve ummadığımız bir güzellikte gelir.", "kaynak": "Âl-i İmrân Sûresi, 3/37-41; Meryem Sûresi, 19/2-11"}, {"no": 3, "baslik": "Kâbe'yi Yükselten Baba ile Oğul", "tur": "kaynakli", "paragraflar": ["Yıllar geçmiş, İbrahim (a.s.) ile oğlu İsmail (a.s.) Mekke'de yeniden bir araya gelmişti. İbrahim bir gün oğluna şöyle dedi: “Allah bana burada bir ev yapmamı emretti.” İsmail cevap verdi: “Rabbin sana ne emrettiyse onu yap.” İbrahim: “Bana yardım eder misin?” diye sordu. İsmail: “Sana yardım ederim” dedi. İbrahim etrafa göre biraz yüksek olan bir tepeciği işaret ederek, “Burada” dedi. Bu sözleri, İbn Abbas'ın (r.a.) rivayet ettiği ve Buhârî'nin kitabına aldığı uzun bir hadisin son kısmından öğreniyoruz.", "Böylece baba ile oğul, o kutlu evin temellerini yükseltmeye başladılar. İsmail taş getiriyor, İbrahim de taşları örüyordu. Duvarlar yükseldikçe İbrahim'in boyu yetmez oldu. Bunun üzerine İsmail bir taş getirip babasının önüne koydu; İbrahim onun üzerine çıkıp duvarı örmeye devam etti, İsmail de ona taşları uzattı. Bu taş, bugün Makam-ı İbrahim diye anılır.", "Çalışırken ikisi de dua ediyordu. Kur'an şöyle anlatır: “İbrahim ve İsmail, Kâbe'nin temellerini yükseltirken: ‘Rabbimiz! Bizden kabul buyur. Şüphesiz sen işitirsin, bilirsin’ dediler.” (Bakara, 2/127) Duanın içinde bir telaş, bir pazarlık yoktur; yalnızca bir güven vardır. İki insan Kâbe'yi inşa ediyor, ama onu yapmak için değil, Allah'ın kabul etmesi için çalışıyordu. “Bizden kabul et” sözü, en büyük emeğin bile ancak Allah'ın kabulüyle bir değer kazandığını gösterir.", "Duaları burada bitmedi. Şöyle devam ettiler: “Rabbimiz! Bizi sana teslim olmuş kıl; soyumuzdan da sana teslim olmuş bir ümmet kıl. Bize ibadet yollarımızı göster, tövbemizi kabul et. Şüphesiz sen tövbeyi çok kabul edensin, çok merhametlisin.” (Bakara, 2/128)", "Sonra duaları, kendilerinden sonra gelecek nesillere uzandı: “Rabbimiz! Onların içinden, kendilerine senin âyetlerini okuyacak, onlara Kitab'ı ve hikmeti öğretecek ve onları arındıracak bir peygamber gönder. Şüphesiz sen mutlak güç sahibisin, hüküm ve hikmet sahibisin.” (Bakara, 2/129)", "Bu duadan biraz önceki ayette Kâbe'nin değeri de anlatılır: “Hani biz Beyt'i insanlar için bir toplanma yeri ve güvenli bir yer kılmıştık. Siz de İbrahim'in makamından kendinize bir namaz yeri edinin. İbrahim ve İsmail'e: ‘Evimi tavaf edenler, orada kalanlar, rükû ve secde edenler için temiz tutun’ diye emretmiştik.” (Bakara, 2/125)", "Bu sahnede bir baba ve oğul, aynı işin başında yan yanadır. Taşı İsmail taşıyor, duvarı İbrahim örüyor; ama ikisi de aynı niyetle çalışıyor. Hiçbiri bir diğerinin işini küçük görmüyor. Üstelik ikisinin duası yalnızca kendi nesilleri için değil, sonradan gelecek bütün topluluk içindi.", "Bugün Kâbe'ye yönelen milyonlarca insan, o iki insanın dua ve emeğiyle yükselen bir binaya bakıyor. Yapılanın büyüklüğü, taşların sayısında değil; “Bizden kabul et” diyen yüreklerin samimiyetinde gizliydi."], "ibret": "En büyük işi bile Allah rızası için yapmak, ardından kabul etmesi için dua etmektir. Samimi bir emek ve içten bir dua, nesillerden nesillere uzanan bir hayrın başlangıcı olabilir.", "kaynak": "Bakara Sûresi, 2/125-129; Buhârî, Enbiyâ, 9 (3364-3365)"}, {"no": 4, "baslik": "Göğsümü Genişlet", "tur": "kaynakli", "paragraflar": ["Musa'nın (a.s.) haberi sana geldi mi? Kur'an hikâyeyi böyle bir soruyla başlatır (Tâhâ, 20/9). Musa, Medyen'deki süresini tamamlamış, ailesiyle birlikte yola çıkmıştı (Kasas, 28/29). Müfessirlere göre gece idi. Uzakta bir ateş gördü ve ailesine şöyle dedi: “Siz burada durun. Ben bir ateş gördüm; belki ondan size bir ateş parçası getiririm ya da ateşin başında bir yol gösterici bulurum.” (Tâhâ, 20/10)", "Ateşe vardığında kendisine seslenildi: “Ey Musa! Ben senin Rabbinim. Pabuçlarını çıkar; çünkü sen kutsal vadi Tuvâ'dasın. Ben seni seçtim; şimdi vahyolunanı dinle.” (Tâhâ, 20/11-13) Biz bu sahnede ne bir ateşin ne bir sesin ayrıntısına giriyoruz; Kur'an hangi ifadeyle anlattıysa onunla yetiniyoruz.", "Bu sırada Musa'ya asası da gösterildi. Elindeki asa, Allah'ın emriyle bir yılana dönüştü ve yine asa oldu. Elini koynuna soktuğunda, el hastalık olmadan bembeyaz çıktı. Bunlar, Musa'ya verilen iki mucizeydi. Sonra Allah ona görevini bildirdi: “Firavun'a git; çünkü o azmıştır.” (Tâhâ, 20/24)", "Musa görevin ağırlığını hissetti. Karşısında koca bir imparatorluğun hükümdarı vardı. Ne bir ordusu ne de yanında gücü vardı. Ama güçlü bir iman ve tevekkül vardı. Ve Allah'a şöyle yalvardı: “Rabbim, göğsümü genişlet; işimi kolaylaştır; dilimdeki düğümü çöz ki sözümü anlasınlar.” (Tâhâ, 20/25-28)", "Musa'nın duasında üç ayrı istek vardır. Önce kalbini genişletmesini istedi; çünkü sabır ve huzur, söz söylemekten önce gelir. Sonra işini kolaylaştırmasını diledi. Ardından dilindeki düğümün çözülmesini istedi. Müfessirler bu düğümün sebebine dair rivayetler aktarır; ama bunlar Kur'an'da yoktur ve kesin değildir. Önemli olan, Musa'nın bu eksikliğini gizlemek yerine Allah'a arz etmesidir.", "Daha sonra şöyle devam etti: “Ailemden bana bir yardımcı ver: Kardeşim Harun'u. Onunla gücümü pekiştir ve onu işime ortak et ki seni çokça tesbih edelim ve seni çokça analım. Şüphesiz sen bizi görmektesin.” (Tâhâ, 20/29-35) Musa tek başına yola çıkmak istemedi. Yardımcısını bile dua ile istedi.", "Dikkat edelim: Musa bu duada ne büyük bir kudret ne de bir mucize istedi. Yalnızca kalbinin genişlemesini, işinin kolaylaşmasını, sözünün anlaşılmasını ve yanında bir kardeş bulunmasını diledi. Her biri, bir insanın görevi taşımak için ihtiyaç duyduğu en insani şeylerdir: huzur, kolaylık, anlaşılmak ve yalnız kalmamak.", "Allah'ın cevabı kısa ve sıcaktı: “Ey Musa! İsteğin sana verildi.” (Tâhâ, 20/36) Sonra Allah, Musa'ya daha önceki lütuflarını da hatırlattı: “Andolsun ki sana bir defa daha lütufta bulunduk.” (Tâhâ, 20/37) Musa, hiçbir şeyini yalnız başına yaşamamıştı; Allah onu hep gözetmişti.", "Bu dua, bugün de pek çok insanın kapısını çaldığı bir dua oldu. Zor bir imtihan, bir sınav, bir konuşma, bir görev öncesinde “Rabbim, göğsümü genişlet” diyen herkes, aslında Musa'nın sesini tekrar eder. Çünkü gerçek güç, işi kolaylaştıranın Allah olduğunu bilmekten gelir."], "ibret": "Zor bir işe başlarken önce gönlün genişlemesini istemek gerekir. Allah'a yardım için yönelmek zayıflık değil, güçlerin en büyüğüne dayanmaktır; O, kulunun isteğinin güzelini verir ve işi kolaylaştırır.", "kaynak": "Tâhâ Sûresi, 20/9-37; Kasas Sûresi, 28/29-35"}, {"no": 5, "baslik": "Mağarada Kalan Üç Kişi", "tur": "kaynakli", "paragraflar": ["Üç kişi yolculuğa çıkmıştı. Yolda yağmura yakalandılar ve sığınacak bir yer ararken bir mağara buldular. Hepsi içeri girdiği sırada, dağdan koca bir kaya yuvarlandı ve mağaranın ağzını tamamen kapattı. Peygamber Efendimizin (s.a.v.) anlattığı bu olayı Abdullah b. Ömer (r.a.) rivayet eder.", "Kayayı kıpırdatmak imkânsızdı. Biri şöyle dedi: “Buradan kurtulmamızın tek yolu var: Allah için yaptığınız iyi amellerinizi vesile edip dua etmek.” Üçü de bu fikirde birleşti.", "Birincisi şöyle yakardı: “Allahım! Benim çok yaşlı bir anne babam vardı. Ben onlardan önce ne çocuklarıma ne ailemize süt içirirdim. Bir gün ağaç aramaya uzağa gittim ve akşam eve gelmeden önce onlar uyumuştu. Sütü sağdım ve yanlarına getirdim. Onları uyandırmak istemedim, onlardan önce çocuklara içirmeyi de doğru bulmadım. Süt kabı elimde sabaha kadar başlarında bekledim. Çocuklar ayaklarımın dibinde ağlıyordu. Allahım! Bunu yalnız senin rızan için yaptığımı biliyorsan, bizi içinde bulunduğumuz durumdan kurtar.” Kaya biraz açıldı, ama çıkmaya yetmedi.", "İkincisi şöyle dua etti: “Allahım! Amcamın kızını çok severdim. Haram olan bir şeye yaklaşacakken o bana ‘Allah'tan kork’ dedi; ben de Allah korkusuyla ondan vazgeçtim. Allahım! Bunu yalnız senin rızan için yaptığımı biliyorsan, bizi bu durumdan kurtar.” Kaya biraz daha açıldı, ama yine de çıkamıyorlardı. Bu kısım hadiste çok örtülü anlatılır; biz de ayrıntıya girmiyoruz. Hikâyenin ağırlığı, günahtan yalnızca Allah korkusuyla vazgeçmektedir.", "Üçüncüsü şöyle dedi: “Allahım! Birkaç işçi tutmuştum ve hepsinin ücretini vermiştim. Yalnız biri ücretini almadan gitmişti. Ben onun hakkını işlettim ve mal çoğaldı. Bir süre sonra o işçi geldi ve ‘Ey Allah'ın kulu, hakkımı ver’ dedi. Ona: ‘Gördüğün bütün develer, sığırlar, koyunlar ve çobanlar senindir’ dedim. ‘Ey Allah'ın kulu, benimle alay etme’ dedi. ‘Alay etmiyorum’ dedim. Hepsini aldı, hiçbir şey bırakmadı. Allahım! Bunu senin rızan için yaptığımı biliyorsan, bizi bu durumdan kurtar.” Bu duadan sonra kaya tamamen açıldı ve üçü de mağaradan çıkıp yollarına devam ettiler.", "Bu üç dua, üç ayrı iyiliği anlatır: Anne babaya hizmet, haramdan sakınma ve emanete riayet. Ama ortak bir yanları vardır: Üçü de yalnızca Allah için yapılmıştı. Hiçbiri bir ödül beklemiyordu; her biri gösterişten uzak, sessizce yapılmıştı. Mağaradaki dar yerde, bu gizli iyilikler birer dua oldu.", "Dikkat çeken bir ayrıntı daha vardır: Hiçbiri “Biz iyi insanlarız” demedi. Her biri yalnızca bir iyiliğini hatırladı ve onu Allah'a arz etti. Böylece kayanın açıldığını gördüler. İyilik, geçmişte yapıldığında bitmiş sayılmıyor; en zor anda yeniden bir kapı oluyordu."], "ibret": "Gizlice yapılan ve yalnızca Allah için olan iyilikler, en zor anda insanın imdadına yetişir. Samimi bir iyilik, zamanı geldiğinde bir dua olur ve kapıları açar.", "kaynak": "Buhârî, Enbiyâ, 53 (3465); Edeb, 5 (5974); İcâre (2272); Müslim, Zikir, 100 (2743)"}, {"no": 6, "baslik": "Ümmü Seleme'nin Musibet Duası", "tur": "kaynakli", "paragraflar": ["Ümmü Seleme (r.a.) o gün çok yalnızdı. Çok sevdiği eşi Ebû Seleme vefat etmişti. Siyer kitaplarında anlatıldığına göre bu çift hicret yolculuğunda bir süre ayrı düşmüş, daha sonra Medine'de kavuşmuştu; şimdi ise kalıcı bir ayrılık yaşıyordu. Ümmü Seleme'nin başında, geride kalan yetim çocukları vardı.", "Ümmü Seleme'nin asıl adı Hind'dir. Kureyş'in Mahzûm koluna mensuptu. Ebû Seleme ile birlikte ilk hicret edenler arasında yer almıştı ve ikisi İslam yolunda pek çok zorluğa birlikte katlanmıştı. Bu yüzden ayrılığı, yalnızca bir eşin değil, bir yol arkadaşının kaybıydı.", "Böyle bir zamanda insan, ne yapacağını bilemez. Ümmü Seleme ise Peygamber Efendimizden (s.a.v.) öğrendiği bir sözü hatırladı. Resûlullah şöyle buyurmuştu: “Bir Müslümana bir musibet erişir de Allah'ın emrettiği gibi şöyle derse: ‘Biz Allah'a aidiz ve O'na döneceğiz. Allahım! Musibetimde bana ecir ver ve bana ondan daha hayırlısını ver’, Allah mutlaka ona ondan daha hayırlısını verir.”", "Bu söz, Bakara Sûresi'ndeki bir ayete dayanır: “Onlar, başlarına bir musibet geldiğinde: ‘Biz Allah'a aidiz ve O'na döneceğiz’ derler. İşte Rablerinden bağışlamalar ve rahmet hep onlaradır. Doğru yolu bulanlar da onlardır.” (Bakara, 2/156-157) Ümmü Seleme bu sözü okumaya başladı.", "Ayetin hemen öncesinde şöyle buyurulur: “Andolsun, sizi biraz korku, açlık, mallardan, canlardan ve ürünlerden eksiltmeyle imtihan edeceğiz. Sabredenleri müjdele.” (Bakara, 2/155) Yani musibet, Kur'an'a göre hayatın içinde bekleyen bir imtihandır; müminin cevabı ise sabır ve teslimiyettir.", "Ama okurken içinden bir düşünce geçti: “Ebû Seleme'den daha hayırlı kim olabilir?” Çünkü eşi, ilk hicret eden ev halkından biriydi; Ümmü Seleme için onun yeri doldurulamazdı. Yine de duaya devam etti, sözlerini yarıda bırakmadı. Böyle bir düşünceye rağmen duayı sürdürmesi, onun güvenini gösterir.", "Dua, hemen değil, bir süre sonra karşılığını buldu. Peygamber Efendimiz, Ümmü Seleme'ye evlenme teklifinde bulundu. Ümmü Seleme, bir zamanlar “Ondan daha hayırlısı kim olabilir?” diye düşündüğü hâlde, Allah'ın ona Resûlullah'ı bir eş olarak vermesine şahit oldu. Bu hadis, Müslim'in Cenâiz bölümünde Ümmü Seleme'nin kendi ağzından nakledilir.", "Evlilik teklifinin ayrıntıları, Ümmü Seleme'nin verdiği cevaplar ve konuşmalar bazı rivayetlerde farklı biçimlerde anlatılır; biz bu konuya girmiyoruz. Bizim için önemli olan, duanın nasıl okunduğu ve nasıl karşılık bulduğudur.", "Bu kıssada dikkat çeken şey şudur: Ümmü Seleme, duasının ne şekilde kabul edileceğini bilmiyordu. Kalbinden geçen bir şüpheye rağmen duasını sürdürdü. Allah'ın verdiği, onun hayal ettiği bir şey değil, hiç düşünmediği bir iyilikti. Dua, hep istediğimizi vermez; çoğu zaman istediğimizden daha hayırlısını verir.", "Musibet anında “Biz Allah'a aidiz ve O'na döneceğiz” demek, acıyı inkâr etmek değildir. Acıyı Allah'ın huzuruna götürmektir. Yitirilen şeyin gerçek sahibinin Allah olduğunu, bize emanet verildiğini ve bir gün hepimizin O'na döneceğini hatırlamaktır."], "ibret": "Musibet anında “Biz Allah'a aidiz ve O'na döneceğiz” diyen kalp, acısını Rabbine teslim eder. Bu teslimiyetin karşılığı, çoğu zaman beklediğimizden daha güzel ve daha hayırlı olur; dua boşa gitmez.", "kaynak": "Bakara Sûresi, 2/155-157; Müslim, Cenâiz, 3-5 (918)"}, {"no": 7, "baslik": "Cuma Günü Yağmur Duası", "tur": "kaynakli", "paragraflar": ["Medine kurak bir dönemden geçiyordu. Kıtlık, insanları, hayvanları ve toprağı yoruyordu. Bir Cuma günü Peygamber Efendimiz (s.a.v.) minberde hutbe okuyordu. Bu sırada ayağa bir adam kalktı. Enes b. Mâlik'in (r.a.) anlattığına göre bu bir bedeviydi. Dedi ki: “Ey Allah'ın Resulü! Mallar helak oldu, aile aç kaldı. Allah'a dua et de bize yağmur versin.”", "Böyle zamanlarda insanın aklına ilk gelen, yönünü Allah'a çevirmektir. Medineliler de çaresiz kaldıklarında Peygamberimizin dua etmesini istediler. Bu istek, Müslümanların birbirinden dua istemesinin ve salih bir kimsenin duasına sığınmasının da güzel bir örneğidir.", "Peygamberimiz ellerini kaldırdı. Enes şöyle anlatır: “O gün gökte hiçbir bulut göremiyorduk. Canım elinde olan Allah'a yemin ederim ki, daha ellerini indirmeden dağlar gibi bulutlar toplanmaya başladı. Minberden inmeden yağmur, sakalından damlıyordu.” Yağmur o gün, ertesi gün, sonraki gün ve gelecek Cuma'ya kadar yağdı.", "Peygamberimiz yağmuru kendi sözüyle değil, Allah'tan isteyerek çağırdı. Yağmur duası, bu açıdan Allah'ın dilemesine teslim olmayı da içerir. Ne bulut ne rüzgâr, ne de yağmurun miktarı kimsenin elinde değildi; kulun elinde yalnızca dua vardı.", "Bu, çok güzel bir sahneydi. Çöldeki insanlar, uzun zamandır beklenen yağmuru görüyordu. Ama sonra bir şey oldu. Gelecek Cuma günü, Peygamberimiz yine hutbe okurken, bir adam kalktı. Rivayetlerde bu kişinin önceki Cuma gelen adam mı yoksa başkası mı olduğu konusunda farklılık vardır; biz de ona “bir adam” diyoruz.", "Bu defa adam şöyle dedi: “Ey Allah'ın Resulü! Evler yıkıldı, mallar boğuldu. Allah'a dua et de yağmuru bizden kessin.” Yağmur, bir hafta önce rahmetken, şimdi bir sıkıntı hâline gelmişti. Peygamber Efendimiz yine ellerini kaldırdı.", "Bu defa şöyle dua etti: “Allahım! Etrafımıza yağdır, üzerimize değil. Allahım! Tepelere, yığınlara, vadilere ve ağaçlık yerlere yağdır.” Eliyle hangi yöne işaret ettiyse bulutlar oradan açıldı ve şehrin etrafına çekildi. Enes şöyle devam eder: “Bulutlar Medine'nin çevresinde bir taç gibi kaldı; biz de güneşin altında yürüyerek çıktık.” Bu rivayet, Buhârî'nin İstiskâ bölümünde ve Müslim'in İstiskâ bölümünde yer alır.", "Bu hadis, duanın bir nimeti çağırdığını, aynı zamanda dozunu da istediğini gösterir. İlk Cuma, kıtlığın yarattığı bir ihtiyaç vardı; ikinci Cuma ise bolluk bir yük hâline gelmişti. Peygamberimiz her iki durumda da aynı yolu seçti: Allah'a yöneldi. Ne yağmuru isteyerek bir şeyi zorladı ne de bolluktan sonra ona karşı çıktı. Yalnızca “Üzerimize değil, etrafımıza” dedi.", "“Etrafımıza, üzerimize değil” duası, nimetin bile zarar vermemesi için dua edilebileceğini öğretir. Bir şeyin yokluğu kadar fazlalığı da bir imtihandır. Güzel dua, bu dengeyi de Allah'tan ister: Hem rahmetin gelmesini hem de onun hayra dönüşmesini.", "Bu olayda Peygamberimizin mucizesi de görülür; ama hadisin bize bıraktığı asıl şey, ellerimizi kaldırdığımızda neyi, ne kadar istememiz gerektiğidir."], "ibret": "Güzel dua, yalnızca nimeti istemez; onun zarar vermeden hayra dönüşmesini de ister. Allah'a yönelmek, hem eksikliğin hem de fazlalığın çaresidir; kul dua eder, nimeti veren Allah'tır.", "kaynak": "Buhârî, Cum'a (933); İstiskâ (1013, 1014, 1033); Müslim, Salâtü'l-istiskâ (897)"}, {"no": 8, "baslik": "Abdest Suyunu Hazırlayan Çocuk", "tur": "kaynakli", "paragraflar": ["Küçük bir çocuğun yapabileceği iş kadar basit, ama niyeti kadar derin bir iyilik vardı bu sahnede. Abdullah b. Abbas (r.a.), Peygamber Efendimizin (s.a.v.) amcasının oğluydu. Peygamberimizin vefatında henüz on üç yaşlarında olduğu kaydedilir. Annesinin kız kardeşi Meymûne ise Peygamberimizin hanımlarından biriydi; bu yüzden Abdullah, Peygamberimizin evine gidip gelebiliyordu.", "Bir rivayete göre, Abdullah bir gece teyzesinin evinde kalmıştı. Peygamberimiz helâya girdiğinde Abdullah, kimseye bir şey söylemeden, çıkınca abdest alacağı suyu hazırlayıp koydu. Bu işi ondan kimse istememişti. O yalnızca, Resûlullah'a bir kolaylık olsun istemişti.", "Peygamberimiz abdest almak için gelince suyu hazır buldu ve sordu: “Bunu kim koydu?” Kendisine bunu yapanın Abdullah olduğu haber verildi.", "Peygamberimiz de şu duayla karşılık verdi: “Allahım! Onu dinde derin bir anlayış sahibi kıl.” Buhârî'nin Vudû bölümünde yer alan bu hadis, Müslim'de de nakledilir. Küçük bir çocuğun gösterdiği özenin karşılığı, bütün bir ömre yayılacak bir dua oldu.", "Bu duanın nasıl bir karşılık bulduğunu, İbn Abbas'ın sonraki hayatından anlıyoruz. Abdullah b. Abbas, bu çocuk büyüdüğünde ümmetin en büyük Kur'an âlimlerinden biri oldu. İlim meclislerinde ona “ümmetin âlimi” anlamına gelen “Hibrü'l-ümme” ve “Kur'an tercümanı” gibi unvanlar verildi. Sahabiler ve sonraki nesiller, Kur'an'ı anlamak için sık sık ona başvurdu.", "Hayatı boyunca ilme çok değer verdi. Peygamberimiz vefat ettikten sonra, kendisinden daha yaşlı sahabilere sorular sorarak hadisleri öğrenmeye çalıştığı anlatılır. Hz. Ömer de onu, Bedir'de bulunmuş yaşlı sahabilerin meclisine alırdı. Bu duruma itiraz edenlere Ömer, İbn Abbas'ın ilmini göstererek cevap vermiştir (Buhârî, Tefsîr, Nasr). “Tercümânü'l-Kur'ân” ve “Hibrü'l-ümme” diye anılan bu insanın ilim yolundaki ilk basamağı, bir kap suydu.", "Bunun başlangıcında ne büyük bir gösteriş, ne bir ilim meclisi, ne de bir ödül vardı. Bir çocuk, birine yardım etmek istemişti. Kimsenin görmediği, kimsenin kendisinden beklemediği bir kolaylık yapmıştı. Hadislerde bu davranışın bir dua ile ödüllendirildiğini görüyoruz.", "Böylece küçük bir iyilik, büyük bir ilmin kapısını açtı. Başka bir rivayette, Peygamberimizin onu bağrına basıp “Allahım, ona Kitab'ı öğret” diye dua ettiği de anlatılır (Buhârî, İlim, 17).", "Düşünürsek, çocuğun yaptığı şeyin kendisi çok küçüktü: Bir kap su. Ama niyeti, hizmet etmek ve bir kolaylık sunmaktı. Peygamber Efendimiz bu niyeti fark etti ve karşılığında bir duayla karşılık verdi. Bir kap su, bir ömürlük ilim yolculuğunun ilk adımı oldu.", "Dua, yalnızca kendimiz için değil, bir çocuğun geleceği için de edilebilir. Üstelik bazen en etkili dua, bir küçük iyiliğin karşılığı olarak sevgiyle söylenen kısa bir cümledir."], "ibret": "Küçük bir iyilik, bir büyüğün duasıyla bir ömre yayılabilir. Birine duyduğumuz sevgiyi dua ile ifade etmek, onun geleceğine yapılabilecek en kıymetli yatırımlardan biridir; dua, en güzel armağandır.", "kaynak": "Buhârî, Vudû, 10 (143); İlim, 17 (75); Müslim, Fezâilü's-sahâbe, 138 (2477)"}], "kapanis": "Sekiz hikâyenin hepsinde aynı gerçek vardı: Allah, kuluna yakındır ve onu işitir. Kimi zaman karanlıkta, kimi zaman bir Cuma günü, kimi zaman sessizce, kimi zaman içten bir niyazla yapılan dualar, hiçbir zaman karşılıksız kalmadı. Siz de bugün ellerinizi açtığınızda, hangi kapıya baktığınızı hatırlayın. Duada bekleyiş vardır; ama bekleyenin kapısı kapanmaz. Dua eden eller, boş dönmez.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/09/", "kapak": "../../kapak/09.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 10, "baslik": "Geçmiş Ümmetlerden İbretler", "hazir": true, "yol": "../10/index.html"}, "pdf": "../../pdf/kitap-09.pdf", "epub": "../../epub/kitap-09.epub"}</script>
