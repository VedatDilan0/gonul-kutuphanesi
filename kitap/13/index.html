<script type="application/json" id="kitap-veri">{"no": 13, "baslik": "Affetmenin Güzelliği", "tanitim": "Âdem'in tövbesinden Mekke'nin fethine, bağışlamanın ve barışın güzelliğini anlatan sekiz kaynaklı hikâye.", "onsoz": "Hepimiz yanılırız, hepimiz kırarız, hepimiz kırılırız. Bu kitaptaki sekiz hikâye, hatadan sonra kapının kapanmadığını gösteriyor. Âdem'in duasından Yusuf'un büyüklüğüne, Mekke'nin affından devesini bulan adamın sevincine kadar, tövbenin ve bağışlamanın güzelliğini birlikte okuyacağız. Gönlümüzdeki ağırlıkları bu sayfalarda bir nebze hafifletmek dileğiyle.", "hikayeler": [{"no": 1, "baslik": "Âdem ile Havva'nın Tövbesi", "tur": "kaynakli", "paragraflar": ["Cennette nimet de vardı, huzur da; yalnızca tek bir yasak vardı. Âdem (a.s.) ile eşi o güzel yurda yerleştirildiğinde Allah onlara şöyle buyurdu: “Ey Âdem! Sen eşinle birlikte cennette yerleş; dilediğiniz yerden yiyin. Yalnız şu ağaca yaklaşmayın, yoksa zalimlerden olursunuz.” (A'râf, 7/19) Ayetlerde ağacın cinsi bildirilmez. Bildirilen şey, yasağın açık ve anlaşılır olduğudur. Yasağın tek bir ağaçla sınırlı kalması, nimetin ne kadar geniş olduğunu da gösterir.", "Ama bu huzuru çekemeyen bir düşman vardı: şeytan. İkisine birden fısıldadı. “Rabbiniz size bu ağacı, ancak melek olmayasınız ya da burada ebedî kalanlardan olmayasınız diye yasakladı” dedi. Üstelik “Ben size öğüt verenlerdenim” diye yemin etti. (A'râf, 7/20-21) Kur'an bu noktada bir şeyi özellikle belirtir: Aldatılan da, tövbe eden de tek kişi değil, ikisidir. Şeytan ikisini birlikte kandırdı; sonra ikisi birlikte pişman oldu.", "Ağaçtan tadar tatmaz, üzerlerindeki nimet örtüsünün kalktığını fark ettiler. Kendilerini korumasız hissettiler ve cennet yapraklarıyla örtünmeye çalıştılar. İşte o sırada Rableri onlara seslendi: “Ben size o ağacı yasaklamamış mıydım? Şeytanın size apaçık bir düşman olduğunu söylememiş miydim?” (A'râf, 7/22) Hata olmuştu, ama kapı henüz kapanmamıştı.", "Kur'an, onların ağzından bahane değil, şu sözü nakleder: “Rabbimiz! Biz kendimize zulmettik. Eğer bizi bağışlamaz ve bize acımazsan, mutlaka ziyana uğrayanlardan oluruz.” (A'râf, 7/23) Bu cümlede suçlanacak başka biri yoktu, savunma da yoktu. Yalnızca itiraf, pişmanlık ve umut vardı. İki insan, Rablerinin merhametinden başka sığınacak bir yer olmadığını biliyordu.", "Cevap rahmetle geldi. Bakara Sûresi'nde bildirildiğine göre Âdem Rabbinden bazı sözler öğrendi ve Allah onun tövbesini kabul etti; çünkü O, tövbeleri çokça kabul eden, çok merhamet edendir. (Bakara, 2/37) Sonra şöyle buyurdu: “Hepiniz oradan inin. Benden size bir rehber gelecek; kim o rehbere uyarsa onlara korku yoktur, onlar üzülmeyeceklerdir.” (Bakara, 2/38)", "A'râf Sûresi bu inişin yeni hayatını da anlatır. Allah, yeryüzünde onlar için bir yurt ve belli bir süreye kadar yararlanacakları nimetler bulunduğunu bildirdi: “Orada yaşayacaksınız, orada öleceksiniz ve oradan çıkarılacaksınız.” (A'râf, 7/24-25) Yani dünya, bir sürgün yeri olarak değil, rehberlikle donatılmış bir imtihan yurdu olarak tanıtıldı.", "Böylece insanın yeryüzü yolculuğu, bir cezayla değil, bağışlanma ve rehberlik vaadiyle başladı. Bu hikâyede yürek ısıtan nokta şu: İlk insan da yanıldı, ama bize miras kalan şey yanılgı değil, tövbe duası oldu. Düşmanın hilesi bir fısıltıyla başlar; yasak olanı süslü göstermek onun işidir. Ama düşen insanın elinden tutacak bir Rab vardır ve O'na dönmek için hiçbir aracıya gerek yoktur."], "ibret": "Hata yapmak insanın yaratılışında vardır; ama hatada ısrar etmek kibirdendir. Tövbe kapısı her zaman açıktır. Yeter ki insan, “Kendime yazık ettim” diyebilsin ve utanmadan Rabbine dönsün.", "kaynak": "A'râf Sûresi, 7/19-25; Bakara Sûresi, 2/35-38"}, {"no": 2, "baslik": "Yusuf Kardeşlerini Affediyor", "tur": "kaynakli", "paragraflar": ["Yıllar önce kuyuya attıkları kardeşleriyle bir kapıda karşılaşacaklarını hiç düşünmemişlerdi. Yusuf (a.s.) artık Mısır'da yetkili bir yöneticiydi. Kıtlık uzak diyarlara kadar uzanmıştı ve insanlar yiyecek almak için Mısır'a geliyordu. Bir gün Yusuf'un huzuruna gelenler arasında kendi kardeşleri vardı. Yusuf onları hemen tanıdı; onlar ise onu tanıyamadı. (Yûsuf, 12/58) Kardeşlerin adları ve yolculuğun ayrıntıları ayetlerde yoktur.", "Yusuf onlara yüklerini hazırlattı ve şunu söyledi: “Babanızdan olan kardeşinizi bana getirin. Getirmezseniz benden size ölçü yok.” (Yûsuf, 12/59-60) Verdikleri sermayeyi de gizlice yüklerinin arasına koydurdu; belki ailelerine dönünce fark eder, yeniden gelirlerdi. (Yûsuf, 12/62) Kardeşler babalarını razı etmeye çalışacaklarını söyleyip döndüler. Sonra küçük kardeşi alıp yeniden geldiler.", "Yusuf, öz kardeşini bir kenara çekip ona sırrını fısıldadı: “Ben senin kardeşinim; onların yaptıklarına üzülme.” (Yûsuf, 12/69) Sonra Allah'ın kendisine öğrettiği bir tedbirle kardeşini yanında alıkoydu. Kur'an bunu açıkça belirtir: “Biz Yusuf'a böyle bir tedbir öğrettik.” (Yûsuf, 12/76) Kardeşler çaresiz kaldı: “Ey Aziz! Onun çok yaşlı bir babası var; onun yerine bizden birini al.” Yusuf, haksız yere başkasını alamayacağını söyledi. (Yûsuf, 12/78-79)", "Kardeşlerin en büyüğü, babasına ne yüzle döneceğini bilemeyip Mısır'da kalmaya karar verdi. (Yûsuf, 12/80) Diğerleri eve dönüp olanı anlattı; babaları sabrettiği hâlde yeniden yola çıkmalarını istedi. Yeniden Mısır'a gelen kardeşler bu kez çok alçak gönüllüydü: “Ey Aziz! Bize ve ailemize bir darlık dokundu; değersiz bir sermaye ile geldik. Ölçüyü tam yap, bize de sadaka ver. Allah sadaka verenleri mükâfatlandırır.” (Yûsuf, 12/88)", "İşte o an Yusuf'un yüreğinde tutulan söz dile geldi: “Siz cahilken Yusuf'a ve kardeşine neler yaptığınızı biliyor musunuz?” (Yûsuf, 12/89) Kardeşler şaşkınlıkla baktı: “Yoksa sen Yusuf musun?” “Ben Yusuf'um, bu da kardeşim” dedi. “Allah bize lütufta bulundu. Kim Allah'a karşı gelmekten sakınır ve sabrederse, Allah iyilik edenlerin ödülünü zayi etmez.” (Yûsuf, 12/90)", "Kardeşlerinin söyleyecek sözü kalmamıştı: “Allah seni bize üstün kıldı; biz gerçekten hatalıymışız.” (Yûsuf, 12/91) Yusuf'un cevabı, kuyudan da, yıllardan da büyüktü: “Bugün size kınama yok. Allah sizi bağışlasın; O, merhametlilerin en merhametlisidir.” (Yûsuf, 12/92) Babaları Yakup'un hüznü ve gözlerinin açılışı ayrı bir hikâyenin konusudur. Sonunda bütün aile Mısır'da bir araya geldi.", "Yusuf ebeveynini tahtın üzerine oturttu ve şöyle dedi: “Babacığım, işte bu, önceden gördüğüm rüyanın gerçekleşmesidir. Rabbim onu gerçek yaptı. Şeytan benimle kardeşlerimin arasını bozduktan sonra, beni zindandan çıkarırken ve sizi çölden getirirken bana lütufta bulundu.” (Yûsuf, 12/100) Dikkat edilirse Yusuf bu sözünde suçu kardeşlerinin yüzüne vurmaz. “Şeytan aramızı bozduktan sonra” der. Acı geçmişi, usulca kapatır."], "ibret": "Gücü eline geçen insan için en büyük sınav, intikam alabilecekken bağışlayabilmektir. Yusuf suçu kardeşlerinin yüzüne vurmadı, geçmişi kapattı. Affeden yalnız karşısındakini değil, kendini de hafifletir.", "kaynak": "Yûsuf Sûresi, 12/58-82, 88-92, 99-100"}, {"no": 3, "baslik": "Ebubekir ve Mistah", "tur": "kaynakli", "paragraflar": ["Bazı kırgınlıklar, insanın iyilik ettiği ve yakın bildiği birinden geldiği için daha çok yaralar. Ebubekir (r.a.) de böyle bir kırgınlık yaşadı. Mistah, onun yoksul bir akrabasıydı. Ebubekir uzun zamandır onun geçimine yardım ediyordu. Bu iyiliğin karşılığını beklemezdi; yakınlarına karşı eli açık biriydi.", "Günlerden bir gün Medine'de, Peygamber Efendimizin (s.a.v.) hanımı Hz. Âişe hakkında çirkin bir dedikodu yayıldı. Âişe, Ebubekir'in kızıydı. Dedikoduyu yayanların arasına Mistah da karışmıştı. Konunun ayrıntılarına girmeyelim; bilinmesi gereken, bu sözün Peygamber Efendimizin ailesini ve Ebubekir'in evini derinden yaralamış olmasıdır. Sonra Allah, Âişe'nin temiz olduğunu bildiren ayetler indirdi. (Nûr, 24/11-20)", "Mistah da sıradan biri değildi. Hadis rivayetlerinde, Mekke'den hicret eden Müslümanlardan olduğu ve Bedir'de bulunduğu bildirilir. Belki de bu yüzden Ebubekir'in canı daha çok yandı. Yoksul bir akrabaya yıllarca el uzatmış, bir de onu kızına yapılan haksızlığın içinde görmüştü. Haklı olduğunu düşünmek için pek çok sebebi vardı.", "Yalan ortaya çıkmıştı, ama Ebubekir'in içindeki yara kapanmadı. Hadiste anlatıldığına göre şöyle yemin etti: “Vallahi, Âişe hakkında söylediklerinden sonra Mistah'a bir daha hiçbir şey vermeyeceğim.” Bunu anlamak zor değil. Kızına yapılan haksızlık, bir babanın yüreğinde derin bir iz bırakmıştı.", "Tam bu sırada Allah şu ayeti indirdi: “İçinizden fazilet ve servet sahibi olanlar, akrabaya, yoksullara ve Allah yolunda hicret edenlere bir şey vermeyeceklerine yemin etmesinler. Affetsinler, hoş görsünler. Allah'ın sizi bağışlamasını istemez misiniz? Allah çok bağışlayandır, çok merhamet edendir.” (Nûr, 24/22) Ayet, kırgınlığı küçümsemiyordu. Yalnızca kalbe bir soru soruyordu.", "Ebubekir bu ayeti dinleyince cevabı hemen verdi: “Evet, vallahi ben Allah'ın beni bağışlamasını istiyorum.” Mistah'a yaptığı yardıma geri döndü. Sonra da şöyle yemin etti: “Vallahi, bunu ondan bir daha asla kesmeyeceğim.” Böylece daha önce söylediği söz, daha güzel bir sözle değişti. Hadis rivayetinde Mistah'ın bu sırada neler hissettiğine dair bir bilgi yoktur; ama yardım eli yeniden uzanmıştı.", "Bu sahnede çarpıcı olan, ayetin Ebubekir'e “Sen haksızsın” dememesidir. Onun üzüntüsünü gören Rabbi, yalnızca daha yüksek bir ölçüyü gösterir. Hata yapan akrabanın yardımını kesmek, insana doğal gelen bir tepki olabilir. Ama Allah'tan bağışlanmak isteyen biri, kendisi de bağışlamayı öğrenmelidir.", "Âişe'nin temiz olduğunu bildiren ayetlerin ardından, bir babanın gönlüne dokunan bu ayet de indirilmişti. Hem kızına yapılan haksızlık, hem de akrabasının o haksızlığa karışmış olması Ebubekir için ağırdı. Yine de o, bu ağırlığı bağışlamayla hafifletmeyi seçti. Ebubekir'in büyüklüğü, haklı olduğu hâlde kırgınlığını bir kenara bırakabilmesiydi. Mistah'a uzattığı el, o günden sonra yalnızca bir yardım değil, bir bağışlama armağanı oldu."], "ibret": "Haklı olmak, kırıcı olmayı asla gerektirmez. Allah'tan bağışlanmak isteyen kimse, kendi kırgınlığını bırakıp başkasını bağışlamayı da öğrenmelidir. Affetmek, çoğu zaman bağışlayanın gönlüne de ferahlık olur.", "kaynak": "Nûr Sûresi, 24/22; Buhârî, Megâzî (4141); Müslim, Tevbe (2770)"}, {"no": 4, "baslik": "Mescide Bağlanan Esir: Sümâme", "tur": "kaynakli", "paragraflar": ["Medine'de mescidin direklerinden birine bağlanmış bir adam düşünün. Adı Sümâme b. Üsâl'dı; Yemâme taraflarında yaşayan Hanîfe oğullarının ileri gelenlerinden biriydi. Peygamber Efendimizin (s.a.v.) Necid tarafına gönderdiği bir süvari birliği onu yakalayıp Medine'ye getirmişti. Şimdi o, ne olacağını bilmeden, mescidin bir köşesinde bekliyordu.", "Peygamber Efendimiz yanına geldi ve sordu: “Ne düşünüyorsun, ey Sümâme?” Sümâme cevap verdi: “Ey Muhammed, bende bir hayır var. Eğer beni öldürürsen, kanı yerde kalmayacak birini öldürmüş olursun. Eğer bağışlarsan, şükredecek birine iyilik etmiş olursun. Eğer mal istiyorsan, dilediğini iste, sana verilir.” Peygamberimiz onu o hâlde bıraktı ve yanından ayrıldı.", "Ertesi gün yine geldi, aynı soruyu sordu: “Ne düşünüyorsun, ey Sümâme?” Sümâme önceki sözünü tekrarladı. Peygamberimiz ona bir şey söylemeden gitti. Üçüncü gün aynı soru, aynı cevap. Sonunda yanındakilere dönüp şöyle buyurdu: “Sümâme'yi salıverin.” Sümâme'nin ne bir şart ileri sürmesi, ne bir pazarlık etmesi, ne de kendini savunması gerekmişti. Üç gün boyunca ona yöneltilen tek şey, bir soru ve bir bekleyişti.", "Serbest kalan Sümâme hemen yola koyulmadı. Mescidin yakınındaki bir hurmalığa gitti, yıkandı ve temizlendi. Sonra mescide geri döndü ve şöyle dedi: “Allah'tan başka ilah olmadığına ve Muhammed'in Allah'ın elçisi olduğuna şahitlik ederim.” Bir esirden bir kardeşe geçiş, böylece birkaç adımda gerçekleşti.", "Sonra Peygamber Efendimize döndü ve içindeki değişimi şu sözlerle anlattı: “Ey Muhammed! Vallahi yeryüzünde senin yüzünden daha sevimsiz bir yüz yoktu; şimdi senin yüzün bana yüzlerin en sevimlisi oldu. Vallahi senin dininden daha sevmediğim bir din yoktu; şimdi dinin bana dinlerin en sevimlisi oldu. Senin şehrinden daha sevimsiz bir şehir yoktu; şimdi şehrin bana şehirlerin en sevimlisi oldu.”", "Sümâme, umre yapmak üzere yola çıktığı sırada yakalanmıştı. Bunu da Peygamberimize anlattı. Peygamberimiz ona müjde verdi ve umresini yapmasını söyledi. Mekke'ye vardığında biri ona “Dininden mi döndün?” diye sorunca, “Hayır, Muhammed'le birlikte Müslüman oldum” dedi. Hadiste, Sümâme'nin Yemâme'den Mekke'ye buğday gönderilmesi konusunda aldığı bir karar da anlatılır; ama bu hikâyenin kalbi, üç günlük bekleyiştedir.", "Bu olayda her gün tekrarlanan tek bir soru var: “Ne düşünüyorsun?” Esirin kalbini kazanan, ne sert bir söz oldu ne de bir tehdit. Dinleyen, bekleyen ve sonunda hiçbir karşılık istemeden bırakan bir tavır, kapalı bir yüreği açtı. Sümâme'nin söylediği her cümle, kalbin nasıl döndüğünü tek tek gösteriyor. Düşman bellediği yüz, bir bağışlamanın ardından en sevdiği yüz oldu. Kalpler çoğu zaman tartışmayla değil, güvenle ve sabırla açılır."], "ibret": "Karşılıksız bir bağışlama, kalbi kılıçtan daha derinden değiştirebilir. Merhametle bekleyen, sabırla dinleyen insan, düşmanı bile dostuna çevirebilir. Güzel muamele, en sert kalbin bile kilidini açabilir.", "kaynak": "Buhârî, Megâzî, 70 (4372); Müslim, Cihâd ve's-siyer (1764)"}, {"no": 5, "baslik": "Mekke'nin Fethinde Genel Af", "tur": "kaynakli", "paragraflar": ["Bir zamanlar yurdundan çıkmak zorunda kalan Peygamber Efendimiz (s.a.v.), hicretten sekiz yıl sonra Mekke'ye büyük bir topluluğla döndü. Kureyşlilerin birçoğu bu günü, geçmişte yaptıklarının hesabının sorulacağı gün sanıyordu. Çünkü yıllarca Müslümanlara eziyet etmişler, onları yurtlarından ayrılmaya zorlamışlardı. Ama Peygamberimiz şehre intikam duygusuyla girmedi.", "Ebû Hüreyre'nin rivayetine göre Peygamberimiz, Mekkelilerin önde gelenlerinden Ebû Süfyân için bir güvence verdi: “Kim Ebû Süfyân'ın evine girerse güvendedir.” Başka rivayetlerde şu da bildirilir: “Kim kapısını kapatırsa güvendedir.” Ebû Dâvûd'un bir rivayetinde buna, Mescid-i Haram'a girenin de güvende olduğu eklenir. Yani Mekkeliler için üç güvenli kapı açılmıştı. Aynı rivayete göre insanlar evlerine ve Mescid-i Haram'a dağıldı.", "Aynı rivayet, o günün başka bir sahnesini de anlatır. Medineli Müslümanlar, yani ensar, Peygamberimizin Mekke'ye gösterdiği merhameti görünce kendi aralarında konuştular: “Galiba doğduğu şehre ve akrabalarına karşı yumuşadı.” Peygamberimiz onların bu sözünü öğrenince şöyle buyurdu: “Hayır! Ben Allah'ın kulu ve elçisiyim. Allah'a ve size hicret ettim. Hayatım da sizinle, ölümüm de sizinle.” Ensar ağladı ve özür diledi.", "Sonra Peygamberimiz Kâbe'ye gitti, Hacerülesved'e elini sürüp selamladı ve Kâbe'yi tavaf etti. Kâbe'nin çevresinde üç yüz altmış put vardı. İbn Mes'ûd'un anlattığına göre elindeki bir sopayla onlara dokunuyor ve şu ayeti okuyordu: “Hak geldi, batıl yok oldu. Zaten batıl yok olmaya mahkûmdur.” (İsrâ, 17/81) İnsanların yıllarca kendilerine sığındığı o taş ve tahta parçaları, aslında hiçbir güce sahip değildi. Tavafını bitirince Safâ Tepesi'ne çıktı, Kâbe'ye bakarak ellerini kaldırdı; Allah'a hamd etti ve dua etti. Zafer günü, böylece bir övünme günü değil, bir şükür günü oldu.", "Siyer kitaplarında anlatıldığına göre Kureyşliler Kâbe'nin çevresinde toplanmıştı. Peygamberimiz onlara seslendi: “Ey Kureyş topluluğu! Sizce ben size ne yapacağım?” Onlar şöyle cevap verdi: “İyilik. Sen cömert bir kardeşsin, cömert bir kardeşin oğlusun.” Bu söz, yıllarca onu yalanlayanların ağzından çıkıyordu.", "Peygamberimiz şöyle buyurdu: “Gidin, hepiniz serbestsiniz.” Bu söz sahih hadis kitaplarında yer almaz; siyer kaynaklarında anlatılır. Yüzyıllar önce Yusuf'un kardeşlerine gösterdiği büyüklüğün aynısı, bir kez daha yaşanıyordu. Yıllarca eziyet edenler, şimdi bir bağışlamanın karşısında şaşkın duruyordu.", "Bu af, bir zayıflık değildi. Hakkı olan birinin, hakkından vazgeçmesiydi. Müfessirlerin çoğuna göre Nasr Sûresi de bu fetih günlerine işaret eder: “Allah'ın yardımı ve fetih geldiği, insanların bölük bölük Allah'ın dinine girdiğini gördüğün zaman, Rabbini överek tesbih et ve O'ndan bağışlanma dile. Çünkü O, tövbeleri çok kabul edendir.” (Nasr, 110/1-3) Zaferin cevabı, kibir değil, hamd ve istiğfardı. Mekke'nin kapıları açıldı ve insanlar, yıllardır kapalı duran yüreklerinin kapısını da açmaya başladılar. İslam'ın en güzel sahnelerinden biri, kılıcın değil, bağışlamanın galip geldiği o gündür."], "ibret": "Gerçek güç, hakkını almaya hazır olduğu hâlde bağışlayabilmektir. Merhametle kazanılan gönüller, zorla kazanılanlardan çok daha kalıcıdır. Af, güçlünün zarafetidir. Zafer günü Rabbine yönelmek, kalbi kibirden korur.", "kaynak": "Müslim, Cihâd ve's-siyer (1780); Ebû Dâvûd, Harâc (3021-3022); Buhârî, Megâzî (4287); İsrâ Sûresi, 17/81; Nasr Sûresi, 110/1-3; İbn Hişâm, es-Sîre"}, {"no": 6, "baslik": "Yüz Cana Kıyan Adamın Tövbesi", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimiz (s.a.v.) bir gün sahabelere, geçmiş ümmetlerden birinin hikâyesini anlattı. Bu hikâyenin kahramanı, çok büyük günahlar işlemiş bir adamdı. Ebû Saîd el-Hudrî'nin aktardığına göre adam, doksan dokuz kişinin canına kıymıştı. Ama yıllarca süren bu karanlığın sonunda, kalbinde bir soru uyandı: Acaba tövbe kapısı hâlâ açık mıydı?", "Adam, yeryüzünün en bilgili kişisinin kim olduğunu sordu ve bir rahibe yönlendirildi. Rahibin yanına gidip derdini anlattı: “Doksan dokuz kişiyi öldürdüm. Benim için tövbe var mı?” Rahip “Hayır” dedi. Adam onu da öldürdü ve canına kıydığı insanların sayısı yüze ulaştı. Bu ayrıntı hadiste kısaca geçer, biz de burada daha fazla üzerinde durmayalım.", "Adam yine vazgeçmedi. Yeryüzünün en bilgili kişisini yeniden sordu ve bu kez bir âlime yönlendirildi. Ona şöyle dedi: “Yüz kişiyi öldürdüm. Benim için tövbe var mı?” Âlimin cevabı, adamın kalbine ilk defa su serpti: “Evet. Tövbenle arana kim girebilir?”", "Âlim devam etti: “Şu yere git. Orada Allah'a ibadet eden insanlar var; sen de onlarla birlikte Allah'a ibadet et. Memleketine dönme; çünkü orası kötü bir yerdir.” Adam yola koyuldu. Eski hayatını, eski çevresini, eski alışkanlıklarını arkasında bırakıyordu. Gönlü yeni bir sayfa açmak için yola düşmüştü. Kur'an'da Allah'ın şu müjdesi de bu hikâyenin ruhunu anlatır: “Ey kendilerine kötülük edip haddi aşan kullarım! Allah'ın rahmetinden ümit kesmeyin. Allah bütün günahları bağışlar.” (Zümer, 39/53)", "Fakat yolun yarısına geldiğinde ecel yetişti. Hadiste anlatıldığına göre adam can verirken göğsüyle gideceği yere doğru uzandı. Bu sırada rahmet melekleriyle azap melekleri onun hakkında tartıştı. Rahmet melekleri: “Bu adam tövbe etmiş, kalbiyle Allah'a yönelerek gelmişti” dedi. Azap melekleri ise: “Bu adam hiçbir hayır işlememişti” dedi.", "Bunun üzerine insan suretinde bir melek geldi ve aralarında hakem oldu. “İki yer arasındaki mesafeyi ölçün” dedi. “Hangisine daha yakınsa, o yere aittir.” Ölçtüler. Hadiste bildirildiğine göre, Allah bu iş için kötü yerin uzaklaşmasını, iyi yerin ise yaklaşmasını emretmişti. Adamın, gitmek istediği yere bir karış daha yakın olduğu görüldü ve bağışlandı.", "Bu hikâyede dikkat çeken şey, adamın günahının büyüklüğünden çok, kalbindeki dönüş arzusudur. Bir insan ne kadar geriye düşmüş olursa olsun, doğru yöne bir adım atmaya niyet ettiğinde, Allah'ın rahmeti ona yaklaşır. Rahip kapıyı kapatmaya çalıştı; âlim ise kapıyı açtı. Aslında kapı hiç kapanmamıştı.", "Peygamberimizin bu hikâyeyi sahabelere anlatması da bir öğüttür: Ümitsizlik, bir insanı günahtan daha çok uzaklaştırabilir. Oysa tövbenin ilk şartı, dönmek için bir kapı olduğuna inanmaktır."], "ibret": "Hiçbir günah, Allah'ın rahmetinden büyük değildir. İnsan ne kadar uzaklaşmış olursa olsun, doğru yöne atılan bir adım bile Allah katında değerlidir. Ümitsizlik, günahtan daha tehlikelidir.", "kaynak": "Buhârî, Enbiyâ, 54 (3470); Müslim, Tevbe (2766); Zümer Sûresi, 39/53"}, {"no": 7, "baslik": "Hudeybiye: Kazanılan Barış", "tur": "kaynakli", "paragraflar": ["Müslümanlar bir hayalle yola çıkmıştı: Kâbe'yi tavaf etmek. Peygamber Efendimiz (s.a.v.) bir umre için sahabelerle birlikte Mekke'ye doğru yürüdü. Savaşa değil, ibadete niyetliydiler. Ama Hudeybiye'ye inen geçitte devesi çöktü ve ilerlemedi. Sahabeler “Kasvâ huysuzluk etti” dediler. Peygamberimiz buyurdu: “Kasvâ huysuzluk etmedi; onu Fil'i alıkoyan alıkoydu.” Orada çok az suyu kalmış bir kuyu vardı. Peygamberimizin emriyle içine bir ok bırakıldı; su kaynamaya başladı ve herkes suya kandı.", "Peygamberimiz şöyle devam etti: “Kureyş, Allah'ın saygın kıldığı şeylere saygı göstermemi isteyen her teklifi bana yaparsa kabul ederim.” Elçiler gidip geldi. Sonunda Kureyş, Süheyl b. Amr'ı gönderdi. Antlaşma yazılmaya başlandı. Peygamberimiz katibe yazdırdı: “Bismillâhirrahmânirrahîm.” Süheyl itiraz etti: “Biz Rahman'ı tanımayız; ‘Allahım, senin adınla’ yaz.” Sahabeler bunu kabul etmek istemedi. Ama Peygamberimiz Süheyl'in istediği ifadeyi yazdırdı.", "Sonra yazdırdı: “Bu, Allah'ın Resulü Muhammed'in yaptığı anlaşmadır.” Süheyl yine itiraz etti: “Seni Allah'ın Resulü olarak tanısaydık, seni Kâbe'den alıkoymaz, seninle savaşmazdık. ‘Abdullah oğlu Muhammed’ yaz.” Peygamberimiz buna da razı oldu. Bu iki değişiklik, sahabelerin kalbinde ağır bir yük bıraktı. Peygamberimiz ise öfkeye değil, barışa yöneldi.", "Antlaşmanın şartları ağırdı: Müslümanlar o yıl umre yapmadan geri dönecek, ertesi yıl gelecekti. Mekke'den Müslüman olarak Medine'ye gelen biri geri verilecekti. Tam bu sırada Süheyl'in oğlu Ebû Cendel zincirlerle geldi. Sahabelerin gözü önünde, Müslüman bir genç, babası tarafından geri alındı. Ömer (r.a.) bu duruma dayanamadı ve Peygamberimize sorular sordu. Peygamberimiz sakin kaldı: “Ben Allah'ın Resulüyüm, O'na isyan etmem; O bana yardım eder.” Ömer, sonradan bu itirazları için pek çok iyi amel işlediğini anlatır.", "Antlaşma tamamlandı. Peygamberimiz sahabelere seslendi: “Kalkın, kurbanlarınızı kesin ve tıraş olun.” Hiçbiri kalkmadı. Üç kez tekrarladı; yine kimse yerinden kıpırdamadı. Sahabeler üzgündü. Peygamberimiz, eşi Ümmü Seleme'nin yanına gidip durumu anlattı. Ümmü Seleme dedi ki: “Ey Allah'ın Resulü! Sen dışarı çık, hiç kimseyle konuşma; kurbanını kes ve berberini çağır.”", "Peygamberimiz öyle yaptı. Hiç konuşmadan kurbanını kesti ve tıraş oldu. Bunu gören sahabeler hemen ayağa kalktı, kurbanlarını kestiler ve birbirlerini tıraş etmeye başladılar. Öyle ki üzüntüden neredeyse birbirlerini yaralayacaklardı. Bazen bin sözün yapamadığını sessiz bir örnek yapar.", "Dönüş yolunda Fetih Sûresi indi: “Biz sana apaçık bir fetih verdik.” (Fetih, 48/1) Aynı sûrede müminlerin kalplerine huzur indirildiği ve ağacın altında Resûlullah'a biat ederken Allah'ın onlardan razı olduğu bildirilir. (Fetih, 48/4, 18) Ağır görünen barış, aslında İslam'ın yayılmasının önünü açan bir başlangıçtı. Sabırla kazanılan şey, çoğu zaman kılıçla kazanılandan daha derindir."], "ibret": "Bazen en büyük kazanç, haklı olduğu hâlde geri adım atabilmektir. Sabır ve barış, ağır görünen şartların ardında bile büyük bir fetih saklayabilir. Önemli olan, acele etmemek ve kalbini Allah'a bağlamaktır.", "kaynak": "Fetih Sûresi, 48/1-4, 18; Buhârî, Şurût, 15 (2731-2732); Müslim, Cihâd ve's-siyer (1783-1785)"}, {"no": 8, "baslik": "Çölde Kaybolan Deve", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimiz (s.a.v.) bazen bir olayı değil, bir benzetmeyi anlatırdı. Bu hadiste anlattığı da gerçek bir kişiden çok, bir örnektir. İbn Mes'ûd ve Enes b. Mâlik'in aktardığı bu benzetme, tövbenin Allah katındaki değerini bir çöl sahnesiyle gözler önüne serer.", "Rivayete göre Hâris b. Süveyd, hasta yatan İbn Mes'ûd'u ziyaret etti. İbn Mes'ûd ona iki söz aktardı: biri kendi sözüydü, diğeri Peygamberimizden naklettiği. Kendi sözü, müminin günahına bakışıyla ilgiliydi: Mümin, günahını üzerine devrilecek bir dağ gibi görür. Peygamberimizden naklettiği ise bu benzetmedir: Allah, müminin tövbesinden, şimdi anlatacağımız adamın sevincinden daha çok memnun olur.", "Düşünün: Issız, bomboş bir çöl. Gökyüzünde kızgın bir güneş, ufukta tek bir gölge yok. Bir adam bu çölde yolculuk ediyor. Yanında tek bir hayvanı var: devesi. Üstelik yiyeceği de içeceği de o devenin üzerinde. Adam için o deve, hayatla arasındaki tek bağdır. Sıcakta yolda kalmış biri için su ve yiyecek, günlük bir ihtiyaç değil, hayatın kendisidir. Bu sahneyi her yolcu, hatta çölü hiç görmemiş biri bile gönlünde canlandırabilir.", "Bir ara adam dinlenmek için durur, biraz uyur. Uyandığında deve yanında yoktur. Adam hemen aramaya koyulur. Bir yana koşar, öbür yana koşar. Sıcak ve susuzluk gittikçe artar. Gücü tükenir. Sonunda şöyle der: “Ben bulunduğum yere döneyim, orada uyuyayım.” Başını koluna koyup ölümü bekler.", "Adam artık umudunu kesmiştir. Yorgunluktan gözleri kapanır. Bir süre sonra yeniden uyanır. İşte o an, başucunda devesini görür. Devenin üzerinde yiyeceği, içeceği, bütün ihtiyaçları durmaktadır. Adamın içinden taşan sevinci, tarif edilecek gibi değildir. Bir anda ölümden hayata dönmüş gibidir.", "Müslim'in başka bir rivayetinde, adamın sevinçten ne söylediğini şaşırdığı bildirilir. Dili dolaşır, yanlış bir cümle söyler: “Allahım, sen benim kulumsun, ben de senin Rabbinim.” Bu söz, bir saygısızlık değil, aşırı sevincin getirdiği bir şaşkınlıktır. Yani adam ne dediğini bilmeyecek kadar sevinmiştir.", "Peygamber Efendimiz benzetmeyi şöyle tamamladı: “Allah, kulunun tövbesine, bu adamın devesini bulmasından duyduğu sevinçten çok daha fazla sevinir.” Düşünmek bile insanı şaşırtıyor: Çölde ölümle yüz yüze gelmiş bir adamın sevinci, bir kulun dönüşüne duyulan sevincin yanında küçük kalıyor. Elbette Allah'ın sevinmesi bizim sevincimize benzemez; hadis, tövbenin Allah katındaki değerini anlatır.", "Bu hadis, tövbenin yalnızca bir kul görevi olmadığını gösterir. Dönmek isteyen birini bekleyen, onu kabul eden ve onun dönüşüne sevinen bir Rab vardır. Ne kadar uzaklaşmış olursak olalım, geri dönüş yolunun başında bizi bekleyen bir merhamet var. İşte bu yüzden hiç kimse “Artık çok geç” dememeli."], "ibret": "Allah, kulunun tövbesine, devesini çölde bulan adamın sevincinden de fazla sevinir. Dönmek için hiçbir zaman geç değildir; kapı, dönmek isteyen herkese açıktır. Yeter ki insan umudunu kaybetmesin ve bir adım atsın.", "kaynak": "Buhârî, Daavât, 4 (6308-6309); Müslim, Tevbe (2744, 2747)"}], "kapanis": "Affetmek kolay değildir; ama bu hikâyelerde onun karşılığının, kalpte açan bir ferahlık olduğunu gördük. Okuduklarımız bize şunu gösterdi: büyüklük, hakkını almakta değil, hakkından vazgeçebilmektedir. Belki bugün gönlünü almak istediğimiz biri vardır, belki de kendi hatamız için Rabbimize dönme zamanıdır. Tövbe kapısı her zaman açıktır; bağışlayan da O'dur.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/13/", "kapak": "../../kapak/13.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 14, "baslik": "Büyüklerin Öğütleri", "hazir": true, "yol": "../14/index.html"}, "pdf": "../../pdf/kitap-13.pdf", "epub": "../../epub/kitap-13.epub"}</script>
