<script type="application/json" id="kitap-veri">{"no": 8, "baslik": "Doğruluk ve Emanet", "tanitim": "Doğru sözün, korunan emanetin ve kul hakkının değerini peygamberlerin, sahabilerin ve geçmiş ümmetlerden dürüst insanların hayatından anlatan sekiz hikâye.", "onsoz": "Doğru söz, insanın en sessiz ama en güçlü sermayesidir. Güven, bir günde kurulmaz; yıllarca söylenen doğru sözlerle, geri verilen emanetlerle, ödenen borçlarla kurulur. Bu kitapta sekiz hikâye var: Safa'da Peygamberimizin doğruluğuna şahit olan Mekkeliler, Mısır'da emanete sadık kalan Yusuf, tartıyı doğru tutmayı öğütleyen Şuayb ve daha nicesi. Her birinin sonunda kaynağını ve kısa bir ibret bulacaksınız.", "hikayeler": [{"no": 1, "baslik": "Safa Tepesindeki Soru", "tur": "kaynakli", "paragraflar": ["Mekke'de bir gün, Allah'tan bir emir geldi: “En yakın akrabanı uyar.” (Şuarâ, 26/214) Siyer kitaplarına göre bu ayet, davetin yakın çevreden daha geniş bir topluluğa açılmasının başlangıcı oldu. Peygamber Efendimiz (s.a.v.) bu emri yerine getirmek üzere harekete geçti.", "Safa tepesine çıktı ve yüksek sesle seslendi: “Yâ sabâhâh!” Bu, Araplarda sabah baskınını haber veren, herkesi hemen toplayan bir çağrıydı. Kureyş'in kolları bu sese koştu. Gelemeyen kimse, yerine bir adam gönderdi. Resûlullah kabileleri tek tek anarak çağırmıştı; hepsi tepenin eteğinde toplandı.", "Peygamberimiz onlara bir soru sordu: “Söyleyin bana, şu vadinin arkasında bir süvari birliği var ve size baskın yapmak üzere diyorsam, bana inanır mısınız?” Cevap tek bir ağızdan geldi: “Evet. Senden hiç yalan duymadık.” Şüpheye yer bırakmayan bu sözler, Mekke'nin onun hakkında verdiği hükümdü.", "Bu cevap boşuna verilmemişti. Peygamberimiz yıllardır bu şehirde yaşıyordu. Kimseyi aldatmamış, bir söz verince tutmuş, kendisine bırakılan emanetlere el sürmemişti. Mekkeliler ona “el-Emîn”, yani güvenilir kişi diyorlardı. Siyer kitaplarına göre Kâbe onarılırken kabileler arasında çıkan bir anlaşmazlıkta, onun geldiğini görenler “İşte el-Emîn geldi, razıyız” diyerek hakemliğine hemen güvenmişti.", "Şimdi aynı insanlar, Safa'nın eteğinde onun doğruluğuna şahitlik ediyordu. Peygamberimiz de bu şahitliği hemen değerlendirdi: “O hâlde şunu bilin ki ben, önünüzdeki çetin bir azaba karşı sizi uyaran bir peygamberim.” Doğru söylediğini kabul ettikleri adam, şimdi onlara hayati bir haber getiriyordu.", "Ayetin devamı da dikkat çekicidir: “Sana uyan müminlere şefkat kanadını ger.” (Şuarâ, 26/215) Yani uyarı görevi sert bir ses tonuyla değil, şefkatli bir tavırla yürütülecekti. Safa'daki bu çağrı da, kimseyi korkutmak için değil, kimseyi kaybetmemek için yapılmıştı.", "Bu sözün ardından çevresindekilerden biri, amcası Ebû Leheb, öfkeyle karşılık verdi ve onu azarladı. Rivayete göre bu olay üzerine Tebbet Sûresi indi. Biz bu kısmı burada uzatmıyoruz; çünkü bu hikâyenin ağırlığı itirazda değil, güvende.", "Çünkü güven bir günde kurulmaz. Bir insanın sözünün karşılık bulması, yıllar içinde verdiği küçük sözlerin, geri verdiği küçük emanetlerin toplamıdır. Mekkeliler bu soruya hiç düşünmeden “evet” dediler; çünkü yıllardır bir insanın kimseye yalan söylemediğini görmüşlerdi. Onun bütün bir ömrü, o gün tek bir kelimeyle özetlenmişti: Doğru.", "Safa'daki bu sahne, doğruluğun bir erdemden öte, bir hayat sermayesi olduğunu da gösterir. İnsanlar onun sözünü, dışarıdan gelen bir iddia olarak değil, tanıdıkları bir adamın haberi olarak dinlediler. Kimi inandı, kimi geç inandı, kimi inkâr etti. Ama hiçbirinin “yalan söylüyorsun” diyecek hâli yoktu; çünkü tecrübeleri tam tersini söylüyordu."], "ibret": "Güven, bir günde kurulmaz; yıllar boyunca söylenen doğru sözlerle kurulur. Doğruluk, insanın hem en değerli sermayesi hem de bir gün söyleyeceği en önemli sözün en sağlam dayanağıdır.", "kaynak": "Buhârî, Tefsîr, Şuarâ (4770); Müslim, Îmân, 355 (208); Şuarâ Sûresi, 26/214"}, {"no": 2, "baslik": "Emanete Hıyanet Etmeyen Yusuf", "tur": "kaynakli", "paragraflar": ["Mısır'da Azîz'in evinde büyüyen Yusuf (a.s.) gençliğe adım atmıştı. Allah ona hüküm ve ilim vermişti; Kur'an, iyilik edenleri Allah'ın böyle ödüllendirdiğini bildirir (Yûsuf, 12/22). Ne var ki bu evde onu büyük bir imtihan bekliyordu.", "Bu evin sahibi, Yusuf'u satın aldığında hanımına “Ona iyi bak; belki bize yararı dokunur” demişti (Yûsuf, 12/21). Yusuf ise bu iyi muameleyi unutmadı. O evde kendisine güvenilmişti; Yusuf bu güveni, kimsenin görmediği bir anda bile gözetti.", "Evin hanımı, kapıları kapatıp onu kendine çağırdı. Yusuf bu çağrıyı kabul etmedi ve kesin bir cevap verdi: “Allah'a sığınırım! Çünkü o benim efendimdir, bana iyi baktı. Doğrusu zalimler kurtuluşa ermez.” (Yûsuf, 12/23) Kur'an bu sahneyi çok kısa ve örtülü anlatır; biz de ayrıntıya girmiyoruz. Önemli olan, Yusuf'un cevabında iki sebebin birleşmesidir: Allah korkusu ve efendisine karşı sorumluluk. Ona güvenilmişti; o da bu güveni bozmayı kabul etmedi.", "Yusuf kapıya doğru koştu, kadın gömleğini arkadan yırttı ve kapıda efendisiyle karşılaştılar. Hanım suçlamaya başladı. Yusuf ise sadece gerçeği söyledi. Kadının ailesinden bir şahit, gömleğin arkadan yırtıldığına dikkat çekti ve hakikat ortaya çıktı (12/25-28). Ama dedikodu şehre yayıldı; Yusuf'u gören şehrin kadınları şaşkınlıktan ellerini kesti (12/31). Sonunda, delilleri gördükten sonra Yusuf'un bir süre zindana atılması uygun görüldü (12/35).", "Yusuf zindanda da doğruluğundan taviz vermedi. Orada yanında bulunan insanlara Allah'ın birliğini anlattı. İki mahkûmun rüyasını yorumladı; ikisinden biri, bir süre sonra kralın sofrasına dönecekti. Yıllar sonra kral kendi rüyasını gördü ve bu adam Yusuf'u hatırladı; Yusuf rüyayı yorumladı.", "Kral onu yanına getirmek istediğinde Yusuf'un cevabı çok şaşırtıcıydı. Hemen çıkmadı: “Efendine dön ve ona sor: Ellerini kesen kadınların durumu neydi?” (Yûsuf, 12/50) Hürriyetini bile iftiranın kalkmasından sonraya bıraktı. Çünkü çıkmak ona yetmezdi; temiz çıkmak istiyordu. Kimsenin içinde bir kuşku kalmasını istemiyordu.", "Kadınlar sorguya çekildi. Azîz'in hanımı da gerçeği itiraf etti: “Şimdi hak ortaya çıktı. Ben onu kendime çağırmıştım; o ise doğru söyleyenlerdendir.” (12/51) Ardından gelen ifade ise şöyledir: “Bu, onun yokluğunda ona hainlik etmediğimi bilsin diyedir.” (12/52) Müfessirler bu sözün kime ait olduğu konusunda, Yusuf'a mı yoksa Azîz'in hanımına mı, farklı görüşler bildirmişlerdir. Biz kesin bir hüküm vermiyoruz; ayetlerin vurgusu ise açıktır: Hıyanet edilmemişti.", "Kral, Yusuf'a şöyle dedi: “Bugün sen bizim yanımızda yüksek mevki sahibi, güvenilir birisin.” (12/54) Yusuf cevap verdi: “Beni ülkenin hazinelerinin başına geçir; çünkü ben iyi korurum, bilirim.” (12/55) Allah da onu o ülkede yerleştirdi (12/56). Emanete hıyanet etmeyen, sonunda ülkenin emanetlerinin başına geçirildi."], "ibret": "Emanete sadık kalmak, bazen çok zor bir imtihanı geçmek demektir. Güvenilir olan kişiyi Allah, hem iftiradan kurtarır hem de güvenin en büyüğüne layık görür; temiz kalan, sonunda temize çıkar.", "kaynak": "Yûsuf Sûresi, 12/23-56"}, {"no": 3, "baslik": "Doğru Terazi", "tur": "kaynakli", "paragraflar": ["Medyen'de pazar yeri hareketliydi. Ama tezgâhların arkasında bir sorun vardı: Satanlar, ölçüyü ve tartıyı eksik tutuyordu. Allah, bu topluluğa kendi içlerinden birini peygamber olarak göndermişti: Şuayb (a.s.). Şuayb onlara şöyle dedi: “Ey kavmim! Allah'a kulluk edin; sizin için O'ndan başka ilah yoktur. Ölçüyü ve tartıyı eksik tutmayın.” (Hûd, 11/84)", "Bu, yalnız bir dinî çağrı değildi. Şuayb ticaretin içindeki adaleti de hatırlatıyordu: “Ey kavmim! Ölçüyü ve tartıyı adaletle tam yapın, insanların mallarının değerini düşürmeyin, yeryüzünde bozgunculuk yapmayın.” (Hûd, 11/85) Ardından şunu ekledi: “Eğer inanıyorsanız, Allah'ın size bıraktığı helal kazanç sizin için daha hayırlıdır.” (Hûd, 11/86)", "Kavmi ise alay etti: “Ey Şuayb! Namazın mı sana, atalarımızın taptıklarını terk etmemizi ya da mallarımız hakkında dilediğimizi yapmamızı emrediyor?” (Hûd, 11/87) Onlara göre dinle ticaret ayrı işlerdi. Şuayb için ise ikisi aynı kapının iki yüzüydü: Allah'a kulluk eden, insanın hakkını da gözetmeliydi.", "Şuayb'ın cevabı sakin ve sabırlıydı: “Ey kavmim! Rabbimden açık bir delil üzerinde olduğumu ve O'nun bana güzel bir rızık verdiğini düşünün. Ben, size yasakladığım şeyi kendim yapmak istemem. Ben ancak gücüm yettiğince düzeltmek istiyorum. Başarım ancak Allah'ladır. Ona dayandım ve ona yöneliyorum.” (Hûd, 11/88)", "A'râf Sûresi'nde aynı çağrıya şu uyarılar da eklenir: “Her yolun başına oturup, inananları tehdit ederek Allah yolundan alıkoymayın ve o yolu eğri göstermeye çalışmayın. Hatırlayın ki sizler az idiniz, Allah sizi çoğalttı.” (A'râf, 7/86) Şuayb'ın derdi, yalnızca bir pazarın kuralları değil, bir toplumun güven ve dayanışma düzeniydi.", "Bu sözlerde, söylediğini önce kendisi yaşayan bir peygamberin sesi vardır. Şuayb kimseye kendisinin yapmadığı bir şeyi söylemiyordu. Sonra onlara bir kapı daha açtı: “Rabbinizden bağışlanma dileyin, sonra O'na tövbe edin. Rabbim çok merhametlidir, çok sever.” (Hûd, 11/90) Yani eski hatalarına rağmen, dönüş yolu açıktı.", "Kavminin bir kısmı yine de dinlemedi: “Ey Şuayb! Söylediklerinin çoğunu anlamıyoruz. Seni aramızda zayıf görüyoruz.” (Hûd, 11/91) Şuayb yine de onları bırakmadı; sonunda “Siz yapabildiğinizi yapın, ben de yapacağım” dedi (Hûd, 11/93). Allah, Şuayb'ı ve onunla birlikte iman edenleri rahmetiyle kurtardı; zulmedenleri ise şiddetli bir ses yakaladı ve yurtlarında hareketsiz kaldılar (Hûd, 11/94). Biz bu sahneyi burada uzatmıyoruz.", "Hikâyenin asıl dersi, helak sahnesinde değil, pazar yerindedir. Bir tartının sadece kefesi değil, bir toplumun ahlakı da dengelenir. Eksik tartan, bir kişiden bir şey çalmaz; bütün bir pazarın güvenini zedeler. Şuayb'ın çağrısı, bugün de her tezgâhın, her işyerinin ve her alışverişin başında durmaktadır."], "ibret": "Doğruluk, yalnızca söze değil; tartıya, ölçüye ve alışverişe de yansıyan bir ahlaktır. Hakkı eksiltmeyen kişi, hem pazarın hem gönlün dengesini korur ve kazancını da bereketlendirir.", "kaynak": "Hûd Sûresi, 11/84-95; A'râf Sûresi, 7/85-93"}, {"no": 4, "baslik": "Davud ile Süleyman'ın Hükümleri", "tur": "kaynakli", "paragraflar": ["Bir gece, bir topluluğun koyunları başıboş kalıp bir tarlaya dağıldı ve ekini yedi. Sabah olunca tarla sahibi, hayvanların sahipleriyle birlikte davasını Davud (a.s.) önüne getirdi. Davud, Allah'ın peygamberi olduğu gibi aynı zamanda bir hükümdardı. Kur'an bu olaya şöyle işaret eder: “Davud ile Süleyman'ı da an. Hani bir ekin tarlası hakkında hüküm veriyorlardı. Çünkü halkın koyunları geceleyin tarlaya dağılmıştı. Biz onların hükmüne şahittik.” (Enbiyâ, 21/78)", "Devamında şöyle buyurulur: “Biz o hükmü Süleyman'a kavrattık; ikisine de hüküm ve ilim verdik.” (Enbiyâ, 21/79) Ayet bu kadarını söyler. Hükümlerin ayrıntısı Kur'an'da yer almaz. Müfessirlerin İbn Mes'ûd ve İbn Abbas'tan aktardığına göre Davud, koyunların tarla sahibine verilmesine hükmetmişti; Süleyman ise koyunların bir süre tarla sahibine verilmesini, onun sütünden ve yününden yararlanmasını, koyun sahibinin de tarlayı eski hâline getirmesini, sonra herkesin kendi malına kavuşmasını önermişti.", "Dikkat edin: Ayet, hükmün Süleyman'a kavratıldığını bildirse de Davud'u kınamaz. “İkisine de hüküm ve ilim verdik” der. Yani doğru hükmü bulmak bir ilim işidir; ama bu, öncekinin haksız olduğu anlamına gelmez. Hükümdeki hakkaniyet, bazen ayrıntıyı görebilmekte gizlidir.", "Davud ile Süleyman'ın bir başka davasını da Peygamberimiz (s.a.v.) anlatmıştır. İki kadının yanında birer oğlan çocuğu vardı. Bir kurt gelip çocuklardan birini kaptı. Kadınlar arasında bir tartışma başladı: Her biri hayatta kalan çocuğun kendisine ait olduğunu iddia ediyordu. Davud'a gittiler. Davud, çocuğun büyük kadına ait olduğuna hükmetti.", "Kadınlar Davud'un huzurundan çıkıp Süleyman b. Davud'un yanına uğradılar ve durumu anlattılar. Süleyman şöyle dedi: “Bana bir bıçak getirin; çocuğu aranızda ikiye böleyim.” Bunun üzerine küçük kadın hemen itiraz etti: “Yapma, Allah sana rahmet etsin! O, onun çocuğudur.” Süleyman bunun üzerine çocuğun küçük kadına ait olduğuna hükmetti.", "Bıçak, bir hüküm değil, bir sınamaydı. Süleyman çocuğu bölmeye niyetli değildi. Bir annenin kalbi, çocuğunun yaşamasını ister, onu kaybetmek yerine başkasına vermeyi bile göze alır. Süleyman, delil bulunamayan bir davada gerçeği, anne sevgisinin dilinden dinledi.", "Hadisin ravisi Ebû Hüreyre (r.a.) ayrıca, “bıçak” için kullanılan “sikkîn” kelimesini o güne kadar hiç duymadığını, kendi aralarında bu aleti “müdye” diye andıklarını söyler. Bu küçük not, olayın Peygamberimizin ağzından ne kadar canlı ve dikkatle dinlendiğini gösterir.", "İki hükmün birlikte anılması da ibretliktir: Davud'un hükmü kınanmadı, Süleyman'ın hükmü de ayrıca övüldü. Hakkaniyet, birbirini küçümsemeden doğruyu aramakla büyür.", "Bu iki olay birlikte düşünülünce doğruluğun yalnızca doğru söylemekle bitmediği anlaşılır. Doğruluk, hakkı arayan bir sabır, adaleti ayrıntıda bulan bir dikkat ve gerektiğinde zekâyla gerçeği ortaya çıkaran bir hikmettir. Hâkimin vicdanı, davacıların hakkı için çalışır; ilim ise bu vicdanın ışığıdır."], "ibret": "Adalet, hakkı bulmak için sabırla ve dikkatle düşünmeyi gerektirir. Gerçek, bazen sözlerde değil, yüreğin sevgisinde ve şefkatinde ortaya çıkar. Hikmet, doğru hükmü bulabilmek ve haksızlığı önlemektir.", "kaynak": "Enbiyâ Sûresi, 21/78-79; Buhârî, Enbiyâ, 40 (3427); Ferâiz, 30 (6769); Müslim, Akdiye, 20 (1720)"}, {"no": 5, "baslik": "Yalan Söylemeyen Ka'b", "tur": "kaynakli", "paragraflar": ["Ka'b b. Mâlik (r.a.), Bedir dışında Peygamberimizin çıktığı her savaşa katılmıştı. Ama Tebük seferi için hazırlık yapılırken işler değişti. Hava çok sıcaktı, yol uzundu, düşman kalabalıktı. Ka'b'ın o zamana kadar hiç sahip olmadığı iki bineği vardı ve hiç bu kadar güçlü, zengin olmamıştı.", "Tebük seferi, Peygamberimizin son seferlerindendi. Resûlullah bu defa seferin hedefini gizlemeyip açıkça duyurmuştu; çünkü yol uzun, hava çok sıcak ve karşılaşılacak ordu büyüktü. Herkes gerekli hazırlığı yapabilsin diye bunu açıkça söylemişti.", "Ka'b o sıralarda dönüp bakıyor, hazırlık yapmadığını görüyordu. Her seferinde “Gücüm yetiyor, yetişirim” diye kendini avutuyordu. Oysa erteleme, küçük bir kararsızlığın günden güne büyüyen bir yüke dönüşmesidir.", "Her sabah hazırlanmak için evinden çıkıyor, bir şey yapmadan dönüyordu: “Nasılsa yetişirim.” Erteleme günleri çoğalırken ordu yola çıktı ve Ka'b geride kaldı. Medine'de dolaştığında çevresinde ya münafıklıkla anılan insanları ya da Allah'ın mazur gördüğü zayıfları görüyor, bu durum onu çok üzüyordu.", "Peygamberimiz seferden dönünce mescide girdi ve iki rekât namaz kıldı. Geride kalanlar yanına gelip yeminle mazeretler sundular. Resûlullah dışlarını kabul etti, bağışlanma diledi, kalplerini Allah'a bıraktı. Sıra Ka'b'a gelince, Peygamberimiz öfkeli birinin tebessümüyle tebessüm etti ve “Gel” dedi. Ka'b şöyle dedi: “Vallahi, eğer dünya ehlinden birinin yanında otursaydım, bir mazeretle öfkesinden kurtulacağımı bilirdim. Ama sana yalan söylersem Allah seni bana kızdırır. Doğruyu söylersem kızarsın, ama Allah'ın affını umarım. Hiçbir mazeretim yoktu.” Peygamberimiz: “Bu doğru söyledi” buyurdu.", "Karar Allah'a bırakıldı. Peygamberimiz Müslümanların Ka'b'la ve aynı şekilde doğruyu söyleyen iki arkadaşıyla konuşmasını yasakladı. Elli gün kimse onlara selam vermedi, kimse onlarla konuşmadı. Yeryüzü, bütün genişliğine rağmen onlara dar gelmeye başlamıştı.", "Bu yalnızlığın içinde Gassân hükümdarından bir mektup geldi: “Duyduğumuza göre efendin seni dışlamış. Allah seni horluk ve zayıflık içinde bırakmasın; bize gel, sana destek olalım.” Ka'b mektubu okuyunca “Bu da bir imtihan” dedi ve mektubu yaktı. Bir yabancı hükümdarın çağrısı, ona sadakatinden vazgeçirecek güçte değildi.", "Elli günün sonunda, sabah namazının ardından evinin damında otururken, bir dağın üstünden bir ses duydu: “Müjde, ey Ka'b b. Mâlik!” Hemen secdeye kapandı. Allah, tövbelerinin kabul edildiğini bildiren ayeti indirmişti (Tevbe, 9/118). Müjdeciye üzerindeki iki elbiseyi çıkarıp verdi ve ödünç bir elbiseyle Peygamberimizin huzuruna gitti.", "Ka'b şöyle dedi: “Ey Allah'ın Resulü, Allah beni doğruluğumla kurtardı. Tövbemin bir gereği olarak, hayatım boyunca doğrudan başka bir söz söylemeyeceğim.” Aynı surede şu ayet de yer alır: “Ey iman edenler! Allah'tan korkun ve doğrularla beraber olun.” (Tevbe, 9/119)"], "ibret": "Doğruyu söylemek bazen zor ve pahalı görünür; ama sonunda insanı kurtaran odur. Bahane bulmak kısa süreli bir kurtuluş, doğruluk ise kalıcı bir huzurdur; vicdan rahat uyur.", "kaynak": "Buhârî, Megâzî, 79 (4418); Müslim, Tevbe, 53 (2769); Tevbe Sûresi, 9/117-119"}, {"no": 6, "baslik": "Denize Bırakılan Borç", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimiz (s.a.v.), İsrailoğulları arasında yaşamış bir adamı anlatır. Bu adam bir başkasından bin dinar borç istedi. Alacaklı şöyle dedi: “Bana şahitler getir, onları şahit tutayım.” Adam cevap verdi: “Şahit olarak Allah yeter.” Alacaklı: “O hâlde bir kefil getir.” Adam yine aynı cevabı verdi: “Kefil olarak Allah yeter.” Alacaklı: “Doğru söyledin” dedi ve parayı belli bir vadeye kadar verdi.", "Borçlu adam denize çıktı, işini gördü ve vade yaklaştı. Borcunu ödemek için alacaklının bulunduğu yere gidecek bir gemi aradı, ama bulamadı. Elinde hiçbir araç yoktu. Bu hadiste adamın adı ve memleketi söylenmez; biz de bir ad vermiyoruz.", "Sonunda bir tahta parçası aldı ve ortasını oydu. İçine bin dinarı ve alacaklıya bir mektubu koydu, ağzını kapatıp sağlamlaştırdı. Denize doğru gitti ve şöyle dua etti: “Allahım, biliyorsun ki ben falancadan bin dinar borç aldım. Benden kefil istedi, ben ‘Allah kefil olarak yeter’ dedim, o da razı oldu. Şahit istedi, ben ‘Allah şahit olarak yeter’ dedim, o da razı oldu. Ben gemi bulmak için çok uğraştım, bulamadım. Ben bunu sana emanet ediyorum.” Sonra tahtayı denize attı.", "Tahta, dalgaların arasında uzaklaştı. Adam ise yine de vazgeçmedi; kıyıdan ayrıldıktan sonra yeni bir gemi bulmak için aramaya devam etti. Bu önemli bir noktadır: Emaneti Allah'a bırakmak, kendi çabasını bırakmak anlamına gelmiyordu.", "Bu sırada alacaklı, borçlunun geleceğini umarak kıyıya çıktı; belki bir gemi bulunmuştu. Gemi göremedi. Fakat kıyıda içinde mal olan, sürüklenen bir tahta parçası gördü. Onu ailesine yakacak olsun diye aldı. Eve götürüp tahtayı kesince bin dinarı ve mektubu buldu.", "Aradan zaman geçti. Borçlu, bin dinarı alıp alacaklının yanına geldi: “Vallahi, malınızı getirebilmek için gemi bulmaya çalışmaktan geri durmadım. Bu geldiğim gemiden önce bir gemi bulamadım.” Alacaklı sordu: “Bana bir şey göndermiş miydin?” Adam şöyle cevap verdi: “Size haber vereyim; bu gemiden önce hiç gemi bulamadım.” Bunun üzerine alacaklı dedi ki: “Allah, senin adına tahtanın içinde gönderdiğini bana ulaştırdı. Bin dinarını da al ve hayırla dön.”", "Hadis Buhârî'nin Kefâlet bölümünde, ta'lîk yoluyla ve kesinlik bildiren bir ifadeyle nakledilir. Âlimler bu rivayeti sahih kabul eder. Hadisi Ebû Hüreyre (r.a.) Peygamberimizden rivayet eder.", "Bu hadiste güzel bir denge vardır. Adam sözünde durdu, çalışmaktan geri kalmadı, ama sonucu Allah'a bıraktı. Alacaklı da onun doğruluğuna güvendi ve hakkını eksiksiz buldu. Ne bir yalan, ne bir bahane, ne de bir hile vardı. Borç da, emanet de yerine ulaştı."], "ibret": "Sözünde durmak, borcu ödemek için elinden geleni yapıp gerisini Allah'a bırakmaktır. Verilen söz bir emanettir; onu eksiksiz yerine getirmeye çalışanın, Allah bir yolunu bulur ve işini kolaylaştırır.", "kaynak": "Buhârî, Kefâlet, 1 (2291)"}, {"no": 7, "baslik": "Altın Dolu Küp", "tur": "kaynakli", "paragraflar": ["Sizden önce yaşayanlar arasında bir adam, bir başkasından bir arsa satın aldı. Anlaşma yapıldı, bedel ödendi, arsa el değiştirdi. Çok geçmeden alıcı, arsanın içinde altınla dolu bir küp buldu.", "Adam, küpü hemen arsayı sattığı adamın yanına götürdü ve şöyle dedi: “Altınını al. Ben senden arsayı satın aldım, altını değil.” Arsanın eski sahibi şaşırdı ve cevap verdi: “Ben sana arsayı, içindekilerle birlikte sattım.” İkisi de altını almak istemiyordu. İkisi de hakkı olmadığını düşündüğü bir şeyi almaktan çekiniyordu.", "Burada bir an durup düşünelim. Bulunan şey küçük bir hazine değildi; bir küp dolusu altındı. Çoğumuz böyle bir durumda “Yolum açıldı” der, sesimizi çıkarmazdık. Üstelik arsayı satan adam, belki bunun hiç farkında değildi. Ama alıcı, kendisine ait olmadığını düşündüğü bir malla evine dönemedi. Elindeki altın, ona bir imtihan gibi ağır geldi.", "Sonunda bir hakeme gittiler. Hakem ikisini dinledi ve sordu: “Çocuğunuz var mı?” Biri: “Benim bir oğlum var” dedi. Öteki: “Benim de bir kızım var.” Hakem şöyle hükmetti: “Oğlanı kızla evlendirin, altından onların üzerine harcayın ve sadaka verin.”", "Satıcının tavrı da en az alıcınınki kadar güzeldir. Arsayı satmıştı, içinde ne varsa onunla satmıştı; üstelik sattığı yerin altındaki zenginliği bile geri istemedi. Ortada iki insan, iki farklı haklı gerekçe ve hiç kimsenin kendi lehine kullanmak istemediği bir hazine vardı.", "Hadis bu kadarını anlatır. Kişilerin isimleri, yaşadıkları yer, hakemin kimliği söylenmez; biz de hiçbirini uydurmuyoruz. Ama anlatılan şey çok açıktır. Dünyada çoğu insan, “benim değil” diyecek yerde “bende kalsın” der. Burada ise iki insan, kendilerine ait olmayan bir hazine karşısında sınandı ve ikisi de kendi hakkını başkasına bırakmakta yarıştı.", "Bu rivayet, Ebû Hüreyre'nin Peygamberimizden naklettiği bir hadistir. “Sizden önce yaşayanlar arasında” diye anlatılan bu olay, daha önceki toplumlarda da dürüstlüğün bir değer olarak yaşadığını gösterir. Peygamberimiz bu hikâyeyi anlatarak onu bugün için de bize bir örnek olarak sunmuştur.", "Altın, onlara gökten düşmemişti; bir alışverişin içinden çıkmıştı. Alıcı, “ben bunu satın almadım” diyordu; satıcı, “ben bunu bilerek vermemiştim ama satmıştım” diye düşünüyordu. Bu iki dürüst insanın çatışmasında kimse kimseyi suçlamıyordu. Herkes kendi vicdanına göre davranıyordu.", "Hakemin çözümü de güzeldir. Altını birine ya da öbürüne vermek yerine, iki aileyi birleştirdi. Bu hazine bir çekişme değil, bir yuvanın başlangıcı oldu. Hem ihtiyaç için harcanacak hem de sadaka olarak verilecek bir kaynak doğdu. Dürüstlük, ortada bir hazine varken bile kimsenin kaybetmediği bir yola açıldı.", "Bu hikâyede kimse zengin olmak için yarışmadı; dürüst kalmak için yarıştı. Ve sonunda, kimsenin haksızlığa uğramadığı bir çözümde buluştular."], "ibret": "Hakkı olmayan bir şeyi almamak, dürüstlüğün en zor sınavlarından biridir. Kendi payına düşeni bile başkasına bırakmaya çalışan insanlar, çekişme yerine bereket ve kardeşlik doğurur; böylece herkes kazanır.", "kaynak": "Buhârî, Enbiyâ, 54 (3472); Müslim, Akdiye, 21 (1721)"}, {"no": 8, "baslik": "Ömer'in Son Sorusu: Borcum Ne Kadar?", "tur": "kaynakli", "paragraflar": ["Hz. Ömer (r.a.) sabah namazında ağır biçimde yaralanmıştı. Yara ağırdı; çevresindekiler bunun son günleri olacağını anlamıştı. Bu olayı bize Amr b. Meymûn aktarır. Saldırının ayrıntılarına girmiyoruz; burada asıl konu, Ömer'in bu durumda ne söylediğidir.", "Saldırganın Müslüman olmadığını öğrenince Ömer, “Allah'a hamd olsun ki ölümümü, İslam'ı iddia eden birinin eline vermedi” demişti. Sonra düşündüğü şey, ardında bırakacağı hesaplar oldu.", "Ömer'in aklındaki işlerden biri de borçlarıydı. Oğlu Abdullah'a döndü: “Bak bakalım, benim ne kadar borcum var.” Hesapladılar; seksen altı bin kadar bir borç çıktı. Müslümanların emiri, ölüm döşeğinde bile üzerindeki bir borcu hatırlıyor ve onu ödemeden gitmek istemiyordu.", "Ömer şöyle vasiyet etti: “Eğer Ömer ailesinin malı yeterse borcu onlardan öde. Yetmezse Adî b. Ka'b oğullarından iste. Onların malı da yetmezse Kureyş'ten iste, başkalarından isteme. Bu borcu benim adıma öde.” Dikkat edin: Borcunu, ilgisi olmayan kimselere yüklemek istemedi; önce kendi malına, sonra kendi yakınlarına, en son kendi kabilesine başvurdu.", "Sonra oğluna başka bir görev verdi: “Müminlerin annesi Âişe'ye git ve ‘Ömer sana selam ediyor’ de. ‘Emîrü'l-müminîn’ deme; çünkü ben bugün müminlerin emiri değilim. ‘Ömer b. Hattâb, iki arkadaşının yanına defnedilmek için izin istiyor’ de.” Ömer, ölümünde bile makamını bir hak olarak değil, bir emanet olarak görüyordu.", "Abdullah, Hz. Âişe'nin yanına gitti. Âişe oturmuş ağlıyordu. Selam verdi ve Ömer'in isteğini iletti. Âişe şöyle cevap verdi: “Ben o yeri kendim için isterdim; ama bugün onu kendime tercih ediyorum.” Hz. Âişe, kendisine ait bir yerden vazgeçerek Ömer'e izin verdi.", "Abdullah dönünce Ömer: “Ne var?” diye sordu. “Emîrü'l-müminîn, izin verdi.” Ömer şöyle dedi: “Benim için bundan önemli bir şey yoktu. Ruhumu teslim ettiğimde beni götürün, selam verin ve ‘Ömer b. Hattâb izin istiyor’ deyin. Eğer izin verirse beni içeri alın. Vermezse beni Müslümanların mezarlığına götürün.”", "Ömer'in bu davranışı, Müslümanların ilk halifelerinin hayatındaki titizliği gösterir. Bir hesap vermeden gitmemek, bir hakkı geride bırakmamak ve izinsiz bir adım atmamak. Ölümün kapıda beklediği bir anda bile hakkı tek tek hatırlamak, gerçek bir olgunluk ister.", "Bu sahne kısa, ama çok şey söyler. Ömer, bütün bir devletin başında olmasına rağmen hesabını unutmamıştı. Borcunu ödenmesi gereken bir hak, iki arkadaşının yanına defnedilmeyi de sahibinden izin alınması gereken bir iş olarak görüyordu. Kimsenin hakkını yemeden, kimsenin evine izinsiz girmeden gitmek istedi.", "Bir babanın bu son sözleri, oğlunun omzuna bir emanet olarak bırakılmıştı. Ömer'in vasiyeti, hem borcu hem de izni konusunda hiçbir hakkı açıkta bırakmayacak şekilde, adım adım düşünülmüştü."], "ibret": "Kul hakkı, ölüm anında bile unutulmayacak kadar ağırdır. Hakkı ödemeye ve izin istemeye gösterilen titizlik, insanın gerçek büyüklüğünü ortaya koyar; son sözler, bir ömrün özetidir.", "kaynak": "Buhârî, Fezâilü'l-ashâb, 8 (3700)"}], "kapanis": "Sekiz hikâyede de aynı gerçek karşımıza çıktı: Doğruluk, kısa vadede pahalı görünse de en güvenli yoldur. Mekke'de el-Emîn diye anılan, Mısır'da zindanda bile emanete hıyanet etmeyen, kıyıda borcunu tahtayla gönderen, ölüm döşeğinde borcunu soran insanlar, güvenin nasıl kurulduğunu gösterdi. Siz de bugün söylediğiniz bir sözü, verdiğiniz bir sözü, tuttuğunuz bir emaneti hatırlayın. Küçük doğruluklar, insanın hayatındaki en büyük kapıları açar.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/08/", "kapak": "../../kapak/08.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 9, "baslik": "Duaların Güzelliği", "hazir": true, "yol": "../09/index.html"}, "pdf": "../../pdf/kitap-08.pdf", "epub": "../../epub/kitap-08.epub"}</script>
