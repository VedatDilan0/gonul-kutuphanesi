<script type="application/json" id="kitap-veri">{"no": 2, "baslik": "Peygamberlerden İbretlik Kıssalar", "tanitim": "Âdem'den İsa'ya, Kur'an'ın anlattığı peygamber kıssalarından sekiz ibretli sahne; ayetlere bağlı kalınarak anlatılır.", "onsoz": "Kur'an-ı Kerim, peygamberlerin hayatını bize eğlence için değil, ders almamız için anlatır. Bu kitapta Âdem'den İsa'ya kadar sekiz peygamber kıssasını ayetlere bağlı kalarak okuyacağız. Ayette olmayan ayrıntıyı kesin bilgi gibi vermedik; müfessirlerin yorumu olan yerleri de belirttik. Her hikâyenin sonunda ayet aralığı yazılıdır.", "hikayeler": [{"no": 1, "baslik": "Âdem'e İsimlerin Öğretilmesi", "tur": "kaynakli", "paragraflar": ["Henüz insanın yeryüzünde ilk adımı atılmamıştı. Allah, meleklere bir haber verdi: “Ben yeryüzünde bir halife var edeceğim.” (Bakara, 2/30). Melekler bu haberi duyunca, Rablerinin hikmetini anlamak istedi. Bu bir itiraz değil, bir soruydu: “Orada bozgunculuk çıkaracak ve kan dökecek birini mi yaratacaksın? Oysa biz seni överek tesbih ediyor, seni her noksandan uzak tutuyoruz.”", "Allah onlara şöyle cevap verdi: “Ben sizin bilmediklerinizi bilirim.” Cevap kısaydı ama bütün sorunun kapısını kapatmıyor, aksine açıyordu. Bunun anlamı bir sonraki sahnede görülecekti.", "Bu cevabın içinde ince bir terbiye vardı. Melekler hikmeti sormuş, Allah da bilgiyi göstererek cevap vermişti. Kur'an'da soru sormak, öğrenmenin kapısı sayılır; yeter ki saygıyla sorulsun.", "Kur'an-ı Kerim, Allah'ın Âdem'i çamurdan yarattığını, ona ruhundan üflediğini bildirir (Hicr, 15/28-29). Ardından şöyle buyurur: “Allah, Âdem'e bütün isimleri öğretti.” (Bakara, 2/31). Müfessirler bu isimlerin, varlıkların ve şeylerin adları ve bilgisi olduğunu söyler; ayrıntısı ayette verilmediği için ötesine geçilmez.", "Sonra Allah bu varlıkları meleklere gösterdi: “Eğer doğru söyleyenlerseniz, haydi şunların isimlerini bana bildirin.” Melekler kendi bilgilerinin sınırını biliyordu. Cevapları, bilginin başında duran bir teslimiyet gibiydi: “Seni her türlü eksiklikten uzak tutarız. Senin bize öğrettiğinden başka hiçbir bilgimiz yoktur. Şüphesiz her şeyi bilen, hikmet sahibi olan sensin.” Böylece melekler, sordukları sorunun cevabını da kendi sınırlarını kabul ederek aldılar.", "Bunun üzerine Allah, Âdem'e şöyle buyurdu: “Ey Âdem, bunların isimlerini onlara haber ver.” Âdem isimleri bildirdi. Allah da meleklere hitap etti: “Ben, göklerin ve yerin gaybını bilirim; sizin açığa vurduğunuzu da gizlediğinizi de bilirim, demedim mi?” (Bakara, 2/33).", "Ardından meleklere Âdem'e secde etmeleri emredildi. Secde, saygının ve itaatin bir ifadesiydi. Kur'an'a göre melekler hep birlikte secde etti. Yalnız İblis, “Ben balçıktan yaratılmış bir insana secde edecek değilim” diyerek kibirle geri durdu (Hicr, 15/33). Yaratılışının önemli olmadığını, emre uymanın asıl mesele olduğunu anlayamadı. Müfessirlere göre bu secde ibadet değil; saygı ve Allah'ın emrine teslimiyet ifadesiydi.", "Bu sahne, insanın yeryüzündeki yerini anlatır. İnsan güç bakımından değil, öğrenme ve bilme kabiliyetiyle seçilmişti. Melekler hata yapmadan itaat eden varlıklardı; ama Allah, insana farklı bir şey verdi: bilgi öğrenebilme ve öğretebilme yeteneğini.", "Sahne İblis'in geri durmasıyla biter. Bu bölümde, insanın değeri de, kibrin zararı da kısa ve açık biçimde görünür: Bilgi, insana verilen en büyük emanetlerden biridir. Onu doğru kullanmak da insanın imtihanıdır. Melekler kendi sınırlarını biliyor ve bunu açıkça söylüyordu; ilmin ilk basamağı da budur: Bilmediğini bilmek."], "ibret": "İnsanın değeri, bilgiyle ve öğrenme gücüyle anlaşılır. Bilgi, kibirle değil, teslimiyetle ve şükürle taşındığında insanı yükseltir. Bildiğimizle övünmek yerine, bilmediğimizi kabul etmeli ve öğrenmeye devam etmeliyiz.", "kaynak": "Bakara Sûresi, 2/30-34; Hicr Sûresi, 15/28-33"}, {"no": 2, "baslik": "Nuh'un Gemisi", "tur": "kaynakli", "paragraflar": ["Nuh (a.s.), kavmini uzun yıllar boyunca Allah'a çağırdı. Kur'an-ı Kerim bunun süresini şöyle bildirir: “Onların arasında elli yıl eksiği bin yıl kaldı.” (Ankebût, 29/14). Sabrın bu kadar uzun sürdüğü bir davet, insanın aklına şunu getirir: Yorulmadı mı? Nuh'un sabrı yalnız beklemek değildi; her sabah aynı sözü, aynı sevgiyle yeniden söylemekti.", "Nuh kendi sözüyle derdini Rabbine şöyle anlattı: “Rabbim, kavmimi gece gündüz davet ettim; ama davetim onların kaçışını artırmaktan başka bir şey yapmadı.” Onlar parmaklarını kulaklarına tıkamış, elbiselerine bürünmüşlerdi. Nuh, bununla yetinmedi. Hem açıkça hem gizlice konuştu, her yolu denedi (Nûh, 71/5-9). Çağrısında “Rabbinizden bağışlanma dileyin, O çok bağışlayıcıdır” diyordu (Nûh, 71/10).", "Çok az kişi ona inandı. Sonunda Allah, Nuh'a bir gemi yapmasını bildirdi: “Bizim gözetimimiz altında ve vahyimize göre gemiyi yap.” (Hûd, 11/37). Nuh gemiyi yaparken, kavminin ileri gelenleri yanından geçtikçe onunla alay ediyordu. Nuh sakin kaldı: “Bugün bizimle alay ediyorsanız, biz de sizinle alay edeceğiz. Kimin rezil edecek bir azaba uğrayacağını yakında bileceksiniz.”", "Allah'ın emri gelip tandır kaynamaya başlayınca Allah, Nuh'a her cinsten birer çifti ve hakkında hüküm verilmiş olanlar dışında ailesini ve inananları gemiye almasını bildirdi (Hûd, 11/40). Ona inanan az sayıdaki kişi gemiye bindi. Nuh şöyle dedi: “Binin! Geminin yürümesi de durması da Allah'ın adıyladır. Rabbim, şüphesiz bağışlayandır, merhamet edendir.” (Hûd, 11/41).", "Dalgalar dağlar gibi yükselirken Nuh uzakta duran oğluna seslendi: “Yavrucuğum, bizimle birlikte bin, kâfirlerle beraber olma!” Oğlu ise “Beni sudan koruyacak bir dağa sığınırım” dedi. Nuh ona şöyle cevap verdi: “Bugün Allah'ın emrinden koruyacak kimse yoktur; yalnız Allah'ın merhamet ettiği kimse hariç.” O sırada dalgalar ikisinin arasına girdi.", "Sonra emir geldi: “Ey yer, suyunu yut! Ey gök, sen de tut!” Su çekildi, iş bitirildi. Gemi Cûdî dağının üzerine oturdu (Hûd, 11/44). Bu ayrıntı, Kur'an'da böyle kısaca geçer; geminin ölçüleri, hayvanların sayısı gibi bilgiler ayette yoktur.", "Nuh baba yüreğiyle Rabbine dönüp oğlunu sordu: “Rabbim, oğlum da ailemdendi; senin sözün haktır ve sen hâkimlerin en iyisisin.” Allah ona şöyle buyurdu: “Ey Nuh, o senin ailenden değildir; çünkü onun işi salih değildi. Bilmediğin bir şeyi benden isteme. Cahillerden olmandan seni sakındırırım.” Nuh hemen Rabbine sığındı: “Rabbim, bilmediğim şeyi istemekten sana sığınırım. Beni bağışlamazsan, bana acımazsan ziyana uğrayanlardan olurum.”", "En sonunda şöyle denildi: “Ey Nuh! Bizden sana ve seninle beraber olanlara selametle ve bereketlerle in.” (Hûd, 11/48). Uzun bir sabrın sonu, bir selamla bitiyordu. Gemi, kurtulanlar için bir sığınaktı; Nuh için ise bir sabrın mükâfatı."], "ibret": "Sabır ve tevekkül, çabayı bırakmak değil, elimizden geleni yapıp sonucu Allah'a bırakmaktır. Nuh'un gemisi, bu iki şeyin birlikte yürüdüğünü gösterir; çaba ve teslimiyet yan yanadır. Davetinde yılmadan sabretmek de Nuh'un bize bıraktığı derstir.", "kaynak": "Hûd Sûresi, 11/25-48; Nûh Sûresi, 71/5-10; Ankebût Sûresi, 29/14-15"}, {"no": 3, "baslik": "Hakikati Arayan İbrahim", "tur": "kaynakli", "paragraflar": ["İbrahim (a.s.), insanların neye taptığını soran, düşünen bir gençti. Kur'an-ı Kerim, onun kavmine hakikati nasıl anlattığını iki ayrı sahneyle gösterir. Birincisi gecenin karanlığında, gökyüzüne bakarak yapılan bir konuşmadır.", "Gece bastırınca bir yıldız gördü. “Bu benim Rabbim” dedi. Yıldız batınca “Batanları sevmem” diye ekledi. Ay'ı doğarken görünce aynı şeyi söyledi; o da batınca “Rabbim bana yol göstermezse, sapıklardan olurum” dedi. Güneşi doğarken görünce “Bu daha büyük” dedi; o da batınca kavmine döndü (En'âm, 6/76-78).", "Müfessirler bu sahneyi farklı yorumlamıştır. Kimi onu İbrahim'in kendi arayışı, kimi de kavmine akıl yürütme yoluyla gösterdiği bir ders olarak anlar. Bu yüzden tek bir yorumu kesin hüküm gibi sunmayacağız. Ayetin sonucu ise açıktır: “Ey kavmim, ben sizin ortak koştuklarınızdan uzağım. Ben yüzümü, hakka yönelen biri olarak, gökleri ve yeri yaratana çevirdim. Ben ortak koşanlardan değilim.”", "İkinci sahne putlarla ilgilidir. İbrahim, babasına ve kavmine sormuştu: “Bu heykeller nedir ki onlara bağlanıp kalmışsınız?” Onlar şöyle cevap verdi: “Babalarımızı onlara tapar bulduk.” İbrahim ise “Siz de babalarınız da apaçık bir sapıklık içindeydiniz” dedi (Enbiyâ, 21/52-54).", "Bir süre sonra İbrahim kavmine şunu söyledi: “Allah'a andolsun, siz arkanızı dönüp gittikten sonra putlarınıza bir tuzak kuracağım.” Müfessirlere göre kavmin şehirden dışarı çıktığı bir vakitte, bu söz yerine geldi. Putları parçaladı; yalnız en büyüğünü bıraktı, belki ona dönüp bakarlar diye (Enbiyâ, 21/57-58).", "Kavmi dönüp gelince şaşkına döndü: “Bunu tanrılarımıza kim yaptı? Şüphesiz o zalimlerdendir.” İbrahim'in adını andılar, onu insanların gözü önüne getirdiler: “Ey İbrahim, bunu tanrılarımıza sen mi yaptın?”", "İbrahim'in cevabı, bir kılıcın değil, bir aynanın cevabıydı: “Hayır, bunu şu büyükleri yapmıştır. Konuşabiliyorlarsa onlara sorun.” Bunun üzerine kavmi kendi kendine döndü, “Siz haksızsınız” dediler. Ama sonra başları öne eğildi: “Sen bunların konuşmadığını biliyorsun.” (Enbiyâ, 21/63-65).", "Kur'an, İbrahim'i başka bir yerde şöyle över: “Hani o, Rabbine tertemiz bir kalple gelmişti.” (Sâffât, 37/84). Büyük putu ayakta bırakması, kavmini düşünmeye çağırdığını gösterir. Onun yolu, hakikate akıl ve temiz kalple varmaktı. Kimseye zarar vermemiş, yalnızca cansız putları kırmıştı.", "İbrahim açık ve sakin bir soruyla konuştu: “Allah'ı bırakıp size hiçbir yarar ve zarar vermeyen şeylere mi tapıyorsunuz? Yazıklar olsun size! Hâlâ akıl etmeyecek misiniz?” Cevap, düşünceye çağrıydı. Ama kavmi akla kulak vermek yerine “Yakın onu!” kararı verdi (Enbiyâ, 21/68). Bu kararın sonunu başka bir kitaba bırakıyoruz. Bu kitapta İbrahim'in yaptığı iş şudur: bir sorunun gücüyle bütün bir toplumun karşısına tek başına dikilmek."], "ibret": "Hakikati bulmak için aklı kullanmak, soru sormak ve alışkanlıkların ötesine bakmak gerekir. İbrahim, “Hâlâ akıl etmeyecek misiniz?” diye sorarak bizi de düşünmeye çağırır. Atalardan gördüğümüzü sorgulamadan sürdürmek yerine doğruyu araştırmalıyız.", "kaynak": "En'âm Sûresi, 6/74-79; Enbiyâ Sûresi, 21/51-68; Sâffât Sûresi, 37/84"}, {"no": 4, "baslik": "Kuyuya Atılan Yusuf", "tur": "kaynakli", "paragraflar": ["Bir gün küçük Yusuf (a.s.), babasına bir rüya anlattı: “Babacığım, ben on bir yıldızı, güneşi ve ayı gördüm; hepsi bana secde ediyordu.” (Yûsuf, 12/4). Babası Yakup (a.s.), rüyanın taşıdığı anlamı sezmişti.", "Bu rüyanın gerçek anlamı yıllar sonra ortaya çıkacaktı. Küçük Yusuf ise o gün yalnızca gördüğünü babasına anlatmak istemişti. Kur'an, hikâyeyi bu sade başlangıçtan alır ve adım adım büyütür.", "Yakup oğluna sevgiyle ama dikkatle cevap verdi: “Yavrucuğum, rüyanı kardeşlerine anlatma; sana bir tuzak kurarlar. Şüphesiz şeytan insanın apaçık düşmanıdır.” Sonra ona, Rabbinin onu seçeceğini, rüyaların yorumunu öğreteceğini ve nimetini tamamlayacağını müjdeledi (Yûsuf, 12/5-6).", "Kardeşleri ise Yusuf'u ve onun öz kardeşini babalarının kendilerinden daha çok sevdiğini düşünüyordu. “Oysa biz güçlü bir topluluğuz” dediler. Kıskançlık içlerinde büyüdü. Aralarında “Yusuf'u öldürün ya da uzak bir yere atın ki babanızın yüzü yalnız size dönsün” diyenler oldu. İçlerinden biri ise şöyle dedi: “Yusuf'u öldürmeyin; onu kuyunun dibine bırakın. Yoldan geçen kafilelerden biri onu alır.” (Yûsuf, 12/8-10).", "Babalarına gidip “Niçin Yusuf konusunda bize güvenmiyorsun? Yarın onu bizimle gönder, oynasın, biz onu koruruz” dediler. Yakup, içinde bir sızıyla cevap verdi: “Onu götürmeniz beni üzer. Siz ondan habersizken kurdun onu yemesinden korkarım.” Sonunda Yusuf'u onlarla gönderdi.", "Kuyunun başına vardıklarında onu kuyuya bırakmaya karar verdiler. O sırada Allah, Yusuf'a şöyle vahyetti: “Sen onlara, bu yaptıklarını mutlaka haber vereceksin; onlar bunu fark etmeyecekler.” (Yûsuf, 12/15). Yusuf'un yalnız olmadığını bildiren bu cümle, hikâyeye bir umut ışığı bırakır. Kardeşlerinin sonradan getirdiği yalan ve Yakup'un “güzel sabır” sözü ise başka bir kitaba aittir.", "Bir kafile gelip sucusunu gönderdi. Su kovasını sarkıttığında sevinçle haykırdı: “Müjde! İşte bir oğlan!” Onu bir ticaret malı gibi sakladılar; sonra ona değer vermeyip sattılar. Ayet bunu kısaca “Az bir paraya, birkaç dirheme sattılar” diye bildirir (Yûsuf, 12/19-20).", "Mısır'da onu satın alan kişi, hanımına şöyle dedi: “Ona iyi bak; belki bize faydası dokunur, ya da onu evlat ediniriz.” İşte böylece Allah, Yusuf'a o ülkede bir yer hazırlamıştı. Kur'an bunu şöyle özetler: “Yusuf'u orada yerleştirdik ki ona rüyaların yorumunu öğretelim. Allah emrinde galiptir; ama insanların çoğu bilmez.” (Yûsuf, 12/21).", "Yusuf erginlik çağına erişince Allah ona hüküm ve ilim verdi: “İyilik edenleri işte böyle ödüllendiririz.” (Yûsuf, 12/22). Kuyunun dibinde başlayan hikâye, Allah'ın gözetiminde bir yükselişe dönüşüyordu. Yusuf'un yeri değişti; ama emaneti taşıyan kalbi hep aynı kaldı. Onu kuyuya atanlar, hâlâ olacakları bilmiyordu."], "ibret": "En karanlık yerde bile Allah kulunu unutmaz. Kıskançlık insanı kardeşine bile kötülük yaptırır; ama Allah'ın murat ettiği iyiliği hiçbir tuzak engelleyemez. Sabırla ve güvenle beklemek gerekir.", "kaynak": "Yûsuf Sûresi, 12/4-15, 19-22"}, {"no": 5, "baslik": "Musa ile Hızır'ın Yolculuğu", "tur": "kaynakli", "paragraflar": ["Bir gün Musa (a.s.) İsrailoğullarına konuşma yaparken kendisine “İnsanların en bilgilisi kimdir?” diye sordular. O da “Benim” dedi. Hadis-i şerifte anlatıldığına göre Allah, bilgiyi kendisine havale etmediği için Musa'yı bu cevabından dolayı uyardı. Allah ona şu bildirimi yaptı: İki denizin birleştiği yerde kullarından biri vardı ve Musa'dan daha bilgiliydi (Buhârî, İlim, 44).", "Musa, genç yardımcısıyla birlikte, bu bilgin kulu aramak üzere yola çıktı. “İki denizin birleştiği yere ulaşmadıkça yürüyeceğim” dedi. Yanlarına bir balık aldılar; balığın kaybolduğu yer, aradıkları yer olacaktı. Balık denizde yolunu tuttu; genç yardımcı bunu Musa'ya söylemeyi unuttu (Kehf, 18/61-63). Fark edip geri dönünce, o kulu buldular (Kehf, 18/60-65). Allah onu şöyle tanıtır: “Kullarımızdan bir kul; ona katımızdan bir rahmet vermiş, tarafımızdan bir ilim öğretmiştik.” Hadiste adı Hızır diye geçer; Kur'an ise onun adını vermez.", "Musa ona “Sana öğretilen doğru bilgiden bana da öğretmen için seni izleyebilir miyim?” diye sordu. Cevap şöyleydi: “Benimle birlikte asla sabredemezsin. Bilgin yetmediği şeye nasıl sabredersin?” Musa söz verdi: “İnşallah beni sabırlı bulacaksın, sana karşı gelmeyeceğim.” Hızır da şartını koydu: “Bana uyarsan, ben sana söz açmadıkça bir şey sorma.”", "İlk olarak bir gemiye bindiler. Hızır, geminin bir kısmını delip bozdu. Musa dayanamadı: “Yolcularını boğmak için mi deldin? Çok kötü bir şey yaptın!” Hızır “Benimle sabredemezsin demedim mi?” dedi. Musa unuttuğunu söyleyip özür diledi.", "Sonra bir çocukla karşılaştılar; Hızır bir çocuğun hayatına son verdi. Bu sahne kısa ve ağırdır; Musa yine itiraz etti. Hızır sözünü tekrarladı. Musa bu kez şunu söyledi: “Bundan sonra sana bir şey sorarsam, artık benimle arkadaşlık etme.”", "Bir kasabaya vardıklarında halktan yemek istediler; kimse onları ağırlamadı. Orada yıkılmak üzere bir duvar gördüler. Hızır duvarı doğrulttu. Musa “İsteseydin buna karşılık bir ücret alırdın” deyince Hızır: “İşte bu, seninle benim aramın ayrılmasıdır. Sabredemediğin şeylerin yorumunu sana haber vereceğim.” (Kehf, 18/78).", "Yorumlar şöyleydi: Gemi, denizde çalışan yoksul insanlarındı; arkalarında her sağlam gemiyi zorla alan bir kral vardı, o yüzden gemiyi kusurlu yapmıştı. Çocuğun ana babası mümindi; Allah onların bir kötülüğe sürüklenmesini istemedi ve onlara daha hayırlı bir evlat vermek diledi. Duvar ise şehirdeki iki yetim çocuğundu; altında onların hazinesi vardı, babaları da iyi bir insandı. Hızır şöyle bitirdi: “Bunları kendi isteğimle yapmadım.” (Kehf, 18/79-82).", "Hadis-i şerife göre gemiye bindiklerinde bir serçe gelip geminin kenarına konmuş, gagasıyla denizden bir iki yudum almıştı. Hızır o an Musa'ya şöyle demişti: “Benim ilmim ve senin ilmin, Allah'ın ilmi yanında, bu kuşun gagasıyla denizden eksilttiği kadardır.” Yolculuğun sonunda bu sözün anlamı daha iyi anlaşılıyordu: Bilgi sınırlıydı, hikmet ise Allah'a aitti. En bilgili insan bile her şeyi bilemezdi."], "ibret": "Her olayın ardındaki hikmeti göremeyiz. Bilgimizin sınırlı olduğunu kabul etmek, Allah'ın hikmetine güvenmek ve sabretmek insanın olgunluğudur. Sormak güzeldir; ama bilgiyi her zaman Allah'a bırakmak daha güzeldir.", "kaynak": "Kehf Sûresi, 18/60-82; Buhârî, İlim, 44 (122); Müslim, Fezâil, 170 (2380)"}, {"no": 6, "baslik": "Süleyman, Hüdhüd ve Sebe Melikesi", "tur": "kaynakli", "paragraflar": ["Süleyman (a.s.) bir gün kuşları yoklarken hüdhüdün yerinde olmadığını gördü. “Hüdhüdü niçin göremiyorum? Yoksa ortada yok mu?” dedi. Süleyman, bir hükümdar olarak hem düzeni gözetiyor hem de en küçük kuşun yokluğunu fark ediyordu. Yokluğunun nedenini bilmiyordu. Onu sert biçimde cezalandıracağını ya da kendisine açık bir mazeret getirmesi gerektiğini söyledi (Neml, 27/20-21).", "Çok geçmeden hüdhüd geldi ve şöyle dedi: “Senin bilmediğin bir şeyi öğrendim. Sana Sebe'den kesin bir haber getirdim.” Bir kadının onlara hükmettiğini, kendisine her şeyin verildiğini ve büyük bir tahtı olduğunu anlattı. Ama asıl dikkat çeken şeyi şöyle söyledi: “Onu ve halkını, Allah'ı bırakıp güneşe secde ederken buldum.” (Neml, 27/22-24).", "Süleyman cevap verdi: “Doğru mu söyledin yoksa yalancılardan mısın, bakacağız.” Sonra ona bir mektup verdi: “Bu mektubumu götür, onlara bırak, sonra çekilip bak, ne cevap veriyorlar.” Hüdhüd mektubu bıraktı. Kaynaklarda melike Belkıs diye anılır; ama Kur'an adını vermez.", "Melike mektubu okuyunca ileri gelenlerini topladı: “Bana çok önemli bir mektup bırakıldı. Süleyman'dandır ve Rahman, Rahîm olan Allah'ın adıyladır: ‘Bana karşı büyüklük taslamayın, teslim olarak bana gelin.’” Sonra ekledi: “Ey ileri gelenler, işimde bana görüş bildirin; siz yanımda bulunmadıkça hiçbir işe karar vermem.” Ağırbaşlı bir hükümdardı; hemen savaşmayı değil, danışmayı seçti.", "İleri gelenler, güçlü olduklarını söyleyip kararı ona bıraktı. Melike ise ihtiyatlı davrandı. Süleyman'a bir hediye göndermeye ve elçilerin ne ile döneceğine bakmaya karar verdi. Süleyman hediyeyi görünce cevap verdi: “Siz beni malla mı destekleyeceksiniz? Allah'ın bana verdiği, size verdiğinden hayırlıdır. Siz hediyenizle sevinirsiniz.” Ve elçilere, karşı koyamayacakları bir güçle gelebileceğini bildirdi.", "Süleyman, Sebe halkı kendisine teslim olmaya gelmeden önce çevresindekilere sordu: “Hanginiz onların tahtını bana getirir?” Kitaptan bir bilgisi olan biri “Gözünü açıp kapayıncaya kadar getiririm” dedi. Tahtı yanında görünce Süleyman şöyle söyledi: “Bu, Rabbimin lütfundandır; şükür mü edeceğim, nankörlük mü, beni denemek için.” (Neml, 27/38-40). Kitaptan bilgisi olan kişinin adı ayette verilmez.", "Melike geldiğinde tahtını gösterdiler: “Senin tahtın böyle mi?” “Sanki odur” dedi. Sonra ona “Saraya gir” denildi. Zemini bir su havuzu sanıp eteklerini toplamak istedi. Süleyman ona, o zeminin sırçadan döşeli, düz bir saray olduğunu bildirdi (Neml, 27/42-44). Görünenin ardındaki gerçeği fark etmek, o gün onun için bir ders oldu.", "Melike burada görünüşün insanı yanıltabileceğini anladı. İçinden gelen bir duayla şöyle dedi: “Rabbim, ben kendime zulmettim. Süleyman'la birlikte âlemlerin Rabbi Allah'a teslim oldum.” Bir hüdhüdün cesaretle getirdiği haber, bir hükümdarın hidayetine kadar uzanmıştı. Melike, güç ve ihtişam sahibi olmasına rağmen, hakikati görünce başını eğmekten çekinmedi."], "ibret": "Doğru haberi getiren küçük bir kuşun sözü bile dinlenmeye değerdir. Danışmak, ağırbaşlı davranmak ve kibri bırakıp teslim olmak insanı Allah'a yaklaştırır. Hakikat, nereden gelirse gelsin, ona saygı göstermek gerekir.", "kaynak": "Neml Sûresi, 27/20-44"}, {"no": 7, "baslik": "Demiri Yumuşatan Davud", "tur": "kaynakli", "paragraflar": ["Davud (a.s.), Allah'ın kendisine büyük nimetler verdiği bir peygamberdi. Kur'an-ı Kerim bu nimeti şöyle anlatır: “Andolsun ki Davud'a katımızdan bir lütuf verdik: ‘Ey dağlar, onunla birlikte tesbih edin! Kuşlar da!’ Demiri de ona yumuşattık.” (Sebe, 34/10). Demir, insanın elinde zor işlenen bir madde; Davud'un elinde ise kolaylaştırılmıştı.", "Allah ona yalnız bir yetenek vermedi, ona bir yol da gösterdi: “Geniş zırhlar yap ve halkaları dokumada ölçülü ol. Salih amel işleyin; çünkü ben yaptıklarınızı görürüm.” (Sebe, 34/11). Başka bir ayette de “Ona, savaşta sizi korumak için zırh yapmayı öğrettik. Şükredecek misiniz?” diye sorulur (Enbiyâ, 21/80).", "Ayetlerde mucize ile emek el ele verir: Allah demiri yumuşatır, Davud ise ölçülü halkalar dokur. Allah vermiş, kul çalışmıştır. Zırhın sayısı, nasıl yapıldığı ya da kimlere satıldığı gibi ayrıntılar ayette yoktur; bu yüzden onlara girmeyeceğiz.", "Kur'an ayrıca onu şöyle anar: “Elleri kuvvetli kulumuz Davud'u an; çünkü o hep Allah'a yönelirdi.” (Sâd, 38/17). Ve “Dağları, akşam sabah onunla birlikte tesbih ederlerdi, kuşları da toplanmış hâlde” der (Sâd, 38/18-19). Güçlü bir hükümdar, aynı zamanda sürekli Allah'a dönen bir kuldu.", "İşte Peygamberimiz (s.a.v.) bu peygamberin hayatından bir noktayı özellikle vurgular: “Hiç kimse, elinin emeğinden daha hayırlı bir yemek yememiştir. Allah'ın peygamberi Davud da elinin emeğinden yerdi.” (Buhârî, Büyû, 15). Yani en büyük peygamberlerden biri bile geçimini elinin emeğiyle sağlamayı onurlu bulmuştu.", "Zırh dokumak sabır, ölçü ve emek isteyen bir iştir. Bir hükümdarın böyle bir işi onurla yapması ise ayrı bir ders taşır. Geçimini kazanmak, ona göre bir eksiklik değil, bir erdemdi. Davud'un elleri, Allah'ın verdiği mucizeyle demiri yumuşatıyordu ama o, bu nimeti kendi işi için kullanıyordu. Verilen kudret, emeğin yerini almıyordu; emeği daha anlamlı kılıyordu.", "Davud'un bu hâli, bugün de yaşayan bir hakikati hatırlatır: Her meslek, Allah'ın verdiği imkânla yapıldığında kıymet kazanır. Demirci de, kâtip de, hükümdar da aynı Rabbin kuludur. Önemli olan, işin büyüklüğü değil, onu yaparken Allah'ı unutmamaktır.", "Allah, Davud'a hem hikmet hem de hüküm vermişti (Sâd, 38/20). Ama onun asıl öne çıkan yanı, ayetin dediği gibi hep Allah'a yönelmesiydi. Zırh, savaşta insanları koruyacaktı; bir silah değil, bir kalkandı. Güç, korumak için kullanıldığında nimete dönüşür. Nimetin, başkalarını korumak ve geçimini onurla kazanmak için kullanılması ise şükrün ta kendisiydi.", "Alın teri ve şükür, bu kıssanın iki kanadıdır. Bir kanat çalışmaya, diğeri teşekküre aittir. Allah'ın verdiği imkânı, insanlara faydalı olacak şekilde kullanmak, onun nimetine karşılık verebilmenin en güzel yoludur."], "ibret": "Helal kazanç, alın teriyle elde edilen kazançtır. Allah'ın verdiği imkânı iyilikte ve başkalarını korumada kullanmak, nimete şükretmenin en güzel yoludur. Çalışmak da ibadetin bir yoludur.", "kaynak": "Sebe Sûresi, 34/10-11; Enbiyâ Sûresi, 21/79-80; Sâd Sûresi, 38/17-20; Buhârî, Büyû, 15 (2072)"}, {"no": 8, "baslik": "İsa ve Gökten İnen Sofra", "tur": "kaynakli", "paragraflar": ["İsa (a.s.), İsrailoğullarına gönderilmiş bir peygamberdi. Onlara şöyle dedi: “Size Rabbinizden bir mucize getirdim. Çamurdan kuş şeklinde bir şey yapar, ona üflerim; Allah'ın izniyle kuş olur. Anadan doğma körü ve alacalıyı iyileştirir, Allah'ın izniyle ölüleri diriltirim.” (Âl-i İmrân, 3/49). Bu mucizelerin hepsini Allah'ın izniyle yaptığını söylerdi.", "Çağrısı ise sadeydi: “Allah'tan korkun ve bana itaat edin. Şüphesiz Allah, benim de Rabbim, sizin de Rabbinizdir; O'na kulluk edin. Doğru yol budur.” (Âl-i İmrân, 3/50-51). Bir kısmı yüz çevirdi. İsa onlardan inkârı sezince şöyle sordu: “Allah yolunda bana yardımcı olacak kim var?”", "Havariler, İsa'nın en yakın dostlarıydı. Bu kelime “yardımcı, sadık dost” anlamında kullanılır. Onlar İsa'nın etrafında toplandı ve inanan küçük bir topluluk oldu. Kur'an, bu çağrıya cevap verenleri “havariler” diye anar.", "Havariler hemen cevap verdi: “Biz Allah'ın yardımcılarıyız. Allah'a inandık; sen de şahit ol ki biz teslim olanlarız.” Sonra Allah'a şöyle yalvardılar: “Rabbimiz, indirdiğine inandık, peygambere uyduk; bizi şahitlerle beraber yaz.” (Âl-i İmrân, 3/52-53).", "Bir gün havariler ona şöyle dedi: “Ey Meryem oğlu İsa, Rabbin bize gökten bir sofra indirebilir mi?” İsa onları uyardı: “Eğer inanıyorsanız Allah'tan korkun.” Bu, kınamaktan çok bir hatırlatma gibiydi. Mucize istemekten önce, O'na güvenmek gerekiyordu.", "İsa'nın cevabında bir terbiye vardı. Havariler bir mucize istiyor, İsa ise önce kalplerini düzeltmelerini istiyordu. “Allah'tan korkun” demek, istek ile iman arasındaki bağı hatırlatmaktı.", "Havariler isteklerinin sebebini açıkladı: “Ondan yemek istiyoruz; kalplerimiz yatışsın, senin bize doğru söylediğini bilelim ve buna şahit olanlardan olalım.” (Mâide, 5/113). Bu söz, yemekten çok kalplerinin güvene ihtiyaç duyduğunu gösteriyordu.", "İsa bunun üzerine dua etti: “Allah'ım, Rabbimiz! Bize gökten bir sofra indir ki, önce gelenimiz ve sonra gelenimiz için bir bayram ve senden bir mucize olsun. Bizi rızıklandır; sen rızık verenlerin en hayırlısısın.” (Mâide, 5/114). Dua, bir yemek isteğinden çok, şükür ve bayram duygusunu taşıyordu. İsa “önce gelenimiz ve sonra gelenimiz” diyerek yalnız o günkü insanları değil, sonraki nesilleri de duasına kattı.", "Allah şöyle cevap verdi: “Ben onu size indireceğim.” Ardından bir uyarı ekledi: Bundan sonra kim inkâr ederse, âlemlerden hiç kimseye yapmadığı bir azabı ona yapacaktı (Mâide, 5/115). Sorumluluk, nimetle birlikte geliyordu.", "Kur'an, bu sofranın nasıl indiğini, üzerinde neler olduğunu anlatmaz. Müfessirler sofranın indirilip indirilmediği hususunda bile farklı görüşlere sahiptir. Bu yüzden anlatıyı ayetin söylediği yerde bırakıyoruz: Havarilerin isteği, İsa'nın duası ve Allah'ın vaadi. Böylece kıssa, bir mucizeden çok bir duanın hikâyesi olarak kalır."], "ibret": "Kalbin yatışması için istenen şeyde bile Allah'a saygı ve güven gerekir. Nimet geldiğinde şükretmek, istenen şeyin bir sorumluluk da taşıdığını bilmektir. Allah'tan istemek güzeldir; ama güvenle ve saygıyla istemek gerekir.", "kaynak": "Mâide Sûresi, 5/110-115; Âl-i İmrân Sûresi, 3/49-53"}], "kapanis": "Sekiz kıssayı tamamladık. Âdem'in bilgisinden İsa'nın duasına kadar her birinde aynı gerçeği gördük: Allah, kuluna yol gösterir; sabreden, şükreden ve teslim olan kurtuluşa erer. Kıssaların asıl değeri, onların bizim hayatımıza dokunmasındadır. Allah bizi, anlattığı bu güzel örneklerden ders alanlardan eylesin.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/02/", "kapak": "../../kapak/02.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 3, "baslik": "Sahabelerin Örnek Hayatları", "hazir": true, "yol": "../03/index.html"}, "pdf": "../../pdf/kitap-02.pdf", "epub": "../../epub/kitap-02.epub", "gorunum": "kitap-gorunumu.html"}</script>
