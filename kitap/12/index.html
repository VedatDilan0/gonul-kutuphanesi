<script type="application/json" id="kitap-veri">{"no": 12, "baslik": "Hayvanlara Merhamet", "tanitim": "Susuz bir köpeğe, yavrusunu arayan bir kuşa, karınca vadisine, bir hurmalığa kadar; canlılara merhameti ve doğaya saygıyı anlatan sekiz sahih hikâye.", "onsoz": "Merhamet yalnız insanlara gösterilen bir güzellik değildir. Kur'an ve sahih hadisler, susayan bir köpeğin, yavrusunu arayan bir kuşun, yorulmuş bir devenin ve küçücük bir karıncanın bile Allah katında değerli olduğunu bize hatırlatır. Bu kitaptaki hikâyeler, merhametin sınırının olmadığını gösterir. Okurken kalbinizin yumuşadığını göreceksiniz.", "hikayeler": [{"no": 1, "baslik": "Susuz Köpeğe Su Veren Adam", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimiz (s.a.v.) bir gün sahabilerine, geçmişte yaşamış bir adamın hikâyesini anlattı. Ebû Hüreyre (r.a.) bu hadisi bize nakleder. Adam yolda yürürken şiddetli bir susuzluk hissetti. Önünde bir kuyu belirdi. Kuyuya indi, kana kana su içti ve yeniden yukarı çıktı. Susuzluğun geçtiği o ilk anlarda yolculuğuna devam edebilirdi.", "Yolculuk insanı yorar; susuzluk ise ona dünyanın en kıymetli şeylerinden birini hatırlatır: bir yudum su. Kuyunun başında susuzluğunu gideren adam, o suyun ne kadar değerli olduğunu çok iyi biliyordu.", "Tam o sırada gözüne bir şey ilişti: Bir köpek, susuzluktan dilini dışarı çıkarmış, nemli toprağı yalıyordu. Adam bir an durdu. Köpeğe baktı ve kendisinin az önceki hâlini onda gördü. İçinden şöyle dedi: “Bu köpek de benim gibi susuzluktan bu hâle gelmiş.”", "Kur'an, yeryüzünde yürüyen her canlı ve iki kanadıyla uçan her kuş için “sizin gibi birer ümmettir” der. (En'âm, 6/38) Yani hayvanlar da Allah'ın yarattığı, kendi düzeni ve hesabı olan topluluklardır.", "Çoğumuz bu noktada başımızı çevirip yolumuza devam edebilirdik; çünkü köpek bizim değildi ve bizden bir şey istemiyordu. Adam ise öyle yapmadı. Yeniden kuyuya indi. Elinde bir kap yoktu; bu yüzden mestini suyla doldurdu. Sonra mestin ağzını dişleriyle tutup kuyudan çıktı ve suyu köpeğe içirdi.", "Peygamber Efendimiz hadisin sonunu şöyle haber verir: Allah, adamın bu davranışını kabul etti ve onu bağışladı. Dikkat edin: Ne uzun bir namaz vardı ne büyük bir sadaka. Yalnızca susamış bir canlıya uzatılan bir yudum su vardı. Allah, bunu adamın bağışlanmasına vesile kıldı.", "Sahabiler bunu duyunca şaşırdılar ve sordular: “Ey Allah'ın Resulü, hayvanlar için de bize sevap var mı?” Peygamber Efendimiz şu cevabı verdi: “Her canlıya yapılan iyilikte sevap vardır.” Bu cevap, merhametin sınırını çizmez; aksine genişletir. İnsanın iyiliği yalnız insanlara değil, kendisine muhtaç olan her canlıya ulaşmalıdır.", "Bu hikâyede bir ders daha var: Adam, hayvanın susuzluğunu kendi susuzluğuna benzeterek anladı. Merhamet çoğu zaman “Ben olsam ne isterdim?” sorusuyla başlar. Kendi ihtiyacını yaşamış bir gönül, başkasının ihtiyacını da daha kolay görür. Adamın yaptığı şey, bir köpeğe su vermekten ibaret görünse de aslında bir kalbin uyanışıydı.", "Bugün de bir kap su, bir sokak hayvanına gösterilen küçük bir ilgi, bu hadisin yankısıdır. Kimsenin görmediği bir yerde, karşılık beklemeden yapılan bu kadar küçük bir iyilik, bir insanın bağışlanmasına vesile olabilir. Allah, en küçük merhameti bile unutmaz. O gün kimse adamın yaptığını görmemişti; ama Allah görmüştü."], "ibret": "Susayan bir canlıya uzatılan bir yudum su, Allah katında büyük bir iyiliktir. Merhametin sınırı yoktur; her canlıya yapılan iyilikte sevap vardır. Kimse görmese de Allah görür.", "kaynak": "Buhârî, Müsâkât, 9 (2363); Edeb, 27 (6009); Müslim, Selâm, 153 (2244); En'âm Sûresi, 6/38"}, {"no": 2, "baslik": "Ağlayan Deve", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimiz (s.a.v.) bir gün Medine'de ensardan bir adamın bahçesine girdi. Abdullah b. Ca'fer (r.a.) bu olayı anlatır. Bahçede bir deve vardı. Deve, Peygamberimizi görünce inledi ve gözlerinden yaşlar aktı. Hayvanın gözyaşı, sessiz ama anlaşılır bir hâl diliydi.", "Peygamber Efendimiz devenin yanına gitti. Elini devenin kulağının arkasına koyup başını okşadı. Deve sakinleşti ve susmaya başladı. Bir yaratığın acısını fark edip ona şefkatle yaklaşmak, işte böyle sade bir davranışla görünür oldu. Bu sade hareket, hayvanın acısına verilmiş ilk cevaptı.", "Peygamber Efendimiz okşamakla yetinmedi. Bu da gösteriyor ki merhamet, yalnız bir okşamayla bitmez; sorumluya doğruyu söylemeyi de gerektirir.", "Sonra sordu: “Bu devenin sahibi kim?” Ensardan bir genç gelip: “Bana ait ey Allah'ın Resulü” dedi. Peygamber Efendimiz şöyle buyurdu: “Allah'ın sana sahip kıldığı bu hayvan hakkında Allah'tan korkmuyor musun? Çünkü deve bana, onu aç bıraktığını ve yorduğunu şikâyet ediyor.”", "Dikkat edin: Devenin derdini bize bildiren, Peygamberimizin kendi sözüdür; hadis devenin ağzından ayrıca bir söz aktarmaz. Önemli olan, bir hayvanın acısının görülmesi ve sahibine hatırlatılmasıdır. Deve, konuşamıyordu; ama gözyaşı ve inleme bir derdi anlatıyordu. Peygamber Efendimiz onun dilini anladı ve hakkını savundu.", "Başka bir rivayette Sehl b. Hanzaliyye (r.a.) şöyle anlatır: Peygamber Efendimiz, sırtı karnına yapışmış, çok zayıflamış bir deve gördü ve şöyle buyurdu: “Bu dilsiz hayvanlar hakkında Allah'tan korkun. Onlara binin, ama sağlıklı oldukları sürece binin; onları yiyin, ama sağlıklı olarak yiyin.” Bu söz, hayvanın hem bakımını hem de gücünü aşan işlerle yorulmamasını gözetir.", "Kur'an, hayvanların insanlar için bir nimet olduğunu hatırlatır: Onlarda ısınma vesileleri ve faydalar vardır; onlar, canınızı yıpratmadan ulaşamayacağınız yerlere ağır yüklerinizi taşır. (Nahl, 16/5-7) Demek ki deve gibi bir hayvan, insana verilmiş bir nimettir; nimetin şükrü de ona iyi bakmaktır.", "Allah, hayvanları insanın hizmetine verdi. Ama bu, onları yorup bırakmaya izin vermek değil, onlara bakmak ve ihtiyaçlarını gözetmek sorumluluğudur. Sahip olduğumuz şeyler birer emanettir; Allah'ın bize emanet ettiği canlı, bizden hesabı sorulacak bir sorumluluktur.", "Deve sahibi olan genç, bu uyarıdan sonra ne yaptı? Hadis bunu anlatmaz. Ama Peygamber Efendimizin gösterdiği şefkat ve söylediği söz, bütün hayvan sahiplerine bir ders olarak kaldı. Bir hayvanın bakışında bile bir ihtiyaç, bir şikâyet, bir yardım çağrısı olabilir. Bunu görebilmek, gönlümüzün inceliğine bağlıdır. Bir hayvanın yorgunluğu, her zaman bir sözle anlatılmaz; zayıflayan bedeni, çökmüş duruşu, durgun gözleri bir hâl dilidir. Gören göz ve duyan kalp için bu yeterlidir."], "ibret": "Hayvanlar Allah'ın bize emanetidir; onları aç bırakmak ya da gücünün üstünde yormak sorumluluktur. Dilsiz canlıların hâlini görmek, merhametli bir gönlün işidir. Nimetin şükrü, ona iyi bakmaktır.", "kaynak": "Ebû Dâvûd, Cihâd (2549, 2548); Ahmed b. Hanbel, Müsned, 1/204-205; Nahl Sûresi, 16/5-7"}, {"no": 3, "baslik": "Yavrusunu Arayan Kuş", "tur": "kaynakli", "paragraflar": ["Abdullah b. Mes'ûd (r.a.) anlatır: Bir yolculukta Peygamber Efendimizle (s.a.v.) birlikteydik. Peygamberimiz bir ihtiyacı için yanımızdan ayrıldı. Biz de bu arada serçe büyüklüğünde, hummara denen bir kuş gördük. Kuşun iki yavrusu vardı. Yavruları yuvadan alıp yanımıza aldık.", "Yolculukta insan, bir mola yerinde etrafına bakar. Bir ağacın ya da çalının içindeki yuva, bir yolcunun gözüne küçük bir hazine gibi görünebilir. Oysa o yuva, bir annenin bütün dünyasıdır.", "O sırada anne kuş geldi. Başımızın üzerinde dönmeye başladı. Kanatlarını çırpıyor, havada bir o yana bir bu yana savruluyordu. Yavrularının yokluğu, onu çaresiz bırakmıştı. Bu, bir annenin yavrusu için çırpınışıydı; dilsiz bir telaş ama bütün çıplaklığıyla bir şefkat sahnesiydi.", "Peygamber Efendimiz geri döndü ve bu manzarayı gördü. Şöyle buyurdu: “Bu kuşu yavrularıyla kim üzdü? Yavrularını ona geri verin.” Kuşun çırpınışı, ona söylenmemiş ama anlaşılan bir şikâyetti. Anne kuşun çırpınışını gören herkes, bir annenin sevgisinin bütün canlılarda aynı derinlikte olduğunu hissedebilir. Bu sevgiyi korumak da bize düşer.", "Burada dikkat çeken şey, Peygamberimizin anne kuşun yavrusuna duyduğu şefkati ciddiye almasıdır. Kuşun telaşı, yavrusundan ayrılan her annenin telaşına benziyordu; Peygamberimiz bu acıyı görmezden gelmedi ve yavruların hemen geri verilmesini istedi. Allah, bu şefkati bütün canlıların kalbine koymuştur ve bu şefkate saygı göstermek, imanın güzel bir göstergesidir.", "Kur'an, kuşlara da özel bir yer verir: “Göklerde ve yerde olanların, kanatlarını açmış kuşların Allah'ı tesbih ettiğini görmedin mi? Her biri kendi duasını ve tesbihini bilmiştir.” (Nûr, 24/41) Bu ayet, bir kuşun yuvasında bile bir ibadet, bir hayat, bir düzen olduğunu hatırlatır.", "Peygamberimizin emri açıktı; rivayetin gidişinden yavruların anne kuşa geri verildiği anlaşılır. Biz de bu emri, çevremizdeki canlılara karşı bir ölçü olarak alabiliriz: Bir yuvayı dağıtmadan, bir yavruyu annesinden ayırmadan önce, annenin çırpınışını düşünmeliyiz.", "İnsan, çoğu zaman elinin yetiştiği şeyi alabileceğini sanır. Çünkü küçük bir yavru, tutulması kolay bir şeydir. Ama Peygamberimizin sorusu, bu kolaylığın bir hakka dönüşmediğini hatırlatır: “Bu kuşu yavrularıyla kim üzdü?” Soru, hem bir uyarı hem de bir öğretidir.", "Küçük bir kuşun ya da bir yuvanın değeri, Allah katında dünyanın hesaplarıyla ölçülmez. Rahmet sahibi Allah, kullarından da rahmet ister. Peygamber Efendimiz, bir anne kuşun çırpınışında bile, bu rahmeti gösterdi. Peygamberimizin “geri verin” demesi, hatayı düzeltmenin yolunu da gösterir: Zarar verdiysek, elden geldiğince eski hâline döndürmeliyiz. Pişmanlık, ancak bir onarımla tamamlanır. Küçük bir kuş bile Allah'ın rahmetinden pay alır."], "ibret": "Anne şefkati yalnız insanlara özgü değildir; bir kuşun yavrusu için çırpınışına saygı göstermek de imanın güzel bir hâlidir. Zararı fark edince onarmak, güçlü olanın erdemidir.", "kaynak": "Ebû Dâvûd, Cihâd (2675), Edeb (5268); Ahmed b. Hanbel, Müsned, 1/404; Nûr Sûresi, 24/41"}, {"no": 4, "baslik": "Süleyman ve Karıncalar", "tur": "kaynakli", "paragraflar": ["Allah, Davud'a ve Süleyman'a ilim verdi. İkisi de şöyle dedi: “Bizi müminlerden birçoğuna üstün kılan Allah'a hamdolsun.” (Neml, 27/15) Süleyman, babası Davud'un mirasçısı oldu. İnsanlara şöyle seslendi: “Ey insanlar! Bize kuşların dili öğretildi ve bize her şeyden verildi. Şüphesiz bu, apaçık bir lütuftur.” (Neml, 27/16)", "Kuşların dilini bilmek ve her şeyden verilmiş olmak, bir hükümdar için büyük bir imtihandır. Çünkü güç arttıkça, insan kendini unutabilir. Süleyman ise bunu açıkça “Şüphesiz bu, apaçık bir lütuftur” diyerek Allah'a bağladı.", "Süleyman'ın büyük bir ordusu vardı. Kur'an, bu ordunun cinlerden, insanlardan ve kuşlardan oluştuğunu bildirir; hepsi düzenli sıralar hâlinde yürütülürdü. (Neml, 27/17) Bir gün bu ordu yola çıktı.", "Süleyman ve ordusu, karıncaların bulunduğu bir vadiye geldi. O sırada bir karınca, diğer karıncalara şöyle seslendi: “Ey karıncalar! Yuvalarınıza girin. Süleyman ve ordusu, farkında olmadan sizi ezmesin.” (Neml, 27/18) Bu söz, küçük bir canlının, en güçlü hükümdarın ordusunun gücünü bilmesini ve kendi türünü korumak için uyarı yapmasını gösterir. Kur'an bu karıncanın adı, boyu ya da başka bir özelliği hakkında bilgi vermez.", "Süleyman bu sözü duydu. Kur'an, ardından şöyle der: “Süleyman, onun sözüne gülümsedi.” (Neml, 27/19) Bu gülümseme, güçlü bir hükümdarın en küçük canlıyı duymasının sıcaklığıdır. Süleyman bu sesi küçümsemedi; ne öfkelendi ne de umursamaz davrandı.", "Bir düşünün: Büyük bir ordunun başında olan biri, en küçük bir sesi de duyabilir. Karıncanın sesi o kadar inceydi ki çoğumuz belki duymazdık bile. Süleyman'ın bu sesi duyması, hükümdarlığının yalnız bir güç değil, aynı zamanda bir dikkat ve incelik olduğunu gösterir.", "Sonra Allah'a şöyle dua etti: “Rabbim! Bana ve anne babama verdiğin nimete şükretmemi, razı olacağın iyi işler yapmamı bana ilham et. Beni rahmetinle salih kulların arasına kat.” (Neml, 27/19) Dikkat edin: Süleyman, karıncanın sözünü duyduktan sonra kendini övmedi, gücüyle böbürlenmedi; aksine şükrü ve salih ameli diledi.", "Bu hikâye, gücün ve tevazunun nasıl bir arada olabileceğini gösterir. Güç, insana yalnız hükmetme hakkı değil, korumak sorumluluğu da verir. En büyük ordu, en küçük canlının yaşamına da dikkat etmek zorundadır. Karıncanın uyarısı, Süleyman'ı küçültmedi; onu daha da olgunlaştırdı.", "Bizim de gücümüz vardır: Bir sözün, bir adımın, bir işin gücü. Bazen bir sokağı geçerken, bir bahçede yürürken, bir yuvanın yakınında dururken küçük bir canlıya zarar vermeden geçmek bile bir şükür biçimidir. Bu hikâye bize, güçlü olmanın merhametli olmakla güzelleştiğini öğretir. Gerçek büyüklük, küçükleri fark edebilmektir."], "ibret": "Gücü olan, güçsüzü gözetmekle sorumludur. Süleyman, en küçük canlıyı bile duyarak gücünü şükürle ve tevazuyla taşımanın örneğini gösterdi. Allah'a şükür, güçlünün en güzel süsüdür.", "kaynak": "Neml Sûresi, 27/15-19"}, {"no": 5, "baslik": "Bir Karınca Yuvası ve Gelen Uyarı", "tur": "kaynakli", "paragraflar": ["Ebû Hüreyre (r.a.), Peygamber Efendimizin (s.a.v.) önceki peygamberlerden biri hakkında anlattığı bir olayı nakleder. Hadiste o peygamberin adı belirtilmez. Peygamber bir yolculuk sırasında bir ağacın altında dinleniyordu. Bu sırada bir karınca gelip onu ısırdı.", "Peygamber, ısırığın acısıyla eşyasının ağacın altından çıkarılmasını emretti. Eşyası çıkarıldı. Sonra karınca yuvasının ateşe verilmesini de emretti ve yuva yakıldı. Hadis şârihleri, zarar veren bir canlıyı yakmanın o peygamberin şeriatında yasak olmadığını, uyarının ise yalnız ısıran karıncayla yetinilmemesine yönelik olduğunu söyler.", "İşte tam o sırada, Allah bu peygambere şöyle vahyetti: “Seni bir karınca ısırdı diye, Allah'ı tesbih eden bir topluluğu mu yaktın? Madem bir karınca seni ısırdı, bir karıncayla yetinseydin.” Bu söz, bir azarlamadan çok, hakikati hatırlatan bir terbiyedir. Peygamber Efendimiz de bu olayı sahabilerine anlatarak onlara canlılara karşı ölçülü olmayı öğretmiştir.", "Karıncalar, yuvalarında birlikte çalışan düzenli bir topluluk olarak yaşar. Bir yuvayı yakmak, tek bir ısırığa karşılık sayısız canı yok etmek demektir. Kur'an'da da karıncalar bir topluluk olarak anılır; Süleyman'ın hikâyesindeki karınca “Ey karıncalar!” diye seslenir. (Neml, 27/18)", "Bu uyarının derin bir anlamı var. Kur'an, “Yedi gök, yer ve onlardaki herkes O'nu tesbih eder. O'nu hamd ile tesbih etmeyen hiçbir şey yoktur” der. (İsrâ, 17/44) Karıncalar da bu tesbih edenlerin arasındadır. Biz onların dilini bilmeyiz; ama Allah bilir. Bu yüzden küçücük bir canlı bile, Allah katında bir değere sahiptir.", "Allah'ın uyarısındaki ölçü de çok önemlidir: “Bir karıncayla yetinseydin.” Yani tepki, acıya denk olmalı; suçsuzlara değil, yalnız zarar verene yönelmelidir. Zararı veren bir karıncaysa, bütün bir yuva değil, o karınca sorumludur. Merhametin yanında adaletin ölçüsü de burada görünür.", "Peygamber Efendimiz başka bir olay üzerine de şöyle buyurmuştur: “Ateşle ancak Allah azap eder.” Bu söz karınca hadisinden ayrı bir vesileyle söylenmiştir, ama aynı ölçüyü hatırlatır: Bir canlıyı ateşle cezalandırmak, insanın hakkı değildir. Allah'ın yarattığı en küçük hayatın bile ayrı bir hürmeti vardır.", "Bu hikâyeden öğrendiğimiz şey, öfke anında bile canlılara karşı ölçülü olmanın gerekliliğidir. Küçük bir acı, büyük bir tepkiyi haklı çıkarmaz. Başkasına verdiğimiz zarar, bize verilen zarardan büyükse, adalet terazisi bozulmuş demektir. Her canlıya, hatta düşman gibi görünen küçük bir böceğe bile haksızlık yapmamak bir imtihandır.", "Hadisin ardında bir güzellik daha var: Allah, uyarısını bir ölçüyle ve sevgiyle bildirdi. Öfkelendiğimiz anda karşımızdaki canlının da bir topluluğun ferdi olduğunu, Allah'ı kendi diliyle andığını aklımızdan çıkarmamalıyız. Bizim de çevremizdeki canlılara karşı tutumumuz, bu uyarının ışığında olmalıdır."], "ibret": "Her canlı Allah'ı kendi diliyle anar; bu yüzden küçük bir canlıya bile haksızlık etmemeliyiz. Öfkemiz acımızı aşmamalı, tepkimiz ölçülü olmalıdır. Merhamet, öfke anında da elden bırakılmaz.", "kaynak": "Buhârî, Cihâd, 153 (3019); Bed'ü'l-halk, 16 (3319); Müslim, Selâm, 148-150 (2241); Buhârî, Cihâd, 149 (3016); Neml Sûresi, 27/18; İsrâ Sûresi, 17/44"}, {"no": 6, "baslik": "Abdest Kabından Su İçen Kedi", "tur": "kaynakli", "paragraflar": ["Sahabilerden Ebû Katâde (r.a.), oğlunun evinde abdest almaya hazırlanıyordu. Gelini Kebşe bint Ka'b (r.anha), abdest alması için ona bir kapta su getirdi. Ebû Katâde suyu almak üzereyken bir kedi geldi. Kedi, kabın yanına yaklaşıp su içmek istedi. Sade bir evde, günlük hayatın içinde yapılan böyle bir hazırlık, çoğu zaman kimsenin dikkatini çekmez.", "Ebû Katâde bu sırada ne yaptı? Kediyi kovmadı. Küçücük bir hayvan, kapta su görüp susuzluğunu gidermek için yaklaşmıştı; Ebû Katâde onun bu isteğini görmezden gelmedi, acele etmeden ona yer açtı. Abdest kabını kediye doğru eğdi ve kedi kana kana içene kadar bekledi. Abdest vakti gelmişti; yine de bir susamış canlıyı beklemekte bir sakınca görmedi. Kebşe, kayınpederinin bu davranışına şaşkınlıkla bakıyordu.", "Ebû Katâde onun bakışlarını fark etti. Şöyle dedi: “Kızım, şaşırdın mı?” Bunun üzerine Ebû Katâde ona Peygamber Efendimizin (s.a.v.) şu sözünü hatırlattı: “Kedi pis değildir. O, sizin etrafınızda dolaşıp duranlardandır.”", "Bu cevap hem fıkhî hem de ahlaki bir derinlik taşır. Kedi, ev içinde insanların arasında dolaşan, onlarla birlikte yaşayan bir canlıdır. Peygamberimiz de onu, ev içinde insanların arasına girip çıkan, onlara yakın yaşayan canlılardan saymıştır. Bu söz, kedinin artığını abdest için de kullanılabilir saymanın dayanağı olmuştur. Ev halkından biri bir canlıya yol açınca, ev de merhametle dolar.", "Ama hadisin güzelliği yalnız hükümde değil, bir sahabinin davranışındadır. Abdest almak büyük bir ibadete hazırlıktır; ibadetin vakti geldiğinde bile bir canlıyı susuz bırakmamak, bu ibadetin ruhunu gösterir. İbadet ile merhamet birbirinin karşıtı değil, tamamlayıcısıdır.", "Abdest, ibadetten önce bir hazırlıktır; temizlik de imanın yarısı sayılmıştır. Bu yüzden kedinin kapta su içmesine izin vermek, ilk bakışta temizlik anlayışıyla çelişiyor gibi görünebilir. Oysa hadis, kedinin insanların arasında dolaşan bir canlı olduğunu hatırlatarak bu şaşkınlığı giderir. Ebû Katâde de Peygamberimizden öğrendiği ölçüyle hem temizliğin hem merhametin hakkını gözetti.", "Ebû Katâde'nin gelinine verdiği cevap da dikkat çeker. O, kendi görüşünü söylemedi; Peygamberimizden duyduğunu aktardı. Böylece bir davranışı yalnız “böyle yapılıyor” diye değil, “Resûlullah böyle buyurmuştu” diyerek temellendirdi. Gelin de bu davranışın arkasındaki bilgiyi öğrenmiş oldu.", "Bugün de evlerimizde, sokaklarımızda kediler dolaşıyor. Onlara bir kap su vermek, bir parça yiyecek bırakmak, küçük bir iyilik gibi görünebilir. Ama bu küçük davranışın arkasında, Peygamberimizin “etrafınızda dolaşanlardan” dediği bir canlıya gösterilen saygı vardır. Merhamet, evin içinden sokağa uzanan bir yoldur. Bir avluda, bir kapı eşiğinde bir kedinin yanımızdan geçmesi çoğumuz için sıradan bir andır. Oysa bu sıradan an, kalbimizin ölçüsünü gösterir."], "ibret": "Evimizin yakınında yaşayan kedi gibi canlılar, Peygamberimizin ifadesiyle etrafımızda dolaşan, bize yakın canlılardır. İbadete hazırlanırken bile bir canlıya merhamet etmek, ibadetin güzelliğini artırır. İbadet ile merhamet birbirini tamamlar.", "kaynak": "Ebû Dâvûd, Tahâret, 38 (75); Tirmizî, Tahâret (92); Nesâî, Tahâret (68); İbn Mâce, Tahâret (367)"}, {"no": 7, "baslik": "Nişan Tahtası Yapılan Kuş", "tur": "kaynakli", "paragraflar": ["Abdullah b. Ömer (r.a.) bir gün yolda yürüyordu. Yolda bir grup gence rastladı. Gençler bir kuşu bağlamış, onu hedef yaparak ona ok atıyorlardı. Rivayete göre hedefi ıskalayan her ok için kuşun sahibine bir bedel ödüyorlardı. Kuş, çaresizce orada duruyordu. Kuş, bu oyunun tek mağduruydu.", "Bir canlıyı hedef yapmak, onun acısını bir oyuna çevirmektir. Kuş ne kaçabilir ne kendini koruyabilirdi; bağlı olması onu tamamen çaresiz kılıyordu. Bir yaratığın çaresizliğinden eğlence çıkarmak, kalpteki merhameti de yavaş yavaş körelten bir alışkanlıktır.", "Gençler İbn Ömer'i görünce hemen dağıldılar. Belki de yaptıkları şeyin yanlış olduğunu biliyorlardı; belki de bir büyüğün yaklaşmasından çekindiler. Kaynaklar bunun sebebini söylemez. Ama dağılmaları, vicdanlarının bir şeyi fark ettiğini gösterir.", "İbn Ömer, durumu anlayınca şöyle dedi: “Bunu kim yaptı? Allah onu rahmetinden uzak kılsın.” Bu ifade Türkçede ağır gelebilir; ama sözü söyleyen bir öfke gösterisi yapmıyor, Peygamberimizin bir uyarısını aktarıyordu. Devamında şöyle dedi: “Resûlullah (s.a.v.), canlı bir şeyi nişan tahtası yapan kimseyi Allah'ın rahmetinden uzak olsun diyerek kınamıştır.”", "Bu söz, hadislerde “lanet” diye geçen ifadenin karşılığıdır. Yani Allah'ın rahmetinden uzak olma temennisidir. Canlı bir hayvanı eğlence aracına çevirmenin ne kadar kötü bir davranış olduğunu bu ifade çok güçlü biçimde anlatır.", "Bir canlıdan faydalanmak başka, ona gereksiz acı çektirmek başkadır. İslam, hayvanın etinden, sütünden, gücünden yararlanmaya izin verir; ama bunu merhametle ve ölçüyle yapmayı ister. Ortada bir ihtiyaç yokken yapılan eziyet, hiçbir mazeretle güzelleşmez.", "Buhârî'nin rivayetinde bu hayvan bir tavuk, Müslim'in bir rivayetinde ise bir kuş olarak geçer; ikisi de aynı olayı anlatır. Önemli olan, hayvanın acı çekmesinden zevk alınmasıdır. Bir canlıyı hedef tahtası yapmak, onun acısını eğlenceye dönüştürmektir. İslam bunu kesin bir dille yasaklamıştır.", "Peygamberimiz başka bir hadisinde ise şunu buyurmuştur: “Allah her şeyde iyiliği (güzelliği) emretmiştir. Öldürürseniz güzel öldürün, keserseniz güzel kesin. Biriniz bıçağını bilesin ve kestiği hayvanı rahat ettirsin.” Bu söz, hayvana yapılan en zorunlu muamelede bile acıyı en aza indirmeyi gerekli kılar.", "O hâlde bir canlı, eğlence malzemesi değil, Allah'ın emanetidir. Gençlerin dağılması vicdanın sesini gösterir. İbn Ömer'in davranışı da bir ölçü verir: Yanlış bir şey gördü, susmadı ve sözünü Peygamberimizin hadisine dayandırdı. İyiliği emretmek, bilgiye dayanınca daha sağlam olur. Bir yanlışı görüp susmamak, güzel bir ahlaktır. Bugün de hayvanları eğlence ya da gösteri aracı yapan, onlara gereksiz acı çektiren davranışlar çeşitli biçimlerde karşımıza çıkabilir. Bu hadis, hepsine karşı vicdanın duyarlı olmasını öğretir."], "ibret": "Canlı bir hayvanı eğlence malzemesi yapmak, Allah'ın merhametine aykırıdır. Allah her şeyde iyiliği ve güzelliği emretmiştir; yanlış gördüğümüzde nazikçe uyarmak da bize düşer. Susmamak da bir sorumluluktur.", "kaynak": "Buhârî, Zebâih, 25 (5515); Müslim, Sayd, 58-59 (1958); Müslim, Sayd, 57 (1955)"}, {"no": 8, "baslik": "Ümmü Mübeşşir'in Hurmalığı", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimiz (s.a.v.) bir gün Medine'de, ensardan Ümmü Mübeşşir'in hurmalığına girdi. Câbir b. Abdullah (r.a.) bu olayı nakleder. Hurma ağaçları sıra sıra duruyordu; gölgeleri, bahçenin sessizliğini örtüyordu. Peygamberimiz ağaçlara bakarak sordu: “Bu hurma ağaçlarını kim dikti?”", "Aldığı cevap şuydu: “Bir Müslüman dikti.” Bunun üzerine Peygamber Efendimiz çok güzel bir ölçü ortaya koydu: “Hiçbir Müslüman bir ağaç dikmez ya da bir ekin ekmez ki, ondan bir insan, bir hayvan ya da bir kuş yesin de bu, onun için sadaka olmasın.” Bu söz, bir hurma ağacının gölgesine sığınan yorgun yolcudan, dalına konan kuşa kadar herkese ve her canlıya ulaşan bir iyiliği müjdeler.", "Hurma ağacı, çöl iklimlerinde bir hayat kaynağıdır; meyvesi, gölgesi, dalı, yaprağı insanların ihtiyacını karşılar. Bir hurmalık, yalnız sahibine değil, yoldan geçene de ikram eder.", "Dikkat edelim: Peygamberimiz ağaçları kimin diktiğini sordu; cevabı alınca da sözü, bir fidanın herkese ulaşan hayrına getirdi. Konu, ağaç dikmenin kendisindeki güzelliktir. Bir Müslüman bir fidan diktiğinde, onun bütün meyvesi, gölgesi, yaprağı sadaka kapsamına girer. Kimin yediğini, nasıl yediğini bile bilmesi gerekmez.", "Bu hadis, insanı doğayla ilişkisinde yeni bir bakışa çağırır. Bir ağaç, yalnızca ona bakan için değil; yiyecek arayan bir kuş, gölge arayan bir hayvan, rızık arayan bir insan için bir hayır kaynağıdır. Dikenin ya da ekenin hiç görmediği canlılar bile onun emeğinden pay alır. Bu, sürekli akan bir sadakadır.", "Peygamber Efendimizin şu sözü de nakledilir. Ahmed b. Hanbel'in Müsned'inde geçer ve sahih kabul edilir: “Kıyamet kopacak olsa ve birinizin elinde bir fidan bulunsa, o kıyamet kopmadan onu dikebiliyorsa dikmeden kalkmasın.” Bu söz, umudun ve çalışmanın ne kadar değerli olduğunu bildirir.", "Kur'an da yeryüzünden çıkan nimetlerin yalnız insana değil, hayvanlara da bir geçimlik olduğunu hatırlatır: Allah, suyu indirir, yeri yarar ve tahıl, üzüm, zeytin, hurma, bahçeler, meyve ve çayır bitirir; bunlar hem sizin hem hayvanlarınız için bir geçimliktir. (Abese, 80/24-32)", "Bu iki hadis birlikte okunduğunda şunu anlarız: Ağaç dikmek, yalnız bir bahçecilik işi değil, bir ibadettir. Üstelik sonucunu göremeyeceğimiz bir işi bile Allah için yapmak, güzel bir tevekkül ve cömertlik örneğidir. Bu, nesillerin birbirine bıraktığı bir emanettir.", "Bugün bir fidan dikmek, yarın gölgede dinlenecek bir yolcuya, dalında yuva yapacak bir kuşa, kuş sesiyle uyanacak bir çocuğa bir hayır bırakmaktır. Ümmü Mübeşşir'in hurmalığı bize, yeryüzünü güzelleştirmenin ibadet kadar kıymetli olduğunu hatırlatır. Bir fidanın gölgesinde dinlenecek olan, belki hiç tanımadığımız biridir."], "ibret": "Ağaç dikmek ve ekin ekmek, insana, hayvana ve kuşa ulaşan sürekli bir sadakadır. Doğaya gösterilen emek ve saygı Allah katında karşılıksız kalmaz; yeryüzünü güzelleştirmek bir ibadettir.", "kaynak": "Müslim, Müsâkât (1552, 1553); Buhârî, Hars, 1 (2320); Edeb, 27 (6012); Ahmed b. Hanbel, Müsned, 3/183, 191; Abese Sûresi, 80/24-32"}], "kapanis": "Bir yudum su, bir kuşun yavrusu, küçük bir karınca, bir fidan... Bu hikâyeler bize, merhametin her canlıya uzanan bir iman hâli olduğunu gösterdi. Allah, kullarına rahmet eder; rahmet eden kullarına da daha çok rahmet eder. Çevremizdeki küçük canlıları görebilmek, kalbimizin inceliğinin ölçüsüdür.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/12/", "kapak": "../../kapak/12.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 13, "baslik": "Affetmenin Güzelliği", "hazir": true, "yol": "../13/index.html"}, "pdf": "../../pdf/kitap-12.pdf", "epub": "../../epub/kitap-12.epub"}</script>
