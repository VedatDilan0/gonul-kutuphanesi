<script type="application/json" id="kitap-veri">{"no": 1, "baslik": "Peygamberimizin Güzel Ahlakı", "tanitim": "Peygamber Efendimizin merhametini, yumuşaklığını ve insana verdiği değeri sahih hadislerden sekiz hikâyeyle anlatan bir kitap.", "onsoz": "Bu kitapta sekiz kısa hikâye var; hepsi hadis kitaplarında yer alan gerçek olaylar. Tâif yolundan Medine mescidine, bir çocuğun kuşundan bir komşunun kapısına kadar, Peygamber Efendimizin merhametini, yumuşaklığını ve insana verdiği değeri yakından göreceğiz. Her hikâyenin sonunda kaynağı yazılıdır. İsterseniz kendi kitaplarınızdan açıp bakabilirsiniz.", "hikayeler": [{"no": 1, "baslik": "Tâif Dönüşünde Gelen Melek", "tur": "kaynakli", "paragraflar": ["Bir gün Hz. Âişe, Peygamber Efendimize (s.a.v.) bir soru sordu: “Ey Allah'ın Resûlü, senin için Uhud gününden daha zor bir gün oldu mu?” Uhud'da Peygamberimiz yaralanmış, amcası Hamza dâhil nice sevdiğini kaybetmişti. Âişe'nin sorusu bir bakıma “Bundan ağırı olabilir mi?” demekti. Aldığı cevap, belki de beklediğinden farklıydı.", "Resûlullah şöyle buyurdu: “Kavminden çok şey çektim. Ama en ağırı, Akabe günü başıma gelendi.” Siyer kitaplarında anlatıldığına göre bu yolculuk, Peygamberimizi en çok koruyan amcası Ebû Tâlib ile eşi Hatice'nin vefatından kısa süre sonra yaşanmıştı. Mekke'de baskı artmış, davetine kulak verenler azalmıştı. Peygamberimiz de yeni bir kapı aramak için serin havasıyla bilinen Tâif şehrine gitti.", "Orada ileri gelenlerden İbn Abdi Yâlîl'e kendini ve getirdiği mesajı sundu; ama aradığı karşılığı bulamadı. Aynı kaynaklara göre şehrin ileri gelenleri ağır sözler söyledi, ardından sokaktakiler de arkasına takılıp taş attı. Peygamberimiz bu sahneyi Âişe'ye uzun uzun anlatmadı; yalnızca “istediğimi vermedi” dedi.", "Siyer kitaplarına göre bu yolculukta yanında yalnız azatlı dostu Zeyd b. Hârise (r.a.) vardı. Tâif'te bir süre kaldı.", "Üzgün bir hâlde yürüdü. O kadar dalgındı ki ancak Karnü's-Seâlib denilen yere gelince kendine geldi. Başını kaldırdığında bir bulutun kendisine gölge yaptığını gördü. Bulutun içinde Cebrâil (a.s.) vardı.", "Cebrâil şöyle seslendi: “Allah, kavminin sana söylediklerini ve sana verdikleri cevabı işitti. Dağlar üzerindeki meleği sana gönderdi; onlar hakkında dilediğini ona emret.” Bu söz, Peygamberimize yalnız olmadığını gösteriyordu. Ardından dağlar meleği selam verdi ve “Ey Muhammed, dilersen Mekke'nin iki dağını (Ahşebeyn) onların üzerine kapatayım” dedi. Ahşebeyn, Mekke'yi iki yandan çevreleyen dağlardır; yani Peygamberimize, kavminin kendi şehrinin dağlarıyla cezalandırılması teklif ediliyordu.", "Bir düşünelim. Kalbi kırılmış bir insan ve karşısında bütün güç hazır. Tek bir söz yetecek. Peygamberimiz ise kısa bir cevap verdi: “Hayır! Ben Allah'ın onların soyundan, yalnız Kendisine kulluk eden ve O'na hiçbir şeyi ortak koşmayan insanlar çıkarmasını umarım.”", "O gün kapısını yüzüne kapatanlara bile gelecekten umutla baktı. Siyer kitaplarına göre Tâif halkı yıllar sonra Müslüman oldu. Kur'an-ı Kerim, Peygamberimiz için “Biz seni ancak âlemlere rahmet olarak gönderdik” der (Enbiyâ, 21/107). Âişe'ye anlattığı bu kısa cevap, o ayetin yaşanmış bir örneğiydi. Hem de intikam için bütün imkân elindeyken verilmiş bir cevaptı. Merhamet, güçsüzün çaresizliği değil; gücü olanın tercihidir. Âişe bu cevabı dinlerken, Uhud'dan daha ağır geçen o günün ardında bile Peygamberimizin beddua yerine umudu seçtiğini görmüş oldu. Peygamberimiz, kavminin bugününe değil, soyundan gelecek nesillere bakıyordu."], "ibret": "Gücümüz yettiği hâlde öfkeyle değil merhametle davranmak büyüklüktür. Bize kötülük edenlerin bile bir gün iyiye dönebileceğini umut etmeyi, bunu da gücümüz yettiği bir anda yapabilmeyi Peygamberimizden öğreniriz.", "kaynak": "Buhârî, Bed'ü'l-halk, 7 (3231); Müslim, Cihâd ve's-siyer, 111 (1795); Enbiyâ Sûresi, 21/107"}, {"no": 2, "baslik": "Mescitteki Bedevi", "tur": "kaynakli", "paragraflar": ["Medine'deki mescit, yalnız namaz kılınan bir yer değildi. Sahabilerin toplandığı, Peygamberimizin onlara öğüt verdiği, Medine'nin gönül merkeziydi. İnsanlar oraya sorularıyla, dertleriyle, merakla gelirdi. Bir gün Resûlullah (s.a.v.) sahabileriyle mescitte otururken çölden gelen bir adam içeri girdi.", "Bedevi, mescidin bir köşesine çöktü ve küçük abdestini yapmaya başladı. Mescidin saygısını henüz bilmediği anlaşılıyordu. Çölün açık hayatında böyle bir kuralın olmadığı, belki de kimsenin ona anlatmadığı bir şeydi bu.", "Orada bulunanlar bunu görünce yerlerinden fırladı. “Dur, dur!” diyerek adama doğru yürüdüler. Mescide duydukları bu hassasiyet yerindeydi. Ama Peygamberimiz onları durdurdu: “Onu bırakın, işini yarıda kesmeyin.” Sahabiler, belki içlerinden itiraz ederek ama emre uyarak bekledi.", "Sahabilerin tepkisi anlaşılırdı. Onlar için mescit Allah'ın evi, namazın yeriydi. Peygamberimiz bu hassasiyeti yok saymadı; yalnızca öncelik sırasını doğru koydu. Önce adamın incinmemesi gelecekti; ardından hem yanlış yumuşakça öğretilecek hem de yer temizlenecekti.", "Adam işini bitirince Resûlullah, bir kova su getirilip oraya dökülmesini emretti. Sonra yanındakilere dönüp şunu söyledi: “Siz kolaylaştırıcı olarak gönderildiniz, zorlaştırıcı olarak değil.” Bu cümle, orada bulunan herkes için bir ders oldu. Bir kova suyla yer temizlendi; mesele de büyütülmeden, kimse kırılmadan kapandı.", "Bedeviyi de yanına çağırdı. Ona bağırmadı, ayıplamadı, kovmadı. Müslim'deki rivayete göre ona şöyle buyurdu: “Bu mescitler, şu pislik ve kirlerin yeri değildir. Mescitler ancak Allah'ı anmak, namaz kılmak ve Kur'an okumak içindir.”", "Peygamberimiz başka bir hadiste de aynı ilkeyi şöyle özetler: “Kolaylaştırın, zorlaştırmayın; müjdeleyin, nefret ettirmeyin.” Mescitteki bedevi olayı, bu sözün bir ders kitabında değil, bir mescidin ortasında yaşanmış hâliydi. Söz ile davranış, Peygamberimizde hep birbirinin aynasıydı.", "Düşünün: Adamın bilgisizliği yüzünden mescit kirlenmişti. Haklı bir öfke için pek çok sebep vardı. Peygamberimiz ise önce adamı korudu; sonra yanlışı yumuşak bir dille düzeltti ve yeri temizletti. Hepsi sırayla, acele etmeden ve kimseyi kırmadan.", "Kendi evimizde bir misafir bilmeden bir hata yapsa, onu hemen kapıdan çıkarmazdık. Önce sakin bir yer bulur, ince bir dille anlatırdık. Peygamberimiz mescidi herkesin evi saydı ve bedeviyi de o evin misafiri gibi karşıladı. Hata yapan birine bağırmak, o an kolay gelebilirdi. Ama bedevi bu mescide ve Resûlullah'a sevgiyle bağlanabilecekken, utanç ve korkuyla uzaklaşmış olurdu. Peygamberimiz ise ona bir yanlışı değil, bir doğruyu hatırlattı.", "Orada bulunanlar o gün, bir hatayı düzeltmenin en kısa yolunun öfke olmadığını gördü. Bilmeden yanlış yapan birine gösterilen sabır, çoğu zaman en iyi öğretmendir. Ona öğretilen şey sevgiyle öğretilmişti."], "ibret": "Bilmeden hata yapana önce sabır göstermeliyiz. Düzeltmeyi kırıcı değil, yumuşak bir dille yapmak, öğrenmenin en kısa, en kalıcı ve en güzel yoludur. Doğruyu öğreten kişi, sevgiyi de öğretmiş olur.", "kaynak": "Buhârî, Vudû, 57-58 (219-220); Müslim, Tahâret, 98-100 (284-285); Buhârî, İlim, 11 (69)"}, {"no": 3, "baslik": "On Yıl Boyunca Bir 'Öf' Bile Demedi", "tur": "kaynakli", "paragraflar": ["Enes b. Mâlik (r.a.), Medine'de daha çocuk yaştayken Peygamber Efendimizin (s.a.v.) hizmetine verildi. Ailesi, bu büyük insanın yanında yetişsin istiyordu. Küçük Enes böylece Resûlullah'ın evine girip çıkan, ona yardım eden bir çocuk oldu. Bu hizmet on yıl sürdü.", "Yıllar sonra yaşlanan Enes, o günleri anlatırken şöyle der: “On yıl Peygamberimize hizmet ettim. Bana bir kere bile ‘öf’ demedi. Yaptığım bir iş için ‘Bunu niçin yaptın?’, yapmadığım bir iş için de ‘Bunu niçin yapmadın?’ demedi.” Bir de şunu ekler: “Peygamberimiz insanların ahlakça en güzeliydi.”", "Kur'an-ı Kerim, anne babaya “öf” bile denmemesini, onlara azarlayıcı söz söylenmemesini öğütler (İsrâ, 17/23). Peygamberimiz bu inceliği, hizmetindeki küçük bir çocuğa bile gösterdi. Evin büyüğüydü; ama ağzından ne sert bir söz ne de bir azar çıktı.", "Bunu düşünmek bile insana tuhaf gelir. Çocuklar işi geciktirir, bir şeyi unutur, bazen de yanlış yapar. Büyüklerin sabrı çoğu zaman bu yüzden tükenir. Oysa Enes'in anlattığına göre, on yıl içinde Peygamberimiz bir kez bile bu yüzden ona çıkışmadı. On yıl, kısa bir süre değildir; her gün aynı sabrı göstermek ise ayrı bir güzel ahlak ister.", "Müslim'in aktardığı bir anısı bu sabrı daha iyi gösterir. Bir gün Resûlullah, Enes'i bir iş için bir yere göndermek istedi. Enes “Allah'a yemin olsun, gitmem” dedi. Ama içinden, Peygamberimizin emrettiği yere gitmeyi geçiriyordu. Evden çıktı. Çarşıda oynayan çocukların yanından geçerken onlara takıldı kaldı.", "Bir de baktı ki biri arkasından boynundan tutuyor. Dönüp bakınca Peygamberimizi gördü. Resûlullah gülümsüyordu. “Ey Üneys,” dedi, “sana gitmeni söylediğim yere gittin mi?” Küçük Enes mahcup oldu: “Evet, ey Allah'ın Resûlü, şimdi gidiyorum.”", "Medine'de Peygamberimizin evinin yakınında büyüyen Enes, bir çocuğun kolay kolay göremeyeceği pek çok şey gördü. Resûlullah'ın evdeki hâlini, misafirlerle ilgisini, ibadetini yakından izledi. Ama o, bütün bu yıllardan en çok, kendisine gösterilen sabrı hatırladı. Çünkü çocuk, öğüdü değil, davranışı unutmaz. Enes'in o on yılı, kendi ağzından yüzlerce hadise dönüşecek bir okul oldu.", "Kızmadı, azarlamadı, cezalandırmadı. Sadece gülümseyerek hatırlattı. Çocuğun oyuna dalmasını, onun yaşına yakışan bir şey olarak gördüğü anlaşılıyor. “Üneys” diye seslenmesi de çocuğa duyduğu sevgiyi gösteriyordu; Enes'in adını küçültüp sevgiyle söylüyordu.", "Enes bu hâli hiç unutmadı. Peygamberimizin vefatından sonra uzun yıllar yaşadı; Resûlullah'tan en çok hadis aktaran sahabilerden biri oldu ve onu görmüş son sahabilerden biri olarak insanlar arasında saygı gördü. Yetişkin bir insan olarak o günleri anlatırken, çocukluğunun en büyük hatırasının, yüzüne gülümseyen bir bakış olduğunu söyleyebilirdi."], "ibret": "Çocuğa sabır göstermek, ona en güzel ahlakı öğretmenin yoludur. Hata yapana kızmadan gülümsemek, bazen en etkili uyarıdır. Çünkü çocuk, sevildiğini bildiği yerde daha kolay öğrenir.", "kaynak": "Buhârî, Edeb, 39 (6038); Müslim, Fezâil, 51 (2309) ve 53 (2310); İsrâ Sûresi, 17/23"}, {"no": 4, "baslik": "Omzundaki Örtüyü Çeken Bedevi", "tur": "kaynakli", "paragraflar": ["Medine'de bir gün Peygamber Efendimiz (s.a.v.) yürüyordu. Üzerinde kenarları kalın, Necrân yapımı bir örtü vardı. Yanında hizmetinde bulunan Enes (r.a.) vardı. Necrân, Yemen'e yakın bir şehirdi ve oranın dokumaları, kalın kenarlı örtüleriyle bilinirdi. Sokaklar her zamanki gibiydi; kimse o gün hatırlanacak bir olay beklemiyordu.", "Karşılarına bir bedevi çıktı. Adam Peygamberimize yetişti, örtüyü yakalayıp öyle sert çekti ki, Enes'in anlattığına göre Resûlullah'ın omzunda örtünün kenarının izi kaldı. Bu, hem acıtan hem de saygıdan uzak bir davranıştı.", "Adam kaba bir sesle konuştu: “Ey Muhammed! Yanındaki Allah'ın malından bana da verilmesini emret!” Sözünde ne bir selam, ne bir nezaket vardı. Çölün sert hayatından gelen biri, kimin karşısında durduğunu ve nasıl konuşması gerektiğini bilmiyor olabilirdi. İhtiyacı olduğu ise belliydi.", "Enes yanında durup bütün bunları izliyordu. O anda içinde neler geçtiği anlatılmaz. Ama her şey Peygamberimizin cevabına bakıyordu. Resûlullah dönüp adama baktı. Ve gülümsedi.", "Sonra yanındakilere adama bir bağış verilmesini emretti. Rivayet bu kadardır. Adamın bundan sonra ne yaptığı, utanıp utanmadığı anlatılmaz. Ama anlatılanlar yeter: Sert bir çekiş, kaba bir söz; karşılığında bir gülümseme ve verilmiş bir bağış.", "Adamın sözünde bir doğruluk payı da vardı: Peygamberimizin yanındaki mal, ihtiyaç sahiplerine ulaştırılması gereken Allah'ın malıydı. Kaba olan, adamın isteği değil, isteme biçimiydi. Peygamberimiz doğru olan kısma cevap verdi, kaba olan kısmı gönlüne almadı. İnsanları çoğu zaman en çok incitenler, haklı oldukları yerde kaba davrananlardır; Peygamberimiz ise kaba davranana bile nazik davrandı.", "Biz olsak ne yapardık, diye düşünmek insanı sarsıyor. Haklı olduğumuzu bildiğimiz yerde kabalığa kabalıkla karşılık vermek en kolay yoldur. Ses yükseltmek, adamı azarlamak, hatta bir ders vermek mümkündü. Peygamberimiz ise o yolu seçmedi. Adamın ihtiyacını gördü, kabalığını gönlüne almadı.", "Hz. Enes bu olayı yıllar sonra anlatırken, Peygamberimizin gülümsemesini özellikle hatırladı. Çünkü kabalığa verilen en güçlü cevap, bazen öfke değil, sakinliktir. Güler yüz, hem karşıdakinin gururunu korur hem de kendi kalbimizi öfkeden korur.", "Peygamberimiz bir hadisinde şöyle buyurur: “Güçlü kişi, güreşte yenen değil; öfke anında kendine hâkim olandır.” Kur'an-ı Kerim ise şu öğüdü verir: “İyilikle kötülük bir olmaz. Sen kötülüğü en güzel şekilde sav. Bir de bakarsın ki seninle aranda düşmanlık bulunan kişi, sanki sıcak bir dost olmuştur.” (Fussilet, 41/34).", "Resûlullah, insanlara yalnız doğruyu anlatmadı; o doğruyu davranışıyla da gösterdi. Omzundaki iz belki birkaç gün sonra geçti. Ama o günün sahnesi, sahabilerin hafızasında kaldı ve bugün bile bizim hafızamızda."], "ibret": "Kabalığa kabalıkla karşılık vermek kolaydır; güler yüz ve açık el ise daha zordur ama daha kalıcıdır. İnsanların ihtiyacını, kaba sözlerinden önce görmeyi, öfkelendiğimizde de kendimize hâkim olmayı öğrenmeliyiz.", "kaynak": "Buhârî, Farzu'l-humus, 19 (3149); Libâs, 18 (5809); Edeb, 68 (6088); Müslim, Zekât, 128 (1057); Buhârî, Edeb, 76 (6114); Fussilet Sûresi, 41/34"}, {"no": 5, "baslik": "Küçük Ebû Umeyr'in Kuşu", "tur": "kaynakli", "paragraflar": ["Küçük bir çocuğun kuşu ölse, kaç büyük bunu fark eder? Medine'de bir evde, Peygamber Efendimiz (s.a.v.) bunu fark etti.", "Enes (r.a.) şöyle anlatır: “Resûlullah bizimle iç içeydi. Hatta benim küçük kardeşime bile takılır, ‘Ey Ebû Umeyr, nugayr ne yaptı?’ derdi.” Ebû Umeyr, Enes'in küçük kardeşiydi. Rivayete göre sütten yeni kesilmiş, daha çok küçük bir çocuktu. Peygamberimiz bu eve sık gelir, çocuklara karışırdı. Ebû Umeyr'in annesi Ümmü Süleym, babası Ebû Talha'ydı; Medine'nin bu sıcak evi, Peygamberimizin sık uğradığı yerlerden biriydi.", "Aynı rivayetin devamında, bu evde namaz vakti gelince hasırın süpürülüp üzerine su serpildiğini, Peygamberimizin namaza durduğunu, evdekilerin de arkasında saf tuttuğu da anlatılır. Yani o küçük ev, bir gün çocukla şakalaşılan, başka bir an namaza durulan sıcak bir yerdi.", "Nugayr, serçeye benzer küçük bir kuştur; hadiste kesin türü belli değildir. Ebû Umeyr bu kuşla oynardı. Kuş ona hem arkadaşlık eder, hem de eğlence olurdu. Bir çocuk için küçük bir canlı, bazen koca bir dünya demektir.", "Bir gün Peygamberimiz eve geldi. Küçük Ebû Umeyr'i üzgün gördü. Sebebini sorunca kuşunun öldüğünü söylediler. Resûlullah çocuğun yanına gitti ve sordu: “Ey Ebû Umeyr, nugayr ne yaptı?”", "Bu söz, ilk bakışta basit bir takılma gibi duyulur. Oysa içinde bir incelik vardı. Ebû Umeyr, “Umeyr'in babası” demektir. Arap geleneğinde künye, büyüklere yakışan saygılı bir hitaptı. Peygamberimiz küçük bir çocuğa bu adla seslenerek onu ciddiye aldığını, derdini gördüğünü gösteriyordu.", "Kuş ölmüştü; bunu değiştirmek kimsenin elinde değildi. Ama bir çocuğun üzüntüsünün anlaşıldığını bilmesi, o gün ona bir parça teselli verebilirdi. Peygamberimiz çocuğun kuşunu geri getiremezdi. Fakat onun hâlini sormayı çok iyi biliyordu.", "Peygamberimiz çocuklara karşı hep böyleydi. Bir hadisinde şöyle buyurmuştur: “Küçüğümüze merhamet etmeyen, büyüğümüzün hakkını bilmeyen bizden değildir.” Bu söz, Peygamberimizin çocuklara karşı gösterdiği sevginin yalnız bir huy değil, öğretilmesi gereken bir ahlak olduğunu gösterir.", "Düşünün, bu davranışı gösteren kişi Allah'ın elçisi, bir devletin başı, binlerce insanın önderiydi. Gününü, çocukların neşesini ve kederini önemseyerek geçirebiliyordu. Çocuk gönlüne giden yol, küçük ayrıntılardan geçiyordu. Bazen bir soru, bazen bir takılma, bazen de sadece ismini hatırlamak yeter. Bir çocuğun yüzüne gülümseyen büyük, onun hafızasında ömür boyu kalır; ona ilgi göstermek de, ilgi görmenin ne demek olduğunu öğretmektir.", "Hadis âlimleri, bu rivayetten çocuklarla şakalaşmanın ve onları künyeleriyle çağırmanın da güzel bir davranış olduğunu çıkarmışlardır. Biz de buradan şunu öğreniriz: Bir çocuğun gözyaşı, büyüklerin ilgisiyle kurur."], "ibret": "Çocuğun kederi bize küçük görünse de onun için büyüktür. Hatırını sormak, onu ciddiye almak ve yanında olmak, en güzel tesellidir. Çocukların dünyasını küçümsemek yerine, o dünyaya saygıyla girmeliyiz.", "kaynak": "Buhârî, Edeb, 81 (6129) ve 112 (6203); Müslim, Âdâb, 30 (2150); Ebû Dâvûd, Edeb (4969); Tirmizî, Birr, 15 (1919)"}, {"no": 6, "baslik": "Hendekte Toprak Taşıyan Peygamber", "tur": "kaynakli", "paragraflar": ["Medine büyük bir tehlikeyle karşı karşıyaydı. Mekke'den gelen düşman ordusu şehri kuşatmaya hazırlanıyordu. Müslümanlar şehri korumak için açık tarafına derin bir hendek kazmaya karar verdi. Bu yüzden bu savaşa Hendek Savaşı denildi.", "Siyer kitaplarında anlatıldığına göre hendek usulü, Araplar arasında pek bilinmeyen bir savunma yöntemiydi. Düşman atlıları böyle bir engelle karşılaşmaya alışık değildi. Ama hendeğin kazılması, şehrin her ferdinin emek vermesini gerektiriyordu.", "Günlerce kazı yapıldı. Sahabiler toprağı kürekle çıkarıyor, taşıyordu. İş zordu, yiyecek azdı, yorgunluk herkesin yüzünden okunuyordu. Bu işin ortasında Peygamber Efendimiz (s.a.v.) de vardı. Kenarda durup emir vermiyor, sahabilerle birlikte çalışıyordu.", "Berâ b. Âzib (r.a.) o günü şöyle anlatır: “Hendek günü Resûlullah'ı toprak taşırken gördüm. Toprak karnını öyle kaplamıştı ki derisinin rengi görünmüyordu.” Bir önder, yönetici olarak kenarda durup işi izleyebilirdi. O ise toprağa bulana bulana çalıştı.", "Çalışırken sahabiler birlikte şiir söylüyordu. Peygamberimiz de onlara katılıyordu: “Allah'ım, Sen olmasaydın biz doğru yolu bulamazdık; ne sadaka verir ne namaz kılardık. Bize huzur indir, düşmanla karşılaştığımızda ayaklarımızı sabit kıl.” Bu sözler, yorgun omuzlara güç veriyordu.", "Berâ, şiirin bir yerinde Peygamberimizin sesini yükselttiğini de anlatır. Düşmanın fitne çıkarmak istediğini söyleyen dizelerde “Reddettik, reddettik!” diyordu. Kazma ve küreklerin sesine, yorgun ama kararlı bir ses karışıyordu. Herkes aynı şiiri söylerken, bir kişinin yükü de hepsinin yükü sayılıyordu. Sözün ve ezginin birleştirdiği bir topluluk, yorgunluğu daha az hisseder.", "Peygamberimizin bu alçakgönüllülüğü yalnız savaş günlerine ait değildi. Hz. Âişe'ye Resûlullah'ın evde ne yaptığı sorulmuştu. Şöyle cevap verdi: “Ailesinin işinde yardımcı olurdu. Namaz vakti gelince de kalkıp namaza giderdi.”", "Dışarıda toprak taşıyan, evde ailesine yardım eden aynı insandı. Peygamber olmak, onun için büyüklenmek anlamına gelmiyordu. Zor işte sahabilerin önünde olduğu gibi, sıradan işte de onların yanında oldu.", "Hendekte çalışan o sahabilerin, yorgunluklarını bilen ve onlarla omuz omuza yük taşıyan bir önderi vardı. Bu yüzden zorluklarını daha kolay taşıdılar. Yük paylaşıldığında hafifler. Önder aynı yükü taşıdığında ise sadece hafiflemekle kalmaz, anlam kazanır.", "Sabahın erken saatlerinden akşama kadar süren bu çalışmada, kimin önder, kimin sıradan bir insan olduğu pek belli olmuyordu. Hepsi aynı toprağa bulanmıştı. Belki de en büyük güç, işte bu birliktelikten doğuyordu. Hendek kazıldı, şehir korundu; o günün hatırası ise bugüne kadar anlatılıyor. Fakat tarih, bu hikâyede yalnız bir savunma planını değil, toprağa bulanmış bir peygamber hâlini de hatırladı. O hâl, bizden sonrakilere de bir örnek bıraktı."], "ibret": "Gerçek büyüklük, işin en zor olduğu yerde başkalarıyla birlikte çalışabilmektir. Evde de dışarıda da alçakgönüllü olmak, yani işi küçümsememek ve yükü birlikte taşımak, Peygamberimizin güzel ahlakıdır.", "kaynak": "Buhârî, Megâzî, 29 (4104); Cihâd, 34 (2837); Ezân, 44 (676)"}, {"no": 7, "baslik": "Bir Cenaze İçin Ayağa Kalkış", "tur": "kaynakli", "paragraflar": ["Medine'nin sokaklarından bir cenaze geçiyordu. Yoldakilerin çoğu böyle bir manzarayı kısa bir duraklamayla karşılar, yoluna devam ederdi. O gün Peygamber Efendimiz (s.a.v.) ise ayağa kalktı.", "Yanındaki sahabiler bunu görünce onlar da kalktı. Ama bir şey dikkatlerini çekmişti. Câbir b. Abdullah (r.a.) anlatır: “Bir cenaze geçti. Peygamberimiz ayağa kalktı, biz de kalktık. ‘Ey Allah'ın Resûlü, bu bir Yahudi'nin cenazesi’ dedik.”", "Peygamberimiz şöyle buyurdu: “Cenazeyi gördüğünüzde kalkın.” Aynı olayı anlatan başka sahabilerin rivayetinde ise Peygamberimizin kısa cevabı da yer alır: “Bir can değil mi?”", "Bu kısa soru, bir insanın değerini ne kadar yüce tuttuğunu gösteriyordu. Ölen kişinin dini, kimliği, hayatta yaptıkları o anda önemli değildi. Önünden geçen, bir insanın dünyadan ayrılışıydı. Bu da saygıyla karşılanmaya yeterdi.", "Medine, o dönemde yalnız Müslümanların şehri değildi. Siyer kitaplarına göre Peygamberimiz şehre geldiğinde, orada yaşayan Yahudi topluluklarla da bir arada yaşama düzeni kurmuştu. Bu yüzden sokaklarda farklı inançlardan insanlar yan yana yürürdü. Böyle bir şehirde, bir cenazenin karşısında kalkmak, herkes için görünen bir davranıştı.", "Yıllar geçti. Peygamberimizin vefatından sonra Müslümanlar Irak'a kadar ilerledi. Kâdisiye denilen yerde Sehl b. Huneyf ile Kays b. Sa'd (r.a.) oturuyordu. Yanlarından bir cenaze geçti, ikisi de ayağa kalktı. Onlara “Bu cenaze bu yurdun yerli halkından” denildi; yani kendi dininden biri değildi.", "İkisi de Resûlullah'ın yaptığını hatırlatarak cevap verdi: Bir Yahudi'nin cenazesi geçerken o da kalkmıştı. Yanındakiler “Bu bir Yahudi'nin cenazesi” deyince, “Bir can değil mi?” buyurmuştu. Aradan yıllar geçmiş, şehir ve ortam değişmişti. Ama iki sahabi, Peygamberimizden gördükleri saygıyı olduğu gibi yaşatıyordu. Bir davranış, ancak gerçekten benimsendiğinde, yıllar ve yerler değişse de sürer.", "Kur'an-ı Kerim, insanı genel olarak şöyle över: “Andolsun, biz Âdemoğullarını şerefli kıldık.” (İsrâ, 17/70). Bu şeref, kişinin inancına ya da mevkiine bağlı olmaksızın bütün insanlara verilmiş bir değerdi. Peygamberimizin cenaze karşısında kalkışı, bu ayetin sessiz bir tefsiri gibiydi.", "Bir insanı ayakta karşılamak küçük bir davranış gibi görünür. Ama o küçük davranış, yaşayan bir hatıra gibi sahabiden sahabiye aktarıldı. Kâdisiye'de yabancı bir toprakta, yabancı bir cenazeye gösterilen bu saygı, Medine'deki o sokaktan buraya kadar taşınmıştı.", "Hikâyenin sonunda Peygamberimizin ahlakı hâlâ yürüyordu: Kimin cenazesi olursa olsun, ölenin de bir insan olduğunu unutmamak. Cenazeyi gören herkes, bir an için ölümün herkese yakın olduğunu da düşünür. Bu düşünce, kibri ve kini azaltır. Âlimlerin çoğuna göre cenaze için ayağa kalkmak sonradan bir zorunluluk olarak kalmamıştır; ama ölüye saygı her zaman geçerlidir."], "ibret": "İnsana, dini ya da kimliği ne olursa olsun, insan olduğu için saygı göstermek gerekir. Peygamberimizin “Bir can değil mi?” sözü, saygının insanlıktan geldiğini, kimliğe bağlı olmadığını bize öğretir.", "kaynak": "Buhârî, Cenâiz, 50 (1311-1313); Müslim, Cenâiz, 81 (960-962); İsrâ Sûresi, 17/70"}, {"no": 8, "baslik": "Eşyasını Yola Çıkaran Komşu", "tur": "kaynakli", "paragraflar": ["Medine'de bir adam komşusundan çok bunalmıştı. Komşusu ona sürekli eziyet ediyordu. Adam sabretmeye çalışıyor, ama eziyet bitmiyordu. Sonunda Peygamber Efendimize (s.a.v.) gelip derdini anlattı.", "Resûlullah ona sabretmesini öğütledi: “Git, sabret.” Adam geri döndü ama eziyet sürdü. İkinci, hatta üçüncü kez gelip yine şikâyet etti. Bu kez Peygamberimiz ona şöyle buyurdu: “Git, eşyalarını çıkarıp yola koy.”", "Adam dediğini yaptı. Eşyalarını evinden çıkarıp yolun kenarına yığdı. Gelip geçenler durdu, bu hâli görünce sordular: “Neyin var, eşyalarını niçin dışarı çıkardın?” Adam, komşusunun kendisine ne kadar eziyet ettiğini ve Peygamberimize şikâyet edince bu şekilde yapmasını söylediğini anlattı.", "İnsanlar onu dinleyince komşuyu kınamaya başladı. “Bu adam komşusuna nasıl böyle eziyet eder?” diye sitem ettiler. Kınama o kadar yaygınlaştı ki sözler kısa sürede komşunun kulağına gitti.", "Komşu bunu duyunca utandı. Hemen şikâyetçi komşusunun yanına geldi ve şöyle dedi: “Eşyalarını evine geri al. Bir daha benden hoşlanmayacağın bir şey görmeyeceksin.” Adam eşyalarını geri götürdü. Onlar için yeni bir komşuluk başlıyordu.", "Kur'an-ı Kerim, komşuya iyiliği açıkça emreder: “Yakın komşuya da uzak komşuya da iyilik edin.” (Nisâ, 4/36). Peygamberimiz de şöyle buyurmuştur: “Allah'a ve ahiret gününe iman eden, komşusuna eziyet etmesin.” Komşuluk hakkı, bu yüzden imanın bir ölçüsü sayılır.", "Dikkat edin: Peygamberimiz komşuyu çağırıp azarlamadı, kimseye ceza vermedi. Zulmü yalnızca gözlerin önüne koydu. Eziyetin gizli kaldığı yerde sürdüğünü, açığa çıkınca ise utanca dönüştüğünü biliyordu. Önce sabrı öğütledi, çözümü acele etmedi; sonra da yol gösterdi.", "Aynı konuyla ilgili Peygamberimiz bir gün şöyle buyurmuştu: “Cebrâil bana komşu hakkında o kadar tavsiyede bulundu ki, onu mirasçı kılacağını sandım.” Yani komşuluk, yalnız yan yana yaşamak değil, birbirinin hakkını gözetmekti.", "Bu çözümde bir incelik vardı. Eziyet gören adam, hakkını tek başına bağırarak alamıyordu. Peygamberimiz ona şikâyetini toplumun vicdanına taşıma yolunu gösterdi. Çünkü bazı kötülükler, herkesin gözü önünde sürdürülemez. Komşu da kendi yaptığını başkalarının ağzından duyunca, ilk kez gerçek yüzüyle karşılaştı. Anlatılana göre bu karşılaşma, ona yetti.", "Hikâyenin sonu bir barışla biter. Evinden eşyaları çıkmış bir adam, geri dönerken yalnız eşyalarını değil, huzurlu bir komşuluğu da geri aldı. Komşu ise ders almış, belki de ilk kez kendi davranışına dışarıdan bakabilmişti. Bu olay, “komşuluk hakkı” sözünün ne kadar ciddi olduğunu hem Medine halkına hem bize öğretir. Bir kapının ardında yaşanan huzursuzluk, yalnız iki ailenin değil, bütün sokağın meselesidir. Peygamberimiz bu yüzden sabrı da, çözümü de birlikte öğretti."], "ibret": "Komşuya eziyet etmek insanlar katında da Allah katında da kınanır. Komşunun hakkı büyüktür; ona iyi davranmak, güzel ahlakın ve imanın bir parçasıdır. Sabırlı olmak da, hakkını aramak da bir arada gider.", "kaynak": "Ebû Dâvûd, Edeb (5153); Buhârî, Edeb, 28 (6014-6015) ve 31 (6018); Müslim, Birr, 140 (2624); Nisâ Sûresi, 4/36"}], "kapanis": "Sekiz hikâyeyi bitirdik. Hepsinde aynı şeyi gördük: Peygamberimiz güçlü olduğu yerde merhameti, haklı olduğu yerde yumuşaklığı, büyük olduğu yerde alçakgönüllülüğü seçti. Bugün bir komşuya, bir çocuğa, kaba davranan bir yabancıya nasıl davrandığımız, bu güzel ahlakı ne kadar sevdiğimizin en açık cevabıdır. Allah bizi de güzel ahlakla yaşayanlardan eylesin.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/01/", "kapak": "../../kapak/01.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 2, "baslik": "Peygamberlerden İbretlik Kıssalar", "hazir": true, "yol": "../02/index.html"}, "pdf": "../../pdf/kitap-01.pdf", "epub": "../../epub/kitap-01.epub"}</script>
