<script type="application/json" id="kitap-veri">{"no": 3, "baslik": "Sahabelerin Örnek Hayatları", "tanitim": "Ebû Bekir, Ömer, Osman, Ali ve diğer sahabelerin hayatlarından cömertlik, adalet, ilim, cesaret ve fedakârlık örnekleri.", "onsoz": "Peygamber Efendimizin yanında yetişen sahabeler, İslam'ın güzel ahlakını yaşayarak gösterdi. Bu kitapta sekiz sahabi ve sahabiyenin hayatından birer sahne okuyacağız: cömertlik, adalet, ilim, cesaret ve fedakârlık. Hadis kitaplarında yer alan olaylar kadar, siyer ve tarih kitaplarında anlatılanlar da var; hangisinin nereden geldiği her hikâyede belirtildi.", "hikayeler": [{"no": 1, "baslik": "Evine Allah'ı ve Resûlünü Bırakan Ebû Bekir", "tur": "kaynakli", "paragraflar": ["Bir gün Peygamber Efendimiz (s.a.v.) sahabilere sadaka vermelerini emretti. Hadisi anlatan Hz. Ömer (r.a.) o sırada elinde bir miktar mal bulunduğunu söyler. Ve içinden şöyle der: “Bugün Ebû Bekir'i geçerim.” Çünkü Ebû Bekir'in her hayırda öne geçtiğini görmüştü ve bir kez olsun önüne geçebilmek istiyordu.", "Ömer malının yarısını alıp Peygamberimizin huzuruna getirdi. Bu, küçümsenecek bir bağış değildi. Peygamberimiz ona sordu: “Ailene ne bıraktın?” Ömer cevap verdi: “Bunun bir mislini.” Yani malının yarısını ailesine bırakmış, yarısını Allah yoluna getirmişti.", "Kısa bir süre sonra Ebû Bekir (r.a.) geldi. Elinde bütün malı vardı. Hadiste bu sahnenin nerede geçtiği açıkça belirtilmez; şerhlerde ve siyer kitaplarında Tebük seferi hazırlıkları zikredilir. Biz burada yalnızca “sadaka çağrısı yapıldığı bir gün” diyeceğiz.", "Peygamberimiz ona da aynı soruyu sordu: “Ailene ne bıraktın, ey Ebû Bekir?” Ebû Bekir hiç tereddüt etmeden cevap verdi: “Onlara Allah'ı ve Resûlünü bıraktım.”", "Bu cevap, orada bulunanların dikkatini çekmiş olmalıydı. Ebû Bekir, malını Allah'a emanet ederken ailesini de O'na emanet etmişti. Bunu bir ihmal olarak değil, bir güven olarak yapmıştı. Çünkü ona göre, Allah ve Resûlü bir ailenin bırakabileceği en sağlam mirastı. Evinde yiyecek olup olmadığı sorusu, onun yüreğinde güvenin yanında küçük kalıyordu. Ebû Bekir, rızkı verenin Allah olduğunu biliyordu ve bu bilgiyi malıyla da ispat etmişti.", "Kur'an-ı Kerim, müminleri şöyle çağırır: “Hayırlarda yarışın.” (Bakara, 2/148). Ömer ile Ebû Bekir arasında geçen bu sahne, bu emrin yaşanmış bir örneğidir. Yarış vardı; ama kimse kimseyi yıpratmak için yarışmıyordu. Herkes Allah'a yaklaşmak için koşuyordu.", "Ömer'in cümlesi ise bu hikâyenin en güzel sonu oldu: “Ben de bunun üzerine dedim ki: ‘Vallahi ben onu hiçbir şeyde geçemem.’” Dikkat edilirse bu söz, bir yenilgi cümlesi değildir. Ömer, rakip olarak başladığı bir yarışta, yarıştığı kişinin büyüklüğünü kabul etmişti. Bu da insanın olgunluğunu gösterir.", "Burada iki farklı güzellik var. Birincisi, Ebû Bekir'in her şeyini veren cömertliği. İkincisi, Ömer'in kıskançlık yerine hayranlığı seçmesi. Çünkü Ömer, kendisinden üstün olanı gördüğünde onu çekiştirmedi; ona olan hürmetini dile getirdi.", "Bugün bile yoksulluk korkusuyla elimizi tutarken, Ebû Bekir'in bu cevabı hepimize bir ayna tutar: Rızkı verenin Allah olduğuna inanan, onu paylaşmaktan korkmaz. Bu rivayeti Tirmizî ve Ebû Dâvûd kaydetmiştir. Rivayet, sade bir sahneyi anlatır: Sadaka istenmiş, iki dost yarışmış, biri bütün malını getirmiş. Ama bu sade sahne, yüzyıllardır güveni, cömertliği ve temiz rekabeti anlatan en sevilen hikâyelerden biri olarak yaşıyor."], "ibret": "Ebû Bekir'in sözü, güvenin ve cömertliğin ölçüsünü gösterir. Hayırda yarışmak güzeldir; kendimizden üstün olanı gördüğümüzde kıskanmak yerine takdir etmek de olgunluktur. Rızkı verenin Allah olduğuna güvenmek de cömertliğin sırrıdır.", "kaynak": "Tirmizî, Menâkıb, 16 (3675; hasen sahih); Ebû Dâvûd, Zekât, 40 (1678); Bakara Sûresi, 2/148"}, {"no": 2, "baslik": "Kıtlık Yılında Halife Ömer", "tur": "kaynakli", "paragraflar": ["Hz. Ömer'in halifeliği sırasında Medine'de büyük bir kuraklık yaşandı. Tarihçiler bu yıla “Remâde yılı” der; yani yeryüzünün kül rengine döndüğü yıl. Tarih kitaplarına göre yaklaşık hicri on yedi ve on sekizinci yıllarda yaşanan bu kıtlık aylarca sürdü ve Hicaz'ı sarstı.", "Tarih kitaplarında anlatıldığına göre halk yiyecek bulmakta zorlanıyor, çevredeki bedeviler Medine'ye sığınıyordu. Halife Ömer işte bu günlerde, halkın yemediği yemeği yememeye karar verdi. Anlatıldığına göre, halk doyana kadar et ve yağ yemedi. Sofrasında yalnızca kuru ve basit yiyecekler bulunuyordu. Medine'ye sığınanların sayısı arttıkça yönetenin omzundaki yük de ağırlaşıyordu.", "Aynı kaynaklar, bu süreçte Ömer'in yüzünün renginin solduğunu ve bedeninin zayıfladığını anlatır. Ancak o, yardım için yalnız kendi sofrasındaki fedakârlıkla yetinmedi. Mısır, Şam ve Irak'taki valilerine haber göndererek Medine'ye yiyecek gönderilmesini istedi. Ve bu erzak geldikçe, ihtiyaç sahiplerine dağıttırdı.", "Anlatıya göre Ömer, yardımı dağıtırken kendi hakkına da ayrıcalık tanımadı. “Halkın derdini yaşamazsam, onların hâlini nasıl anlarım?” diye düşünen bir yöneticiydi. Bu davranış, halifeliği bir makam değil, bir sorumluluk olarak gördüğünü gösteriyor.", "Tedbirler alındı, yardım ulaştı; ama kuraklık sürdü. Bunun üzerine Ömer, insanlarla birlikte yağmur duasına çıkmaya karar verdi. Bu kısım ise sahih bir hadiste anlatılır. Enes b. Mâlik (r.a.) der ki: Kıtlık olduğunda Ömer, Abbas b. Abdülmuttalib'i öne çıkararak yağmur istedi.", "Abbas, Peygamberimizin amcasıydı. Peygamberimiz hayattayken sahabiler yağmur için onun duasına başvururdu. O dünyadan ayrılınca Ömer, aralarında Peygamberimize en yakın kişi olan amcasının dua etmesini istedi. Şerhlerde bu davranış, hayatta olan salih bir kimsenin duasından yararlanmak olarak anlaşılır.", "Duasında şöyle dedi: “Allah'ım, biz Peygamberimizin vesilesiyle sana yağmur dilerdik, sen de bize yağmur verirdin. Şimdi Peygamberimizin amcasını vesile kılarak sana yağmur diliyoruz; bize yağmur ver.” Anlatıldığına göre bu duanın ardından yağmur yağdı.", "Bu davranışın incelikli bir yanı vardı. Ömer, Peygamberimizin amcası Abbas'ı öne çıkararak onun hatırasına saygı göstermiş, hem de Peygamberimizin ailesine hürmet etmişti. Yağmur duasında kimse kendi makamını öne sürmedi; herkes Allah'a muhtaç olduğunu kabul etti.", "Tarih kitaplarında kıtlığın süresi, ulaşan yardımın miktarı gibi ayrıntılar farklı aktarılır; biz yalnızca ortak çizgiyi anlattık. Hikâyenin özü, tedbir ile duanın birlikte yürümesidir. Ömer önce elindeki bütün imkânları kullandı: Yardım istedi, dağıttı, halkla aynı yükü taşıdı. Sonra Allah'a el açtı. Çalışmadan dua etmek de, duayı unutup yalnızca çalışmak da eksik kalırdı. Ömer bu dengeyi kurmaya çalıştı; yağmur da Allah'ın lütfu olarak geldi. Tarih kitaplarına göre kıtlık da bu duanın ardından sona erdi."], "ibret": "Yöneten insan, halkın derdini kendi derdi bilmelidir. Elimizden gelen her tedbiri aldıktan sonra Allah'a dua etmek, olgun bir güvenin işaretidir. İyi bir yönetici, kendi rahatını halkın rahatından sonraya bırakır.", "kaynak": "Buhârî, İstiskâ, 3 (1010); İbn Sa'd, et-Tabakâtü'l-kübrâ; Taberî, Târîh"}, {"no": 3, "baslik": "Mushafları Çoğaltan Halife Osman", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimizin (s.a.v.) vefatından sonra Müslümanlar çok geniş bir coğrafyaya yayılmıştı. Medine'den uzak şehirlerde yaşayan insanlar, Kur'an'ı farklı kişilerden öğreniyordu. Her bölge, o bölgeye Kur'an'ı öğreten sahabinin okuyuşunu esas alıyordu. Bu da zamanla bir tartışma kapısı açtı.", "Hz. Huzeyfe b. Yemân (r.a.), Ermenistan ve Azerbaycan taraflarında yapılan bir seferde Şam ve Irak halkıyla birlikte savaşıyordu. Orada, insanların Kur'an'ın okunuşu konusunda birbirleriyle çekiştiğini gördü. Yüreği daraldı. Hemen Medine'ye döndü ve Halife Osman'ın (r.a.) yanına geldi.", "Daha önce Ebû Bekir döneminde, Yemâme Savaşı'nda Kur'an'ı ezbere bilen pek çok sahabi şehit düşmüştü. Bunun üzerine Kur'an, sahifeler hâlinde bir araya getirilmişti. Bu işi üstlenen kişi, Peygamberimizin vahiy kâtiplerinden Zeyd b. Sâbit'ti. Aradan yıllar geçmiş, şimdi başka bir sorun ortaya çıkmıştı: Okuyuş farkları, tartışmaya dönüşüyordu.", "Huzeyfe ona şöyle dedi: “Ey müminlerin emiri! Bu ümmeti kurtar; Yahudiler ve Hıristiyanlar gibi kitapları hakkında ihtilafa düşmeden önce yetiş.” Bu sözler, Osman'ın içini sızlattı. Çünkü Kur'an, Müslümanları bir araya getiren en büyük bağdı. O bağın zedelenmesine razı olamazdı.", "Osman, Hafsa'ya (r.anha) haber gönderdi: “Sahifeleri bize gönder; onlardan nüshalar çıkarıp sana geri vereceğiz.” Bu sahifeler, Hz. Ebû Bekir döneminde Kur'an'ın yazılı hâle getirilmesiyle toplanmış ve sonra Hz. Ömer'in kızı Hafsa'ya emanet edilmişti. Hafsa sahifeleri gönderdi.", "Osman, Zeyd b. Sâbit'e, Abdullah b. Zübeyr'e, Saîd b. Âs'a ve Abdurrahman b. Hâris'e bu sahifelerin çoğaltılmasını emretti. Kureyşli üç kişiye de şu talimatı verdi: “Siz ve Zeyd, Kur'an'ın herhangi bir kelimesinde ihtilaf ederseniz onu Kureyş lehçesiyle yazın; çünkü Kur'an onların lisanıyla indi.” Onlar da dediği gibi yaptı.", "Nüshalar çoğaltılınca Osman, asıl sahifeleri Hafsa'ya geri verdi. Hazırlanan mushaflardan birer nüshayı İslam beldelerine gönderdi. Rivayetlerde gönderilen nüsha sayısı farklı aktarıldığı için kesin sayı vermeyeceğiz. Ayrıca bundan başka sayfaların ve nüshaların ortadan kaldırılmasını da emretti; bu, ihtilafın tekrar doğmaması içindi.", "Zeyd b. Sâbit, bu iş için en uygun kişiydi; çünkü Peygamberimizin zamanında Kur'an'ı yazmış, sonra da Ebû Bekir döneminde toplamıştı. Bu karar, o gün de bugün de saygıyla karşılanır. Hiçbir ayet eklenmedi, hiçbir ayet çıkarılmadı. Yapılan, Kur'an'ın aynı yazıyla ve aynı sırayla bütün Müslümanların elinde bulunmasını sağlamaktı. Osman'ın bu işi yaparken gösterdiği titizlik, sahabelerin ona verdiği desteği de beraberinde getirdi.", "Bugün dünyanın dört bir yanındaki Müslümanlar, aynı Kur'an'ı okur. Nesilden nesile aktarılan bu emanetin korunmasında, Hz. Ebû Bekir'in toplatması, Hafsa'nın emaneti saklaması ve Hz. Osman'ın çoğaltması önemli bir yer tutar."], "ibret": "Kur'an etrafında birleşmek, ümmetin en büyük gücüdür. Bir emaneti korumak için sabır, titizlik ve ortak hareket gerekir. Ayrılığı önlemek için zamanında alınan tedbir, ümmeti yıllarca korur.", "kaynak": "Buhârî, Fezâilü'l-Kur'ân, 3 (4987); Ebû Bekir dönemindeki toplama için Buhârî, Fezâilü'l-Kur'ân, 3 (4986)"}, {"no": 4, "baslik": "Hayber'de Sancak Kime Verilecek?", "tur": "kaynakli", "paragraflar": ["Hayber, Medine'nin kuzeyinde, hicretin yedinci yılında kuşatılan, kalelerle çevrili bir bölgeydi. Müslümanlar oraya ulaşmış ve kuşatma günlerce sürmüştü. Bir akşam Peygamber Efendimiz (s.a.v.) sahabilerine şöyle buyurdu: “Yarın sancağı, Allah'ı ve Resûlünü seven, Allah'ın ve Resûlünün de sevdiği bir adama vereceğim. Allah, fethi onun eliyle nasip edecek.”", "Sancak, ordunun işaretiydi; onu taşıyan kişi, hem bir sorumluluk hem de bir güven yüklenirdi. Peygamberimizin bu sözü, kimin kastedildiğini açıkça söylemeden herkesi meraka düşürmüştü. Herkes “Acaba ben miyim?” diye düşünüyordu.", "Sahabiler gece boyunca kimin bu şerefe nail olacağını düşündü. Sehl b. Sa'd (r.a.) bunu şöyle anlatır: “İnsanlar geceyi, sancağın kime verileceğini konuşarak geçirdi. Sabah olunca hepsi Resûlullah'ın yanına gitti; herkes sancağın kendisine verilmesini umuyordu.”", "Peygamberimiz sordu: “Ali b. Ebû Tâlib nerede?” Cevap verdiler: “Gözleri ağrıyor, ey Allah'ın Resûlü.” Bunun üzerine “Çağırın onu” buyurdu. Ali (r.a.) getirildi. Peygamberimiz onun gözlerine mübarek ağzının suyunu sürdü ve dua etti. Hadisin anlatışına göre Ali'nin gözleri hemen, sanki hiç ağrı çekmemiş gibi iyileşti.", "Peygamberimiz sancağı ona verdi. Ali, “Ey Allah'ın Resûlü, onlar bizim gibi Müslüman olana kadar onlarla savaşayım mı?” diye sordu. Resûlullah ona şöyle buyurdu: “Yavaş yavaş git. Onların meydanına varınca onları İslam'a çağır. Allah'ın haklarından kendilerine vâcip olanı bildir.”", "Bundan sonra gelen sözler, bu rivayetin kalbidir: “Allah'a yemin olsun, Allah'ın senin vesilenle bir kişiyi hidayete erdirmesi, senin için kızıl develerden daha hayırlıdır.” O zamanın Arapları için kızıl develer en değerli maldı. Peygamberimiz, bir insanın hidayetinin en kıymetli servetten üstün olduğunu bu sözle anlattı.", "Dikkat edelim: Peygamberimiz bir savaşın ortasında bile, askerî bir başarıdan çok insanın hidayetini önemsiyordu. Ali'ye emri, önce çağırmak, sonra bildirmekti. Savaşmak son çare, davet ise ilk adımdı. Bu rivayetin hiçbir yerinde kılıç gösterisi, kahramanlık anlatısı yoktur; baştan sona sevgi, dua ve hidayet vardır. Savaşın ayrıntılarına girmeyeceğiz; bu hikâyenin asıl konusu orada geçmiyor.", "Sahabiler bir de şunu gördü: Herkes bu şerefi umarken sancak, gözleri ağrıdığı için aralarında bulunmayan Ali'ye verildi. Peygamberimizin sözü, Ali'nin Allah'ı ve Resûlünü sevdiğine, Allah'ın ve Resûlünün de onu sevdiğine şahitlik ediyordu. Bu, öteki sahabilerin sevilmediği anlamına gelmez; Ali'nin o günkü şerefini gösterir. Gerçek değer, kendini öne çıkarmakta değil, Allah'ın ve Resûlünün takdirindedir.", "Ali sancağı alıp gitti. Hikâyemizin sonu burada. Ama Peygamberimizin ona söylediği sözler hâlâ yankılanıyor: Bir insana doğru yolu göstermek, dünya malının hepsinden daha değerlidir. Bunu da kalbi kırmadan, sevgiyle ve sabırla yapmak gerekir."], "ibret": "Sevgi ve dua, güçten önce gelir. Bir insanın hidayetine vesile olmak, bütün dünya servetinden daha kıymetlidir; çağırırken de yumuşak, sabırlı ve sevgi dolu olmak gerekir.", "kaynak": "Buhârî, Megâzî, 38 (4210) ve Cihâd, 102 (2942); Müslim, Fezâilü's-sahâbe, 32-34 (2404-2406)"}, {"no": 5, "baslik": "Bana Çarşının Yolunu Göster", "tur": "kaynakli", "paragraflar": ["Mekke'deki sıkıntılar artınca Müslümanlar, Peygamber Efendimizle (s.a.v.) birlikte Medine'ye hicret etti. Muhacirler yurtlarını, evlerini, mallarını geride bırakmıştı. Medineli Müslümanlar, yani Ensar ise onları evlerinde ağırladı. Peygamberimiz de bu iki grubu birbirine kardeş yaptı.", "Hicret kolay bir iş değildi. Pek çoğunun elinde hiçbir şey yoktu. Medine'nin yerlileri ise onlara kapılarını açtı. İki taraf da büyük bir imtihandan geçiyordu: Biri bırakmanın, diğeri paylaşmanın imtihanı.", "Abdurrahman b. Avf (r.a.) Mekke'de varlıklı bir tüccardı; ama hicret ederken mal mülk getirememişti. Peygamberimiz onu Ensar'dan Sa'd b. Rebî' (r.a.) ile kardeş etti. Bu kardeşlik kâğıt üzerinde bir ilan değildi. Sa'd, bu işi gerçekten ciddiye almıştı.", "Abdurrahman olayı şöyle anlatır: Sa'd ona, “Ben Ensar'ın en zenginlerindenim. Malımı seninle ikiye bölüp yarısını sana vereyim” dedi. Bu, kimsenin pek kolay yapamayacağı bir tekliftir. Malının yarısını, yeni tanıdığı bir kardeşine vermeye hazırdı. Bu teklif, sözde kalan bir nezaket değil, gerçek bir paylaşım teklifiydi.", "Abdurrahman ise teşekkür ederek şu dualı cevabı verdi: “Allah malında sana bereket versin. Fakat bana çarşının yolunu göster.” Bu sözlerde, aldığı bir teklifin kıymetini bilen, ama onu kabul etmeyen bir izzet vardı. Abdurrahman, kardeşinin yardımına minnet duyuyor, ama kendi emeğiyle ayakta durmayı seçiyordu. Bu seçim, kibirden değil, izzetinden doğuyordu.", "Sa'd ona çarşının yerini gösterdi. Abdurrahman çarşıya gitti ve ticarete başladı. Rivayete göre önce peynir ve yağ getirip sattı, sonra kâr etti. Çok geçmeden elinde bir miktar birikim oldu. Kimseye el açmadan, helal kazançla geçindi. Bir süre sonra Peygamberimizin yanına geldiğinde, Peygamberimiz onun üzerinde sarı bir koku izi gördü.", "Peygamberimiz sordu: “Evlendin mi?” “Evet, ey Allah'ın Resûlü.” “Kiminle?” “Ensar'dan bir kadınla.” “Ona ne mehir verdin?” “Bir hurma çekirdeği ağırlığında altın.” Peygamberimiz şöyle buyurdu: “Allah sana bereket versin. Bir koyunla da olsa bir düğün yemeği ver.” Böylece Abdurrahman, kısa sürede kendi evini kurmuş oldu.", "Hikâyenin iki yüzü vardır. Birincisi, Sa'd'ın verme konusundaki yüreklilik ve cömertliği. İkincisi, Abdurrahman'ın kendi emeğiyle ayakta durma onuru. Sa'd vermekten, Abdurrahman ise almak yerine kazanmaktan çekinmedi. İki taraf da kendi payına düşeni yaptı. Bu iki tavır birbirini tamamladı: Biri açık kapı, diğeri onurlu bir adımdı.", "Abdurrahman daha sonra Müslümanların en zenginlerinden biri oldu; Cennetle müjdelenen on sahabiden biriydi. Zenginliğini ise hep Allah yolunda harcadı. Her şey bir çarşının yolunu sormakla başlamıştı. Medine'nin çarşısı, o gün sıradan bir yer olmaktan çıktı; bir kardeşlik hikâyesinin tanığı oldu. Muhacirlerle Ensar arasındaki bu bağ, ilk Müslüman toplumunun ayakta kalmasının temel taşlarından biriydi."], "ibret": "Verenin cömertliği de, almayanın onuru da değerlidir. Kardeşlik elbette yardımla başlar, ama insanın kendi emeğiyle ayakta durması ona haysiyet kazandırır. İyiliği kabul etmek de, kibarca geri çevirmek de bir inceliktir.", "kaynak": "Buhârî, Büyû, 1 (2048-2049); Menâkıbü'l-ensâr, 3 (3780-3781) ve 50 (3937)"}, {"no": 6, "baslik": "Mus'ab'ın Kısa Kefeni", "tur": "kaynakli", "paragraflar": ["Siyer kitaplarında anlatıldığına göre Mus'ab b. Umeyr (r.a.), Mekke'nin en bakımlı ve en zengin gençlerinden biriydi. Ailesinin yanında rahat ve gösterişli bir hayat sürüyordu. İslam'ı duyunca bu rahatlığı geride bıraktı. Ailesinin baskısına, yoksulluğa ve zorluğa rağmen yolundan dönmedi.", "Siyer kitaplarına göre Peygamberimiz (s.a.v.), hicretten önce, Birinci Akabe biatının ardından onu Medine'ye gönderdi. Berâ b. Âzib'in anlattığına göre Medine'ye ilk gelenlerden biri Mus'ab'tı; insanlara Kur'an okutuyordu. Siyer kitaplarında onun, Medine'de pek çok kişinin Müslüman olmasına vesile olduğu da anlatılır. Bu iş için görevlendirilen bu genç, şehrin gönlüne girmişti.", "Siyer kitapları, onun bu işi hiç gösteriş yapmadan, sakin ve ikna edici bir dille yaptığını anlatır. Zenginliğin değil, ilmin ve ahlakın bir temsilcisi olarak gitmişti.", "Mus'ab'ın hayatı, zengin bir gençten bir muallime dönüşmenin hikâyesidir. Hem öğretti, hem öğrendi. Medineli Müslümanların ilk hocası olarak, Kur'an'ı ve İslam'ın ahlakını onlara aktardı.", "Hicretten sonra Uhud Savaşı geldi. Mus'ab, bu savaşta şehit düştü. Savaşın ayrıntılarına girmeyeceğiz; yalnız Peygamberimizin ve sahabilerin onu nasıl yolcu ettiğini anlatacağız.", "Habbâb b. Eret (r.a.) şöyle anlatır: “Biz Resûlullah'la birlikte Allah rızası için hicret ettik; ecrimiz Allah'a aittir. İçimizden bir kısmı, hiçbir karşılık almadan göçüp gitti. Mus'ab b. Umeyr de bunlardan biriydi. Uhud günü şehit düştü ve geriye bir namire (çizgili bir yün örtü) dışında bir şey bırakmadı.” Bu olayı anlatan Habbâb, kefenleme anında orada bulunanlardan biriydi.", "Habbâb devam eder: “Onu kefenlemek için o örtüyü kullandık. Başını örttüğümüzde ayakları açıkta kalıyor, ayaklarını örttüğümüzde başı açıkta kalıyordu.” Çaresiz kaldıklarında Peygamberimiz onlara şöyle buyurdu: “Örtüyü başına çekin, ayaklarına da izhir otu koyun.” İzhir, Mekke ve çevresinde yetişen, güzel kokulu bir ottur.", "Bu iş yalnız bir kefen meselesi değildir. O gün Müslümanların elinde yeterince kumaş yoktu. Savaştan çıkmış, yaralı ve yorgun insanlar, sevdikleri bir arkadaşlarını yolcu ederken ellerindeki en küçük şeyi bile bölüşüyordu. Bu sahneye bakınca, Mekke'nin en zengin gençlerinden birinin, geriye yalnızca bir örtü bıraktığını görüyoruz. Bu örtü bile onu tam örtmeye yetmemişti. Ama bu eksiklikte bir yoksulluktan çok, bir zenginlik vardı: Dünyayı Allah için bırakmış, geriye hiçbir şey bırakmamış olmanın zenginliği.", "Habbâb'ın anlatışında şu cümle de geçer: “Bizden bazılarının meyvesi olgunlaştı ve onu devşiriyor.” Yani bazıları emeklerinin karşılığını dünyada da görmüştü; bazıları ise hiçbir karşılık görmeden gitmişti. Mus'ab bu ikincilerdendi. Dünyada rahatını bırakmış, ahirette bunun karşılığını beklemişti. Peygamberimizin “ayaklarına izhir koyun” demesi, bir eksikliği tamamlamanın ötesinde, onu saygıyla ve güzel kokuyla uğurlamaktı."], "ibret": "Dünya malı son yolculukta bize eşlik etmez. Asıl servet, Allah rızası için verilen emek, öğretilen ilim ve geride bırakılan güzel hatıradır. Gösterişsiz bir ömür de, büyük bir değerdir.", "kaynak": "Buhârî, Cenâiz, 27 (1276); Menâkıbü'l-ensâr, 45 (3897) ve 46 (3925); Megâzî (4047); Müslim, Cenâiz, 44 (940); İbn Hişâm, es-Sîre"}, {"no": 7, "baslik": "Hakikati Arayan Selmân", "tur": "kaynakli", "paragraflar": ["Selmân-ı Fârisî (r.a.) İran'ın İsfahan şehrinde, ateşe tapan bir ailede büyüdü. Babası zengin bir toprak sahibiydi ve Selmân'ı çok severdi; hatta onu evden çıkarmaz, ateşin başında bekletirdi. Bir gün babası onu arazisine gönderdi. Yolda bir kilisenin önünden geçerken içeriden gelen sesleri duydu ve durdu.", "Hıristiyanların ibadetini görünce çok etkilendi. “Vallahi bu din bizimkinden daha iyi” dedi. Onlara bu dinin nereden geldiğini sordu; Şam'dan diye cevap aldı. Babasının yanına eli boş döndü ve hakikati araştırmaya karar verdi. Babası bunu öğrenince onu zincire vurdu. Selmân ise Şam'a giden bir kervana katılıp kaçtı.", "Şam'da bir piskoposun hizmetine girdi. Rivayete göre bu adam sadaka toplayıp kendisi için biriktiriyordu. Selmân, adam ölünce bunu halka açıkladı. Sonra daha dürüst bir ruhbanla tanıştı. Bu âlimin vefatı yaklaşınca onu başka bir âlime gönderdi. Böyle böyle Musul'dan Nusaybin'e, Nusaybin'den Ammûriye'ye geçti. Rivayet uzundur; hocaların hepsini tek tek anlatmayacağız.", "Son hocası ona şunu söyledi: Yakında Arap topraklarında, İbrahim'in dinini yeniden ayağa kaldıracak bir peygamber çıkacaktı. İki kara taşlık arasında, hurmalıkları olan bir yere hicret edecekti. Sadakayı yemez, hediyeyi kabul ederdi. Rivayete göre sırtında nübüvvet mührü bulunacaktı.", "Selmân Arap topraklarına giden bir kafileyle yola çıktı; ama kafiledekiler onu bir Yahudi'ye köle olarak sattı. Efendisinin akrabası onu Medine'ye getirdi. Selmân hurmalıkları görünce hocasının tarifini hatırladı. Peygamberimizin Kuba'ya geldiğini duyunca yanında biraz yiyecekle gitti.", "Önce sadaka olarak bir şey getirdi; Peygamberimiz (s.a.v.) kendisi yemedi, sahabilere yedirdi. Sonra hediye olarak getirdi; hem kabul etti hem yedi. Selmân'ın içinde bir hakikat doğmuştu. Bir başka gün Peygamberimizin bir cenaze için gittiği Bakî mezarlığında yanına yaklaştı; hocasının söylediği son alameti de görünce kendini tutamayıp ağladı. Peygamberimiz ona “Önüme geç” dedi; Selmân da önüne geçip hikâyesini baştan sona anlattı.", "Selmân hâlâ köleydi. Peygamberimiz ona hürriyetini kazanması için efendisiyle anlaşma yapmasını tavsiye etti: Üç yüz hurma fidanı dikip yetiştirecek, bir de kırk ukiyye ödeyecekti. Sahabiler fidan getirip yardım etti; Peygamberimiz de fidanları kendi elleriyle dikti. Hiçbiri kurumadı.", "Kalan borç içinse, bir gazadan Peygamberimize tavuk yumurtası büyüklüğünde bir altın parçası geldi. Onu Selmân'a verdi. Selmân altını tarttı, borcunu ödedi ve hür oldu. Hem de bütün bu yolların sonunda, bir köle olarak, Peygamberimizin huzuruna varmıştı. Hakikati arayan bir köle, yıllar süren yolculuğun ardından hem imanını hem hürriyetini bulmuştu. Selmân sonraki savaşlarda Müslümanların yanında yer aldı. Doğduğu ateşgâhtan çıkıp bir peygamberin yanına varan bu uzun yol, onun sabrının ve samimiyetinin karşılığıydı."], "ibret": "Hakikati aramak, yorulmadan ve cesaretle yola çıkmayı gerektirir. Samimi arayış boşa gitmez; doğruyu arayan, Allah'ın izniyle yolunu bulur. Hakikat yolcusu yalnız kalmaz.", "kaynak": "Ahmed b. Hanbel, Müsned (Selmân rivayeti, 5/441-444; 23737; isnadı hasen kabul edilir); İbn Hişâm, es-Sîre"}, {"no": 8, "baslik": "İki Kuşaklı Esmâ", "tur": "kaynakli", "paragraflar": ["Esmâ bint Ebû Bekir (r.anha), hicret günlerinde henüz genç bir kadındı. Babası Hz. Ebû Bekir ile Peygamber Efendimiz (s.a.v.) gizlice Mekke'den ayrılıyordu. Hazırlıkları yapacak olanlardan biri de Esmâ'ydı.", "Esmâ, Ebû Bekir'in büyük kızıydı. Âişe (r.anha) hicret günlerini anlatırken, azığın acele hazırlandığını ve bu işte Esmâ'nın payı olduğunu bildirir. Gece yolculuğunun gizli olması, hazırlığın da sessiz ve çabuk yapılmasını gerektiriyordu. Esmâ, bu işi üstlenen genç kadındı ve bu sorumluluğu hiç şikâyet etmeden yerine getirdi. Elinde ne varsa onu kullanarak çözüm üretti.", "Esmâ olayı şöyle anlatır: “Ebû Bekir ile Peygamberimizin yolculuk azığını hazırladım. Ancak azığı ve su kabını bağlayacak bir şey bulamadım. Babama, ‘Vallahi bağlayacak bir şey bulamıyorum, kuşağımdan başka’ dedim. ‘Kuşağını ikiye böl’ dedi. Ben de ikiye bölüp biriyle azığı, diğeriyle su kabının ağzını bağladım.”", "Bu davranışı yüzünden ona “zâtü'n-nitâkayn”, yani “iki kuşaklı” denildi. Bu ad, bir yoksulluğun değil, bir fedakârlığın adıydı. Kendisi için önemli olan kuşağını, Allah rızası için Resûlullah'ın yolculuğuna feda etmekten çekinmemişti.", "Hikâyenin devamını Esmâ'nın kendisi anlatır; bu rivayet Ahmed b. Hanbel'in Müsned'inde ve siyer kitaplarında yer alır. Ebû Bekir (r.a.) yola çıkarken bütün parasını, beş altı bin dirhemi yanına almıştı. Evde Esmâ ve kardeşleri kalmıştı.", "Bir süre sonra Esmâ'nın dedesi Ebû Kuhâfe, evlerine geldi. Gözleri görmüyordu. Torunlarına şöyle dedi: “Vallahi, görüyorum ki Ebû Bekir hem sizi bırakıp gitti hem de parasını götürdü; sizi mahrum etti.” Dedesi, torunlarının aç kalacağından endişe ediyordu.", "Esmâ ise ona yumuşak bir şekilde cevap verdi: “Hayır dedeciğim, bize çok hayır bıraktı.” Sonra evin köşesindeki bir yere, babasının parasını koyduğu yere küçük taşlar yerleştirdi, üzerine bir örtü örttü. Dedesinin elini tutup oraya götürdü ve “Elini şu mala koy” dedi.", "Gözleri görmeyen yaşlı adam elini taşların üstüne koydu. Taşları para sandı. Rahatlayarak şunu söyledi: “Eğer size bunu bıraktıysa, güzel yapmış. Bu sizin için yeterlidir.” Esmâ'nın sözleri şöyle bitiyor: “Vallahi bize bir şey bırakmamıştı; ama ben yaşlı adamın içini rahatlatmak istedim.”", "Burada bir kadının hem akıllı hem şefkatli davrandığını görüyoruz. Esmâ, babasının asıl bıraktığı hayrın iman ve güven olduğunu biliyordu; endişelenen yaşlı dedesini kırmadan teselli etmek istedi. Amacını kendisi açıkça söyler: Yaşlı adamın içini rahatlatmak. Bu aile, Ebû Bekir'in bıraktığı serveti değil, onun bıraktığı güveni taşıyordu. Bu hikâye, Esmâ'nın zekâsını ve şefkatini gösteriyor. Hicret yolculuğu, yalnız yola çıkanların değil, geride kalanların da imtihanıydı. Esmâ, hem azığı hazırlayarak hem de dedesini rahatlatarak bu imtihanın içinde kendi payını güzel biçimde yerine getirdi."], "ibret": "Esmâ'nın kuşağı küçük bir fedakârlık gibi görünür; ama büyük bir yolculuğa güç vermiştir. Zor anlarda akıllıca ve sakin davranmak, yaşlıların gönlünü gözetmek güzel bir ahlaktır.", "kaynak": "Buhârî, Cihâd, 123 (2979); Menâkıbü'l-ensâr, 45 (3905); Et'ime (5388); Ahmed b. Hanbel, Müsned, 26957; İbn Hişâm, es-Sîre"}], "kapanis": "Sekiz sahabi, sekiz ayrı hâl. Biri bütün malını getirdi, biri kıtlıkta halkıyla aynı yükü taşıdı, biri Kur'an'ı birleştirdi, biri hakikat için ömrünü yollarda geçirdi. Hepsi Peygamberimizin yanında öğrendiğini yaşadı. Bize düşen, onların hikâyesini okumakla kalmayıp, kendi hayatımızda küçük de olsa birer iz bırakmaktır.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/03/", "kapak": "../../kapak/03.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 4, "baslik": "Annelerin Duaları", "hazir": true, "yol": "../04/index.html"}, "pdf": "../../pdf/kitap-03.pdf", "epub": "../../epub/kitap-03.epub", "gorunum": "kitap-gorunumu.html"}</script>
