<script type="application/json" id="kitap-veri">{"no": 14, "baslik": "Büyüklerin Öğütleri", "tanitim": "Lokman'dan Yakup'a, Peygamber Efendimizin genç sahabilere söylediği sözlere kadar, hikmetli öğütlerin sekiz hikâyesi.", "onsoz": "Bir öğüdün değeri, söyleyenin yüreğinden çıkıp dinleyenin gönlüne yerleşmesinden belli olur. Bu kitapta bir babanın oğluna, bir peygamberin oğullarına, Peygamber Efendimizin gençlere söylediği sözleri okuyacağız. Kur'an ve sahih hadislerden süzülen bu sözler, bugün de bize aynı sıcaklıkla seslenmeye devam ediyor.", "hikayeler": [{"no": 1, "baslik": "Lokman'ın Oğluna Öğütleri", "tur": "kaynakli", "paragraflar": ["Kur'an, bir babanın oğluna söylediklerini bize bugüne kadar ulaştırır. Bu baba Lokman'dır. Allah, ona hikmet verdiğini şöyle bildirir: “Andolsun, Lokman'a hikmet verdik: Allah'a şükret. Kim şükrederse kendi iyiliği için şükretmiş olur.” (Lokmân, 31/12) Hikmetin ilk adımı şükürdür. Peygamber olup olmadığı konusunda âlimler farklı düşünmüştür; çoğunluk onu hikmet sahibi, salih bir kul olarak görür. Hayatına dair başka rivayetlere girmiyoruz; elimizdeki en kıymetli şey, oğluna söyledikleridir.", "Öğüdün ilk cümlesi, en önemli cümledir: “Yavrucuğum! Allah'a ortak koşma. Çünkü ortak koşmak, büyük bir zulümdür.” (31/13) Bu sözle Lokman, evlat sevgisini imanın temeline bağlıyor. Babanın oğluna bırakabileceği en değerli hazine, ona tek olan Allah'ı tanıtmaktır.", "Ardından iki ayet araya girer; bunlar artık Lokman'ın değil, doğrudan Allah'ın sözüdür. Allah, insana anne ve babasına iyilik etmesini öğütler. Annesi onu zayıflık üstüne zayıflıkla taşımış, sütten kesilmesi iki yıl sürmüştür. İnsan, hem Allah'a hem anne babasına şükretmelidir. Ama onlar Allah'a ortak koşması için zorlarsa, bu konuda onlara uyulmaz; yine de dünyada onlarla güzel geçinilir. (31/14-15) Sonra Lokman'ın öğütleri kaldığı yerden devam eder.", "“Yavrucuğum! Yapılan iş bir hardal tanesi kadar olsa, bir kayanın içinde ya da göklerde veya yerde bulunsa bile Allah onu getirir. Şüphesiz Allah, her şeyin en inceliğini bilir ve her şeyden haberdardır.” (31/16) Küçük bir iyilik de, küçük bir kötülük de gözden kaçmaz. Hiçbir şey kaybolmaz; hiçbir şey unutulmaz.", "Sonra yaşama dair öğütler gelir: “Yavrucuğum! Namazı dosdoğru kıl, iyiliği öğütle, kötülükten alıkoy ve başına gelene sabret. Çünkü bunlar, azmedilmesi gereken işlerdendir.” (31/17) Dikkat edin: namaz, iyilik ve sabır birlikte geçiyor. İbadet insanı yalnız Rabbine değil, insanlara da yöneltiyor; iyilik yolunda karşılaşılacak zorluk için de sabır isteniyor.", "Son öğütler davranışlarla ilgilidir: “İnsanlardan küçümseyerek yüz çevirme, yeryüzünde böbürlenerek yürüme. Çünkü Allah, kibirli ve övünen hiç kimseyi sevmez.” (31/18) Gerçek ağırlık, adımların sertliğinde değil, gönlün tevazuundadır. İnsana insan olarak bakmak, ona yüzünü çevirmemekle başlar.", "Ve son sözler: “Yürüyüşünde ölçülü ol, sesini alçalt. Çünkü seslerin en çirkini, şüphesiz eşeklerin anırtısıdır.” (31/19) Burada bağırıp çağırmak değil, yumuşak ve vakur konuşmak öğütlenir. Ses kısılınca gönül açılır, kelimeler yerini bulur.", "Lokman'ın öğütleri, bir babadan oğluna kalan bir yol haritası gibidir: önce iman, sonra anne babaya saygı, sonra her şeyi bilen bir Rabbe güven, ardından namaz, iyilik, sabır, tevazu ve ölçü. Asırlar geçmesine rağmen bu sözler, hikmetin ne olduğunu bize hatırlatıyor. Öğütlerin çoğunun “Yavrucuğum” diye bir sevgi hitabıyla başladığını da unutmayalım; öğüt, sevgiyle söylenince kalbe işler."], "ibret": "Gerçek hikmet, yalnız bilmek değil, doğru yaşamaktır. Önce iman, sonra güzel ahlak, sonra tevazu ve ölçü; bir babanın oğluna bırakabileceği en güzel miras budur. Öğüt de sevgiyle söylenince kalbe yerleşir.", "kaynak": "Lokmân Sûresi, 31/12-19"}, {"no": 2, "baslik": "Yakup'un Son Sorusu", "tur": "kaynakli", "paragraflar": ["Bir ömrün sonuna gelen insan, en çok neyi merak eder? Yakup (a.s.) için cevap belliydi. Kur'an, bu sahneyi kısa ama dolu dolu anlatır. Yerini, zamanını ve kimlerin bulunduğunu bildirmez; yalnızca Yakup'un oğullarına bir soru sorduğunu söyler. Biz de ayetlerde olmayan bir ayrıntı eklemeyeceğiz. Önemli olan, o sorunun kendisidir.", "Önce Yakup'un dedesi İbrahim'e bakalım. Kur'an, İbrahim'in yolundan yüz çevirenin ancak kendini bilmeyen biri olabileceğini söyler. Allah onu dünyada seçmiş, ahirette de salihlerden kılmıştır. (Bakara, 2/130) Rabbi ona “Teslim ol” dediğinde, İbrahim hiç beklemeden “Âlemlerin Rabbine teslim oldum” demiştir. (2/131)", "Ayet şöyle devam eder: “İbrahim de, Yakup da oğullarına şöyle vasiyet etti: Oğullarım! Allah sizin için bu dini seçti. O hâlde siz de ancak Müslüman olarak can verin.” (2/132) Bu cümlede mirasın ne olduğu açıktır: mal değil, mülk değil, din; yani Allah'a teslimiyet. Aynı vasiyet, atadan evlada, evladan torunlara yolculuk eder.", "Sonra sahne kendine gelir: “Yoksa Yakup'a ölüm geldiği zaman siz orada mıydınız?” (2/133) Müfessirlere göre bu soru, Yakup'un dini hakkında iddiada bulunanlara yöneltilmiştir. Biz de orada değildik; ama Kur'an bizi o sahnenin içine götürür. Yakup'un oğullarına söylediği söz şudur: “Benden sonra neye kulluk edeceksiniz?”", "Soru kısaydı ve yumuşaktı. Yakup oğullarına mallarını ya da işlerini sormuyordu; “Benden sonra neye kulluk edeceksiniz?” diyordu. Bu soru bir yoklama değildi. Bir baba, gözünü hayata yumarken, arkasında bıraktığı evlatlarının kalbine bakıyordu. Onlara bir mal ya da bir makam hakkında soru sormuyordu; kalplerinin kime bağlı olduğunu soruyordu. Çünkü bir babanın en büyük endişesi, evladının yolunu şaşırmasıdır.", "Oğulları şöyle cevap verdi: “Senin ilahına ve atalarının, İbrahim'in, İsmail'in ve İshak'ın ilahı olan bir tek Allah'a kulluk edeceğiz; biz O'na teslim olmuşuz.” (2/133) Müfessirler, Arapçada “baba” kelimesinin amcayı da kapsayabildiğini belirtir; bu yüzden İsmail de ataları arasında anılır. Cevap, vasiyetin kabul edildiğini gösteriyordu: Evlatlar, atalarının yolundan yürümeye hazırdı.", "Bu sahne, yalnız Yakup'un değil, her babanın ve her annenin içindeki sessiz soruyu dile getirir: Biz gittikten sonra ne olacak? Kur'an'ın cevabı yumuşaktır. Miras, mal ve makamla değil, bir gönül yoluyla bırakılır. Evlatlar, verilen cevapla sorumluluğu üstlenir.", "Dikkat edin: Yakup, sorusunu bir tehdit olarak sormaz; bir güven duygusuyla sorar. Oğullarının cevabı da bir cevap olmanın ötesinde, bir söz vermedir. Bir ailenin en değerli bağı, aynı Rabbe duyulan teslimiyettir. Hayatın sonunda geriye kalan, bu bağdır. Bugün bir anne ya da baba çocuğuna dua ederken de aynı şeyi diler: Rabbim, bizden sonra da seni kendine bağlı kılsın."], "ibret": "Bir ebeveynin evladına bırakacağı en değerli ve en kalıcı miras, imandır. Evlat da bu emaneti, kalbinden ve sözünden eksik etmemelidir. Güzel bir vasiyet, ancak kabul edilince tamamlanır.", "kaynak": "Bakara Sûresi, 2/130-133"}, {"no": 3, "baslik": "İbrahim'in Babasına Yumuşak Öğüdü", "tur": "kaynakli", "paragraflar": ["Kimi öğütler, söylediği kişinin sevgisini de içinde taşır. İbrahim (a.s.) babasına öğüt verirken de böyle yaptı. Meryem Sûresi, bu konuşmayı bize ayrıntısıyla aktarır. Kur'an, İbrahim'i “çok doğru, güvenilir bir peygamber” diye anar. (Meryem, 19/41) Babasının adı ve nasıl bir akrabalık bağı olduğu konusunda âlimler farklı düşünmüştür; biz o tartışmaya girmeden Kur'an'ın aktardığı sözlere bakalım.", "İbrahim sözlerine hep aynı sıcak hitapla başlar: “Babacığım!” Önce soruyu sorar: “Babacığım, işitmeyen, görmeyen ve sana hiçbir faydası olmayan şeylere niçin tapıyorsun?” (Meryem, 19/42) Bu soru bir suçlama değildi; bir düşünmeye çağrıydı. İbrahim “Sen yanlış yoldasın” demiyor, soruyla gönlün kapısını çalıyordu. Hemen ardından kendisini de alçak gönüllülükle anlatır: “Babacığım, sana gelmeyen bir bilgi bana geldi. Bana uy ki seni doğru yola ileteyim.” (19/43)", "Sonra ikinci bir “Babacığım” gelir: “Şeytana kulluk etme. Çünkü şeytan Rahman'a isyan etmiştir.” (19/44) Üçüncü kez de aynı hitap tekrarlanır: “Babacığım, Rahman'dan sana bir azap dokunmasından ve şeytanın dostu olmandan korkuyorum.” (19/45) Dikkat edilirse İbrahim bir yargı vermiyor; sevdiği biri için korktuğunu söylüyor. Her cümlesi, bir evladın babasına duyduğu endişeyle yoğrulmuş. Sözlerde ne bir yükseklik, ne de bir kırıcılık var; yalnızca sevgi ve saygı.", "Babanın cevabı ise sertti: “Ey İbrahim! Sen benim ilahlarımdan yüz mü çeviriyorsun? Vazgeçmezsen seni mutlaka taşlarım. Uzun bir süre benden uzak dur.” (19/46) Bir oğul, babasından bu sözleri duyuyordu. Hem tehdit hem kovulma vardı. Üstelik bu sözleri söyleyen, ona en yakın insanlardan biri, babasıydı.", "İbrahim bu söz karşısında kırıcı bir cevap vermedi. Onun cevabı Kur'an'da şöyle geçer: “Selam sana! Rabbimden senin için bağışlanma dileyeceğim. Çünkü O, bana karşı çok lütufkârdır.” (19/47) Tartışmaya girmedi, öfkelenmedi, babasını incitmedi. Ona bir “selam” bıraktı ve uzaklaştı. Aldığı cevap sert olsa da, İbrahim'in dili aynı yumuşaklıkta kaldı. Kur'an, onun bu bağışlanma dileğini babasına verdiği söz üzerine yaptığını, babasının Allah'a düşmanlığı açıkça belli olunca ondan uzaklaştığını da bildirir. (Tevbe, 9/114)", "Sonra ayrılma sözünü de söyledi: “Sizden de Allah'tan başka taptıklarınızdan da ayrılıp uzaklaşıyorum. Rabbime dua edeceğim; umulur ki Rabbime dua etmekle mutsuz olmam.” (19/48) İbrahim yürüdü. Arkasında bıraktığı bir baba, önünde duran bir yol vardı. Yine de yüreğindeki yumuşaklık yerindeydi.", "Bu sahnede insanı etkileyen, İbrahim'in “haklı” olduğunu ispatlamaya çalışmaması. Hakikati söyledi, sevgiyi elden bırakmadı. Üstünlük taslamadan, “bana bir bilgi geldi” diyerek konuştu. Karşı tarafın sertliği karşısında bile dilini kırıcılıktan korudu. Gerçek hikmet, doğruyu söylemekle kalmaz, onu nasıl söyleyeceğini de bilir.", "Bugün de bir yakınımıza, bir dostumuza doğruyu söylemek zorunda kaldığımızda İbrahim'in bu örneğine bakabiliriz. Önce sevgiyi, sonra sözü; önce yumuşaklığı, sonra gerçeği. Kapı kapanırsa da, selam ile ayrılmak, gönlü açık tutar."], "ibret": "Doğruyu söylerken tatlı dili elden bırakmamak gerekir. Karşıdaki ne kadar sert olursa olsun, selamla ve hidayet dileğiyle ayrılmak, kalbi temiz tutar. Doğruyu söylemek bir görevdir; kırıcı olmamak ise bir erdemdir.", "kaynak": "Meryem Sûresi, 19/41-48; Tevbe Sûresi, 9/114"}, {"no": 4, "baslik": "Firavun'un Sarayındaki Mümin", "tur": "kaynakli", "paragraflar": ["Firavun bir gün şöyle dedi: “Bırakın beni, Musa'yı öldüreyim.” (Ğâfir, 40/26) Bu sözü duyanlar arasında bir kişi daha vardı. Kur'an, onun adını vermez; yalnızca “Firavun ailesinden imanını gizleyen bir mümin” der. Bu adamın adı sonraki tefsir rivayetlerinde geçer; ama biz yalnızca ayetlerin söylediğini anlatacağız.", "Adam öne çıkıp söz aldı: “Rabbim Allah'tır diyor diye bir adamı mı öldüreceksiniz? Hâlbuki size Rabbinizden apaçık deliller de getirdi. Eğer yalancıysa, yalanı kendi aleyhinedir. Eğer doğru söylüyorsa, sizi tehdit ettiği şeylerin bir kısmı başınıza gelir.” (Ğâfir, 40/28) Ne kadar sakin ve mantıklı bir konuşma! Musa'yı korumak için bile, kimseyi suçlamadan konuşuyordu.", "Sonra uyarıyı da yaptı: “Ey kavmim! Bugün hükümranlık sizin, yeryüzünde üstünsünüz. Ama Allah'ın azabı gelirse, bize kim yardım eder?” (40/29) Firavun bu sözlere şöyle karşılık verdi: “Ben size ancak kendi gördüğümü gösteriyorum.” Adam yılmadı, geçmiş kavimlerin sonunu hatırlattı: “Ey kavmim! Ben sizin için, daha önceki toplulukların başına gelen günler gibi bir günden korkuyorum.” (40/30) Nuh kavminin, Âd'ın, Semûd'un akıbetini anarak saraydakilerin gönlüne dokunmaya çalıştı.", "Konuşmasının merkezinde şu cümleler vardı: “Ey kavmim! Bana uyun, sizi doğru yola ileteyim. Ey kavmim! Bu dünya hayatı geçici bir faydalanmadır. Ahiret ise kalıcı yurttur.” (40/38-39) Dünya ve ahiret arasındaki farkı, Firavun'un ve adamlarının önünde, hiç çekinmeden söylüyordu. Bu cesaret, imanın gücünden geliyordu. Sözlerinde ne bir hakaret, ne de bir tehdit vardı; yalnızca akıl ve merhamet.", "Bir de şu hayret verici sözü söyledi: “Ey kavmim! Ne oluyor bana ki ben sizi kurtuluşa çağırıyorum, siz beni ateşe çağırıyorsunuz?” (40/41) Birini yanlış yola çağıranlar, kendi yönlerinin farkında olmayabilir. Adam bunu nazik ama net bir şekilde gösteriyordu.", "Sözlerini şöyle bitirdi: “Şimdi size söylediklerimi yakında hatırlayacaksınız. Ben işimi Allah'a havale ediyorum. Şüphesiz Allah, kullarını hakkıyla görendir.” (40/44) Bu sözler bir kapanış değil, bir güven beyanıydı. Sonuç ne olursa olsun, o işini Allah'a bırakmıştı. Kur'an sonrasını şöyle bildirir: “Allah onu, kurdukları tuzakların kötülüklerinden korudu.” (40/45)", "Yüzyıllar sonra, Mekke'de benzer bir sahne yaşandı. Abdullah b. Amr'ın anlattığına göre müşriklerden biri, Peygamber Efendimiz (s.a.v.) namaz kılarken boynuna bir giysi dolayıp sıktı. Ebubekir (r.a.) yetişip adamı uzaklaştırdı ve şu ayeti okudu: “Rabbim Allah'tır dediği için bir adamı mı öldürüyorsunuz?”", "İki sahne arasında yüzyıllar var, ama aynı ruh var: Güçlü olanın karşısında, haklıya sahip çıkmak. Bunu yaparken sesini yükseltmeden, akıl ve merhametle konuşmak. Kur'an mümin adamın adını vermez; ama sözü, bu kadar yıl sonra hâlâ yürekleri harekete geçiriyor."], "ibret": "Haksızlık karşısında susmamak, imanın bir gereğidir. Ama bunu yaparken ölçüyü, sakinliği ve merhameti elden bırakmamak gerekir. Sonuç ne olursa olsun, işi Allah'a havale eden kimse korkmaz.", "kaynak": "Ğâfir (Mü'min) Sûresi, 40/26, 28-45; Buhârî, Fezâilü'l-ashâb (3678)"}, {"no": 5, "baslik": "Karun'a Verilen Öğüt", "tur": "kaynakli", "paragraflar": ["Bazı insanlar elindekini, kendi gücü sanır. Karun da böyleydi. Kur'an onu Musa'nın kavminden biri olarak anar ve şöyle der: Karun onlara karşı şımarmıştı. Ona öyle hazineler verilmişti ki, onların anahtarlarını bile güçlü bir topluluk zor taşırdı. (Kasas, 28/76) Hazinelerin tam miktarı hakkındaki rivayetlere girmiyoruz; ayetin söylediği yeterlidir.", "Kavmi ona şöyle seslendi: “Şımarma! Çünkü Allah, şımarıp böbürlenenleri sevmez.” (28/76) Sonra öğütleri sıraladılar: “Allah'ın sana verdiği şeylerle ahiret yurdunu ara. Dünyadan da nasibini unutma. Allah sana nasıl iyilik ettiyse, sen de iyilik et. Yeryüzünde bozgunculuk arama. Çünkü Allah bozguncuları sevmez.” (28/77) Bu sözler bir tehdit değil, bir dostluk uyarısıydı; yanlış yöne giden birine “Şımarma” diyen, onun iyiliğini istiyordu.", "Bu öğüt, ne kadar dengeli! Dünyayı bütünüyle reddettirmiyor; “dünyadan nasibini unutma” diyor. Ama dünyayı hedef de yapmıyor; “ahiret yurdunu ara” diyor. Ve en önemlisi, nimeti paylaşmaya çağırıyor: “Allah sana iyilik etti, sen de iyilik et.” Servet, bir emanete dönüşüyor.", "Karun ise şöyle cevap verdi: “Bu servet bana, sahip olduğum bir bilgi sayesinde verildi.” (28/78) Ona verilen her şeyi kendi emeğinin ürünü sanıyordu. Hâlbuki Allah, ondan önce de ondan daha güçlü ve daha zengin nice nesilleri helak etmişti. İnsan, nimeti kendine mal ettiği ânda, şükürden uzaklaşır.", "Bir gün Karun, kavminin karşısına bütün görkemiyle çıktı. Dünya hayatını isteyenler ona imrenerek baktı: “Keşke Karun'a verilenin bir benzeri bize de verilseydi! Gerçekten o büyük bir paya sahip.” (28/79) Ama kendilerine ilim verilenler, onlara şöyle dedi: “Yazıklar olsun size! Allah'ın sevabı, iman edip iyi iş yapan kimse için çok daha hayırlıdır. Buna ancak sabredenler kavuşturulur.” (28/80)", "Karun'un sonu, Kur'an'da tek cümleyle anlatılır: Allah onu da, sarayını da yere geçirdi. (28/81) Hikâyenin ağırlığı bu cümlede değil, öğütte ve ardından gelen uyanışta. Dün imrenenler, bu manzara karşısında şaşkına döndü. “Demek ki Allah, kullarından dilediğine rızkı genişletir, dilediğine kısar. Allah bize lütfetmeseydi, bizi de batırırdı.” (28/82)", "Sonunda şu müjde gelir: “İşte ahiret yurdu; biz onu, yeryüzünde büyüklük taslamak ve bozgunculuk yapmak istemeyenlere veririz. Güzel sonuç, Allah'a karşı gelmekten sakınanlarındır.” (28/83) Zengin olmak kötü bir şey değil; zenginliğin insana kibir ve unutkanlık getirmesi kötü. Nimeti veren Rabbini hatırlayan kimse, elindekini paylaşmaktan korkmaz.", "Kavmi, Karun'a bu sözleri söyleyerek ona bir kurtuluş yolu gösterdi. O yolu seçmedi. Ama bu öğütler bugün hepimiz için hâlâ geçerli: Elimizde olan her şey emanettir; şükür, paylaşım ve tevazu ile korunur."], "ibret": "Elimizdeki her nimet bir emanettir. Onu kendi gücümüzden bilirsek şükrü unuturuz; Allah'ın lütfu olarak görürsek paylaşmayı ve iyilik yapmayı öğreniriz. Şükreden, nimette bereket bulur; tevazu sahibi, kalpte huzur.", "kaynak": "Kasas Sûresi, 28/76-83"}, {"no": 6, "baslik": "Selmân'ın Ebu'd-Derdâ'ya Öğüdü", "tur": "kaynakli", "paragraflar": ["Bir kardeşlik yalnız iyi niyetle değil, dürüst bir söz ve sevgiyle de güçlenir. Peygamber Efendimiz (s.a.v.), Medine'ye hicretten sonra sahabeleri birbirleriyle kardeş yapmıştı. Selmân (r.a.) ile Ebu'd-Derdâ (r.a.) da kardeş olmuştu. Bu kardeşlik yalnızca yan yana oturmak değil, birbirinin hâlini gözetmekti. Bir gün Selmân, kardeşini ziyaret etmeye gitti.", "Selmân evde Ebu'd-Derdâ'nın hanımını bakımsız bir hâlde gördü ve sebebini sordu. Kadın şöyle cevap verdi: “Kardeşin Ebu'd-Derdâ'nın dünyaya hiç ihtiyacı yok.” Yani eşi, ibadetle o kadar meşguldü ki ailesine ve kendine zaman bırakmıyordu. Selmân bir şey demedi; ama kardeşinin hâlini anlamıştı.", "Biraz sonra Ebu'd-Derdâ geldi. Selmân'a yemek hazırladı ve “Buyur ye, ben oruçluyum” dedi. Selmân cevap verdi: “Sen yemedikçe ben yemem.” Bu nezaket karşısında Ebu'd-Derdâ orucunu bozdu ve birlikte yemek yediler. Kimse kimseyi incitmemişti. Selmân'ın bu davranışı, bir kardeşi kırmadan, ona dostça bir ölçü göstermekti.", "Gece olunca Ebu'd-Derdâ namaza kalkmak istedi. Selmân ona, “Uyu” dedi. Ebu'd-Derdâ uyudu. Bir süre sonra yine kalkmak istedi; Selmân yine “Uyu” dedi. Gecenin sonlarına doğru Selmân ona, “Şimdi kalk” dedi. İkisi birlikte namaz kıldılar. Selmân, ibadeti yasaklamıyordu; ona ölçüyü ve zamanlamayı öğretiyordu.", "Namazdan sonra Selmân kardeşine şöyle dedi: “Şüphesiz Rabbinin senin üzerinde bir hakkı var; nefsinin senin üzerinde bir hakkı var; ailenin senin üzerinde bir hakkı var. O hâlde her hak sahibine hakkını ver.” Bu söz, bir ibadet dersi değil, bir hayat dersiydi. Rabbin hakkı, kulluk ve şükürdü. Nefsin hakkı, yemek, uyku ve dinlenmekti. Ailenin hakkı ise ilgi, bakım ve onlara zaman ayırmaktı. Biri için diğerini unutmak, dengeyi bozmaktı. İbadet de dengeye, rahmete ve ölçüye muhtaçtı.", "Ebu'd-Derdâ, bu olayı Peygamber Efendimize anlattı. Peygamberimiz şöyle buyurdu: “Selmân doğru söylemiş.” Böylece Selmân'ın öğüdü, Peygamberimizin onayıyla daha da değer kazanmış oldu. Selmân'ın yaptığı, kardeşliğin gereğiydi: kardeşinin hâlini fark etmek ve ona kırmadan, usulca yol göstermek. Hadiste Ebu'd-Derdâ'nın bundan sonra neler yaptığı anlatılmaz; ama onun dinlemeye hazır bir gönlü olduğu açıktır.", "Bu hikâyede iki güzel örnek var. Biri, kardeşine nazik ve dürüst davranan Selmân. Diğeri, tatlı bir öğüdü kibir göstermeden dinleyen Ebu'd-Derdâ. İbadeti küçümsemek yok; ibadeti çoğaltmak da güzel. Ama bunu yaparken eşini, çocuklarını, kendi bedenini unutmak yok. Denge, hayatın bütününü kucaklıyor.", "Bugün de bir kardeşimizin, bir arkadaşımızın kendini aşırı yorduğunu görürsek, onu kırmadan ve yargılamadan yanına oturabiliriz. Doğru söz, doğru zamanda ve nezaketle söylendiğinde, bir kardeşe verilebilecek en değerli armağanlardan biridir."], "ibret": "Her hakkın sahibine hakkını vermek, imanın gereğidir. İbadet güzeldir; ama Rabbin, nefsin ve ailenin hakkını dengede tutmak, daha da güzeldir. Doğru söz, nazikçe söylendiğinde kardeşliği güçlendirir.", "kaynak": "Buhârî, Savm, 51 (1968); Edeb, 86 (6139)"}, {"no": 7, "baslik": "Ey Çocuk, Sana Bazı Sözler Öğreteyim", "tur": "kaynakli", "paragraflar": ["Küçük bir çocuk, Allah'ın Resulü'nün terkisinde, onun hemen arkasında otururken ne düşünür? Abdullah b. Abbas (r.a.) o gün henüz çocuktu ve Peygamber Efendimizin (s.a.v.) terkisindeydi. Yolculuk sırasında Peygamberimiz ona dönüp şöyle dedi: “Ey çocuk, sana bazı sözler öğreteyim.”", "Peygamberimiz sözlerine şöyle devam etti: “Allah'ı gözet ki Allah da seni gözetsin.” Yani Allah'ın emirlerine ve yasaklarına dikkat et; Allah da seni her hâlde koruyup kollasın. Bir çocuğa söylenen bu cümle, bir ömre yetecek kadar derindir.", "Sonra ekledi: “Allah'ı gözet, O'nu önünde bulursun.” Yani Allah'ın emirlerine dikkat eden kişi, ihtiyaç duyduğunda O'nun yardımını yanında bulur. Bu, hayatın her işinde Allah'ı hatırlayan bir gönlün sonucudur.", "Sonraki cümle çocuğun kalbine yerleşecek türdendi: “Bir şey istediğinde Allah'tan iste; yardım dilediğinde Allah'tan yardım dile.” Çocuk bundan sonra her ihtiyacında, ilk olarak Rabbine yönelmeyi öğrenmiş oldu. Bu, başkalarından yardım istemeyi yasaklamak değil; asıl yardımcının kim olduğunu bilmektir. Derdi olan biri ilk kapıyı Rabbinin kapısı bilirse, çaresizlikte bile umut bulur.", "Peygamberimiz sonra şunu söyledi: “Şunu bil ki bütün insanlar sana bir fayda sağlamak için bir araya gelseler, Allah'ın senin için yazdığından başka bir fayda sağlayamazlar. Sana bir zarar vermek için bir araya gelseler, Allah'ın senin aleyhine yazdığından başka bir zarar veremezler.” Yani en güçlü dostlar da, en güçlü engeller de Allah'ın izni dışında bir şey yapamaz. Bu söz, korkunun yerine güveni getirir.", "Son cümle ise şuydu: “Kalemler kaldırıldı, sahifeler kurudu.” Yani Allah'ın hükmü yazılmıştır ve değişmez. Bu söz, insanı kadere teslim olmaya ve boş korkulardan kurtulmaya çağırır. Çalışmak, tedbir almak güzeldir; ama sonucu Allah'a bırakmak, insanın gönlüne ferahlık verir.", "Bu hadisin daha uzun bir şekli de vardır; ama biz burada, Tirmizî'nin “hasen sahih” dediği kısa ve sağlam metne bağlı kaldık. Ne kadar sade görünse de, içinde bir hayat dersi saklıdır. Bir öğrenci sınavdan önce çalışır, sonucu ise Allah'tan bekler. Bir hasta tedavisini olur, şifayı ise Allah'tan diler. Tedbir de, tevekkül de bu sözün içindedir.", "Peygamberimiz bir çocuğa yalnızca yön göstermedi; onu muhatap aldı. Küçük bir yaştaki birine “Ey çocuk” diye hitap edip dinlemeye değer bir söz söylemek, ona değer vermektir. Düşünün: Bir çocuk, Peygamber Efendimizin arkasında ilerliyor. Ve ona verilen şey bir oyuncak ya da bir hediye değil; ömür boyu taşıyacağı bir güven duygusu. Bu söz yalnızca bir çocuğa değil, bizim hepimize de söylenmişti. Küçük yaşta kalbe yerleşen böyle bir güven, ömür boyu insanın yoldaşı olur."], "ibret": "Allah'ın emirlerini gözeten, O'nun korumasını yanında bulur. Yardım dileyeceği zaman Allah'a yönelen, gönlünü korkulardan kurtarır. Bir çocuğa söylenen bu sözler, hepimizin yolunu aydınlatır. Allah'a dayanan, hiçbir korkuya boyun eğmez.", "kaynak": "Tirmizî, Kıyâme, 59 (2516)"}, {"no": 8, "baslik": "Muaz'a Veda Öğüdü", "tur": "kaynakli", "paragraflar": ["Bir görev için yola çıkan iki sahabi düşünün. Önlerinde uzun bir yolculuk, gidecekleri yerde yeni insanlar, yeni zorluklar var. Peygamber Efendimiz (s.a.v.) Muaz b. Cebel (r.a.) ile Ebû Mûsâ el-Eş'arî'yi (r.a.) Yemen'e gönderirken onlara bir öğüt verdi. Bu öğüt, sadece o iki kişiye değil, insanlarla muamele eden herkese söylenmişti.", "“Kolaylaştırın, zorlaştırmayın. Müjdeleyin, nefret ettirmeyin. Birbirinize uyun, ayrılığa düşmeyin.” Bu üç öğüt, Buhârî ve Müslim'in naklettiği sahih bir hadiste geçer. Her cümlesi bir ilke gibidir: Dini öğretirken insanları bunaltmamak, hep umut ve müjde vermek, aralarında uyumu korumak.", "Mesela kolaylaştırmak, yeni öğrenen birine yalnızca ağır yükleri değil, kolay olanı da göstermektir. Müjdelemek, hata yapan birine önce rahmeti hatırlatmaktır. Uyumlu olmak da, her fikir ayrılığını bir kavgaya çevirmemektir. Bu öğüt, o gün Yemen'e giden iki arkadaşa bir yol haritası oldu. İnsanlara yumuşaklıkla yaklaşmaları, onları zorluklarla yüzleştirmek yerine kolaylıkla eğitmeleri gerekiyordu. Bir öğretmenin, bir yöneticinin, bir ebeveynin bugün de hatırlaması gereken bir ölçüdür bu.", "Başka bir gün, Peygamber Efendimiz Muaz'ın elini tuttu ve şöyle dedi: “Ey Muaz! Vallahi ben seni seviyorum.” Bir peygamberden, hele genç bir sahabiye bu kadar sıcak bir cümle duymak, insanın hayatında derin bir iz bırakır.", "Sonra Peygamberimiz sözüne devam etti: “Sana tavsiye ederim, ey Muaz! Her namazın sonunda şu duayı etmeyi bırakma: Allahım! Seni anmak, sana şükretmek ve sana güzel ibadet etmek için bana yardım et.” Bu dua, kısa ama bütün bir hayatı kapsıyor. Her gün tekrarlanınca insanın yönünü sürekli Allah'a çevirir, öğüdü bir alışkanlığa dönüştürür. İçinde şunlar var: Önce Allah'ı anmak, sonra şükretmek, sonra da ibadeti güzel yapmak.", "Düşünürsek, bu duada insan bir şeyi Allah'a bırakıyor: yardım. Allah'ı anmak bile Allah'ın yardımıyla oluyor. Şükretmek de, ibadeti güzel yapmak da. Böylece insan hem tevazuyu hem de bağlılığı öğreniyor. Kendini beğenmek yerine, her işte Allah'a yönelmeyi.", "Peygamberimizin Muaz'a sevgisini dile getirmesi de önemlidir. İnsanlara öğüt vermeden önce onları sevdiğimizi söylemek, öğüdün kalbe girmesine yardım eder. Bir öğüt, sevgi ile söylendiğinde yük olmaktan çıkar ve bir armağana dönüşür.", "Yemen'e giden iki arkadaşın yolculuğu bitti, ama bu öğütler bugün de bizimle. Kolaylaştırmak, müjdelemek, uyumlu olmak; sevgiyle söylemek; ve her ibadetin ardından Allah'tan yardım dilemek. Bir komşuya, bir çocuğa, bir yaşlıya bu ölçüyle yaklaşan kimse, hem insanları hem Rabbini hoşnut eder. Bu iki öğüt birleşince, hem insanlara hem Allah'a karşı güzel bir tutum ortaya çıkar."], "ibret": "İnsanlara kolaylık ve müjde sunmak, onları nefret ettirmemek, birlik ve uyum içinde olmak güzel ahlakın gereğidir. Öğüdü sevgiyle söylemek ve her ibadetin ardından Allah'tan yardım dilemek, bir ömre yeter.", "kaynak": "Buhârî, Cihâd, 164 (3038) ve Megâzî, 60 (4341-4345); Müslim, Cihâd ve's-siyer (1733); Ebû Dâvûd, Vitr, 26 (1522)"}], "kapanis": "Büyüklerin öğütleri, yalnız söylendikleri kişilere değil, bize de hitap ediyor. Biz de kimimize kolaylık, kimimize sevgi, kimimize ölçü öğütleyebiliriz. En güzel öğüt, söylenen söz kadar yaşanan hayattır. Bu kitaptan kalbimize kalan bir cümle varsa, bugün onu ilk fırsatta birine hediye edelim.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/14/", "kapak": "../../kapak/14.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 15, "baslik": "Gönülden Gönüle İbretlik Hikâyeler", "hazir": true, "yol": "../15/index.html"}, "pdf": "../../pdf/kitap-14.pdf", "epub": "../../epub/kitap-14.epub"}</script>
