<script type="application/json" id="kitap-veri">{"no": 10, "baslik": "Geçmiş Ümmetlerden İbretler", "tanitim": "Kur'an'ın anlattığı geçmiş toplumlardan ve insanlardan sekiz ibretli hikâye. Anlatının ağırlığında peygamberlerin sabrı, inananların cesareti ve kurtuluşu var.", "onsoz": "Kur'an, geçmiş toplumların haberlerini bize ders olsun diye anlatır. Bu kitaptaki sekiz hikâyede kimi kavimler uyarıya kulak tıkar, kimi gençler inancından dönmez, kimi insanlar da son nefesine kadar başkasına iyilik diler. Hepsinin ortasında sabreden peygamberler ve kurtulan inananlar var. Okurken umudu ve cesareti arayın.", "hikayeler": [{"no": 1, "baslik": "Âdem'in İki Oğlu", "tur": "kaynakli", "paragraflar": ["İki kardeş, Allah'a yaklaşmak için birer kurban sundu. Kur'an, onların Âdem'in iki oğlu olduğunu bildirir; adlarını ise söylemez. Kurbanlar sunuldu, bekleyiş başladı. Sonunda birinin kurbanı kabul edildi, ötekininki edilmedi. Bu haber, kabul edilmeyenin gönlüne taş gibi oturdu. Kendi eksiğine bakmak yerine kardeşine baktı. İçinde kıskançlık büyüdü. Kıskançlık, kalbe bir kez yerleşince susmayı bilmez. Bir gün dayanamadı ve kardeşine: “Andolsun, seni öldüreceğim!” dedi. (Mâide, 5/27)", "Kardeşinin cevabı sakin ve temizdi. “Allah ancak kendisine karşı gelmekten sakınanların kurbanını kabul eder” dedi. Yani mesele kurbanın büyüklüğü değil, kalbin duruluğuydu. Sonra kardeşliği korumak için bir söz daha söyledi: “Sen beni öldürmek için elini uzatsan da ben seni öldürmek için sana elimi uzatmam. Çünkü ben âlemlerin Rabbi Allah'tan korkarım.” (Mâide, 5/28) Bu sözlerde ne korku vardı ne de öfke. Tehdit karşısında bile kardeşliği ve Allah'a saygıyı koruyan bir yürek konuşuyordu.", "Düşünün: Kardeşi yanında durmuş, kötü bir söz bile etmeden ona yol gösteriyordu. İnsan, böyle sakin bir sesin karşısında vazgeçebilirdi. Ama kıskançlık, aklı da kalbi de bulandırdı. Kur'an burada bize ince bir şey öğretir: Kabul edilmeyen bir ibadet, başkasını suçlamak için değil, kendimizi gözden geçirmek için bir fırsattır.", "Ne yazık ki kıskançlık galip geldi; o, nefsine uydu ve tehdidini gerçekleştirdi. (Mâide, 5/30) Kur'an bu acı anı tek cümleyle anlatır ve asıl olarak ardından yaşananlara dikkat çeker. İşlediği şeyin büyüklüğü karşısında adam ne yapacağını bilemedi. Allah, kardeşinin cesedini nasıl örteceğini ona göstermek için yeri eşeleyen bir karga gönderdi. Adam kendine geldi ve içini yakan bir pişmanlıkla: “Yazıklar olsun bana! Şu karga kadar olup da kardeşimin cesedini örtmekten âciz miyim ben?” dedi. (Mâide, 5/31) Kur'an, onun pişman olanlardan olduğunu bildirir.", "Bu, yeryüzünde işlenen ilk cinayetti. Peygamber Efendimiz (s.a.v.) bir hadisinde bu gerçeğe dikkat çeker: “Haksız yere öldürülen hiçbir can yoktur ki, kanından bir pay Âdem'in ilk oğluna düşmesin. Çünkü o, öldürmeyi ilk başlatandır.” Yani kötü bir yolu ilk açan, o yoldan yürüyenlerin yükünden de pay alır. Bir hatanın bedeli, çoğu zaman yapanın düşündüğünden çok daha uzağa uzanır.", "Bu olay yüzünden Allah, İsrailoğullarına şu hükmü yazdığını bildirir: Kim, bir cana kıymamış ya da yeryüzünde bozgunculuk çıkarmamış bir insanı öldürürse bütün insanları öldürmüş gibi olur; kim de bir insanı yaşatırsa bütün insanları yaşatmış gibi olur. (Mâide, 5/32) Bir tek can, bütün insanlığın değeri kadar kıymetlidir. Kıskançlıkla başlayan hikâye, işte bu büyük öğütle son bulur."], "ibret": "Kıskançlığa teslim olmayan kalp, kardeşine el kaldırmaz. Bir canı korumak, bütün insanlığı korumak kadar değerlidir. Pişmanlığın geç kaldığı bir yola hiç girmemek için kardeşliği öfkeye değil, merhamete emanet edelim.", "kaynak": "Mâide Sûresi, 5/27-32; Buhârî, Enbiyâ, 1 (3335); Müslim, Kasâme, 27 (1677)"}, {"no": 2, "baslik": "Hûd ve Güçlü Âd Kavmi", "tur": "kaynakli", "paragraflar": ["Çok eskiden, Âd adında güçlü bir kavim yaşardı. Kur'an'a göre Allah onlara bol nimet vermiş, yaratılışça da kendilerini üstün kılmıştı. Yüksek tepelere gösterişli yapılar kurar, sağlam eserler yapıp sanki sonsuza dek yaşayacakmış gibi davranırlardı. Güçleri arttıkça Allah'ı unuttular ve başka şeylere tapmaya başladılar. İşte bu kavme, kendi içlerinden biri gönderildi: Hûd (a.s.).", "Âd kavminin sahip olduğu nimetler aslında bir imtihandı. Güçlü olmak kötü değildi; kötü olan, gücü verenin unutulmasıydı. Hûd'un kavmine nasıl seslendiğine bakın: Ayetler onu, Âd'ın kardeşi diye anar. (A'râf, 7/65) Bu da bize, peygamberlerin kimsenin düşmanı olmadığını, herkesin hayrını istediğini gösterir.", "Hûd, kavmine kardeşçe seslendi: “Ey kavmim, Allah'a kulluk edin. Sizin O'ndan başka tanrınız yoktur.” (Hûd, 11/50) Bu çağrı için onlardan bir karşılık da istemedi; ücretini yalnızca kendisini yaratandan bekliyordu. Sonra nimetin asıl kaynağını hatırlattı: “Ey kavmim, Rabbinizden bağışlanma dileyin, sonra O'na tövbe edin ki üzerinize gökten bol yağmur göndersin, gücünüze güç katsın. Suçlular olarak yüz çevirmeyin.” (Hûd, 11/52) Görüldüğü gibi Hûd, onları korkutmaktan çok umutlandırmak istiyordu.", "Kavmi ise buna alayla karşılık verdi. “Ey Hûd, bize açık bir delil getirmedin” dediler. “Senin sözünle tanrılarımızı bırakacak değiliz, sana da inanmayız.” Hatta tanrılarından birinin onu çarptığını söyleyecek kadar ileri gittiler. (Hûd, 11/53-54) Bir peygamber için en zor şeylerden biri, doğruyu söylerken kendi insanlarından alay görmektir. Hûd ise öfkelenmedi; sakin ve kararlıydı.", "Onlara şu sözleri söyledi: “Ben Allah'ı şahit tutuyorum, siz de şahit olun ki Allah'ı bırakıp ortak koştuğunuz şeylerden uzağım. Hepiniz birleşip bana tuzak kurun, bana mühlet de vermeyin. Ben, hem benim hem sizin Rabbiniz olan Allah'a dayandım.” (Hûd, 11/54-56) Bu, tevekkülün en güzel örneklerinden biridir. Elinden geleni söyledi, sonra sonucu Allah'a bıraktı. Üstelik şunu da ekledi: “Şüphesiz benim Rabbim dosdoğru yoldadır.” (Hûd, 11/56)", "Hûd'un hikâyesi bize sabrın nasıl bir şey olduğunu gösterir. Alay edilince öfkelenmedi, tehdit edilince geri adım atmadı. Yağmur ve güç vaadi bile kendisi için değil, kavmi içindi. Birinin hayrını bu kadar isteyip de bu kadar reddedilmek ağırdır. Ama Hûd, görevini yaptı ve Allah'a güvenle ayakta durdu.", "Kavmi dinlemedi. Allah'ın emri gelince, Kur'an'ın bildirdiğine göre bir rüzgâr onları sardı ve o güçlü kavim kalmadı. Ayetler bu sahneyi kısa anlatır; asıl dikkat çektikleri, kurtulanlardır. Allah, Hûd'u ve onunla birlikte iman edenleri katından bir rahmetle kurtardı. (Hûd, 11/58) Kalabalıklar yıkılıp gitti, ama doğruyu söyleyen az sayıdaki insan ayakta kaldı. Ayetler, Rablerinin ayetlerini inkâr edip peygamberlere karşı gelenlerin ardından bir ibret kaldığını da hatırlatır. (Hûd, 11/59-60)"], "ibret": "Güç ve nimet, verenin hatırlanması için verilir; unutulunca insana yük olur. Hûd gibi doğruyu sakince söyleyip sonucu Allah'a bırakmak, tevekkülün en güzel hâlidir. Sabreden peygamberi Allah yalnız bırakmaz.", "kaynak": "Hûd Sûresi, 11/50-60; A'râf Sûresi, 7/65-72; Şuarâ Sûresi, 26/123-140"}, {"no": 3, "baslik": "Salih ve Mucize Deve", "tur": "kaynakli", "paragraflar": ["Semûd halkı, Âd'dan sonra yeryüzünde yurt tutan bir topluluktu. Ovalarda köşkler kurar, dağlardan oyarak evler yaparlardı. Nimet içindeydiler; ama zamanla kendilerine verilenin sahibini unuttular. Allah onlara da kendi içlerinden birini gönderdi: Salih (a.s.). Salih, aynı sözle geldi: “Ey kavmim, Allah'a kulluk edin; sizin O'ndan başka tanrınız yoktur. O sizi yerden yarattı ve orayı imar etmenizi istedi. O'ndan bağışlanma dileyin, sonra O'na tövbe edin. Rabbim yakındır, dualara karşılık verir.” (Hûd, 11/61)", "Salih onlara şöyle hatırlatmıştı: Bahçeler, pınarlar, ekinler ve hurmalıklar arasında sonsuza dek güven içinde bırakılacağınızı mı sanıyorsunuz? (Şuarâ, 26/146-149) Bütün peygamberlerin ana çağrısı aynıdır: Allah'ı bir bilmek ve O'nun nimetine şükretmek.", "Kavmi şaşkınlık ve itirazla cevap verdi: “Ey Salih, sen bundan önce aramızda umut beslenen biriydin. Şimdi atalarımızın taptıklarına tapmamızı mı yasaklıyorsun?” (Hûd, 11/62) Sonra bir delil istediler. Allah da onlara bir mucize olarak bir dişi deve gönderdi. Salih şöyle dedi: “İşte size bir mucize olarak Allah'ın devesi. Bırakın, Allah'ın yeryüzünde otlasın. Ona kötülükle dokunmayın, yoksa sizi yakın bir azap yakalar.” (Hûd, 11/64) Suyun paylaşımı da belirlendi: Bir gün su devenin, belli bir gün de halkın olacaktı. (Şuarâ, 26/155)", "Deve, onlara gösterilmiş bir imtihandı. Kendilerinden istenen şey çok basitti: Ona dokunmamak ve suyu paylaşmak. Paylaşmayı bilmek, kardeşliğin de ilk ölçüsüdür.", "Bir süre böyle geçti. Fakat aralarından bazıları, azgınlıkta ileri gitti. Kur'an'ın ifadesiyle sonunda deveyi kestiler. (Hûd, 11/65) Bu, Allah'ın nimetine ve peygamberinin uyarısına karşı yapılmış büyük bir saygısızlıktı. Salih onlara son bir mühlet verdi: “Yurdunuzda üç gün daha yaşayın; bu, yalanlanmayacak bir tehdittir.” Salih bunca zaman kavmine sabırla davrandı. Ona inanan az sayıdaki kişi de kalabalığın alayına rağmen onun yanında durdu. Allah bu sabrı karşılıksız bırakmadı; inananların kurtuluşu da ayette açıkça bildirilir.", "Ardından Allah'ın emri geldi. Ayetler bu acı sahneyi kısa anlatır; asıl üzerinde durdukları ise şudur: Allah, Salih'i ve ona inananları kendi katından bir rahmetle kurtardı. (Hûd, 11/66) Salih'in sabrı, uyarısı ve inananların kurtuluşu bu hikâyenin asıl ağırlığıdır.", "Yüzyıllar geçti. Bu topluluğun yurtlarına Peygamber Efendimiz (s.a.v.) bir yolculukta uğradı. Abdullah b. Ömer'in anlattığına göre, Hicr denen bu yere gelince sahabilere şöyle buyurdu: “Kendilerine zulmetmiş kimselerin yurtlarına ancak ağlayarak girin. Ağlayamıyorsanız hiç girmeyin ki onlara gelen sıkıntı size de gelmesin.” Başını örtüp yolunu hızlandırdı. Orası bir gezi yeri değil, bir ibret durağıydı. Orada akacak gözyaşı, merak için değil, ibret için olmalıydı."], "ibret": "Allah'ın verdiği nimete saygı göstermek, şükrün bir parçasıdır. Geçmiş toplumların yurtlarından geçerken merak değil, ibret ve kendimize dönük bir ders aramalıyız. Peygamberin sabrı ve inananların kurtuluşu bize umut verir.", "kaynak": "Hûd Sûresi, 11/61-68; Şuarâ Sûresi, 26/141-159; Şems Sûresi, 91/11-15; Buhârî, Enbiyâ, 17; Müslim, Zühd, 38-39 (2980)"}, {"no": 4, "baslik": "Secdeye Kapanan Sihirbazlar", "tur": "kaynakli", "paragraflar": ["Firavun, Musa'nın getirdiği mucizeleri görünce bunlara sihir demekle yetindi. “Bizi topraklarımızdan çıkarmak için mi geldin?” dedi. “O hâlde biz de sana benzer bir sihir getireceğiz; ikimiz arasında bir buluşma günü belirle.” (Tâhâ, 20/57-58) Musa (a.s.), buluşmanın bayram günü ve insanların kuşluk vakti toplandığı bir saatte yapılmasını önerdi. (Tâhâ, 20/59) Böylece ülkenin sihirbazları çağrıldı. İnsanlar meydana akın etti; herkes merakla bekliyordu.", "Burada dikkat çeken bir ayrıntı var: Firavun'un sihirbazları çağırmasındaki amaç, hakikati araştırmak değil, onu gölgelemekti. Musa ise karşısındakileri korkutmak yerine onları sakin bir dille uyarıyor, hakikate çağırıyordu. Bir tarafta güç gösterisi, öbür tarafta sade bir doğruluk vardı.", "Musa, sihirbazlara dönüp onları nazik ve ciddi bir dille uyardı: “Yazıklar olsun size! Allah'a karşı yalan uydurmayın.” (Tâhâ, 20/61) Sihirbazlar kendi aralarında fısıldaştılar. Sonra Musa'ya: “Önce sen mi atacaksın, yoksa biz mi?” dediler. Musa: “Siz atın” dedi. İpleri ve değnekleri atıldı; Musa'ya, yaptıkları sihir yüzünden o ipler ve değnekler koşuyormuş gibi göründü. Musa içinde bir korku duydu. (Tâhâ, 20/65-67)", "Allah ona şöyle buyurdu: “Korkma! Sen elbette üstün geleceksin. Sağ elindekini at, onların yaptıklarını yutsun. Onların yaptığı, sadece bir sihirbaz hilesidir.” (Tâhâ, 20/68-69) Musa asasını attı; asa, sihirbazların uydurduklarını yuttu. O anda sihirbazlar, gördüklerinin sihirden çok öte olduğunu anladılar. Hepsi birden secdeye kapandı: “Harun'un ve Musa'nın Rabbine iman ettik!” dediler. (Tâhâ, 20/70) Az önce Firavun adına yarışan insanlar, yüzlerini Allah'a çevirmişti. İnsan gerçeği görünce yalnız kalbiyle değil, bütün varlığıyla eğilir.", "Müfessirler, sihrin inceliklerini en iyi bilen bu insanların gerçeği hemen fark ettiğini söyler. Yıllarını bu sanata vermişlerdi; gördükleri şeyin bir hüner olmadığını, insan gücünü aştığını anlamışlardı. Gerçeği en önce işini bilenlerin kabul etmesi, bu yüzden şaşırtıcı değildir.", "Firavun öfkelendi: “Ben size izin vermeden mi ona iman ettiniz?” dedi ve onlara ağır bir tehditte bulundu. Fakat sihirbazlar bir adım bile geri durmadı. Şöyle dediler: “Bize gelen apaçık delillere ve bizi yaratana seni asla tercih etmeyiz. Ne hükmedeceksen hükmet. Sen ancak bu dünya hayatında hükmedersin. Biz Rabbimize iman ettik ki hatalarımızı ve bizi zorladığın sihri bağışlasın.” (Tâhâ, 20/71-73)", "Aynı gönülle şu duayı da ettikleri bildirilir: “Rabbimiz, üzerimize sabır yağdır ve bizi Müslüman olarak vefat ettir.” (A'râf, 7/126) Kısa süre önce ödül ve kazanç umuduyla gelen insanlar, birkaç an içinde sabrın ve imanın yolunu seçmişti. (Şuarâ, 26/41-42) Kur'an onların sayısını ya da adlarını vermez; çünkü hikâyenin ağırlığı kimlikte değil, cesarettedir. Gerçeği gördüklerinde, onu en güçlü hükümdarın tehdidine rağmen bırakmadılar."], "ibret": "Doğruyu gören kalp, güçlünün tehdidinden korkmadan ona yönelir. Geçmişi ne olursa olsun, hakikate dönen herkesin önünde sabır ve umut dolu bir yol vardır. Allah, inananların sabrını boşa çıkarmaz.", "kaynak": "Tâhâ Sûresi, 20/56-76; A'râf Sûresi, 7/109-126; Şuarâ Sûresi, 26/34-51"}, {"no": 5, "baslik": "Mağara Arkadaşları", "tur": "kaynakli", "paragraflar": ["Çevrelerindeki herkesin başka şeylere taptığı bir yerde, Rablerine iman etmiş birkaç genç vardı. Kur'an, onların haberini gerçek olarak anlatır ve onlara şu güzel tanıklığı verir: “Onlar Rablerine iman etmiş gençlerdi; biz de onların hidayetini artırdık.” (Kehf, 18/13) Bu gençler, inançlarını korumak istedi. Sonunda ayağa kalkıp şöyle dediler: “Rabbimiz göklerin ve yerin Rabbidir; biz O'ndan başkasına asla ilah demeyiz.” (Kehf, 18/14)", "Kur'an bu gençlerin adını, şehrini ve hükümdarını söylemez. Çünkü ayrıntı değil, ders önemlidir: Gençler kalabalığın yolunu bırakıp doğruyu seçmiştir. Gençlik, insanın hem en güçlü hem de en kolay etkilenen çağıdır. Onlar bu çağda kolay yolu değil, doğru yolu seçti.", "Kavimleri ise başka ilahlar edinmişti. Gençler aralarında şöyle konuştu: “Madem onlardan ve Allah'tan başka taptıklarından ayrıldınız, o hâlde mağaraya sığının. Rabbiniz size rahmetinden verir ve işinizi kolaylaştırır.” (Kehf, 18/16) Mağaraya girdiklerinde şöyle dua ettiler: “Rabbimiz, bize katından bir rahmet ver ve işimizde bize doğru yolu kolaylaştır.” (Kehf, 18/10) Bu dua, korkuyla yoğrulmuş ama umutla dolu bir duaydı.", "Mağarada ne bol bir yiyecek vardı ne de bir güvenlik. Ellerinde yalnızca bir dua ve bir güven vardı. Allah onlara, hiç beklemedikleri bir koruma sundu. Bir sığınağın en güzeli, Allah'ın kuşattığı yerdir.", "Allah, onların kulaklarına mağarada yıllarca sürecek bir uyku perdesi vurdu. (Kehf, 18/11) Köpekleri de mağaranın girişinde ön ayaklarını uzatmış yatıyordu. (Kehf, 18/18) Dışarıdan bakan onları uyanık sanırdı; oysa derin bir uykudaydılar. Zaman dışarıda akmaya devam ediyordu; onlar ise bambaşka bir sessizliğin içindeydi.", "Sonra Allah onları uyandırdı. Aralarından biri: “Ne kadar kaldınız?” diye sordu. “Bir gün ya da günün bir kısmı kadar” dediler. Sonra şöyle konuştular: “Rabbiniz ne kadar kaldığınızı daha iyi bilir. Şimdi birinizi şu gümüş paranızla şehre gönderin; hangi yiyecek daha temizse ondan size azık getirsin. Nazik davransın, sakın sizi kimseye sezdirmesin.” (Kehf, 18/19) Müfessirlerin aktardığına göre, şehre giden genç, aradan çok uzun bir zaman geçtiğini orada fark etti.", "Ayetler bu gençlerin ne kadar kaldığını da bildirir: “Mağaralarında üç yüz yıl kaldılar, dokuz yıl da eklediler.” Hemen ardından şöyle denir: “De ki: Ne kadar kaldıklarını Allah daha iyi bilir.” (Kehf, 18/25-26) Sayıları konusunda insanlar tartışırken Kur'an şunu söyler: “De ki: Rabbim onların sayısını daha iyi bilir. Onları ancak pek az kimse bilir.” (Kehf, 18/22) Yani bu konuda boş tartışmaya girmemek gerekir. Bir de güzel bir edep öğretilir: Bir iş için “Yarın yapacağım” demeyin; “Allah dilerse” (inşallah) deyin. (Kehf, 18/23-24)"], "ibret": "İnancını korumak için sığınan gençleri Allah rahmetiyle kuşattı. Bilmediğimiz ayrıntılar için tartışmak yerine Allah'ın bildiğine güvenelim; yarın için de “inşallah” diyelim. Rahmet, Allah'a sığınanın yanındadır.", "kaynak": "Kehf Sûresi, 18/9-26"}, {"no": 6, "baslik": "Şehrin Öbür Ucundan Koşan Adam", "tur": "kaynakli", "paragraflar": ["Bir şehir vardı. Kur'an, adını söylemeden bu şehri bize örnek olarak anlatır. (Yâsîn, 36/13) Şehre önce iki elçi gönderildi; halk ikisini de yalanladı. Allah da onları üçüncü bir elçiyle destekledi. Elçiler şöyle dedi: “Biz size gönderilmiş elçileriz.” Halk ise: “Siz de bizim gibi birer insansınız. Rahmân hiçbir şey indirmemiştir; siz sadece yalan söylüyorsunuz” diye karşılık verdi. (Yâsîn, 36/14-15)", "Kur'an bu şehri neden örnek olarak anlatıyor? Çünkü burada her çağın insanı kendinden bir şey bulur. Doğruyu söyleyenlere “Siz de bizim gibi insansınız” diyen, uyarıyı uğursuzluk sayan, çağrıya tehditle karşılık veren bir topluluk... Elçiler ise öfkelenmeden, sabırla bildirmeye devam etti.", "Elçiler sakin kaldı: “Rabbimiz biliyor ki biz size gönderilmiş elçileriz. Bize düşen, sadece apaçık bir tebliğdir.” (Yâsîn, 36/16-17) Halk bu defa tehdit etti: “Biz sizde uğursuzluk gördük. Vazgeçmezseniz sizi mutlaka taşlarız; bizden size acı bir azap dokunur.” (Yâsîn, 36/18) Elçiler onlara şu cevabı verdi: “Uğursuzluğunuz kendi içinizdedir. Size öğüt verildi diye mi? Hayır, siz haddi aşan bir topluluksunuz.” (Yâsîn, 36/19)", "O sırada şehrin en uzak ucundan bir adam koşarak geldi. Kur'an, onun adını söylemez; yalnızca koşusunu, bir iyilik telaşı olarak gösterir. Adam şöyle seslendi: “Ey kavmim, bu elçilere uyun. Sizden hiçbir ücret istemeyen ve doğru yolda olan kimselere uyun.” (Yâsîn, 36/20-21) Sonra kendi hâlini anlatarak onlara düşünme fırsatı verdi: “Ben niçin beni yaratana kulluk etmeyeyim? Siz de O'na döndürüleceksiniz.” (Yâsîn, 36/22)", "Bu adamın bir makamı ya da unvanı yoktu; Kur'an ondan yalnızca bir adam diye söz eder. Ama iki özelliği vardı: Doğruyu görünce beklemedi, koştu. Gördüğü doğruyu da yalnız kendine saklamadı. İman, onun için paylaşılacak bir iyilikti.", "Kendi güvenini de açıkça söyledi: “Ben sizin Rabbinize iman ettim, beni dinleyin.” (Yâsîn, 36/25) Müfessirlerin çoğuna göre kavmi onu dinlemedi ve ona kötülük etti. Ayetler ise şöyle devam eder: Ona “Cennete gir” denildi. O da şöyle dedi: “Keşke kavmim bilseydi; Rabbimin beni bağışladığını ve beni ikram edilenlerden kıldığını!” (Yâsîn, 36/26-27) İşte bu söz, o adamın gönlünü anlatır. Kendisine kötülük edenler için bile hâlâ hayır düşünüyordu.", "Kavmin sonu ayetlerde kısacık anlatılır: Gökten bir ordu indirmeye bile gerek kalmadı; tek bir çığlıkla hepsi sessizliğe gömüldü. (Yâsîn, 36/28-29) Hikâyenin yükü orada değil, şehrin öbür ucundan koşan adamdadır. Yalnız kalsa da doğruyu savundu, kötülük görse de iyilik diledi. Kur'an bu adamı iyilikle anarak yüceltir. Bir iyiliği yüksek sesle söylemek, bazen bütün bir şehre karşı tek başına durmak demektir."], "ibret": "Doğruyu görünce susmayıp koşan insan, kimsenin tanımadığı biri olsa da Allah katında değerlidir. Bize kötülük edenler için bile iyilik dilemek, imanın en güzel meyvelerinden biridir.", "kaynak": "Yâsîn Sûresi, 36/13-29"}, {"no": 7, "baslik": "Fil Yılı", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimizin doğumundan kısa süre önce, Mekke halkının hiç unutmayacağı bir yıl yaşandı. Bu yıl sonradan “Fil Yılı” diye anıldı. Siyer kitaplarında anlatıldığına göre, Yemen valisi Ebrehe, Sana'da büyük bir ibadethane yaptırmıştı. Arapların Kâbe'ye gitmeyi bırakıp oraya gelmesini istiyordu. Bu olmayınca Kâbe'yi yıkmaya karar verdi. Büyük bir ordu hazırladı ve ordusunun önüne fillerini kattı.", "Kâbe, Mekke'nin kalbiydi. Her yıl çevreden insanlar oraya gelir, onu ziyaret ederdi. Ebrehe'nin amacı bu bağı koparmaktı. Güçlü ordular çoğu zaman her şeyi alt edebileceklerini sanırlar; oysa Kâbe'nin hikâyesi, gücün her şey olmadığını gösterir.", "Ordu Mekke'ye yaklaşınca şehrin dışında otlayan develere el koydu. Bunların bir kısmı, Kureyş'in ileri gelenlerinden Abdülmuttalib'indi. O da Ebrehe'nin karargâhına gitti. Siyer kitaplarına göre Ebrehe onu saygıyla karşıladı, ama onun Kâbe için değil, develeri için geldiğini görünce şaşırdı. Abdülmuttalib şöyle cevap verdi: “Ben develerin sahibiyim. Kâbe'nin de bir sahibi var; onu O korur.” Bu söz, hem sadeliğiyle hem güveniyle çok şey anlatır.", "Mekkeliler, bu orduya karşı koyacak güçleri olmadığını biliyordu. Abdülmuttalib halkına şehirden çıkıp çevredeki dağlara çekilmelerini söyledi. Evlerini ve Kâbe'yi geride bırakıp çekilmek, kolay bir karar değildi. Rivayete göre kendisi de Kâbe'nin yanına gidip Allah'a dua etti. Gün doğdu; ordu harekete geçmek üzereydi. Mekke'nin sokakları insanlardan boşalmıştı; yalnız bekleyiş vardı.", "Düşünün, evinizden ayrılıp dağlara çekiliyorsunuz ve arkanızda Allah'ın evi duruyor. Elinizde kılıç yok, önünüzde koca bir ordu var. Böyle bir anda insanın yapabileceği tek şey, duasını edip beklemektir. Abdülmuttalib'in sözü, o gün Mekkelilere güç veren sakin bir güvendi.", "Sonra Kur'an'ın haber verdiği olay yaşandı. Allah şöyle buyurur: “Rabbinin fil sahiplerine ne yaptığını görmedin mi? Onların tuzaklarını boşa çıkarmadı mı? Üzerlerine sürü sürü kuşlar gönderdi. Bu kuşlar onlara pişirilmiş çamurdan taşlar atıyordu. Böylece onları yenilmiş ekin yaprağı gibi yaptı.” (Fîl, 105/1-5) Siyer kitaplarına göre ordu Mekke'ye girmeden dağıldı. Ayetler olayı bu kadarıyla anlatır; daha fazla ayrıntıya girmez.", "Sahih hadislerde, Peygamber Efendimizin Mekke'nin fethi günü şehrin dokunulmazlığını anlatırken Allah'ın Mekke'den fili alıkoyduğunu hatırlattığı nakledilir. Fil olayı, sonraki nesillerin hafızasında canlı kaldı; Mekkeliler o yılı yıllarca anlatıp durdular.", "Mekkeliler dağlardan döndüklerinde Kâbe yerinde duruyordu. Evlerini ve Kâbe'yi koruyanın Allah olduğunu kendi gözleriyle görmüşlerdi. Siyer kitaplarında bildirildiğine göre, Peygamber Efendimiz (s.a.v.) aynı yıl dünyaya geldi. Yani insanların çaresiz kaldığı bir yılın ardından, insanlığa rahmet olarak gönderilen son peygamber doğdu. Umutsuz görünen günler, bazen en büyük müjdenin eşiğidir."], "ibret": "Gücümüz yetmediği yerde Allah'a güvenmek, bizi çaresizlikten kurtarır. Büyük sıkıntıların ardından, bazen en büyük müjdeler gelir. Allah, evini de kulunu da korumaya kadirdir. Dua eden kalp yalnız değildir.", "kaynak": "Fîl Sûresi, 105/1-5; İbn Hişâm, es-Sîre; Müslim, Hac, 447 (1355); Buhârî, İlim, 39 (112)"}, {"no": 8, "baslik": "İnancından Dönmeyen Genç", "tur": "kaynakli", "paragraflar": ["Peygamber Efendimiz (s.a.v.) bir gün sahabilerine, geçmiş ümmetlerden bir genci anlattı. Suheyb (r.a.) bu hadisi nakleder. Bir zamanlar bir kral vardı; onun bir de sihirbazı vardı. Sihirbaz yaşlanınca krala: “Ben yaşlandım, bana bir genç gönder, ona sanatımı öğreteyim” dedi. Kral da bir genç gönderdi. Genç, sihirbazın yanına giderken yolda bir rahibin sohbetine rastladı. Oturup dinledi; rahibin sözleri hoşuna gitti. Her gün oraya uğrar oldu.", "Bir gün yolu, insanları geçirmeyen büyük bir hayvan kesmişti. Genç kendi kendine: “Bugün anlayacağım, sihirbaz mı üstün, yoksa rahip mi” dedi. Bir taş alıp şöyle dua etti: “Allahım, rahibin işi sana sihirbazın işinden daha sevgiliyse bu hayvanı öldür ki insanlar geçsin.” Taşı attı; hayvan öldü, insanlar rahatladı. Rahip ona: “Evladım, bugün sen benden üstünsün. Yakında imtihan edileceksin; sakın beni ele verme” dedi. Genç, Allah'ın izniyle hastaları iyileştirmeye başladı.", "Bu iki sahneyi birlikte düşünelim. Genç, taşı attığında duasının kabul edildiğini gördü; ama asıl cesareti, bundan sonra inancını saklamamasıdır. Hastaları iyileştirmesi ona ün de getirebilirdi. Fakat o, şifanın Allah'tan geldiğini söyleyerek kendisini değil, Rabbini gösterdi.", "Kralın yakınlarından biri gözlerini kaybetmişti. Gencin yanına birçok hediyeyle gelip: “Bunların hepsi senin olsun, beni iyileştir” dedi. Genç: “Ben kimseyi iyileştirmem; iyileştiren Allah'tır. Sen Allah'a iman edersen ben de ona dua ederim” cevabını verdi. Adam iman etti, Allah ona şifa verdi. Kral bunu duyunca öfkelendi: “Benden başka bir Rabbin mi var?” Adam: “Benim de Rabbim, senin de Rabbin Allah'tır” dedi. Kral, onu inancından döndürmek istedi; ama genç bir kez bile geri adım atmadı. Allah da onu kralın kurduğu her tuzaktan korudu.", "Sonunda genç krala şöyle dedi: “Benim dediğimi yapmadıkça beni öldüremezsin. İnsanları geniş bir yerde topla, ‘Bu gencin Rabbinin adıyla’ de ve öyle at.” Kral dediğini yaptı. Bütün halk, bu sözü duyunca: “Gencin Rabbine iman ettik!” dedi. Kral, inananları zorla vazgeçirmek için ağır bir baskı yaptı; fakat kimse dönmedi. Hadisin sonunda, kucağında bebeğiyle tereddüt eden bir anneye bebeği: “Anneciğim, sabret; çünkü sen hak üzeresin” dedi.", "Gencin son sözlerindeki cesareti de düşünün. Kendi sonunu bile, insanlara Allah'ı duyurmak için bir vesile yapmak istedi. Halkın kalbine “Gencin Rabbine iman ettik” cümlesini yerleştirmek, onun için kendi canından daha değerliydi.", "Müfessirlerin çoğu, Bürûc Sûresi'nin ilk ayetlerini bu olayla ilişkilendirir. Aynı sûre, imana sebat edenlere şu müjdeyi verir: “İman edip salih ameller işleyenler için altlarından ırmaklar akan cennetler vardır. İşte büyük kurtuluş budur.” (Bürûc, 85/11) Bir gencin cesareti, bir şehrin gönlünü değiştirmişti."], "ibret": "İnancı uğruna sabreden insanın Allah katındaki yeri çok yücedir. Bir gencin doğruluğu, koca bir halkın kalbini uyandırabilir. İmanına sahip çıkan, çoğu zaman başkalarına da yol açar.", "kaynak": "Müslim, Zühd, 73 (3005); Tirmizî, Tefsîr, Bürûc (3340); Bürûc Sûresi, 85/4-11"}], "kapanis": "Sekiz hikâyenin sonuna geldik. Kimi zaman bir kardeşin pişmanlığına, kimi zaman bir gencin kararlılığına, kimi zaman da bir peygamberin sabrına tanık olduk. Gördük ki Allah, doğru yolda duranı yalnız bırakmıyor. Bu hikâyelerden geriye kalan en güzel şey, umudumuzu ve sabrımızı canlı tutmak olsun. Yolunuz hep hayra çıksın.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/10/", "kapak": "../../kapak/10.jpg", "kutuphane": "../../index.html", "sonraki": {"no": 11, "baslik": "Cennet Yolunda Güzel Davranışlar", "hazir": true, "yol": "../11/index.html"}, "pdf": "../../pdf/kitap-10.pdf", "epub": "../../epub/kitap-10.epub", "gorunum": "kitap-gorunumu.html"}</script>
