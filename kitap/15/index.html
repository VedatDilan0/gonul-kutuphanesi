<script type="application/json" id="kitap-veri">{"no": 15, "baslik": "Gönülden Gönüle İbretlik Hikâyeler", "tanitim": "Ağlayan bir hurma kütüğünden yüz yıl sonra uyanan adama, gönülden gönüle ulaşan sekiz ibretlik kıssa.", "onsoz": "Bu son kitapta, önceki kitaplara sığmayan sekiz farklı hikâye var. Birinde bir ağaç özlemden ağlıyor, birinde bir adam yüz yıl sonra uyanıyor, birinde bir hakem yalnızca bir örtüyle kavgayı bitiriyor. Her hikâye ayrı bir kapı; ama hepsi aynı yere, gönle açılıyor. Şimdi o kapılardan birlikte geçelim.", "hikayeler": [{"no": 1, "baslik": "Ağlayan Hurma Kütüğü", "tur": "kaynakli", "paragraflar": ["Mescid-i Nebevî'nin ilk zamanlarını düşünün. Direkleri hurma kütüklerinden, damı hurma dallarından yapılmış sade bir mescit. Peygamber Efendimiz (s.a.v.) Cuma günleri bu direklerden birine, bir hurma kütüğüne yaslanarak hutbe verirdi. Sahabeler onun önünde toplanır, söylediklerini dinlerdi. Kütük, her hafta bu güzel sözlere en yakın duran şeydi. Zikir, yani Allah'ı anma ve ayetleri okuma, o kütüğün yanında her Cuma yeniden yankılanırdı.", "Bazı rivayetlere göre zamanla cemaat çoğalmış, arkada oturanlar Peygamberimizi görmekte zorlanmaya başlamıştı. Câbir b. Abdullah'ın anlattığına göre, ensardan bir kadının marangoz olan kölesi Peygamberimiz için bir minber yaptı. Böylece onu herkes görebilecek, sesi herkese ulaşabilecekti.", "Minber hazırlanınca ilk Cuma geldi. Peygamberimiz hutbe için kütüğün yanından geçip minbere çıktı. Tam o sırada kütükten bir ses yükseldi. Câbir'in anlatımıyla bu ses, bir çocuğun ağlamasına benziyordu. Mescitte bulunanlar bu sesi işitti. Kimse ne olduğunu hemen anlayamadı; ama herkes aynı şeyi hissetti: Bu, bir ayrılığın sesiydi.", "Peygamberimiz minberden indi, kütüğün yanına geldi ve ona sarıldı. Kütük, susturulan bir çocuk gibi hıçkırarak yavaş yavaş sakinleşti, sonra sustu. Câbir'in ve İbn Ömer'in başka rivayetlerinde, Peygamberimizin elini kütüğün üzerine koyup sıvazladığı anlatılır. Mescitte bulunanlar bu manzarayı hayretle seyretti.", "Peygamberimiz kütüğün neden ağladığını da açıkladı. Rivayete göre şöyle buyurdu: “Dinlediği zikri kaybettiği için ağlıyor.” Yani kütük, her Cuma kendisine yaslanılıp okunan o güzel sözleri artık o kadar yakından işitemeyeceği için üzülmüştü. Bu, Allah'ı anmanın ve Peygamberimizin sözlerinin bir kütüğün bile gönlüne ulaştığını gösteriyordu.", "Bu olay, Buhârî'de farklı sahabelerin ağzından nakledilen sahih bir rivayettir. Bir mucize olarak anlatılır, ama asıl vurgusu başkadır: Bir varlık, sevdiği sözden ayrılınca özlem duyar. Bir kütük bile ayrılığa ağlayarak karşılık verdi. Peygamberimiz de ona şefkatle eğilip onu teselli etti; bu, bir varlığın ayrılık acısını anlamanın merhametle başladığını bize hatırlatır.", "Bir ağaç parçası bile sevdiği sözün yokluğuna dayanamıyorsa, insan o sözlere ne kadar yakın durmalıdır? Belki de hikâye bize şunu soruyor: Biz güzel sözleri, Allah'ın kelamını, bir Cuma hutbesini, bir dostun nasihatini ne kadar dinliyoruz? Ve onlardan uzak kalınca gönlümüz ne kadar özlüyor? Bir kütüğün bile özleyip ağladığı sözlere, bizim insan olarak çok daha fazla kulak vermemiz gerekir.", "Cuma günleri minbere çıkan her hatip, bugün de Peygamberimizin o minberini hatırlar. Cuma namazı için mescide giden her Müslüman, o hurma kütüğünün hikâyesini bir kez daha anlatılırken duymuş olabilir. Hurma kütüğünün hikâyesi, bir ağacın değil, bir gönlün hikâyesidir. Güzel olan, özlemeyi bilmektir; özlenen şeyi kaybetmeden önce kıymetini bilmektir."], "ibret": "Sevgi ve özlem, yalnız insanı değil, bir kütüğü bile etkileyebilir. Hayra yakın olmak bir nimettir; onu kaybetmeden önce kıymetini bilmek, kalbin canlı olduğunu gösterir. Güzel sözü dinlemek de bir şükürdür.", "kaynak": "Buhârî, Cuma, 26 (918); Büyû (2095); Menâkıb (3583-3585)"}, {"no": 2, "baslik": "Hacerülesved ve Güvenilir Hakem", "tur": "kaynakli", "paragraflar": ["Kâbe, Peygamber Efendimiz henüz peygamber olmadan önce de Mekke'nin kalbiydi. Siyer kitaplarında anlatıldığına göre bir sel ve bir yangın Kâbe'nin duvarlarını zayıflatmıştı; Kureyş onu yeniden yapmaya karar verdi. Rivayetlere göre Muhammed (s.a.v.) o sırada otuz beş yaşındaydı. Siyer kitaplarına göre yapımda yalnızca helal kazanç kullanıldı; Buhârî'nin bildirdiğine göre bu para yetmeyince Kâbe'nin bir bölümü dışarıda bırakıldı.", "İnşaat, kabileler arasında bir iş bölümüyle yürüdü; her kabile bir kısmını üstlendi. Duvarlar, Hacerülesved'in yerleştirileceği yere kadar yükselince bir sorun çıktı: Bu şerefli taşı yerine kim koyacaktı? Her kabile bu şerefi istiyordu. Tartışma büyüdü, sesler yükseldi. Kureyş, kan dökülmesinin eşiğine geldi.", "Siyer kaynaklarına göre bir süre bu tartışma sürdü. Sonunda içlerinden yaşlı biri bir teklif getirdi: “Şu mescidin kapısından ilk girecek kişiyi aramıza hakem yapalım.” Herkes bu teklifi kabul etti. Çünkü bu, hiçbir kabileyi bir diğerinin önüne geçirmeyen, adil bir yoldu. Kimse kendi tarafından bir kişiyi öne sürmedi; kapıdan kim girerse karar onundu.", "Kapıdan ilk giren Muhammed (s.a.v.) oldu. Mekkeliler ona yıllardır “el-Emîn”, yani “güvenilir” derdi. Bu lakap bir günde kazanılmamıştı; yıllar boyunca emanetlere sahip çıkmasından, sözünde durmasından ve doğru konuşmasından doğmuştu. Onu görenler hep bir ağızdan şöyle dediler: “Bu, el-Emîn! Ona razıyız. Bu, Muhammed!” Kimse hakem olarak onun yerine başkasını istemedi.", "Olayı ona anlattılar. Muhammed (s.a.v.) bir örtü getirmelerini istedi. Hacerülesved'i eliyle alıp örtünün ortasına koydu. Sonra şöyle dedi: “Her kabile örtünün bir ucundan tutsun. Hep birlikte kaldırın.” Kabile büyükleri örtünün kenarlarını tuttu ve taşı birlikte, yerine konulacağı yüksekliğe kadar kaldırdılar.", "Taş yerine gelince Muhammed (s.a.v.) onu kendi eliyle alıp yerine yerleştirdi. Böylece bir tek kabile üstün çıkmadı; herkes taşın kaldırılmasında pay sahibi oldu. Kimse bu çözümden gücenmedi. Kâbe'nin yapımı tamamlandı ve çatışma çıkmadı. Bir tartışmanın kana dönüşmesine ramak kalmışken, bir örtü barışı getirmişti.", "Bu sahnede dikkat çeken şey, hakemin yalnızca akıllı biri olarak değil, güvenilir biri olarak tanınmasıdır. Kavgada her kabile kendi haklılığına bakar; ama el-Emîn'in önünde hepsi sustu. Üstelik çözümü, bir taraf kazansın, diğeri kaybetsin diye kurmadı; herkesin payı olduğu bir yol buldu. Bu rivayetin ayrıntıları esas olarak siyer kitaplarında yer alır; Ahmed b. Hanbel'in Müsned'inde de benzer bir anlatım bulunur.", "İnsanlar arasındaki bozulan dengeler, çoğu zaman güçle değil, adaletle ve akılla düzelir. Güvenilir olmak, bir ömür boyu verilen küçük sözlerin toplamıdır. Muhammed el-Emîn, o gün bu güveni, bir örtüyle, kimsenin gücenmediği bir çözüme dönüştürdü."], "ibret": "Güvenilir insan, bir toplumun en büyük kazancıdır. Çözüm, bir tarafı yenmekte değil, herkesin payını gözetmektedir. Güven ve akıl birleşince, kavga barışa dönüşür. Güvenilirlik, bir ömür boyu tutulan sözlerle kazanılır.", "kaynak": "Ahmed b. Hanbel, Müsned (Sâib b. Abdullah rivayeti); İbn Hişâm, es-Sîre; Buhârî, Hac, 42 (1582-1586)"}, {"no": 3, "baslik": "Habeşistan'da Cafer'in Konuşması", "tur": "kaynakli", "paragraflar": ["Mekke'de Müslümanlara yapılan eziyet çoğalınca, Peygamber Efendimiz (s.a.v.) bir grup sahabiye Habeşistan'a gitmelerini söyledi. Siyer kitaplarına göre orada, yanında kimseye zulmedilmeyen bir hükümdar vardı: Necâşî. Ümmü Seleme'nin anlattığına göre Müslümanlar oraya vardılar ve dinlerini rahatça yaşayabilecekleri güvenli bir yurt buldular. Gidenlerin sayısı ve tarihleri rivayetlerde farklıdır; biz kesin bir rakam vermeyeceğiz.", "Kureyş bunu duyunca rahatsız oldu. İki elçi seçti ve Necâşî'ye hediyeler gönderdi. Önce hükümdarın çevresindeki ileri gelenlere armağanlar dağıttılar ve onların desteğini aldılar. Sonra Necâşî'nin huzuruna çıkıp şöyle dediler: “Bizim kavmimizden bazı beyinsizler, ne bizim dinimizde, ne de sizin dininizde olan bir din icat etti. Onları bize teslim edin.”", "Necâşî, kararını vermeden önce Müslümanları dinlemek istedi. Onları huzuruna çağırdı ve sordu: “Bu dininiz nedir ki kavminizi bırakıp ona girdiniz?” Müslümanlar adına konuşmak üzere Cafer b. Ebû Tâlib (r.a.) öne çıktı.", "Cafer şöyle dedi: “Ey hükümdar! Biz cahil bir toplumduk. Putlara tapar, leş yerdik; kötülük işler, akrabalık bağlarını keser, komşuya kötü davranırdık. Güçlümüz zayıfımızı ezerdi. Derken Allah bize, soyunu, doğruluğunu, güvenilirliğini ve iffetini bildiğimiz bir peygamber gönderdi.”", "Sözlerine şöyle devam etti: “O bizi yalnız Allah'a kulluk etmeye çağırdı. Doğru konuşmayı, emaneti ödemeyi, akrabayı gözetmeyi, komşuya iyiliği emretti; haramlardan ve kan dökmekten alıkoydu. Yalandan, yetim malı yemekten ve iffetli kadına iftiradan sakındırdı. Biz de ona inandık, ona uyduk. Kavmimiz bize düşman oldu, eziyet etti. Biz de sana sığındık, senin yanında kalmayı seçtik.”", "Necâşî sordu: “Onun Allah'tan getirdiğinden yanında bir şey var mı?” Cafer: “Evet” dedi ve Meryem Sûresi'nden okudu. Necâşî o kadar ağladı ki sakalı ıslandı; yanındaki din adamları da ağladı, kitapları gözyaşlarıyla ıslandı. Sonra şöyle dedi: “Vallahi bu ve Musa'nın getirdiği, aynı kandilden çıkıyor.”", "Elçilere döndü: “Gidin! Vallahi onları size teslim etmeyeceğim.” Ertesi gün elçilerin yeni bir girişimi de sonuç vermedi; Necâşî hediyelerini geri verdi ve Müslümanlara “Gidin, siz benim ülkemde güvendesiniz” dedi. Böylece güzel söz, hem bir topluluğu korudu, hem bir hükümdarın kalbini yumuşattı. Cafer'in sözlerinde ne bir suçlama, ne bir tehdit vardı; yalnızca yaşanmış bir hayatın dürüst anlatımı vardı. Kendi geçmişlerini de saklamadı: Eskiden nasıl olduklarını, Allah'ın kendilerini nasıl doğru yola ilettiğini olduğu gibi anlattı. Böyle bir dürüstlük, dinleyenin kalbinde karşılık bulur. Necâşî de bu içtenliğe kayıtsız kalmadı.", "Yıllar sonra Necâşî vefat ettiğinde, Peygamberimiz öldüğü gün sahabelere haber verdi, musallaya çıktı, saf tuttu ve dört tekbirle gıyabi cenaze namazı kıldı. Bir hükümdarın vicdanına dokunan söz, yıllar sonra onun için okunan bir dua olarak geri dönmüştü."], "ibret": "Doğruyu güzel bir dille ve sade bir dürüstlükle anlatmak, en sert yüreği bile yumuşatabilir. Zulüm görenin sığınağı, haklı olduğu hâlde kırıcı olmayan sözdür. Dürüstlük, en güçlü savunmadır.", "kaynak": "Ahmed b. Hanbel, Müsned, I, 201-203 (Ümmü Seleme rivayeti); İbn Hişâm, es-Sîre; Buhârî, Cenâiz, 4 (1245)"}, {"no": 4, "baslik": "Hendekteki Ziyafet", "tur": "kaynakli", "paragraflar": ["Hendek, Müslümanların Medine'yi savunmak için şehrin etrafına kazdığı hendekti. Düşman kuşatma hazırlığındaydı. O günlerde Medine'de günlerdir süren bir açlık vardı. Sahabeler gün boyu çalışıyor, akşam olunca çoğu kez aç yatıyordu. Câbir b. Abdullah, Peygamber Efendimizi (s.a.v.) de aynı hâlde gördü: Açlıktan karnına bir taş bağlamıştı. Câbir bunu görünce izin isteyip evine gitti.", "Eve gelince hanımına sordu: “Peygamber'i öyle bir hâlde gördüm ki buna sabredilmez. Sende bir şey var mı?” Hanımı bir ölçek arpa ve küçük bir oğlak olduğunu söyledi. Câbir oğlağı kesti. Hanımı arpayı öğüttü, hamuru yoğurdu. Et tencereye kondu. Yemek hazır olmaya yaklaşırken Câbir Peygamberimize gidip gizlice dedi: “Küçük bir yemek hazırladık; sen ve yanındaki bir iki kişi gelin.”", "Peygamberimiz sordu: “Ne kadar var?” Câbir söyledi. Peygamberimiz: “Çok ve güzel” buyurdu. Sonra ekledi: “Hanımına söyle, ben gelmeden tencereyi ocaktan indirmesin, fırından ekmeği çıkarmasın.” Ardından yüksek sesle seslendi: “Ey hendek ehli! Câbir size bir ziyafet hazırladı, hadi gelin!”", "Câbir eve koştu ve telaşla hanımına seslendi: “Vah vah! Peygamber muhacirleri, ensarı ve yanındaki herkesi getiriyor!” Hanımı ise sakince sordu: “Sana yemeğin ne kadar olduğunu sordu mu?” Câbir: “Evet, sordu; ben de söyledim” dedi. Küçük bir yemeğin böyle bir kalabalığa yetmeyeceği belliydi; ama ikisi de Peygamberimizin sözüne güvendi. Bu davet, kıtlığın ortasında bir ziyafete dönüşmek üzereydi. Peygamberimiz, elindeki azla ikram etmek isteyen bir sahabinin davetini küçümsemedi, onu en güzel şekilde karşıladı. Ev sahibinin yüreği, sofranın büyüklüğünden önemliydi.", "Peygamberimiz geldi. Sahabelere “Girin, ama sıkışmayın” dedi. Hamura ve tencereye bereket için dua etti. Sonra ekmeği ufaladı, üzerine eti koydu ve sahabelere dağıtmaya başladı. Tencereyi ve fırını her seferinde örtüyordu. Herkes doyana kadar yedi. Câbir'in aktardığına göre sayıları bin kişiydi.", "Hepsi doyup kalktıktan sonra tencere hâlâ kaynıyor, hamur hâlâ pişiyordu; sanki ondan hiçbir şey eksilmemişti. Peygamberimiz Câbir'in hanımına dönüp şöyle dedi: “Sen de ye ve hediye et; çünkü insanlar açlık içinde.”", "Bu hikâyede iki güzel gerçek var. Biri Câbir'in niyetidir: Elindeki az şeyi, sevdiği biri için sunmak istemiştir. Diğeri Peygamberimizin cömertliğidir: Yalnızca kendisini davet edeni değil, aç olan herkesi düşünmüştür. Kısa bir ikram davetini, bütün bir ordunun ziyafetine çevirmiştir.", "Allah'ın bereketi, çoğu zaman bir kalabalığın ihtiyacından değil, bir yüreğin samimiyetinden doğar. Az olan, paylaşıldıkça çoğalır. Bu olay, Hendek'in zor günlerinde sahabelerin hem karnını hem gönlünü doyurmuştur. Câbir'in küçük sofrası, bugün hâlâ cömertliğin ve davete sadakatin güzel bir örneğidir. Elindekini sunmaktan çekinmeyen, Allah'ın bereketini görmüştür."], "ibret": "Az bir şey, samimi bir niyetle sunulduğunda Allah'ın bereketiyle çoğalır. Cömertlik, yalnız kendisini davet edeni değil, aç olan herkesi düşünmektir. Paylaşılan sofra hiç eksilmez, aksine bereketlenir.", "kaynak": "Buhârî, Megâzî, 29 (4101-4102); Müslim, Eşribe (2039)"}, {"no": 5, "baslik": "Zülkarneyn ve Demir Set", "tur": "kaynakli", "paragraflar": ["Kur'an, Zülkarneyn'in hikâyesini şöyle başlatır: “Sana Zülkarneyn'i soruyorlar. De ki: Size ondan bir anı okuyacağım.” (Kehf, 18/83) Zülkarneyn'in kim olduğu hakkında âlimler farklı görüşler ileri sürmüştür; peygamber olup olmadığı da tartışmalıdır. Biz bu tartışmalara girmeden, ayetlerin bildirdiği kadarını anlatacağız.", "Ayete göre Allah ona yeryüzünde imkân verdi ve her şey için bir yol bahşetti. (18/84) Müfessirler bunu, ona verilen ilim, güç ve vasıtalar diye açıklar. O da bir yol tuttu. Batıya doğru ilerledi, güneşin battığı yere vardı; orada bir halk buldu. Allah ona şöyle dedi: “Ey Zülkarneyn! Ya onlara azap edersin ya da onlara güzel davranırsın.” (18/86)", "Zülkarneyn'in cevabı, adaletin ölçüsünü gösterir: “Kim zulmederse ona azap ederiz, sonra o Rabbine döndürülür ve Rabbi ona görülmedik bir azap eder. İman edip iyi iş yapana ise güzel bir karşılık vardır; ona emrimizden kolay olanı söyleriz.” (18/87-88) Güç sahibi biri, hem zalime karşı kararlıydı, hem iyilik yapana karşı yumuşaktı.", "Sonra bir yol daha tuttu ve doğuya ilerledi. (18/89-90) Ardından bir yola daha girdi ve iki dağın arasına vardı. Orada neredeyse hiç söz anlamayan bir halk buldu. Onlar şöyle dedi: “Ey Zülkarneyn! Ye'cûc ve Me'cûc yeryüzünde bozgunculuk yapıyorlar. Bizimle onlar arasına bir set yapman için sana bir vergi verelim mi?” (18/92-94)", "Ye'cûc ve Me'cûc'un görünüşüne dair anlatılanlar tefsirlerde yer alsa da Kur'an bunları bildirmez; biz de o ayrıntılara girmiyoruz. Zülkarneyn'in cevabı ise tevazu ile doludur: “Rabbimin bana verdiği imkân daha hayırlıdır. Siz bana güçle yardım edin, sizinle onlar arasına bir set yapayım.” (18/95) Ücret kabul etmedi; yalnızca emek istedi.", "Şöyle dedi: “Bana demir kütleleri getirin.” İki dağın arası dolunca: “Körükleyin!” dedi. Demir ateş gibi kızınca: “Bana erimiş bakır getirin ki üzerine dökeyim.” (18/96) Artık onlar ne o sete tırmanabildi, ne de onu delebildi. (18/97) Bu, işbirliğinin, aklın ve emeğin ürünüydü; kaba kuvvetle değil, birlikte çalışmayla kurulmuştu.", "Zülkarneyn eserini bitirince şöyle dedi: “Bu, Rabbimden bir rahmettir.” (18/98) Kendi başarısını Allah'a verdi. Bu söz, bütün hikâyenin özünü taşır: Büyük imkân, büyük bir tevazu gerektirir. Ona verilen güç, bir kibir kaynağı değil, bir sorumluluk vesilesi oldu. Kendini, Allah'ın lütfuna aracı olan bir vesile olarak gördü.", "Bu kıssada çarpıcı olan, gücün nasıl kullanıldığıdır. Zalime ceza, iyiliğe karşılık; muhtaçlara yardım, bunun karşılığında ücret değil katkı. Eser ne kadar büyük olursa olsun, sahibinin dilinde kibir değil, şükür vardı. Güçlü olan herkesin, bu ölçüyü hatırlaması gerekir."], "ibret": "Güç, Allah'ın bir emanetidir; zalime karşı adaletle, muhtaca karşı merhametle kullanılır. Büyük bir iş başaran kimse, “Bu Rabbimden bir rahmettir” diyebilmelidir. Güçlü olan, kibirlenmez; şükreder.", "kaynak": "Kehf Sûresi, 18/83-98"}, {"no": 6, "baslik": "Yüz Yıl Sonra Uyanan Adam", "tur": "kaynakli", "paragraflar": ["Duvarları çökmüş, evleri yıkılmış, bomboş bir şehir düşünün. Bir adam bu şehrin yanından geçiyordu. Kur'an onun adını vermez; hangi şehir olduğunu da bildirmez. Bazı müfessirler bu kişinin kim olabileceği konusunda farklı isimler anmıştır, ama biz ihtiyatla yalnızca “bir adam” diyeceğiz.", "Adam şehre baktı ve şöyle dedi: “Allah burayı, ölümünden sonra nasıl diriltecek?” (Bakara, 2/259) Bu soru, böylesine yıkılmış bir yerin yeniden hayata dönmesinin nasıl olacağına dair bir şaşkınlıktı. Allah ona, cevabını sözle değil, kendi hayatıyla verdi.", "Allah o adamı yüz yıl boyunca ölü bıraktı, sonra onu diriltti. Ona şöyle soruldu: “Ne kadar kaldın?” Adam cevap verdi: “Bir gün ya da günün bir kısmı kadar kaldım.” Geçen zamanı hissetmemişti. Yüz yıl, ona bir gün gibi gelmişti. İnsan, dünyadaki zamanın ne kadar göreceli olduğunu böyle anlar. Allah, geçen yılları bir an gibi gösterebilir.", "Allah ona şöyle buyurdu: “Hayır, yüz yıl kaldın. Şimdi yiyeceğine ve içeceğine bak; zamanın hiçbir etkisi yok, bozulmamış.” Bir de şöyle dedi: “Eşeğine de bak.” Kur'an eşeğin hâlini ayrıntılandırmaz; ama bu söz, adamın kendi gözleriyle göreceği bir delili hazırlıyordu. Kur'an'ın işaret ettiğine göre yiyecek ve içecek yüz yıl geçmesine rağmen bozulmamıştı; kemikler ise bir araya getirilip et giydiriliyordu. Allah, doğa ve zaman kanunlarını dilediği gibi işletir. Bir şeyi yüz yıl korur, bir şeyi gözümüzün önünde değiştirir.", "Sonra Allah şöyle buyurdu: “Seni insanlar için bir delil yapalım diye (böyle yaptık). Şu kemiklere bak; onları nasıl birleştirip sonra nasıl et giydiriyoruz.” (2/259) Adam, kemiklerin birleştiğini, canlandığını gördü. Yıkılmış bir şehrin yanında, hayatla ölüm arasındaki sınırın Allah'ın elinde olduğunu kendi gözleriyle gördü.", "Kur'an, bu anı şöyle anlatır: “Bu ona açıkça belli olunca, ‘Allah'ın her şeye kadir olduğunu biliyorum’ dedi.” (2/259) Adam, bunu bir kitaptan öğrendiği bilgiyle değil, bizzat yaşadığı bir hayatla söylüyordu. Duyarak bilmek başka, bizzat yaşayıp görmek başka.", "Bu kıssada dikkat çeken şey, adamın sorusunun geri çevrilmemesidir. Allah, onun sorusuna bir cevap verdi; üstelik cevabı, onun yüreğini aydınlatacak şekilde verdi. Merak ve düşünme, kalbin Allah'a yönelmesinin bir yoludur. Soran kalp, cevabını bulabilir.", "Bir de zaman konusunda ders var: Adam yüz yıl kalmış ama bir gün sanmıştı. İnsan ömrü de böyledir; uzun sanılan günler, geriye bakınca kısa gelir. Yıkılmış bir şehrin yeniden diriltilmesi, bize hem ahirete hem de içimizdeki ölü umutların yeniden canlanabileceğine dair bir işarettir. Çünkü Allah'ın kudreti, gördüğümüz sınırların ötesindedir."], "ibret": "Allah'ın kudretinde hiçbir şey imkânsız değildir. Ölü bir toprağı da, ölmüş bir umudu da canlandırabilir. Soran, düşünen ve sonunda teslim olan kalp, cevabını mutlaka bulur.", "kaynak": "Bakara Sûresi, 2/259"}, {"no": 7, "baslik": "İki Bahçe Sahibi", "tur": "kaynakli", "paragraflar": ["Kur'an, iki arkadaşın hikâyesini bir örnek olarak anlatır: “Onlara iki adamı örnek ver. Onlardan birine iki üzüm bağı vermiştik; etraflarını hurma ağaçlarıyla çevirmiş, ikisinin arasında ekinlik yapmıştık.” (Kehf, 18/32) İki bahçe de ürününü eksiksiz verdi; aralarında bir ırmak akıtılmıştı. (18/33) Adamların adları ve aralarındaki akrabalık Kur'an'da yer almaz.", "Bahçe sahibi, arkadaşıyla konuşurken şöyle övündü: “Ben malca senden daha çok, adamca daha güçlüyüm.” (18/34) Sonra kendine zulmederek bahçesine girdi ve şöyle dedi: “Bunun hiç yok olacağını sanmıyorum. Kıyametin kopacağını da sanmıyorum. Rabbime döndürülsem bile bundan daha iyisini bulurum.” (18/35-36)", "Mümin arkadaşı onu uyardı: “Seni topraktan, sonra bir damla sudan yaratan, sonra seni insan şekline koyan Rabbini inkâr mı ediyorsun? Ama ben, O Allah benim Rabbimdir ve Rabbime hiçbir şeyi ortak koşmam.” (18/37-38) Sonra şunu ekledi: “Bahçene girdiğin zaman ‘Allah'ın dilediği olur; güç ancak Allah'ladır (Mâşâallah, lâ kuvvete illâ billâh)’ demen gerekmez miydi?” (18/39)", "Arkadaşı devam etti: “Eğer beni malca ve evlatça senden az görüyorsan, belki Rabbim bana bahçenden daha hayırlısını verir.” (18/39-40) Bu söz, yoksulluktan şikâyet değil, Allah'a güvenin ifadesiydi. Mümin, nimet sahibine ne kıskançlıkla ne de kibirle karşılık veriyordu; yalnızca doğruyu hatırlatıyordu. Kur'an'ın üslubu burada da dikkat çeker: Adamların kim olduğu değil, tavırları öğretilir.", "Sonra ürünler helak oldu. Kur'an bunu kısa ve yumuşak bir ifadeyle bildirir: Adamın bütün serveti kuşatılıp yok edildi. Adam, bahçesine harcadıklarına yanarak ellerini ovuşturmaya başladı. Çardakları çökmüştü. Şöyle diyordu: “Keşke Rabbime hiçbir şeyi ortak koşmasaydım.” (18/42)", "Ayet şöyle devam eder: “Allah'tan başka ona yardım edecek bir topluluk yoktu; kendi kendini de kurtaramazdı.” (18/43) Yani adamın dayandığı mal, bağ, adamlar, hepsi bir anda işe yaramaz hâle gelmişti. Kur'an, hakiki yardımın yalnız Allah'tan geleceğini bu örnekle gösterir. (18/44)", "Bu kıssada vurgu bahçenin kaybında değil, arkadaşın verdiği öğüttedir. “Mâşâallah, lâ kuvvete illâ billâh”: Güzel bir şey gördüğünde ya da sahip olduğunda bu sözü söyleyen, gözünü kıskançlıktan da, kibirden de korur. Bu sözü söylemek, nimeti Allah'tan bilmektir.", "Nimet, elde iken şükretmek, gidince üzülmekten çok daha kolaydır. Ne kadar çok şeye sahip olursak olalım, güvenimizi mala değil Allah'a bağlamak gerekir. Mal, bir gün bahçedeki bir ürün gibi elimizden gidebilir; ama Allah'a güven, hiç kaybolmaz. Bugün de bir komşunun evine, bir tanıdığın bahçesine bakıp hem imrenmek, hem de kendi elimizdekini küçümsemek yerine, “Mâşâallah” demeyi bilmeliyiz. Bu söz, içimizdeki kıskançlığı da kibri de bir anda yatıştırır."], "ibret": "Elimizdeki nimeti kendi gücümüzden bilmek, gönlü kibirle doldurur ve insanı Allah'tan uzaklaştırır. “Mâşâallah, lâ kuvvete illâ billâh” diyen kimse, nimeti Allah'tan bilir, kibirden ve kıskançlıktan korunur.", "kaynak": "Kehf Sûresi, 18/32-44"}, {"no": 8, "baslik": "Rabbin Seni Bırakmadı", "tur": "kaynakli", "paragraflar": ["Bazı günler vardır ki insan, yalnızlıktan ağır bir sessizlik duyar. Peygamber Efendimiz (s.a.v.) de böyle günler yaşadı. Cündüb b. Abdullah'ın anlattığına göre Peygamberimiz rahatsızlandı ve bir iki gece namaza kalkamadı.", "Başka bir rivayette, Cebrâil'in bir süre gelmediği de bildirilir. Bu bekleyiş ne kadar sürdü, rivayetlerde farklıdır; biz kesin bir süre vermiyoruz. Rivayetlerden, o günlerde Peygamberimizin gönlünde bir yük olduğu anlaşılır. Vahyi bekliyordu ve gelmiyordu.", "Bir kadın bu durumu görüp alaycı bir söz söyledi: “Şeytanının seni terk ettiğini sanıyorum.” Hadiste bu kadının adı geçmez. Sözün ağırlığı, söyleyenin kimliğinde değil, söylenenin ne kadar kırıcı olduğundadır.", "Bunun üzerine Duhâ Sûresi indi. Allah, önce kuşluk vaktine ve her şeyi sükûnetle örttüğü zaman geceye yemin etti. Sonra şöyle buyurdu: “Rabbin seni terk etmedi, sana darılmadı.” (Duhâ, 93/1-3) Bu kısa cümle, bekleyişin bütün ağırlığını bir anda hafifletti. Kuşluk aydınlığı da, gecenin sükûneti de Allah'ın birer nimetidir; ayet, yalnız aydınlığın değil, sessizliğin de O'nun elinde olduğunu hatırlatır.", "Ardından şu müjde geldi: “Elbette ahiret senin için dünyadan daha hayırlıdır. Rabbin sana yakında verecek, sen de hoşnut olacaksın.” (93/4-5) Peygamberimiz, çektiği sıkıntıların bir karşılığı olacağını duyuyordu. Bu söz, yalnız ona değil, sıkıntıda olan herkese bir umut kapısıydı.", "Sonra Allah, ona geçmişte yaptığı iyilikleri hatırlattı: “Seni yetim bulup barındırmadı mı? Seni yolunu bilmez bulup doğru yola iletmedi mi? Seni yoksul bulup zengin etmedi mi?” (93/6-8) Siyer kitaplarında anlatıldığına göre Peygamberimiz, babası doğumundan önce vefat ettiği için yetim doğmuş, sonra dedesinin ve amcasının himayesinde büyümüştü. Müfessirlere göre ikinci söz, vahiy gelmeden önce kitabın ve imanın ne olduğunu henüz bilmemesine işaret eder (Şûrâ, 42/52); üçüncüsü ise ona verilen geçim nimetini hatırlatır. Allah, bütün bu yılları bir bir hatırlatıyordu. Geçmişteki lütuflar, geleceğe güvence oldu.", "Bu ayetlerden sonra bir öğüt gelir. Müfessirler bunu şöyle açıklar: Yetimliğin acısını bilen yetimi ezmez, ihtiyaç içinde büyümüş olan isteyeni azarlamaz, doğru yola kavuşan da bu nimeti anlatır. Sûre şu öğütle biter: “Öyleyse sakın yetimi ezme, sakın isteyeni azarlama, Rabbinin nimetini anlat.” (93/9-11) Allah'ın kendisine gösterdiği merhamet, başkalarına gösterilecek merhametin ölçüsü oldu: Yetime sahip çık, isteyeni geri çevirme, aldığın nimetleri anlatarak şükret.", "Duhâ Sûresi, bugün de hüzünlü gönüllere şifa gibi gelir. Bir sıkıntıdaysanız, bir ayrılık yaşıyorsanız ya da bir cevap bekliyorsanız, bu ayetleri hatırlayın: Rabbiniz sizi bırakmadı. Sessizlik, terk edilmek demek değildir; belki bir hazırlığın, belki bir müjdenin habercisidir."], "ibret": "Sıkıntılı ve sessiz zamanlar, Allah'ın bizi terk ettiği anlamına gelmez. Rabbimiz geçmişteki nimetleriyle bize güvence verir. Merhameti tadan gönül, başkasına da merhamet eder. Rabbine güvenen, bekleyişi umutla sürdürür.", "kaynak": "Duhâ Sûresi, 93/1-11; Şûrâ Sûresi, 42/52; Buhârî, Teheccüd (1124-1125); Tefsîr, Duhâ (4950-4951); Müslim, Cihâd ve's-siyer (1797)"}], "kapanis": "On beş kitap, yüz yirmi hikâye burada tamamlandı. Peygamberlerin sabrından sahabenin cömertliğine, annelerin duasından bu son kitabın ibretlerine kadar hep aynı şeyi gördük: İyilik, güzel söz ve Allah'a güven hiç boşa gitmiyor. Bu sayfaları kapatırken gönlünüzde bir hikâyeden bir cümle kalsın. Rabbim hepimizi, okuduğumuzla amel edenlerden eylesin.", "url": "https://vedatdilan0.github.io/gonul-kutuphanesi/kitap/15/", "kapak": "../../kapak/15.jpg", "kutuphane": "../../index.html", "sonraki": null, "pdf": "../../pdf/kitap-15.pdf", "epub": "../../epub/kitap-15.epub", "gorunum": "kitap-gorunumu.html"}</script>
